{l:6,s:"p32",q:"Which of the following is NOT an explicit assumption of the Roy Adaptation Model?",o:["Health and illness can be completely avoided","The person is a bio-psycho-social being","The person is in constant interaction with a changing environment","The person uses innate and acquired coping mechanisms"],e:"Roy: health and illness are INEVITABLE dimensions of life."},
{l:6,s:"p33",q:"What are the 4 adaptive modes in Roy's model?",o:["Physiological, self-concept, role function, interdependence","Physical, emotional, social, spiritual","Orientation, identification, exploitation, resolution","Person, environment, health, nursing"],e:"Physiological, Self-concept, Role function, Interdependence."},
{l:6,s:"p33",q:"In Roy's model, self-esteem and body image belong to which mode?",o:["Self-concept mode","Physiological mode","Role function mode","Interdependence mode"],e:"Self-concept = psychological and spiritual integrity."},
{l:6,s:"p33",q:"In Roy's model, helping a patient adapt to changes in family or work roles belongs to which mode?",o:["Role function mode","Interdependence mode","Self-concept mode","Physiological mode"],e:"Role function = social roles and responsibilities."},
{l:6,s:"p33",q:"In Roy's model, getting the family involved and linking the patient with support groups belongs to which mode?",o:["Interdependence mode","Role function mode","Self-concept mode","Physiological mode"],e:"Interdependence = relationships and support systems."},
{l:6,s:"p33",q:"In Roy's model, monitoring vital signs, managing pain and supporting nutrition and elimination belong to which mode?",o:["Physiological mode","Self-concept mode","Role function mode","Interdependence mode"],e:"Physiological = physical and biological integrity."},
{l:6,s:"p34",q:"Mr Chan cannot visit his family during COVID; Nurse Yip helps him make video calls. In Roy's model, this is:",o:["Interdependence mode","Role function mode","Self-concept mode","Physiological mode"],e:"Staying connected with loved ones = interdependence."},
{l:6,s:"p34",q:"Mr Chan talks about his daughter's wedding; his role as a father gives him strength to recover. In Roy's model, this is:",o:["Role function mode","Interdependence mode","Self-concept mode","Physiological mode"],e:"Role as a father = role function."},
{l:6,s:"p34",q:"Mr Chan has trouble speaking after treatment; Nurse Yip listens patiently and helps him communicate, supporting his confidence. In Roy's model, this is:",o:["Self-concept mode","Role function mode","Interdependence mode","Physiological mode"],e:"Confidence / self-esteem = self-concept."},
{l:6,s:"p35",q:"How many steps are in the nursing process of the Roy Adaptation Model?",o:["6","5","4","7"],e:"6: 1st-level assessment (behaviour), 2nd-level assessment (stimuli), diagnosis, goal setting, intervention, evaluation."},
{l:6,s:"p35",q:"In Roy's 6-step nursing process, the FIRST level of assessment looks at the patient's ___, and the SECOND level looks at the patient's ___.",o:["behaviour; stimuli","stimuli; behaviour","needs; environment","feelings; roles"],e:"1st = behaviour; 2nd = stimuli."},
{l:6,s:"p37",q:"Watson's Theory of Transpersonal Caring is dated in Lecture 6 as:",o:["1999","1952","1860","1978"],e:"1999 on the slide. (Peplau 1952, Nightingale 1860, Carper 1978.)"},
{l:6,s:"p37",q:"According to Watson, what is central to nursing practice?",o:["Caring","Environment","Self-care","Adaptation"],e:"Caring is central; it can be shown and practised, and it promotes growth."},
{l:6,s:"p37",tf:1,q:"According to Watson, a caring environment accepts a person regardless of who they are and what they may become.",a:1,e:"True."},
{l:6,s:"p38",q:"What are the 3 core concepts of Watson's theory?",o:["Transpersonal caring relationship, creating a healing environment, holistic care","Self-care, self-care agency, self-care deficit","Orientation, identification, resolution","Air, water, light"],e:"Transpersonal caring relationship; healing environment; holistic care."},
{l:6,s:"p39",q:"How many carative factors are in Watson's theory?",o:["10","13","14","7"],e:"10 carative factors = the foundation of caring."},
{l:6,s:"p39",q:"A nurse encourages a chemotherapy patient by sharing stories of others who recovered. Which carative factor is this?",o:["Instillation of faith-hope","Humanistic-altruistic values","Teaching-learning","Existential-spiritual forces"],e:"Instillation of faith-hope."},
{l:6,s:"p39",q:"A nurse greets every patient warmly and listens carefully even on a busy shift. Which carative factor is this?",o:["Humanistic-altruistic values","Helping-trusting relationship","Sensitivity to self and others","Supportive environment"],e:"Humanistic-altruistic values = loving-kindness and compassion."},
{l:6,s:"p39",q:"A nurse reflects on their own emotions to better understand a patient's anxiety. Which carative factor is this?",o:["Sensitivity to self and others","Expression of feelings","Creative problem-solving","Helping-trusting relationship"],e:"Sensitivity to self and others."},
{l:6,s:"p39",q:"Letting a grieving family member cry and talk without interruption or judgement is which carative factor?",o:["Expression of feelings","Sensitivity to self and others","Instillation of faith-hope","Human needs assistance"],e:"Expression of feelings."},
{l:6,s:"p39",q:"A nurse checks in with patients regularly and consistently, building a bond of trust. Which carative factor is this?",o:["Helping-trusting relationship","Humanistic-altruistic values","Supportive environment","Teaching-learning"],e:"Helping-trusting relationship."},
{l:6,s:"p40",q:"Tailoring a pain management plan for a patient who does not respond to standard medication is which carative factor?",o:["Creative problem-solving","Teaching-learning","Human needs assistance","Supportive environment"],e:"Creative problem-solving = applying critical thinking."},
{l:6,s:"p40",q:"Explaining post-surgery care in simple terms and checking understanding is which carative factor?",o:["Teaching-learning","Creative problem-solving","Instillation of faith-hope","Expression of feelings"],e:"Teaching-learning."},
{l:6,s:"p40",q:"Adjusting lighting and noise to help a patient rest peacefully is which carative factor?",o:["Supportive environment","Human needs assistance","Humanistic-altruistic values","Existential-spiritual forces"],e:"Supportive environment."},
{l:6,s:"p40",q:"Helping a patient with bathing while protecting their privacy and comfort is which carative factor?",o:["Human needs assistance","Supportive environment","Helping-trusting relationship","Teaching-learning"],e:"Human needs assistance = meeting basic needs with dignity."},
{l:6,s:"p40",q:"Respecting a patient's wish to pray before a major procedure is which carative factor?",o:["Existential-spiritual forces","Instillation of faith-hope","Humanistic-altruistic values","Expression of feelings"],e:"Existential-spiritual forces."},
{l:6,s:"p41",q:"The care home's hospice room, where family can stay with a dying resident and RNs give massage and bathing 24 hours, is used in Lecture 6 to illustrate:",o:["Watson's Theory of Transpersonal Caring","Orem's Self-Care Theory","Roy's Adaptation Model","Henderson's Need Theory"],e:"Transpersonal caring in contemporary practice."},
{l:6,s:"p42",tf:1,q:"According to the L6 conclusion, one nursing theory should be used in every situation.",a:0,e:"False. Nurses can use different theories in different circumstances; each has pros and cons."}
);

// L7 — Searching for Evidence, Social Media, E-professionalism (C Chan)
Q.push(
{l:7,s:"p5",q:"According to UNESCO (2018), digital literacy is:",o:["The ability to access, manage, understand, integrate, communicate, evaluate and create information safely and appropriately through digital technologies","The ability to type quickly","The ability to use AI to write essays","Knowledge of computer hardware"],e:"UNESCO 2018. It includes computer literacy, ICT literacy, information literacy and media literacy."},
{l:7,s:"p5",q:"Which organization's 2018 definition of digital literacy is used in Lecture 7?",o:["UNESCO","WHO","ICN","NCHK"],e:"UNESCO, 2018."},
{l:7,s:"p5",q:"Digital literacy (UNESCO, 2018) includes all of the following competences EXCEPT:",o:["Clinical literacy","Computer literacy","Information literacy","Media literacy"],e:"Computer literacy, ICT literacy, information literacy, media literacy."},
{l:7,s:"p7",q:"The digital literacy framework named in Lecture 7 is:",o:["DigComp 2.2","ISBAR","SOLER","DigiNurse 1.0"],e:"DigComp 2.2."},
{l:7,s:"p11",q:"Evaluating online information for accuracy, angle and credibility is which digital literacy skill?",o:["Critical thinking skills","Digital search skills","Online safety skills","Managing online identity"],e:"Skill 1: critical thinking."},
{l:7,s:"p12",q:"Choosing the right search engines and keywords is which digital literacy skill?",o:["Building digital search skills","Critical thinking skills","Avoiding digital plagiarism","Managing online identity"],e:"Skill 2: digital search skills."},
{l:7,s:"p13",q:"Learning to cite properly and understanding copyright and licences is which digital literacy skill?",o:["Recognizing and avoiding digital plagiarism","Online safety skills","Critical thinking","Managing online identity"],e:"Skill 3: avoid digital plagiarism."},
{l:7,s:"p14",q:"Protecting yourself from cyberbullying and avoiding threats to physical and psychological well-being are which digital literacy skill?",o:["Using proper online safety skills","Managing online identity","Critical thinking","Digital search skills"],e:"Skill 4: online safety."},
{l:7,s:"p15",q:"Protecting your reputation, personal data and privacy, and guarding against identity theft, are which digital literacy skill?",o:["Managing online identity","Online safety skills","Avoiding plagiarism","Digital search skills"],e:"Skill 5: manage online identity."},
{l:7,s:"p11-15",q:"How many digital literacy skills are listed in Lecture 7?",o:["5","4","6","3"],e:"5: critical thinking, digital search, avoid plagiarism, online safety, manage online identity."},
{l:7,s:"p16",q:"AI literacy is defined by:",o:["Chan, C.K.Y. (2023)","UNESCO (2018)","Cain and Romanelli (2009)","Dang et al. (2022)"],e:"Chan, 2023: ability to understand, interact with and make informed decisions about AI, aware of ethical, social and privacy implications."},
{l:7,s:"p17",q:"Which of the following is NOT listed as a reason AI literacy is important?",o:["Replacing the need for critical thinking","Identifying misconceptions about AI","Enhancing career opportunities","Using AI ethically and responsibly"],e:"Reasons: identify misconceptions, career opportunities, ethical use, innovative products. Over-reliance and less critical thinking are listed as a CHALLENGE."},
{l:7,s:"p18",q:"\"Make humans more human\" (Lee and Park, 2023) is listed as:",o:["An opportunity of AI literacy","A challenge of AI literacy","A principle of social networking","A step of EBP"],e:"Opportunity: learners empowered with knowledge and skills."},
{l:7,s:"p18",q:"Which is listed as an OPPORTUNITY of AI literacy?",o:["No more language boundaries","Amplification of misleading content","Over-reliance on AI","Someone may be left behind"],e:"Opportunities: thrive with AI, develop own strengths, keep up with new tech, no more language boundaries."},
{l:7,s:"p19",q:"Which is listed as a CHALLENGE of AI literacy?",o:["Biased training data leading to discriminatory results","Better task efficiency","Keeping up with new technologies","Helping environmentalism and conservation"],e:"Challenges: someone may be left behind (digital divide), over-reliance and less critical thinking, amplification of misleading content (biased data)."},
{l:7,s:"p19",q:"A widening divide between people with and without the skills or resources to use AI is the challenge called:",o:["Someone may be left behind","Over-reliance","Amplification of misleading content","Language boundaries"],e:"Someone may be left behind."},
{l:7,s:"p23",q:"Evidence-based practice (EBP) is defined as:",o:["A process to review, analyse and translate the latest scientific evidence, combining the best research with clinical experience and patient preference","Following the most senior nurse's routine","Using only textbook knowledge","Doing whatever the patient wants"],e:"Dang et al., 2022."},
{l:7,s:"p24",q:"What are the 3 main elements of EBP?",o:["Clinical experience, research evidence, patient's values and preferences","Research, cost, policy","Doctor's order, nurse's opinion, family's wish","Theory, practice, education"],e:"Clinical experience + research evidence + patient's values and preferences."},
{l:7,s:"p24",q:"In EBP, \"knowledge, judgement and critical reasoning acquired through experience and training\" is the element of:",o:["Clinical experience","Research evidence","Patient's values and preferences","Critical appraisal"],e:"Clinical experience."},
{l:7,s:"p24",q:"In EBP, personal and cultural values, unique concerns and expectations of patients and relatives are the element of:",o:["Patient's values and preferences","Clinical experience","Research evidence","Dissemination"],e:"Patient's values and preferences."},
{l:7,s:"p24",q:"In EBP, \"best available, clinically relevant information from scientific literature using sound methodology\" is the element of:",o:["Research evidence","Clinical experience","Patient preference","Literature search"],e:"Research evidence."},
{l:7,s:"p25",q:"What is the FIRST step of EBP?",o:["Identify a problem","Literature search","Critically appraise the evidence","Apply the findings"],e:"6 steps: identify problem → literature search → critically appraise → apply → evaluate and summarize outcomes → disseminate and apply in daily practice."},
{l:7,s:"p25",q:"Which is the correct order of the 6 steps of EBP?",o:["Identify problem → literature search → critical appraisal → application → evaluate outcomes → disseminate","Literature search → identify problem → application → critical appraisal → disseminate → evaluate","Identify problem → critical appraisal → literature search → evaluate → application → disseminate","Identify problem → literature search → application → critical appraisal → disseminate → evaluate"],e:"Identify → Search → Appraise → Apply → Evaluate → Disseminate."},
{l:7,s:"p25",q:"Which step of EBP comes directly AFTER the literature search?",o:["Critically appraise the evidence","Apply the findings","Identify a problem","Disseminate the information"],e:"Search → appraise."},
{l:7,s:"p25",q:"What is the LAST step of EBP?",o:["Disseminate the information and apply it in daily practice","Evaluate and summarize the outcomes","Apply the findings","Critically appraise the evidence"],e:"Disseminate."},
{l:7,s:"p27",q:"Which of the following is NOT listed as a common search engine / database for nursing?",o:["Wikipedia","PubMed","Cochrane Library","CINAHL Plus"],e:"Listed: PubMed, Cochrane Library, CINAHL Plus, APA PsycInfo, ClinicalKey."},
{l:7,s:"p27",q:"APA PsycInfo is a database mainly for:",o:["Psychology and behavioural science literature","Drug prices","Hospital statistics","Nursing registration"],e:"APA PsycInfo = psychology literature (listed as a common nursing search engine)."},
{l:7,s:"p29",q:"In the hierarchy of evidence, which type of study is usually at the TOP (strongest evidence)?",o:["Systematic reviews and meta-analyses","Expert opinion","Case reports","Cross-sectional surveys"],e:"Slide p29 (Wallace et al., 2022), top → bottom: systematic review & meta-analysis → RCTs → cohort → cross-sectional → case-control → case reports & case series → basic science & translational research."},
{l:7,s:"p29",q:"In the hierarchy of evidence, which type of evidence is usually at the BOTTOM?",o:["Basic science and translational research","Randomized controlled trials","Cohort studies","Case reports and case series"],e:"On the L7 slide the BOTTOM layer is basic science and translational research (not expert opinion, which some other versions use). Case reports and case series are one layer above it."},
{l:7,s:"p26",tf:1,q:"When searching for evidence, you need to think critically and wisely and check whether the source is reliable.",a:1,e:"True."},
{l:7,s:"p31",q:"According to NMC (2019), about what % of UK nurses regularly use Facebook?",o:["~54%","~25%","~75%","~90%"],e:"About 54%."},
{l:7,s:"p32",q:"Which of the following is NOT listed as a benefit of professional social media use?",o:["Sharing patient photos for teaching","Raising the visibility of the profession","Building professional networks","Accessing and giving support"],e:"Benefits: visibility, learning development, professional networks, discussions and ideas, access and give support, enhance knowledge. Sharing patient photos is a breach."},
{l:7,s:"p33",q:"Which of the following is listed as a RISK of social media use for nurses?",o:["Online socialization may keep nurses from gaining real-life skills such as active listening","Raising the profession's visibility","Building networks","Enhancing knowledge"],e:"Risks: low awareness of online vulnerability and privacy, fewer real-life skills, interruptions to care (situational awareness), cyberbullying (anonymous bullies)."},
{l:7,s:"p33",q:"Nurses who think a closed-group discussion is safe and do not restrict access to their posts show which risk?",o:["Lack of awareness of online vulnerability / privacy","Cyberbullying","Loss of real-life skills","Interruptions to care"],e:"Lack of awareness of vulnerability online / privacy."},
{l:7,s:"p33",q:"Checking social media while working can affect nurses':",o:["Situational awareness and critical thinking","Salary","Registration status","Uniform"],e:"Interruptions to nursing care → situational awareness and critical thinking suffer."},
{l:7,s:"p35",q:"E-professionalism is also known as:",o:["Digital professionalism","Online nursing","Tele-nursing","Social nursing"],e:"Digital professionalism."},
{l:7,s:"p35",q:"E-professionalism is defined by Cain and Romanelli (2009) as:",o:["Attitudes and behaviours (some in private settings) reflecting traditional professionalism, shown through digital media","Using the internet only for work","Having a LinkedIn account","Following the hospital IT policy"],e:"Cain and Romanelli, 2009. Note: some of these behaviours may happen in PRIVATE settings."},
{l:7,s:"p35",tf:1,q:"E-professionalism covers only what nurses post while on duty, not their private online behaviour.",a:0,e:"False. Some of these attitudes and behaviours may occur in private settings."},
{l:7,s:"p36-39",q:"Which question belongs to \"Who are you (now)?\" when working towards e-professionalism?",o:["Does your current digital footprint represent you accurately?","What information do you want someone to find in the future?","Which professional organizations are relevant to you?","What do you need to do now to build your professional identity?"],e:"(1) Who are you now → current digital footprint. (2) Who are you going to be → future. (3) Professional bodies' guidelines. (4) Create and maintain an effective presence."},
{l:7,s:"p39",q:"Which is a recommended action to create and maintain an effective online presence?",o:["Review your privacy settings and adjust them where necessary","Delete all social media","Post daily about clinical placements","Use one identity for everything without checking"],e:"Review privacy settings; reflect on your curated identity; think ahead as a professional-in-training; make a plan."},
{l:7,s:"p39",q:"Lecture 7 encourages you to think of yourself on social media as:",o:["A professional-in-training rather than just a student","A private citizen only","An anonymous user","A celebrity"],e:"Think ahead: a professional-in-training."},
{l:7,s:"p40",q:"Which statement describes younger generations' attitudes towards social media in Lecture 7?",o:["They use it mainly for personal purposes, and the line between personal and professional life becomes blurred","They use it mainly for professional development","They avoid social media","They keep personal and professional lives strictly separate"],e:"Personal use; may not see the link to professional development; blurred boundaries."},
{l:7,s:"p41",q:"Which of the following is an example of unprofessional or unlawful behaviour on social media?",o:["Building or pursuing relationships with patients or service users","Sharing a published research article","Joining a professional nursing group","Posting about a nursing conference you attended"],e:"Listed: sharing confidential information, posting patient pictures without consent, inappropriate comments, bullying, pursuing relationships with patients, identity theft, encouraging violence or self-harm, inciting hatred, spreading misinformation."},
{l:7,s:"p41",tf:1,q:"Spreading misinformation on social media is listed as unprofessional or unlawful behaviour.",a:1,e:"True."},
{l:7,s:"p42",q:"Which of the following is NOT one of the principles of social networking for nurses?",o:["Posts in a private group will not be seen by others","Must not place any identifiable patient information online","Separate personal and professional information online","Set clear professional patient–nurse boundaries"],e:"You SHOULD expect your posts will be seen by others. Think before you post."},
{l:7,s:"p42",q:"Professional boundaries are defined as:",o:["The spaces between the nurse's power and the patient's vulnerability","Physical distance of 2–3 feet","Ward visiting hours","The limits of the nurse's scope of practice"],e:"Spaces between the nurse's power and the patient's vulnerability."},
{l:7,s:"p42",q:"According to Lecture 7, where does the nurse's power come from?",o:["The nurse's professional position and access to sensitive personal information","The nurse's age","Hospital management","The patient's family"],e:"Professional position + access to sensitive personal information."},
{l:7,s:"p42",q:"Which is a principle of social networking for nurses?",o:["Develop organizational policies governing online conduct","Post patient stories without names","Accept friend requests from patients","Share clinical photos in closed groups"],e:"Principles: no identifiable patient information; expect posts to be seen; organizational policies; separate personal and professional; clear boundaries; think before you post."},
{l:7,s:"p44",q:"Under the Agreement on Professional Conduct in Clinical Practicum, which is ALLOWED?",o:["Using patient information for a care plan, kept highly confidential and destroyed afterwards","Photocopying a patient's medical record for study","Discussing a patient with classmates in the MTR","Taking a photo of a wound without consent for revision"],e:"Info for learning (care plans, case conferences) must be kept highly confidential and destroyed once the learning purpose is achieved."},
{l:7,s:"p44",q:"Under the Agreement on Professional Conduct in Clinical Practicum, patients' medical records:",o:["Must not be photocopied","May be photocopied if names are covered","May be photocopied for assignments","May be photographed with a phone"],e:"Must not be photocopied."},
{l:7,s:"p44",q:"Under the practicum agreement, patient information must not be discussed in public places such as:",o:["Public transport, canteens and lifts","The nurses' station with the care team","Case conferences","Tutorials, anonymized"],e:"Public transport, canteens, lifts."},
{l:7,s:"p44",q:"Under the practicum agreement, communication devices such as mobile phones:",o:["Should not be carried into clinical areas","May be used on silent mode","May be used to take photos for learning","Are allowed if the ward manager is informed"],e:"Should not be carried to clinical areas."},
{l:7,s:"p44",q:"Under the practicum agreement, photos or recordings of patients may be taken only with:",o:["Institutional authorization and the patient's and/or guardian's consent","The patient's verbal agreement only","The tutor's permission only","No one's permission if faces are hidden"],e:"Institutional authorization + patient's and/or guardian's consent."},
{l:7,s:"p44",q:"Under the practicum agreement, how many items are there?",o:["7","5","10","11"],e:"7 items."},
{l:7,s:"p47",q:"A student uploads a photo of the ward (no patient names shown) to Instagram. According to Lecture 7, this is:",o:["A breach of confidential information, leading to disciplinary action (FTP)","Acceptable because no names are shown","Acceptable if the account is private","Acceptable if deleted within 24 hours"],e:"Students MUST NOT upload any photos related to patients or clinical areas, EVEN IF no names are mentioned → breach → FTP (fitness to practise) disciplinary action."},
{l:7,s:"p47",tf:1,q:"Uploading a photo of a clinical area to a blog is acceptable as long as no patient names are mentioned.",a:0,e:"False. It is still a breach of confidential information and leads to disciplinary action (FTP)."},
{l:7,s:"p48",q:"According to the L7 summary, what guides nurses to protect patient privacy and confidentiality on social media?",o:["The code of professional conduct and ethics, and the principles of social networking","Personal preference","Social media platform rules only","The patient's family"],e:"Code of professional conduct and ethics + principles for social networking."}
);

// Added 2026-09-29 from Kevin's photos of the slides the lecturer called important (appended at the end so numbering stays stable)
Q.push(
{l:7,s:"p29",q:"In the L7 hierarchy of evidence, which level sits directly BELOW RCTs?",o:["Cohort studies","Cross-sectional studies","Case-control studies","Systematic review & meta-analysis"],e:"SR & MA → RCTs → cohort → cross-sectional → case-control → case reports & series → basic science & translational research."},
{l:7,s:"p29",q:"In the L7 hierarchy of evidence, which is ranked HIGHER (stronger)?",o:["Cross-sectional studies","Case-control studies","Case reports and case series","Basic science and translational research"],e:"On this slide cross-sectional sits ABOVE case-control."},
{l:7,s:"p29",q:"Which group of studies does the L7 pyramid bracket as \"observational\"?",o:["Cohort, cross-sectional, case-control, and case reports / case series","RCTs and systematic reviews","Only cohort studies","Basic science and translational research"],e:"The bracket runs from cohort studies down to case reports and case series."},
{l:7,s:"p29",tf:1,q:"In the L7 hierarchy of evidence, RCTs are the second-highest level of evidence.",a:1,e:"True. Only systematic review & meta-analysis is above RCTs."},
{l:7,s:"p25",q:"In the six steps to EBP, the first step \"identify a problem\" is labelled on the slide as finding a:",o:["Gap","Hypothesis","Theory","Protocol"],e:"The slide marks \"Identify a problem\" with GAP: EBP starts from a gap in practice."},
{l:7,s:"p25",q:"Which step of EBP comes directly BEFORE \"disseminate the information and apply in daily practice\"?",o:["Evaluate and summarize the outcomes","Application of findings","Critically appraise the evidence","Literature search"],e:"… → application of findings → evaluate and summarize outcomes → disseminate."},
{l:7,s:"p35",q:"E-professionalism is described as the way you engage yourself online in relation to:",o:["Your profession, including your attitudes, actions and adherence to professional codes of conduct","Your friends and family only","Your personal hobbies","Your employer's marketing"],e:"Slide p35, highlighted by the lecturer: \"engage yourself online in relation to your profession\"."}
);

// L8 — General Health Survey (C Sun)
Q.push(
{l:8,s:"p4",q:"The nursing process is described as:",o:["Cyclic rather than linear, changing over time, and patient-centred","Linear, with a fixed end point","Doctor-centred","Done only once on admission"],e:"Cyclic, changing over time, patient-centred; organized and effective care."},
{l:8,s:"p4",tf:1,q:"The nursing process is linear: once evaluation is done, the process ends.",a:0,e:"False. It is CYCLIC, not linear."},
{l:8,s:"p5",q:"Which of the following is NOT a purpose of the nursing process?",o:["To make medical diagnoses","To identify the client's health status and actual or potential problems","To apply the best available evidence in nursing care","To record the client's health status and response to illness"],e:"Purposes: identify status / problems, make plans, deliver interventions, apply best evidence, show care systematically, record status and response."},
{l:8,s:"p6",q:"Which step of the nursing process is health assessment?",o:["The first step","The second step","The last step","It is not part of the nursing process"],e:"Health assessment = FIRST step of the nursing process."},
{l:8,s:"p6",q:"Health assessment is defined as:",o:["The systematic collection of information on a patient's health status and health risks","Giving treatment to patients","Writing the discharge summary","Evaluating the care plan"],e:"Systematic collection of information on health status and health risks."},
{l:8,s:"p6",q:"Health assessment data are gathered through:",o:["Observation, interviews, health history and physical examination","Lab tests only","Doctors' notes only","Family reports only"],e:"Observation, interviews, health history, physical exam. Assess HOLISTICALLY; it must be ACCURATE and COMPLETE."},
{l:8,s:"p12",q:"According to Lecture 8, whatever assessment method is used, the most important thing is that it is:",o:["Accurate","Fast","Short","Written in English"],e:"\"No matter which method is used, the most important thing is ACCURATE!!!\""},
{l:8,s:"p8",q:"Which of the following should the nurse AVOID in a patient-centred interview?",o:["Being judgemental or emotional","Introducing yourself","Showing genuine interest and partnership","Making sure the patient has privacy and comfort"],e:"Avoid being judgemental or emotional; be supportive, professional and pleasant."},
{l:8,s:"p8",q:"A patient-centred interview is described as a:",o:["Formal, structured discussion","Casual chat","Written questionnaire","Group discussion"],e:"Formal, structured discussion: discover concerns, explore expectations, show genuine interest and partnership."},
{l:8,s:"p9",q:"Which of the following is a purpose of assessment?",o:["Establishing a baseline","Prescribing medication","Discharging the patient","Billing"],e:"Purposes: establish baseline, identify problems / current dysfunction, develop the care plan, evaluate care plan effectiveness."},
{l:8,s:"p10",q:"An assessment done on admission, or when the client first comes to the clinic or hospital, is:",o:["Initial assessment","Focused assessment","Ongoing assessment","Comprehensive assessment"],e:"Initial assessment."},
{l:8,s:"p10",q:"Which type of assessment gives holistic information about the client's overall health, e.g. using Gordon's Functional Health Patterns?",o:["Comprehensive assessment","Focused assessment","Initial assessment","Ongoing assessment"],e:"Comprehensive = holistic, GFHP."},
{l:8,s:"p11",q:"An assessment of one specific problem, e.g. only the patient's back pain, is a:",o:["Focused (patient-centred) assessment","Comprehensive assessment","Initial assessment","Genogram"],e:"Focused assessment."},
{l:8,s:"p11",q:"Re-assessing a patient to detect CHANGES in their condition is which type of assessment?",o:["Ongoing assessment","Initial assessment","Comprehensive assessment","Focused interview"],e:"Ongoing = monitor change."},
{l:8,s:"p13",q:"Who proposed the Functional Health Patterns, and when?",o:["Marjory Gordon, 1987","Virginia Henderson, 1966","Dorothea Orem, 1971","Barbara Carper, 1978"],e:"Marjory Gordon (1931–2015), 1987. The patterns guide building a comprehensive nursing database."},
{l:8,s:"p13",q:"Which nursing diagnosis classification is based on Gordon's Functional Health Patterns?",o:["NANDA Taxonomy II","ICD-10","DSM-5","ISBAR"],e:"NANDA Taxonomy II."},
{l:8,s:"p13",q:"How many Gordon's Functional Health Patterns are there?",o:["11","13","14","10"],e:"11. (Nightingale = 13 concepts; Henderson = 14 components; Watson = 10 carative factors.)"},
{l:8,s:"p13",q:"Which of the following is NOT one of Gordon's Functional Health Patterns?",o:["Physiological mode","Elimination","Coping–stress tolerance","Values–beliefs"],e:"Physiological mode is Roy's. GFHP: health perception–management, nutritional–metabolic, elimination, activity–exercise, sleep–rest, cognitive–perceptual, self-perception–self-concept, roles–relationships, sexuality–reproductive, coping–stress tolerance, values–beliefs."},
{l:8,s:"p41",q:"Questions about immunization records, medication compliance, smoking and the last physical check-up belong to which GFHP pattern?",o:["Health perception–health management","Nutritional–metabolic","Activity–exercise","Values–beliefs"],e:"Health perception / management."},
{l:8,s:"p42",q:"Questions about skin, scalp and nails belong to which GFHP pattern?",o:["Nutritional–metabolic","Elimination","Self-perception–self-concept","Activity–exercise"],e:"Nutrition and metabolism includes tissue integrity and host defences, so skin, scalp and nails are here."},
{l:8,s:"p42",q:"Questions about food allergies and weight change in the past month belong to which GFHP pattern?",o:["Nutritional–metabolic","Health perception–management","Elimination","Activity–exercise"],e:"Nutritional–metabolic."},
{l:8,s:"p44",q:"Excessive sweating (perspiration) or odour problems belong to which GFHP pattern?",o:["Elimination","Nutritional–metabolic","Self-perception","Activity–exercise"],e:"Elimination = bowel, bladder AND skin."},
{l:8,s:"p44",q:"Questions about using laxatives and urinary problems such as dysuria or haematuria belong to which GFHP pattern?",o:["Elimination","Nutritional–metabolic","Sexuality–reproductive","Health perception–management"],e:"Elimination."},
{l:8,s:"p45",q:"Asking whether the patient can do toileting, grooming, feeding, dressing, bathing and walking (ADLs) belongs to which GFHP pattern?",o:["Activity–exercise","Self-perception–self-concept","Roles–relationships","Health perception–management"],e:"Activity–exercise: ADLs, exercise, hobbies; respiratory, cardiovascular and musculoskeletal systems."},
{l:8,s:"p45",q:"Which body systems are evaluated in the activity–exercise pattern?",o:["Respiratory, cardiovascular and musculoskeletal","Renal and GI","Endocrine and reproductive","Nervous and integumentary"],e:"Respiratory, cardiovascular, musculoskeletal."},
{l:8,s:"p46",q:"Checking orientation to time, place and person, memory, and level of consciousness belongs to which GFHP pattern?",o:["Cognitive–perceptual","Self-perception–self-concept","Sleep–rest","Values–beliefs"],e:"Cognitive–perceptual: senses, cognition, LOC, neurological function, pain perception."},
{l:8,s:"p46",q:"Pain perception is assessed under which GFHP pattern?",o:["Cognitive–perceptual","Activity–exercise","Coping–stress tolerance","Health perception–management"],e:"Cognitive–perceptual: sensory experiences, including pain perception."},
{l:8,s:"p46",q:"Gigi wears glasses for mild short-sightedness. This is recorded under which GFHP pattern?",o:["Cognitive–perceptual","Self-perception–self-concept","Activity–exercise","Health perception–management"],e:"Vision = sensory function = cognitive–perceptual."},
{l:8,s:"p47",q:"Asking about naps, sleep medication and relaxation methods (e.g. warm milk, hot bath) belongs to which GFHP pattern?",o:["Sleep–rest","Coping–stress tolerance","Activity–exercise","Health perception–management"],e:"Sleep–rest."},
{l:8,s:"p48",q:"\"Are you satisfied with your body image? Who do you really wish you were?\" belong to which GFHP pattern?",o:["Self-perception–self-concept","Roles–relationships","Values–beliefs","Cognitive–perceptual"],e:"Self-perception–self-concept: body image, self-worth, self-esteem, ideal self."},
{l:8,s:"p48",q:"In the self-perception–self-concept pattern, which of these is OBJECTIVE data?",o:["Body posture, eye contact and voice tone","\"I feel useless\"","\"I wish I were someone else\"","\"I'm not satisfied with my body\""],e:"Objective data here: body posture, eye contact, voice tone."},
{l:8,s:"p49",q:"\"Who will take on your responsibilities if you are in hospital?\" belongs to which GFHP pattern?",o:["Roles–relationships","Coping–stress tolerance","Health perception–management","Self-perception–self-concept"],e:"Roles–relationships: role strain, family burden, family structure."},
{l:8,s:"p50",q:"Asking about the last menstrual period (LMP), Pap smears and HPV vaccination belongs to which GFHP pattern?",o:["Sexuality–reproductive","Health perception–management","Elimination","Values–beliefs"],e:"Sexuality–reproductive: includes Gravida / Para, breast self-exam, Pap smear, HPV vaccine."},
{l:8,s:"p51",q:"\"Have you had any big changes in your life recently? How do you handle stress?\" belong to which GFHP pattern?",o:["Coping–stress tolerance","Roles–relationships","Values–beliefs","Sleep–rest"],e:"Coping–stress tolerance."},
{l:8,s:"p52",q:"Asking whether the patient believes in TCM or herbal medicine and wants spiritual support belongs to which GFHP pattern?",o:["Values–beliefs","Health perception–management","Coping–stress tolerance","Cognitive–perceptual"],e:"Values–beliefs (spiritual and cultural; influences on decisions)."},
{l:8,s:"p50",q:"Which GFHP pattern records reproductive history as \"Gravida / Para\"?",o:["Sexuality–reproductive","Roles–relationships","Elimination","Nutritional–metabolic"],e:"Sexuality–reproductive."},
{l:8,s:"p16",q:"Which is a PRIMARY source of patient data?",o:["The patient","The family","Medical records","Diagnostic test results"],e:"Primary = the patient. Secondary = family / significant others, health care team, medical records, diagnostic data."},
{l:8,s:"p16",q:"Which is a SECONDARY source of patient data?",o:["The patient's medical records","The patient's own report of pain","The patient's own description of their feelings","The patient's answers in an interview"],e:"Secondary = anything not from the patient directly."},
{l:8,s:"p15",q:"When retrieving biographic data from the patient record, what should you do before saving?",o:["Verify it","Delete old data","Ask the doctor","Print it"],e:"\"Remind to VERIFY before SAVE the retrieved data from patient record.\""},
{l:8,s:"p15",q:"Which of the following is NOT part of biographic data?",o:["Blood pressure","Date of birth / age","Occupation","Informant / source of information"],e:"Biographic: name, DOB / age, sex, address, phone, marital status, education, occupation, informant, date and time of history taking."},
{l:8,s:"p17",q:"Subjective data (symptoms) are:",o:["The patient's feelings, perceptions and self-reported symptoms","What the nurse sees, hears and touches","Lab results","Vital signs"],e:"Subjective = reported by the client."},
{l:8,s:"p17",q:"Objective data (signs) are:",o:["Observations and measurements of what you see, hear and touch","The patient's feelings","The patient's perceptions","What the family says the patient feels"],e:"Objective = observed or measured."},
{l:8,s:"p18",q:"Which skills are used to collect OBJECTIVE data in the physical examination?",o:["Inspection, palpation, percussion and auscultation","Listening, empathy and caring","Paraphrasing and summarizing","Counselling"],e:"IPPA. Subjective data need interviewing, caring, empathy and listening skills."},
{l:8,s:"p18",q:"What is the main method for collecting SUBJECTIVE data?",o:["Interview","Physical examination","Lab tests","Observation"],e:"Interview (with therapeutic communication)."},
{l:8,s:"p19",q:"Which statement about SIGNS is correct?",o:["They are objective, quantitative, measurable and can be verified","They are subjective and cannot be verified","They are collected by personal communication only","They are qualitative"],e:"Signs = objective, measurable, verifiable. Symptoms = subjective, qualitative, cannot be verified."},
{l:8,s:"p19",tf:1,q:"Symptoms are subjective data that cannot be verified.",a:1,e:"True."},
{l:8,s:"p20",q:"\"Nurse, my stomach is so painful!\" is a:",o:["Symptom (subjective)","Sign (objective)"],e:"Self-reported = symptom."},
{l:8,s:"p20",q:"BP 180/90 mmHg is a:",o:["Sign (objective)","Symptom (subjective)"],e:"Measured = sign."},
{l:8,s:"p20",q:"Palpitations are a:",o:["Symptom (subjective)","Sign (objective)"],e:"Palpitation is felt and reported by the patient = symptom. (Heart rate 100 bpm would be a sign.)"},
{l:8,s:"p20",q:"Haemoglobin 11 g/dL on a lab report is a:",o:["Sign (objective)","Symptom (subjective)"],e:"Measured = sign."},
{l:8,s:"p20",q:"A pregnant woman feels nauseous in the morning. Her nausea is a:",o:["Symptom (subjective)","Sign (objective)"],e:"Nausea is felt = symptom."},
{l:8,s:"p20",q:"Urine output 500 mL from 11 am to 3 pm is a:",o:["Sign (objective)","Symptom (subjective)"],e:"Measured = sign."},
{l:8,s:"p19",q:"In Sarah's case, the stage 2 pressure injury is a ___, while her lower back pain and fatigue are ___.",o:["sign; symptoms","symptom; signs","sign; signs","symptom; symptoms"],e:"Pressure injury is seen = sign. Pain and fatigue are reported = symptoms."},
{l:8,s:"p17",q:"The nurse sees Sarah massaging her lower back. This is:",o:["Objective data","Subjective data"],e:"Observed behaviour = objective. Her report of back pain = subjective."},
{l:8,s:"p18",q:"\"I feel dizzy\" is ___ data, while \"the client has a flushed face\" is ___ data.",o:["subjective; objective","objective; subjective","subjective; subjective","objective; objective"],e:"Reported vs observed."},
{l:8,s:"p21",q:"How many components of health history taking are listed in Lecture 8?",o:["8","7","11","5"],e:"8: biographic data, reasons for seeking health care, history of present concern, past history, family history, genogram, comprehensive assessment (GFHP), review of body systems."},
{l:8,s:"p21",q:"Which of the following is NOT one of the 8 components of health history taking?",o:["Nursing care plan","Biographic data","Genogram","Review of body systems"],e:"The care plan comes later in the nursing process, not in the history."},
{l:8,s:"p22",q:"\"The primary problem or symptom that made the patient seek medical care\" is recorded as the:",o:["Reason for seeking health care (C/O, complaint of)","Past health history","Family history","Review of systems"],e:"Reason for seeking care; abbreviated C/O = complaint of."},
{l:8,s:"p22",q:"The abbreviation \"C/O\" in history taking means:",o:["Complaint of","Care of","Check-out","Cause of"],e:"C/O = complaint of."},
{l:8,s:"p24",q:"The acronym used in Lecture 8 to describe current symptoms is:",o:["COLDSPA","ISBAR","SOLER","SURETY"],e:"COLDSPA: Character, Onset, Location, Duration, Severity, Pattern, Associated factors."},
{l:8,s:"p24",q:"In COLDSPA, what does \"C\" stand for?",o:["Character","Cause","Condition","Complaint"],e:"Character = the nature of the symptom (sharp, dull, throbbing…)."},
{l:8,s:"p24",q:"In COLDSPA, what does \"P\" stand for?",o:["Pattern: what makes it better or worse","Pain","Position","Past history"],e:"Pattern = what makes the symptom better or worse; triggers."},
{l:8,s:"p24",q:"In COLDSPA, what does \"A\" stand for?",o:["Associated factors / symptoms","Allergies","Assessment","Age"],e:"Associated factors = other symptoms that come with the main one."},
{l:8,s:"p29",q:"\"I would rate the pain as a 7 out of 10.\" Which COLDSPA element is this?",o:["Severity","Character","Pattern","Duration"],e:"Severity = intensity."},
{l:8,s:"p25",q:"\"The pain feels sharp and stabbing.\" Which COLDSPA element is this?",o:["Character","Severity","Location","Onset"],e:"Character."},
{l:8,s:"p28",q:"\"I've had this pain for three days, and it comes and goes.\" Which COLDSPA element is this?",o:["Duration","Onset","Pattern","Severity"],e:"Duration = how long it lasts; constant or intermittent."},
{l:8,s:"p30",q:"\"It gets worse when I lie flat, and better after I pass urine or open my bowels.\" Which COLDSPA element is this?",o:["Pattern","Duration","Associated symptoms","Location"],e:"Pattern = what makes it better or worse."},
{l:8,s:"p31",q:"\"Along with the pain, I feel nauseous and have a headache.\" Which COLDSPA element is this?",o:["Associated symptoms","Character","Pattern","Severity"],e:"Associated symptoms."},
{l:8,s:"p27",q:"\"The pain is in my lower back and does not spread.\" Which COLDSPA element is this?",o:["Location","Character","Pattern","Onset"],e:"Location (including whether it radiates)."},
{l:8,s:"p26",q:"\"When did it start? Was it sudden or gradual?\" asks about which COLDSPA element?",o:["Onset","Duration","Pattern","Character"],e:"Onset."},
{l:8,s:"p24",q:"Besides COLDSPA, which other questions belong to the history of the present health concern?",o:["Any treatment received (when, what, who, where, how) and ability to provide self-care","Family members' illnesses","Childhood immunizations","Religious beliefs"],e:"History of present concern = describe symptoms in detail + treatment received + ability to self-care."},
{l:8,s:"p33",q:"Which of the following belongs to PAST health history?",o:["Allergies","Parents' causes of death","Current chief complaint","Genogram"],e:"Past history: previous accidents / injuries, health maintenance, allergies, childhood illness / congenital problems, adult illness, previous hospitalization / surgery, current medication / substance use."},
{l:8,s:"p33",tf:1,q:"Current medication and substance use are recorded under past health history.",a:1,e:"True (as listed on slide 33)."},
{l:8,s:"p34",q:"The main purpose of taking a family health history is to:",o:["Identify hereditary and familial health risks","Find out who will visit the patient","Plan the patient's discharge","Assess the patient's self-concept"],e:"Identify hereditary / familial risks, record major illnesses, age of onset, cause / age of death; guide assessment, education, screening and prevention."},
{l:8,s:"p34",q:"Family health history collects information on which relatives?",o:["Parents, siblings, children and grandparents","Friends and neighbours","Spouse only","Co-workers"],e:"Parents, siblings, children, grandparents."},
{l:8,s:"p35",q:"A genogram is:",o:["A graphic presentation of a family tree used to assess family health and medical history","A lab test for genes","A list of medications","A chart of vital signs"],e:"Genogram = family tree diagram; quickly shows patterns in family history."},
{l:8,s:"p35",tf:1,q:"A genogram lets health care professionals quickly spot patterns in a patient's family history.",a:1,e:"True."},
{l:8,s:"p39",q:"In the genogram exercise, Emily (40) has diabetes; her mother had diabetes and died at 63 of lung cancer. What should be recorded for the mother?",o:["Her major illness (diabetes), age at death (63) and cause of death (lung cancer)","Only that she is deceased","Only her diabetes","Nothing, because she has died"],e:"Record major illnesses and cause / age of death."},
{l:8,s:"p53",q:"What is the correct order of handling assessment data?",o:["Collection → validation → interpretation → organization","Collection → interpretation → validation → organization","Validation → collection → organization → interpretation","Organization → collection → validation → interpretation"],e:"Collect → Validate → Interpret → Organize."},
{l:8,s:"p54",q:"In which situation should you validate collected data?",o:["Subjective and objective data do not agree","A lab result is reported","An X-ray report is available","The data are within normal range and consistent"],e:"Validate when: S and O data disagree; patient's statements change during the interview; data are far outside normal; something interferes with accurate measurement. Lab and X-ray results don't need validating."},
{l:8,s:"p54",tf:1,q:"All data, including lab results and X-ray results, must be validated by the nurse.",a:0,e:"False. Not all data need validating, e.g. lab and X-ray results."},
{l:8,s:"p54",q:"A patient says \"I have no pain\" but is grimacing and guarding their abdomen. What should the nurse do next?",o:["Validate the data","Record \"no pain\" and move on","Record only the grimacing","Stop the assessment"],e:"Subjective and objective data do not agree → validate."},
{l:8,s:"p55",q:"Which of the following is correct during DATA INTERPRETATION?",o:["Link pieces of information to see the whole picture, and stay open-minded","Base conclusions on your own past experience","Presume the diagnosis before collecting data","Ignore gaps in the data"],e:"Interpretation: fill gaps, link information, avoid inferences from your own preferences or experience, no presumption, be open-minded."},
{l:8,s:"p56",q:"Data organization should use a framework or format that:",o:["Lets the health care team access it, e.g. the ePR (electronic patient record)","Only the nurse can read","Is kept in the nurse's notebook","Is thrown away after discharge"],e:"Organized for team access; factual and complete documentation → comprehensive care. E.g. ePR."},
{l:8,s:"p3",q:"Sarah, 70, has been bedridden for weeks and has a stage 2 pressure injury on her lower back. Which Gordon pattern covers her skin integrity problem?",o:["Nutritional–metabolic","Elimination","Activity–exercise","Self-perception"],e:"Tissue integrity is under nutritional–metabolic (skin, scalp, nails). Her immobility would ALSO be under activity–exercise."}
);

</script>
<script>
(function(){
const LECT={1:"History, education & organizations",2:"Fundamental patterns of knowing",3:"Nursing as a profession & roles",4:"Therapeutic communication & counselling",5:"Nurse–client & team communication",6:"History of nursing thoughts (theorists)",7:"Evidence, social media & e-professionalism",8:"General health survey"};
const EXAM=new Date(2026,8,29,0,0,0);
const KEY="gin-test1-drill-v1";

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
Q.forEach(q=>{q.id=q.l+"-"+hash(q.q);});
const byId={};Q.forEach(q=>byId[q.id]=q);
// Question number = lecture + position in the data file (new questions go at the END of a lecture's file so numbers stay stable)
{const cnt={};Q.forEach(q=>{cnt[q.l]=(cnt[q.l]||0)+1;q.no="L"+q.l+"-"+String(cnt[q.l]).padStart(3,"0");});}
function optText(q,oi){return q.tf?(oi?"True":"False"):q.o[oi];}
function answerText(q){return q.tf?(q.a?"True":"False"):q.o[0];}

let S={q:{},sel:[1,2,3,4,5,6,7,8],resetAt:0};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.q)S={q:p.q,sel:Array.isArray(p.sel)&&p.sel.length?p.sel:S.sel,resetAt:p.resetAt||0};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}schedulePush();}
function st(id){return S.q[id]||(S.q[id]={n:0,r:0,s:0,b:0,t:0});}
function record(q,ok,oi){const x=st(q.id);x.n++;x.t=Date.now();if(ok){x.r++;x.s++;if(x.s>=2)x.b=0;}else{x.s=0;x.b=1;if(oi!=null)x.lw=oi;}save();}

/* ---------- SYNC (local-first; the private per-account db doc is the meeting point) ---------- */
const SYNC={state:"local",ref:null,writing:false,again:false,timer:null};
let view="home";
function syncLabel(){
  return {local:`<span class="dot" style="background:var(--muted)"></span>Saved on this device only`,
    syncing:`<span class="dot" style="background:var(--lamp)"></span>Syncing…`,
    synced:`<span class="dot" style="background:var(--ok)"></span>Synced to your account (Mac, iPad…)`,
    offline:`<span class="dot" style="background:var(--bad)"></span>Offline, saved on this device. Will sync when you're back online`}[SYNC.state];
}
function setSync(s){SYNC.state=s;const el=document.getElementById("sync");if(el)el.innerHTML=syncLabel();}
function merge(remote){
  let changed=false;const rr=remote.resetAt||0;
  if(rr>(S.resetAt||0)){S.resetAt=rr;for(const id in S.q){if((S.q[id].t||0)<rr){delete S.q[id];changed=true;}}}
  const rq=remote.q||{};
  for(const id in rq){const r=rq[id],l=S.q[id];if((r.t||0)<(S.resetAt||0))continue;
    if(!l||(r.t||0)>(l.t||0)){S.q[id]={n:r.n|0,r:r.r|0,s:r.s|0,b:r.b|0,t:r.t||0};if(r.lw!=null)S.q[id].lw=r.lw|0;changed=true;}}
  return changed;
}
function localAhead(remote){
  if((S.resetAt||0)>(remote.resetAt||0))return true;
  const rq=remote.q||{};
  for(const id in S.q){const r=rq[id];if(!r||(S.q[id].t||0)>(r.t||0))return true;}
  return false;
}
function schedulePush(delay){if(!SYNC.ref)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,delay==null?1500:delay);}
async function push(){
  if(!SYNC.ref)return;
  if(SYNC.writing){SYNC.again=true;return;}
  SYNC.writing=true;SYNC.again=false;if(SYNC.state!=="synced")setSync("syncing");
  try{await SYNC.ref.set({v:1,q:S.q,resetAt:S.resetAt||0,at:Date.now()});setSync("synced");}
  catch(e){setSync(e&&e.code==="revoked"?"local":"offline");if(e&&e.code!=="revoked")schedulePush(30000);}
  finally{SYNC.writing=false;if(SYNC.again)schedulePush(300);}
}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(!snap.exists){if(Object.keys(S.q).length||S.resetAt)schedulePush(0);else setSync("synced");return;}
  const d=snap.data()||{};
  if(merge(d)){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(view==="home")home();}
  if(localAhead(d))schedulePush(0);else if(!SYNC.writing)setSync("synced");
}
function subscribe(){
  SYNC.ref.onSnapshot(onRemote,e=>{setSync(e&&e.code==="revoked"?"local":"offline");if(!e||e.code!=="revoked")setTimeout(subscribe,30000);});
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    SYNC.ref=db.doc("data/users/"+uid+"/progress");setSync("syncing");subscribe();
  }catch(e){setSync("local");}
})();
window.addEventListener("online",()=>schedulePush(0));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")schedulePush(0);});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const app=document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){return Q.filter(q=>S.sel.includes(q.l));}
function options(q){ // returns [{t,correct}]
  if(q.tf)return [{t:"True",c:q.a===1,oi:1},{t:"False",c:q.a===0,oi:0}];
  return shuffle(q.o.map((t,i)=>({t,c:i===0,oi:i})));
}
function bookList(){return pool().filter(q=>S.q[q.id]&&S.q[q.id].b);}

let quiz=null, timerId=null;

/* ---------- HOME ---------- */
function home(){
  const from=view;clearInterval(timerId);quiz=null;view="home";
  const all=Q.length, seen=Q.filter(q=>S.q[q.id]&&S.q[q.id].n).length;
  let n=0,r=0;Object.values(S.q).forEach(x=>{n+=x.n;r+=x.r;});
  const book=Q.filter(q=>S.q[q.id]&&S.q[q.id].b).length, selBook=bookList().length;
  const days=Math.ceil((EXAM-new Date())/864e5);
  const dayTxt=days>1?days+" days":days===1?"1 day":days===0?"Today":"Done";
  const p=pool().length;
  let h=`<header class="top"><div class="brand"><span class="eyebrow">NURS1600 · Getting into Nursing</span><h1>Test I Drill<span class="flame" aria-hidden="true"></span></h1></div>
  <div class="exam"><span class="days num">${dayTxt}</span><span class="sub">Tue 29 Sep · L1–8 · 30 min</span></div></header>
  <div class="stats">
   <div class="stat"><b>${seen}<small style="font-size:13px;color:var(--muted)">/${all}</small></b><span>Questions seen</span></div>
   <div class="stat"><b>${n?Math.round(r/n*100)+"%":"—"}</b><span>Accuracy (${n} answers)</span></div>
   <div class="stat"><b style="color:${book?"var(--bad)":"inherit"}">${book}</b><span>Wrong answers to redo</span></div>
   <div class="stat"><b>${p}</b><span>In selected lectures</span></div>
  </div>
  <div class="modes">
   <button class="mode primary" id="m-practice" ${p?"":"disabled"}><span class="t">Endless practice</span><span class="d">Random order, never ends. New and wrong questions come up more often. Answer and explanation straight away.</span></button>
   <button class="mode" id="m-mock" ${p>=20?"":"disabled"}><span class="t">Mock test</span><span class="d">20 questions · 30 min timer · results only at the end, like the real test.</span></button>
   <button class="mode" id="m-book" ${selBook?"":"disabled"}><span class="t">Redo wrong answers <span class="num">(${selBook})</span></span><span class="d">Get a question right twice in a row and it leaves this list.</span></button>
  </div>
  <button class="histbtn" id="m-hist" ${seen?"":"disabled"}><span><b>Answer history</b><span class="d">Every question you've done, by number, with how often you got it wrong. Copy it for AI analysis.</span></span><span class="arrow" aria-hidden="true">→</span></button>
  <section class="sec"><div class="sec-head"><h2>Lectures</h2><span><button class="link" id="sel-all">Select all</button> · <button class="link" id="sel-none">Clear</button></span></div>
  <div class="lects">`;
  for(let l=1;l<=8;l++){
    const qs=Q.filter(q=>q.l===l), tot=qs.length;
    const m=qs.filter(q=>S.q[q.id]&&S.q[q.id].s>=1&&!S.q[q.id].b).length, w=qs.filter(q=>S.q[q.id]&&S.q[q.id].b).length;
    const on=S.sel.includes(l);
    h+=`<label class="chip ${on?"":"off"}"><input type="checkbox" id="lec-${l}" data-l="${l}" ${on?"checked":""}>
      <span class="nm"><b><span class="ln">L${l}</span>${esc(LECT[l])}</b><span class="bar"><i class="m" style="width:${m/tot*100}%"></i><i class="w" style="width:${w/tot*100}%"></i></span></span>
      <span class="ct">${m}/${tot}</span></label>`;
  }
  h+=`</div><div class="legend"><span><i style="background:var(--ok)"></i>Right, not in wrong-answers list</span><span><i style="background:var(--bad)"></i>In wrong-answers list</span></div></section>
  <p class="note"><strong>Unofficial practice questions.</strong> Written with AI help from the lecture slides by a classmate, not by the lecturers, so some may be wrong. Every question shows its slide number: check the slide when in doubt. Spotted a mistake? Screenshot it and send it to whoever shared this link. Your progress is saved in this browser only.</p>
  <p class="note"><strong>Real test format</strong> (course manual 7.3): MCQ / matching / true-or-false / fill-in-the-blanks, 30 minutes. Here, matching questions become one-per-item MCQs, and options can repeat just like in matching (e.g. Science / Art, the 7 ethical principles). Each question shows which slide page it comes from.</p>
  <p class="note syncline"><span id="sync">${syncLabel()}</span> · <span id="reset-zone"><button class="link" id="reset">Reset progress</button></span></p>`;
  app.innerHTML=h;
  app.querySelectorAll(".chip input").forEach(c=>c.addEventListener("change",()=>{
    const l=+c.dataset.l;S.sel=c.checked?[...new Set([...S.sel,l])].sort():S.sel.filter(x=>x!==l);save();home();const el=document.getElementById("lec-"+l);if(el)el.focus({preventScroll:true});
  }));
  document.getElementById("sel-all").onclick=()=>{S.sel=[1,2,3,4,5,6,7,8];save();home();};
  document.getElementById("sel-none").onclick=()=>{S.sel=[];save();home();};
  document.getElementById("m-practice").onclick=()=>start("practice");
  document.getElementById("m-mock").onclick=()=>start("mock");
  document.getElementById("m-book").onclick=()=>start("book");
  document.getElementById("m-hist").onclick=()=>showHistory();
  document.getElementById("reset").onclick=()=>{
    document.getElementById("reset-zone").innerHTML=`<span class="confirm">Clear all progress and the wrong-answers list? <button class="btn warn" id="reset-yes">Clear</button><button class="btn" id="reset-no">Cancel</button></span>`;
    document.getElementById("reset-yes").onclick=()=>{S.q={};S.resetAt=Date.now();save();schedulePush(0);home();};
    document.getElementById("reset-no").onclick=home;
  };
  if(from!=="home")window.scrollTo(0,0);
}

/* ---------- PICKING ---------- */
function weight(q){
  const x=S.q[q.id];
  if(!x||!x.n)return 4;          // unseen
  if(x.b)return 6;               // in wrong list
  return 1/(1+x.s);              // right streak → rarer
}
function pickPractice(){
  const p=pool(), recent=new Set(quiz.recent);
  let cands=p.filter(q=>!recent.has(q.id));if(!cands.length)cands=p;
  let tot=0;const w=cands.map(q=>{const v=weight(q);tot+=v;return v;});
  let r=Math.random()*tot;for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0)return cands[i];}
  return cands[cands.length-1];
}
function mockSet(){
  const p=pool(), by={};p.forEach(q=>(by[q.l]=by[q.l]||[]).push(q));
  const ls=Object.keys(by), out=[];
  // proportional allocation, at least 1 per selected lecture where possible
  const alloc={};let used=0;
  ls.forEach(l=>{alloc[l]=Math.max(1,Math.floor(20*by[l].length/p.length));used+=alloc[l];});
  while(used>20){const l=ls.reduce((a,b)=>alloc[a]>=alloc[b]?a:b);alloc[l]--;used--;}
  const order=shuffle(ls);let i=0;while(used<20){const l=order[i++%order.length];if(alloc[l]<by[l].length){alloc[l]++;used++;}}
  ls.forEach(l=>out.push(...shuffle(by[l]).slice(0,alloc[l])));
  return shuffle(out);
}

/* ---------- QUIZ ---------- */
function start(mode){
  quiz={mode,items:[],idx:0,right:0,done:0,recent:[],wrongs:[],swOpen:false};
  if(mode==="mock"){
    quiz.items=mockSet().map(q=>({q,opts:options(q),ch:null}));
    quiz.deadline=Date.now()+30*60*1000;
    timerId=setInterval(tick,1000);
  }else if(mode==="book"){
    quiz.items=shuffle(bookList()).map(q=>({q,opts:options(q),ch:null}));
  }else{
    const q=pickPractice();quiz.items=[{q,opts:options(q),ch:null}];
  }
  render();
}
function tick(){
  const left=quiz.deadline-Date.now();
  const el=document.getElementById("timer");
  if(left<=0){finishMock();return;}
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=m+":"+String(s).padStart(2,"0");el.classList.toggle("low",left<5*60000);}
}
function render(){
  view="quiz";
  const it=quiz.items[quiz.idx], q=it.q, mock=quiz.mode==="mock";
  const total=quiz.items.length;
  let progTxt, pct;
  if(quiz.mode==="practice"){progTxt=`#${quiz.done+(it.ch===null?1:0)} · ${quiz.right}/${quiz.done} right`;pct=0;}
  else if(mock){const a=quiz.items.filter(x=>x.ch!==null).length;progTxt=`Q${quiz.idx+1} of ${total} · ${a} answered`;pct=a/total*100;}
  else{progTxt=`${quiz.idx+1} of ${total} · ${quiz.right} right`;pct=(quiz.idx+(it.ch!==null?1:0))/total*100;}
  const modeName={practice:"Endless practice",mock:"Mock test",book:"Redo wrong answers"}[quiz.mode];
  let h=`<div class="qbar"><button class="home" id="exit">← Home</button>
    <div class="prog"><div class="row"><span>${modeName}</span><span>${progTxt}</span></div>${quiz.mode==="practice"?"":`<div class="track"><i style="width:${pct}%"></i></div>`}</div>
    ${mock?`<span class="timer" id="timer">30:00</span>`:""}</div>`;
  h+=`<article class="card"><div class="qmeta"><span class="tag">${q.no}</span><span class="tag plain">slide ${esc(q.s)}</span>${q.tf?`<span class="tag tf">True / False</span>`:""}</div>
    <h2 class="qtext">${esc(q.q)}</h2><div class="opts" role="group" aria-label="Answer options">`;
  const answered=it.ch!==null, reveal=answered&&!mock;
  it.opts.forEach((o,i)=>{
    let cls="opt";
    if(reveal){if(o.c)cls+=" right";else if(i===it.ch)cls+=" wrong";}
    else if(i===it.ch)cls+=" sel";
    h+=`<button class="${cls}" data-i="${i}" id="opt-${i}" ${reveal?"disabled":""}><span class="k">${"ABCD"[i]||i+1}</span><span class="tx">${esc(o.t)}</span></button>`;
  });
  h+=`</div>`;
  if(reveal){
    const ok=it.opts[it.ch].c, ans=it.opts.find(o=>o.c).t;
    h+=`<div class="fb ${ok?"ok":"no"}"><span class="h">${ok?"Correct":"Wrong. Answer: "+esc(ans)}</span><span>${esc(q.e)}</span></div>`;
  }
  h+=`<div class="acts">`;
  if(mock){
    h+=`<button class="btn" id="prev" ${quiz.idx?"":"disabled"}>← Previous</button>`;
    h+=quiz.idx<total-1?`<button class="btn go" id="next">Next →</button>`:`<button class="btn go" id="submit">Submit test</button>`;
  }else{
    const past=quiz.idx<total-1;
    h+=`<span class="kbd">${past?"Looking back · → or Enter = forward":reveal?"Enter = next · ← = previous":"Keys A–D or 1–4"}</span><span class="btns">`;
    if(quiz.idx>0)h+=`<button class="btn" id="prev">← Previous</button>`;
    if(reveal)h+=`<button class="btn go" id="next">${past?"Forward →":quiz.mode==="book"&&quiz.idx>=total-1?"Finish":"Next →"}</button>`;
    h+=`</span>`;
  }
  h+=`</div></article>`;
  if(!mock&&quiz.wrongs.length){
    h+=`<details class="sw" id="sw" ${quiz.swOpen?"open":""}><summary>Wrong this session <span class="num">(${quiz.wrongs.length})</span></summary><div class="review">`;
    quiz.wrongs.slice().reverse().forEach(w=>{h+=`<div class="rv"><span class="eyebrow">${w.q.no} · slide ${esc(w.q.s)}</span><span class="q">${esc(w.q.q)}</span><span class="a"><span class="y">✗ ${esc(w.yours)}</span><br><span class="c">✓ ${esc(answerText(w.q))}</span></span><span class="e">${esc(w.q.e)}</span></div>`;});
    h+=`</div></details>`;
  }
  if(mock){
    h+=`<section class="sec"><div class="sec-head"><span class="eyebrow">Jump to question</span><span id="sub-zone"><button class="link" id="submit2">Submit early</button></span></div><div class="grid">`;
    quiz.items.forEach((x,i)=>{h+=`<button class="gc ${x.ch!==null?"done":""} ${i===quiz.idx?"cur":""}" data-j="${i}">${i+1}</button>`;});
    h+=`</div></section>`;
  }
  app.innerHTML=h;
  if(mock)tick();
  document.getElementById("exit").onclick=()=>{if(mock){confirmExit();}else home();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const nx=document.getElementById("next");if(nx)nx.onclick=next;
  const pv=document.getElementById("prev");if(pv)pv.onclick=()=>{quiz.idx--;render();};
  const sb=document.getElementById("submit");if(sb)sb.onclick=confirmSubmit;
  const sb2=document.getElementById("submit2");if(sb2)sb2.onclick=confirmSubmit;
  app.querySelectorAll(".gc").forEach(b=>b.onclick=()=>{quiz.idx=+b.dataset.j;render();});
  const sw=document.getElementById("sw");if(sw)sw.addEventListener("toggle",()=>{quiz.swOpen=sw.open;});
}
function confirmSubmit(){
  const un=quiz.items.filter(x=>x.ch===null).length;
  const z=document.getElementById("sub-zone");
  z.innerHTML=`<span class="confirm">${un?un+" unanswered. ":""}Submit now? <button class="btn go" id="sub-yes">Submit</button><button class="btn" id="sub-no">Keep going</button></span>`;
  document.getElementById("sub-yes").onclick=finishMock;
  document.getElementById("sub-no").onclick=render;
  z.scrollIntoView({block:"nearest"});
}
function confirmExit(){
  const z=document.getElementById("sub-zone");
  z.innerHTML=`<span class="confirm">Leave the mock test? Your answers will not be saved. <button class="btn warn" id="ex-yes">Leave</button><button class="btn" id="ex-no">Stay</button></span>`;
  document.getElementById("ex-yes").onclick=home;
  document.getElementById("ex-no").onclick=render;
  z.scrollIntoView({block:"nearest"});
}
function choose(i){
  const it=quiz.items[quiz.idx];
  if(quiz.mode==="mock"){it.ch=i;render();return;}
  if(it.ch!==null)return;
  it.ch=i;const ok=it.opts[i].c;
  record(it.q,ok,it.opts[i].oi);quiz.done++;if(ok)quiz.right++;else quiz.wrongs.push({q:it.q,yours:it.opts[i].t});
  quiz.recent.push(it.q.id);if(quiz.recent.length>25)quiz.recent.shift();
  render();
  const fb=app.querySelector(".fb");if(fb)fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){
  if(quiz.mode==="mock"){quiz.idx++;render();return;}
  const it=quiz.items[quiz.idx];if(it.ch===null)return;
  if(quiz.idx<quiz.items.length-1){quiz.idx++;render();window.scrollTo(0,0);return;}
  if(quiz.mode==="practice"){const q=pickPractice();quiz.items.push({q,opts:options(q),ch:null});if(quiz.items.length>60)quiz.items.shift();quiz.idx=quiz.items.length-1;render();window.scrollTo(0,0);return;}
  bookDone();
}
function bookDone(){
  view="result";
  const left=bookList().length;
  app.innerHTML=`<article class="card"><span class="eyebrow">Round complete</span><div class="score"><span class="big num">${quiz.right}</span><span class="of">/ ${quiz.items.length} right</span></div>
  <p>${left?`<b>${left}</b> question${left>1?"s are":" is"} still on the wrong-answers list. You need to get each one right twice in a row to clear it.`:"The wrong-answers list is empty."}</p>
  <div class="acts">${left?`<button class="btn go" id="again">Go again</button>`:""}<button class="btn" id="back">Home</button></div></article>`;
  const a=document.getElementById("again");if(a)a.onclick=()=>start("book");
  document.getElementById("back").onclick=home;
}
function finishMock(){
  clearInterval(timerId);view="result";
  const its=quiz.items;let right=0;const per={};
  its.forEach(x=>{const ok=x.ch!==null&&x.opts[x.ch].c;if(ok)right++;record(x.q,ok,x.ch!==null?x.opts[x.ch].oi:null);const l=x.q.l;(per[l]=per[l]||[0,0]);per[l][1]++;if(ok)per[l][0]++;});
  const pct=Math.round(right/its.length*100);
  const verdict=pct>=85?"Ready for the test.":pct>=70?"Solid. Go over the wrong ones below.":pct>=50?"Borderline. Do more practice on your weakest lectures.":"Not yet. Start with endless practice on one lecture at a time.";
  let h=`<div class="qbar"><button class="home" id="exit">← Home</button><div class="prog"><div class="row"><span>Mock test result</span><span>${Math.round((Date.now()-(quiz.deadline-30*60000))/60000)} min used</span></div></div></div>
  <article class="card"><div class="score"><span class="big num">${right}</span><span class="of">/ ${its.length} · ${pct}%</span></div><p class="verdict">${verdict}</p>
  <div class="breakdown">`;
  Object.keys(per).sort().forEach(l=>{const [a,b]=per[l];h+=`<div class="bd"><span class="l">L${l}</span><span class="bar" style="height:8px"><i class="m" style="width:${a/b*100}%"></i><i class="w" style="width:${(b-a)/b*100}%"></i></span><span class="r">${a}/${b}</span></div>`;});
  h+=`</div><div class="acts"><button class="btn go" id="again">New mock test</button><button class="btn" id="back">Home</button></div></article>
  <section class="sec"><div class="sec-head"><h2>Review</h2><button class="link" id="toggle">Show all</button></div><div class="review" id="rv"></div></section>`;
  app.innerHTML=h;
  let showAll=false;
  function list(){
    const rv=document.getElementById("rv");let s="";
    its.forEach((x,i)=>{const ok=x.ch!==null&&x.opts[x.ch].c;if(ok&&!showAll)return;
      const ans=x.opts.find(o=>o.c).t, yours=x.ch===null?"(no answer)":x.opts[x.ch].t;
      s+=`<div class="rv ${ok?"ok":""}"><span class="eyebrow">Q${i+1} · ${x.q.no} · slide ${esc(x.q.s)}</span><span class="q">${esc(x.q.q)}</span>
      <span class="a">${ok?`<span class="c">✓ ${esc(ans)}</span>`:`<span class="y">✗ Your answer: ${esc(yours)}</span><br><span class="c">✓ ${esc(ans)}</span>`}</span><span class="e">${esc(x.q.e)}</span></div>`;});
    rv.innerHTML=s||`<div class="empty">All correct.</div>`;
    document.getElementById("toggle").textContent=showAll?"Wrong ones only":"Show all";
  }
  list();
  document.getElementById("toggle").onclick=()=>{showAll=!showAll;list();};
  document.getElementById("again").onclick=()=>start("mock");
  document.getElementById("back").onclick=home;
  document.getElementById("exit").onclick=home;
  quiz=null;window.scrollTo(0,0);
}
/* ---------- ANSWER HISTORY + EXPORT ---------- */
const HF={f:"wrong",l:0};
function histRows(){
  return Q.filter(q=>S.q[q.id]&&S.q[q.id].n).map(q=>{const x=S.q[q.id];return {q,n:x.n,w:x.n-x.r,s:x.s,b:!!x.b,lw:x.lw,t:x.t||0};});
}
function stamp(){const d=new Date(),p=v=>String(v).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function exportMd(){
  const rows=histRows().sort((a,b)=>b.w-a.w||a.q.l-b.q.l||a.q.no.localeCompare(b.q.no));
  let tn=0,tr=0;rows.forEach(r=>{tn+=r.n;tr+=r.n-r.w;});
  const cell=s=>String(s==null?"":s).replace(/\|/g,"/").replace(/\n/g," ");
  let s=`# NURS1600 Test I Drill — answer history\n\nExported ${stamp()}. Test: Tue 29 Sep 2026, Lectures 1–8, 30 min, MCQ / matching / true-false / fill-in-the-blanks.\n\n`;
  s+=`Please analyse my mistakes: group them by concept, point out which ideas I keep confusing with each other (look at "my last wrong answer" vs the correct answer), and tell me what to review first.\n\n`;
  s+=`## Summary\n\n- Questions answered: ${rows.length} of ${Q.length}\n- Total answers: ${tn}, accuracy ${tn?Math.round(tr/tn*100):0}%\n- Wrong at least once: ${rows.filter(r=>r.w>0).length}\n- Still in wrong-answers list: ${rows.filter(r=>r.b).length}\n\n`;
  s+=`| Lecture | Topic | Answered | Wrong ≥1 | In wrong list |\n|---|---|---|---|---|\n`;
  for(let l=1;l<=8;l++){const tot=Q.filter(q=>q.l===l).length,rs=rows.filter(r=>r.q.l===l);s+=`| L${l} | ${LECT[l]} | ${rs.length}/${tot} | ${rs.filter(r=>r.w>0).length} | ${rs.filter(r=>r.b).length} |\n`;}
  s+=`\n## Every answered question (most wrong first)\n\n| No. | Slide | Tries | Wrong | In wrong list | Question | Correct answer | My last wrong answer |\n|---|---|---|---|---|---|---|---|\n`;
  rows.forEach(r=>{s+=`| ${r.q.no} | ${cell(r.q.s)} | ${r.n} | ${r.w} | ${r.b?"yes":"no"} | ${cell(r.q.q)} | ${cell(answerText(r.q))} | ${r.lw!=null&&r.w?cell(optText(r.q,r.lw)):""} |\n`;});
  return s;
}
function exportCsv(){
  const rows=histRows().sort((a,b)=>a.q.l-b.q.l||a.q.no.localeCompare(b.q.no));
  const c=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  let s="﻿"+["No.","Lecture","Topic","Slide","Type","Tries","Wrong","Right streak","In wrong list","Last answered","Question","Correct answer","My last wrong answer","Explanation"].join(",")+"\n";
  rows.forEach(r=>{s+=[r.q.no,"L"+r.q.l,LECT[r.q.l],r.q.s,r.q.tf?"True/False":"MCQ",r.n,r.w,r.s,r.b?"yes":"no",r.t?new Date(r.t).toISOString().slice(0,16).replace("T"," "):"",r.q.q,answerText(r.q),r.lw!=null&&r.w?optText(r.q,r.lw):"",r.q.e].map(c).join(",")+"\n";});
  return s;
}
async function saveFile(name,data,msgEl){
  msgEl.textContent="";
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(!dl){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();msgEl.textContent="Saved "+name+".";return;}
    await dl.save({filename:name,data});msgEl.textContent="Saved "+name+".";
  }catch(e){msgEl.textContent=e&&e.code==="declined"?"Not saved.":"Couldn't save the file. Use Copy instead.";}
}
function showHistory(){
  view="history";
  const rows=histRows();
  let tn=0,tr=0;rows.forEach(r=>{tn+=r.n;tr+=r.n-r.w;});
  const filt={wrong:"Wrong at least once",book:"In wrong-answers list",all:"All answered"};
  let h=`<div class="qbar"><button class="home" id="exit">← Home</button><div class="prog"><div class="row"><span>Answer history</span><span>${rows.length} questions · ${tn} answers</span></div></div></div>
  <article class="card"><div class="sec-head"><h2 style="font-size:20px">Export for AI</h2></div>
  <p class="note">Every question you've answered, with its number, how many times you got it wrong, and the wrong option you picked last time. Paste it into an AI chatbot and ask which concepts you keep mixing up.</p>
  <div class="exrow"><button class="btn go" id="ex-copy">Copy as text</button><button class="btn" id="ex-md">Save .md</button><button class="btn" id="ex-csv">Save .csv (Excel)</button></div>
  <span class="note" id="ex-msg" role="status"></span>
  <textarea id="ex-area" class="exarea" readonly hidden aria-label="Export text"></textarea></article>
  <section class="sec"><div class="sec-head"><h2>Questions</h2>
   <label class="note" for="h-lec">Lecture <select id="h-lec" class="sel"><option value="0">All</option>${[1,2,3,4,5,6,7,8].map(l=>`<option value="${l}" ${HF.l===l?"selected":""}>L${l}</option>`).join("")}</select></label></div>
  <div class="seg" role="group" aria-label="Filter">${Object.keys(filt).map(k=>`<button class="segb ${HF.f===k?"on":""}" data-f="${k}">${filt[k]}</button>`).join("")}</div>
  <div class="hlist" id="hlist"></div></section>`;
  app.innerHTML=h;
  function list(){
    let rs=rows.filter(r=>(!HF.l||r.q.l===HF.l)&&(HF.f==="all"||(HF.f==="wrong"?r.w>0:r.b)));
    rs.sort((a,b)=>HF.f==="all"?(a.q.l-b.q.l||a.q.no.localeCompare(b.q.no)):(b.w-a.w||a.q.no.localeCompare(b.q.no)));
    document.getElementById("hlist").innerHTML=rs.length?rs.map(r=>`<details class="hrow ${r.b?"inbook":""}"><summary><span class="hno">${r.q.no}</span><span class="hq">${esc(r.q.q)}</span><span class="hn num">${r.w?`✗${r.w}`:"✓"}<small>/${r.n}</small></span></summary>
      <div class="hbody"><span class="eyebrow">L${r.q.l} · slide ${esc(r.q.s)}${r.b?" · in wrong-answers list":""}</span><span class="q">${esc(r.q.q)}</span>
      <span class="a"><span class="c">✓ ${esc(answerText(r.q))}</span>${r.lw!=null&&r.w?`<br><span class="y">✗ Last wrong pick: ${esc(optText(r.q,r.lw))}</span>`:""}</span><span class="e">${esc(r.q.e)}</span></div></details>`).join(""):`<div class="empty">Nothing here yet.</div>`;
  }
  list();
  app.querySelectorAll(".segb").forEach(b=>b.onclick=()=>{HF.f=b.dataset.f;app.querySelectorAll(".segb").forEach(x=>x.classList.toggle("on",x===b));list();});
  document.getElementById("h-lec").onchange=e=>{HF.l=+e.target.value;list();};
  document.getElementById("exit").onclick=home;
  const msg=document.getElementById("ex-msg"), area=document.getElementById("ex-area");
  document.getElementById("ex-copy").onclick=()=>{
    const t=exportMd();
    const fallback=()=>{area.value=t;area.hidden=false;area.focus();area.select();msg.textContent="Copying was blocked here. The text is selected below: copy it manually.";};
    try{navigator.clipboard.writeText(t).then(()=>{msg.textContent="Copied. Paste it into Claude.";},fallback);}catch(e){fallback();}
  };
  document.getElementById("ex-md").onclick=()=>saveFile("NURS1600-TestI-history.md",exportMd(),msg);
  document.getElementById("ex-csv").onclick=()=>saveFile("NURS1600-TestI-history.csv",exportCsv(),msg);
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!quiz||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();const map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  const it=quiz.items[quiz.idx];
  if(k in map&&map[k]<it.opts.length&&(quiz.mode==="mock"||it.ch===null)){e.preventDefault();choose(map[k]);}
  else if((k==="enter"||k==="arrowright")&&it.ch!==null&&quiz.mode!=="mock"){e.preventDefault();next();}
  else if(k==="arrowleft"&&quiz.mode!=="mock"&&quiz.idx>0){e.preventDefault();quiz.idx--;render();}
  else if(quiz.mode==="mock"&&(k==="arrowright"||k==="enter")&&quiz.idx<quiz.items.length-1){e.preventDefault();quiz.idx++;render();}
  else if(quiz.mode==="mock"&&k==="arrowleft"&&quiz.idx>0){e.preventDefault();quiz.idx--;render();}
});
home();
})();
</script>
