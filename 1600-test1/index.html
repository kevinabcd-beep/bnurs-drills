{l:3,s:"p32",q:"\"Respect the dignity, uniqueness, values, culture and beliefs of individuals and their families\" falls under:",o:["Nurses and People","Nurses and Society","Nurses and the Profession","Nurses and Practice"],e:"Nurses and People (item 1)."},
{l:3,s:"p34",q:"How many roles of the nurse are listed in Lecture 3?",o:["11","9","6","12"],e:"11: direct care provider, client advocate, client / family educator, counselor, change agent, manager, case manager, leader, collaborator, delegator, researcher."},
{l:3,s:"p34",q:"Which of the following is NOT one of the nurse roles listed in Lecture 3?",o:["Prescriber","Change agent","Delegator","Researcher"],e:"Prescribing is not listed as a nurse role."},
{l:3,s:"p35",q:"Which is the nurse's PRIMARY professional responsibility?",o:["Care provider","Manager","Researcher","Change agent"],e:"Care provider = primary responsibility."},
{l:3,s:"p35",q:"As a care provider, the nurse directs care of patients through:",o:["The nursing process: a multi-step, ongoing cycle","Doctors' orders only","The 6 Cs","Delegation to HCAs"],e:"Nursing process: assess, diagnose, plan, implement, evaluate in an ongoing cycle."},
{l:3,s:"p36",q:"A patient under general anaesthesia cannot speak for themselves; the nurse makes sure their wishes and safety are protected. This is the role of:",o:["Client advocate","Counselor","Educator","Manager"],e:"The advocate should \"speak for\" the patient, especially when they CANNOT (severe illness, coma, anaesthesia)."},
{l:3,s:"p36",q:"Protecting the patient's human and legal rights and making sure autonomy and self-determination are respected is the role of:",o:["Client advocate","Change agent","Leader","Delegator"],e:"Client advocate."},
{l:3,s:"p37",q:"Teaching a patient to use a home BP monitor or inject insulin is an example of:",o:["Planned, formal teaching (educator role)","Unplanned, informal teaching","Counselling","Advocacy"],e:"Planned and formal. Explaining why an IV drip is needed during a chat = unplanned and informal."},
{l:3,s:"p37",q:"Explaining the reason for an IV infusion during a casual conversation is an example of:",o:["Unplanned, informal teaching","Planned, formal teaching","Counselling","Change agent role"],e:"Unplanned, informal teaching."},
{l:3,s:"p37",q:"Before teaching, the nurse educator should first identify:",o:["The patient's willingness and ability to learn","The patient's income","The doctor's preferences","The ward's budget"],e:"Identify willingness and ability to learn (e.g. is the patient mentally capable?)."},
{l:3,s:"p37",tf:1,q:"The nurse educator teaches only the patient, not the family or carers.",a:0,e:"False. The educator teaches patients AND their family and caregivers."},
{l:3,s:"p38",q:"Which role helps patients identify and clarify health problems and choose the right course of action, WITHOUT giving solutions or making decisions for them?",o:["Counselor","Educator","Advocate","Manager"],e:"Counselor: helps patients reach decisions that are best for them."},
{l:3,s:"p38",q:"Which technique does Lecture 3 say is often very useful in the counselor role?",o:["Motivational interviewing","Problem-based learning","Delegation","Clinical supervision"],e:"Motivational interviewing."},
{l:3,s:"p38",tf:1,q:"As a counselor, the nurse should tell the patient which decision is best and make it for them.",a:0,e:"False. The counselor does NOT give solutions or make decisions; they help patients reach decisions that are best for them."},
{l:3,s:"p39",q:"Finding and implementing new, more effective approaches to problems, even extending to health policy legislation, is the role of:",o:["Change agent","Leader","Manager","Researcher"],e:"Change agent: gathers and analyses facts BEFORE implementing change."},
{l:3,s:"p39",q:"What should a change agent do BEFORE implementing a change?",o:["Gather and analyse facts","Get approval from the patient's family","Delegate the change","Write a new code of ethics"],e:"Gather and analyse facts first."},
{l:3,s:"p40",q:"Coordinating all activities and treatments for a patient or group of patients, and managing a unit's staff, budget and resources, is the role of:",o:["Manager","Leader","Collaborator","Delegator"],e:"Manager."},
{l:3,s:"p41",q:"Giving direction and purpose to others and motivating them toward common goals is the role of:",o:["Leader","Manager","Collaborator","Advocate"],e:"Leader. Characteristics: integrity, interpersonal skills, critical thinking / decision-making / problem-solving, creativity."},
{l:3,s:"p41",q:"Which is NOT listed as a characteristic of a leader?",o:["Seniority","Integrity","Interpersonal skills","Creativity"],e:"Listed: integrity, interpersonal skills, critical thinking / decision-making / problem-solving, creativity."},
{l:3,s:"p42",q:"\"A process in which 2 or more people work together towards a common goal\" defines:",o:["Collaboration","Delegation","Advocacy","Counselling"],e:"Collaboration, aimed at the BEST interest of the patient's health."},
{l:3,s:"p42",q:"Which of the following is an allied health professional in the health care team listed in Lecture 3?",o:["Speech therapist","Nurse","Physician","Clerk"],e:"Allied health: physiotherapist, OT, dietitian, speech therapist, psychologist, etc."},
{l:3,s:"p43",q:"Delegation is:",o:["Entrusting or transferring responsibility for tasks to others, such as HCAs and nursing students","Transferring ultimate responsibility for the patient to another person","Refusing tasks outside one's scope","Asking a doctor to take over care"],e:"Delegation transfers TASKS, but the RN keeps ultimate responsibility."},
{l:3,s:"p43",tf:1,q:"When an RN delegates a task to a health care assistant, the RN keeps ultimate responsibility for patient care.",a:1,e:"True. The RN supervises and keeps ultimate responsibility."},
{l:3,s:"p44",q:"Which of the following is NOT one of the 5 rights of DELEGATION?",o:["Right drug","Right task","Right person","Right supervision and evaluation"],e:"5 rights of delegation: right task, circumstance, person, directions and communication, supervision and evaluation. \"Right drug\" belongs to medication administration."},
{l:3,s:"p44",q:"In the 5 rights of delegation, \"right circumstance\" means:",o:["Considering the patient's status","Checking the delegatee's knowledge and skills","Giving clear and concise instructions","Checking the job description"],e:"Right circumstance = patient status. Right person = delegatee's knowledge and skills. Right task = job description."},
{l:3,s:"p44",q:"In the 5 rights of delegation, \"right person\" means:",o:["The delegatee has the right knowledge and skills","The patient is correctly identified","The task fits the job description","The RN monitors and gives feedback"],e:"Right person = knowledge and skills of the delegatee."},
{l:3,s:"p44",q:"In the 5 rights of delegation, \"right task\" is judged against:",o:["The job description","The patient's status","The delegatee's personality","The doctor's order"],e:"Right task = job description."},
{l:3,s:"p44",q:"In the 5 rights of delegation, \"monitoring and feedback\" belongs to:",o:["Right supervision and evaluation","Right directions and communication","Right circumstance","Right person"],e:"Right supervision and evaluation."},
{l:3,s:"p44",q:"An RN gives an HCA clear, concise instructions on how often to turn a patient. This is:",o:["Right directions and communication","Right task","Right circumstance","Right supervision and evaluation"],e:"Clear and concise = right directions and communication."},
{l:3,s:"p46",q:"Why are professional appearance, demeanour and behaviour important?",o:["They establish trustworthiness and competence","They are required by law","They replace clinical skills","They reduce workload"],e:"They establish trustworthiness and competence."},
{l:3,s:"p46",q:"Which of the following is part of professional APPEARANCE (not behaviour)?",o:["Well-groomed and odour free","Punctual","Listening to others","Accepting new responsibility"],e:"Appearance = clean, neat, well-groomed, odour free. The rest are behaviour."},
{l:3,s:"p46",q:"Which of the following is listed as professional BEHAVIOUR?",o:["Identifying your own strengths and weaknesses","Wearing expensive shoes","Avoiding asking for advice","Working alone without support"],e:"Behaviour includes: punctual, well-prepared, seek advice appropriately, set own goals, accountable, accept new responsibility, identify own strengths and weaknesses."},
{l:3,s:"p47",q:"Lecture 3 advises developing professional appearance and behaviour as a:",o:["\"Habit\": automatic, routine actions","Checklist used only for exams","Rule enforced by the Nursing Council","Personality trait you are born with"],e:"Develop a \"habit\": automatic and routine actions."},
{l:3,s:"p48",tf:1,q:"According to the L3 summary, a person who is well equipped and gives skilled service under legal and ethical constraints can become a professional.",a:1,e:"True."}
);

// L4 — Principles of Therapeutic Communication and Counselling (M Lam)
Q.push(
{l:4,s:"p4",q:"Therapeutic communication is defined as:",o:["The purposeful, interpersonal information-transmitting process through words and behaviours, based on both parties' knowledge, attitudes and skills, which leads to patient understanding and participation","Any casual conversation between a nurse and a patient","Written communication in the nursing record","Communication between health care professionals only"],e:"Purposeful + interpersonal + words AND behaviours → patient understanding and participation."},
{l:4,s:"p4",q:"Therapeutic communication techniques aim to:",o:["Encourage the expression of feelings and ideas, and convey acceptance and respect","Give patients quick solutions","Keep conversations short to save time","Avoid emotional topics"],e:"Encourage expression of FEELINGS and ideas; convey acceptance and respect."},
{l:4,s:"p4",q:"Which nursing leader is linked, in the late 1800s, to the start of therapeutic communication?",o:["Florence Nightingale","Lillian Wald","Clara Barton","Jean Watson"],e:"The slide: \"In the late 1800s, Florence Nightingale…\""},
{l:4,s:"p5",q:"Which of the following is NOT a goal of therapeutic communication?",o:["To persuade the patient to agree with the nurse","To build a relationship of trust and mutual cooperation","To let clients express any concerns freely","To help the patient feel cared for and understood"],e:"Goals: trust and mutual cooperation, free expression of concerns, a cooperative relationship, feeling cared for and understood."},
{l:4,s:"p6",q:"Which of the following is NOT listed as a benefit of therapeutic communication?",o:["Shorter nursing shifts","More accurate diagnoses","Better treatment adherence and patient outcomes","Reduced risk of malpractice"],e:"Benefits: accurate diagnoses, more collaborative decision-making, adherence → better outcome, better satisfaction (patient-centred), less malpractice risk."},
{l:4,s:"p6",tf:1,q:"Therapeutic communication reduces the risk of malpractice.",a:1,e:"True."},
{l:4,s:"p7",q:"Which of the following is NOT one of the 5 common characteristics of a therapeutic nurse–client relationship?",o:["Friendship","Trust","Fiduciary duty","Professional intimacy"],e:"The 5: Trust, Respect, Professional intimacy, Fiduciary duty, Power."},
{l:4,s:"p7",q:"\"Acting in the best interest of clients and avoiding conflicts of interest\" describes which characteristic?",o:["Fiduciary duty","Power","Respect","Trust"],e:"Fiduciary duty."},
{l:4,s:"p7",q:"\"Therapeutic, time-limited and client-focused\" describes which characteristic of the therapeutic relationship?",o:["Professional intimacy","Trust","Power","Fiduciary duty"],e:"Professional intimacy: therapeutic, time-limited, client-focused."},
{l:4,s:"p7",q:"Which characteristic reminds nurses that they influence decisions and should be aware that the client may become dependent?",o:["Power","Respect","Professional intimacy","Trust"],e:"Power."},
{l:4,s:"p7",q:"\"Recognizing and valuing the intrinsic worth of each person\" describes which characteristic?",o:["Respect","Power","Fiduciary duty","Professional intimacy"],e:"Respect."},
{l:4,s:"p7",q:"\"Safe, competent, compassionate and ethical care with confidentiality\" describes which characteristic?",o:["Trust","Respect","Power","Fiduciary duty"],e:"Trust."},
{l:4,s:"p8",q:"In a therapeutic nurse–client relationship, the power balance is:",o:["Unequal: the nurse has authority, knowledge, influence and privileged information","Relatively equal","Controlled by the patient","Controlled by the family"],e:"Unequal. In a personal relationship it is relatively equal."},
{l:4,s:"p8",q:"In a therapeutic nurse–client relationship, who is responsible for setting up and maintaining the relationship?",o:["The nurse","The patient","Both equally","The family"],e:"The nurse. In personal relationships it is shared equally."},
{l:4,s:"p8",q:"Behaviour in a therapeutic nurse–client relationship is regulated by:",o:["A code of ethics and professional standards","Personal values and beliefs","The patient's wishes","Hospital visiting rules"],e:"Code of ethics and professional standards. Personal relationships are guided by personal values."},
{l:4,s:"p8",q:"The purpose of a therapeutic nurse–client relationship is:",o:["Goal-directed, providing care to clients","Spontaneous and pleasure-directed","Unstructured and interest-directed","Unlimited and undefined"],e:"Goal-directed. Personal = spontaneous, unstructured, pleasure and interest-directed."},
{l:4,s:"p8",q:"Where does a therapeutic nurse–client relationship take place?",o:["It is defined and limited to where nursing care is provided","It is unlimited and undefined","Anywhere the patient chooses","On social media as well as in hospital"],e:"Defined and limited to where care is provided."},
{l:4,s:"p8",tf:1,q:"In a therapeutic nurse–client relationship, the time spent in contact is a personal choice.",a:0,e:"False. It is limited by the client's need for care and the nurse's employment agreement. Personal choice applies to personal relationships."},
{l:4,s:"p8",tf:1,q:"A therapeutic nurse–client relationship needs formal knowledge, preparation and orientation from the nurse.",a:1,e:"True. Personal relationships need no formal preparation."},
{l:4,s:"p10",q:"The uniqueness of nursing practice is that nurses combine their professional roles in a way that responds to the needs of individuals, families, groups and the community. Therefore nursing is:",o:["Contextual","Universal","Standardized","Doctor-led"],e:"\"…thus nursing is contextual.\""},
{l:4,s:"p10",q:"Which of the following is a nurse's role in CLINICAL PRACTICE (NCHK Scope of Practice)?",o:["Establish a therapeutic climate for caring, healing and promoting health","Cultivate a positive practice environment as nurse manager","Develop leading-edge nursing knowledge","Take part in pre-registration education"],e:"Clinical practice: assess, plan, monitor, coordinate, manage; implement and evaluate; coach; establish a therapeutic climate; ensure quality; manage and supervise nursing practice."},
{l:4,s:"p11",q:"\"All nurses are expected to take part in forming and carrying out health policy\" belongs to which area of nurses' roles?",o:["Healthcare management","Clinical practice","Nursing education","Research"],e:"Healthcare management (2.2)."},
{l:4,s:"p11",q:"\"Nurse managers should build a positive practice environment for nurses and other health care workers\" belongs to:",o:["Healthcare management","Clinical practice","Nursing education","Counselling"],e:"Healthcare management."},
{l:4,s:"p12",q:"\"Develop leading-edge nursing knowledge and facilitate evidence-based nursing practice\" is expected of nurses in:",o:["Nursing education","Clinical practice","Healthcare management","Community health"],e:"Nursing education (2.3)."},
{l:4,s:"p10",q:"\"Coach individuals, families, groups and the community in matters related to health\" belongs to:",o:["Clinical practice","Healthcare management","Nursing education","Health policy"],e:"Clinical practice (2.1 iii)."},
{l:4,s:"p14",tf:1,q:"Counselling is only for people who have serious emotional or mental problems.",a:0,e:"False. This is a common misconception about counselling."},
{l:4,s:"p14",tf:1,q:"A good counsellor will give you a quick solution to your problems with little or no effort on your part.",a:0,e:"False, a misconception. Counselling helps clients reach their own decisions; it does not hand out solutions."},
{l:4,s:"p15",q:"Counselling is based on:",o:["An accepting, trusting and safe relationship","A strict question-and-answer format","The counsellor's instructions","Medical diagnosis"],e:"Base = an accepting, trusting, safe relationship."},
{l:4,s:"p15",q:"The aim of counselling is for clients to:",o:["Learn to discuss openly what worries and upsets them","Receive advice from an expert","Take medication correctly","Avoid talking about feelings"],e:"Aim: clients learn to discuss openly what worries and upsets them."},
{l:4,s:"p15",q:"Which of the following is NOT an objective of counselling?",o:["To make decisions on behalf of the client","To help clients define precise behaviour goals","To help clients gain essential social skills","To help clients build courage and self-confidence to carry out new behaviour"],e:"Objectives: precise behaviour goals, essential social skills, courage and self-confidence for new behaviour."},
{l:4,s:"p16-17",q:"How many basic principles of counselling are listed in Lecture 4?",o:["7","5","6","9"],e:"7: acceptance, communication, empathy, non-judgemental attitude, confidentiality, individuality, non-emotional involvement."},
{l:4,s:"p16-17",q:"Which of the following is NOT one of the 7 basic principles of counselling?",o:["Principle of beneficence","Principle of acceptance","Principle of individuality","Principle of non-emotional involvement"],e:"Beneficence is an ethical principle (L2), not a counselling principle."},
{l:4,s:"p16",q:"Accepting the client with their physical, psychological, social, economic and cultural conditions is the principle of:",o:["Acceptance","Individuality","Empathy","Non-judgemental attitude"],e:"Acceptance."},
{l:4,s:"p16",q:"\"Do not criticize or comment negatively on the client's complaints\" is the principle of:",o:["Non-judgemental attitude","Acceptance","Confidentiality","Non-emotional involvement"],e:"Non-judgemental attitude."},
{l:4,s:"p16",q:"\"The ability to understand and share the feelings of another\" is the principle of:",o:["Empathy","Acceptance","Individuality","Communication"],e:"Empathy."},
{l:4,s:"p16",q:"According to the principle of communication in counselling, communication should be:",o:["Both verbal and non-verbal, and skilful","Verbal only","Written only","Non-verbal only"],e:"Verbal + non-verbal + skilful."},
{l:4,s:"p17",q:"\"Treat every client as unique and respect their problem\" is the principle of:",o:["Individuality","Acceptance","Empathy","Confidentiality"],e:"Individuality."},
{l:4,s:"p17",q:"\"Not getting emotionally involved with the client and not getting carried away by the client's feelings\" is the principle of:",o:["Non-emotional involvement","Non-judgemental attitude","Empathy","Acceptance"],e:"Non-emotional involvement."},
{l:4,s:"p17",q:"Keeping the client's name and problem strictly secret, and reassuring the client of this, is the principle of:",o:["Confidentiality","Individuality","Acceptance","Communication"],e:"Confidentiality."},
{l:4,s:"p18",q:"The counselling process is described as a:",o:["Planned and structured dialogue","Casual chat","One-way lecture","Written assessment"],e:"Planned and structured dialogue."},
{l:4,s:"p19",q:"What is Stage 1 of the counselling process?",o:["Initial disclosure: relationship building","In-depth exploration: problem assessment","Commitment to action: goal setting","Evaluation, termination / referral"],e:"Stage 1 = initial disclosure / relationship building, using therapeutic communication to build trust and rapport."},
{l:4,s:"p19",q:"What is Stage 2 of the counselling process?",o:["In-depth exploration: problem assessment","Initial disclosure: relationship building","Commitment to action: goal setting","Counselling intervention"],e:"Stage 2 = collect information on the client's life situation; identify triggers, timing, environment, personal and family history."},
{l:4,s:"p19",q:"Identifying triggers, timing, environmental factors, and personal and family history happens in which counselling stage?",o:["Stage 2: in-depth exploration / problem assessment","Stage 1: relationship building","Stage 3: goal setting","Stage 5: evaluation"],e:"Stage 2."},
{l:4,s:"p19",q:"Setting realistic goals together, with the client committing to a particular outcome, happens in which stage?",o:["Stage 3: commitment to action / goal setting","Stage 2: problem assessment","Stage 4: counselling intervention","Stage 1: relationship building"],e:"Stage 3."},
{l:4,s:"p19",q:"What is the final stage (Stage 5) of the counselling process?",o:["Evaluation, termination / referral","Counselling intervention","Goal setting","Problem assessment"],e:"Stage 5 = evaluation, termination / referral (may need further assessment or referral)."},
{l:4,s:"p19",q:"Put the 5 stages of the counselling process in order:",o:["Relationship building → problem assessment → goal setting → counselling intervention → evaluation / termination / referral","Problem assessment → relationship building → goal setting → evaluation → intervention","Goal setting → relationship building → problem assessment → intervention → evaluation","Relationship building → goal setting → problem assessment → intervention → evaluation"],e:"1 Initial disclosure → 2 In-depth exploration → 3 Commitment to action → 4 Intervention → 5 Evaluation / termination / referral."},
{l:4,s:"p39",q:"According to the L4 summary, what is the FIRST step in therapeutic communication and counselling?",o:["Building a trusting relationship between nurse and client","Giving health information","Setting goals","Making a referral"],e:"A trusting relationship is crucial and is the first step."},
{l:4,s:"p22",q:"Which of the following is NOT a way to build trust and rapport?",o:["Doing paperwork with your head down while the client speaks","Greeting the client by name in a gentle tone","Introducing yourself","Keeping your voice low in an open setting to protect privacy"],e:"Head down doing paperwork and rolling your eyes = inappropriate non-verbal communication, which you must avoid."},
{l:4,s:"p22",q:"To build trust and rapport, how should you greet the client?",o:["Call them by name in a gentle tone","Call them by their bed number","Use a nickname","Greet only the family"],e:"Greet client and call his / her name in a gentle tone."},
{l:4,s:"p23",q:"Which statement about active listening is correct?",o:["Stay quiet and really listen; let the client finish, paying attention to both verbal and non-verbal messages","Interrupt early to save time","Focus only on symptoms and treatment adherence","Prepare your reply while the patient talks"],e:"Be attentive verbally and non-verbally; let the client finish; acknowledge their experience of illness, not just symptoms."},
{l:4,s:"p23",q:"In active listening, health care professionals should acknowledge the client's:",o:["Experience of illness, not only their symptoms and treatment adherence","Lab results only","Diagnosis only","Medication list only"],e:"Their experience of illness, e.g. financial burden, loss of control, conflicting advice, family issues."},
{l:4,s:"p25",q:"In the SOLER model of active listening, what does \"O\" stand for?",o:["Open posture","Observe","Offer help","Obtain consent"],e:"SOLER (Egan): Sit squarely, Open posture, Lean towards the client, Eye contact, Relax. (Standard model; the slide shows it as a picture.)"},
{l:4,s:"p25",q:"In the SOLER model of active listening, what does \"L\" stand for?",o:["Lean towards the client","Listen silently","Look at notes","Limit time"],e:"Sit squarely, Open posture, Lean, Eye contact, Relax."},
{l:4,s:"p25",q:"In the SOLER model, what does \"S\" stand for?",o:["Sit squarely facing the client","Smile","Summarize","Silence"],e:"S = Sit squarely."},
{l:4,s:"p24",q:"The SURETY model adds which element to SOLER-style active listening?",o:["Touch (and using your intuition)","Summarizing","Self-disclosure","Silence"],e:"SURETY (Stickley): Sit at an angle, Uncross legs and arms, Relax, Eye contact, Touch, Your intuition. (Standard model; the slide shows it as a picture.)"},
{l:4,s:"p24",q:"In the SURETY model, the nurse should sit:",o:["At an angle to the client","Squarely facing the client","Behind the client","Across a desk"],e:"SURETY = Sit at an angle (SOLER = sit squarely)."},
{l:4,s:"p26",q:"Commenting on how a person looks, sounds or acts, in a caring and non-judgemental tone, is:",o:["Sharing observations","Sharing empathy","Confrontation","Paraphrasing"],e:"Sharing observations: good for starting a conversation with a quiet or withdrawn patient."},
{l:4,s:"p26",q:"Which technique is especially good for starting a conversation with a quiet or withdrawn patient?",o:["Sharing observations","Confrontation","Summarizing","Self-disclosure"],e:"Sharing observations."},
{l:4,s:"p26",tf:1,q:"When sharing observations, it is fine to say something that might embarrass the patient, as long as you say it with humour.",a:0,e:"False. NEVER state an observation that will embarrass or anger a patient, even with humour. Do not make assumptions."},
{l:4,s:"p27",q:"\"The ability to understand and accept another person's reality, accurately perceive feelings, and communicate this understanding\" defines:",o:["Empathy","Sympathy","Validation","Self-disclosure"],e:"Empathy. You can be empathetic even without a similar experience. Sympathy is a NON-therapeutic technique."},
{l:4,s:"p28",q:"Encouraging a patient, commenting on positive behaviour, sharing a vision of the future, and reminding them of their strengths is:",o:["Sharing hope","Sharing humour","Sharing empathy","Providing information"],e:"Sharing hope gives others a sense of possibility."},
{l:4,s:"p29",q:"Which caution about sharing humour is given in Lecture 4?",o:["Be alert to cultural background and to dark, negative humour","Never use humour with patients","Humour should only be used by senior nurses","Use humour to change the subject"],e:"Be alert to cultural backgrounds and the use of dark, negative humour."},
{l:4,s:"p29",q:"Sharing humour contributes to feelings of:",o:["Togetherness, closeness and friendliness","Authority and control","Distance and professionalism","Anxiety"],e:"Togetherness, closeness and friendliness; it reduces anxiety."},
{l:4,s:"p30",q:"When sharing feelings, which of the following is INAPPROPRIATE?",o:["Discussing your own negative feelings such as anger or sadness with the patient","Giving permission to express negative feelings","Acknowledging the patient's feelings","Modelling healthy emotional expression"],e:"Share your negative feelings with colleagues, social workers or pastoral care, away from the patient."},
{l:4,s:"p30",tf:1,q:"Nurses should give patients permission to express negative feelings and should not take them personally.",a:1,e:"True."},
{l:4,s:"p31",q:"Which technique is described as \"one of the most potent and personal forms of communication\"?",o:["Using touch","Using silence","Sharing humour","Active listening"],e:"Touch. Watch the patient's non-verbal cues for permission."},
{l:4,s:"p31",q:"Before using touch, the nurse should:",o:["Watch for the patient's non-verbal cues giving permission","Always ask the doctor","Touch only children","Avoid touch completely"],e:"Be aware of the patient's non-verbal cues on permission."},
{l:4,s:"p32",q:"Using silence lets both nurse and patient:",o:["Observe each other, sort out feelings, think how to say things and consider what has been said","End the conversation","Show disapproval","Change the subject"],e:"Silence shows patience; useful in deep sadness or grief."},
{l:4,s:"p32",q:"Silence is especially useful:",o:["During deep sadness or grief","When giving medication instructions","During an emergency","When the patient asks a direct question"],e:"During profound sadness or grief."},
{l:4,s:"p33",q:"When giving distressing information, the nurse should:",o:["Go at an appropriate pace, start in general terms, and explain to help understanding","Give all details at once","Use technical terms","Avoid telling the patient"],e:"Appropriate pace, general terms first, explain to aid understanding. Patients have a right to know."},
{l:4,s:"p34",q:"Nurse: \"When you say you feel 'itchy', do you mean on your skin or more like a burning feeling?\" This is:",o:["Clarifying","Paraphrasing","Focusing","Validation"],e:"Clarifying = clearing up confusion."},
{l:4,s:"p34",q:"Nurse: \"Let's focus on how you have been managing the pain around your wound.\" This is:",o:["Focusing","Clarifying","Summarizing","Asking relevant questions"],e:"Focusing = guiding the conversation to one topic."},
{l:4,s:"p34",q:"Patient: \"I feel very weak.\" Nurse: \"You're saying you've been feeling very tired and weak lately.\" This is:",o:["Paraphrasing","Validation","Clarifying","Summarizing"],e:"Paraphrasing = restating in your own words."},
{l:4,s:"p34",q:"Nurse: \"It's completely normal to feel frustrated when you have to stay in bed so long.\" This is:",o:["Validation","Paraphrasing","False reassurance","Sympathy"],e:"Validation = affirming feelings as valid and understandable."},
{l:4,s:"p34",q:"Nurse: \"So far we've talked about your wound care, pain and medicines. Is there anything else you'd like to discuss?\" This is:",o:["Summarizing","Focusing","Paraphrasing","Changing the subject"],e:"Summarizing = concisely reviewing the main points."},
{l:4,s:"p34",q:"Nurse: \"I also had a time when I felt very lonely, but talking to my family helped. How have your family visits been?\" This is:",o:["Self-disclosure","Giving personal opinions","Asking personal questions","Sympathy"],e:"Appropriate self-disclosure builds rapport and shows empathy."},
{l:4,s:"p34",q:"Nurse: \"Earlier you said you were happy with that, but now you seem worried. Help me understand the change.\" This is:",o:["Confrontation","Clarifying","Arguing","Validation"],e:"Confrontation = gently pointing out inconsistencies."},
{l:4,s:"p34",q:"Nurse: \"Have you noticed any changes in your pain level since yesterday?\" This is:",o:["Asking relevant questions","Focusing","Summarizing","Clarifying"],e:"Asking relevant questions = purposeful questions to get important information."},
{l:4,s:"p34",q:"\"Gently pointing out inconsistencies in the patient's thoughts, behaviours or feelings\" defines:",o:["Confrontation","Arguing","Clarifying","Defensive response"],e:"Confrontation is therapeutic when done GENTLY; arguing is non-therapeutic."},
{l:4,s:"p35",q:"Which of the following is a NON-therapeutic communication technique?",o:["False reassurance","Paraphrasing","Validation","Using silence"],e:"Non-therapeutic: personal questions, personal opinions, changing the subject, automatic responses, false reassurance, asking for explanation, approval / disapproval, defensive response, passive or aggressive responses, arguing, sympathy."},
{l:4,s:"p35",q:"Nurse: \"Don't worry, everything will be fine.\" This is:",o:["False reassurance (non-therapeutic)","Sharing hope (therapeutic)","Validation (therapeutic)","Empathy (therapeutic)"],e:"False reassurance: it dismisses the concern. Sharing hope is based on REAL strengths and resources."},
{l:4,s:"p35",q:"Nurse: \"Why did you stop taking your medicine?\" Asking \"why\" is an example of:",o:["Asking for explanation (non-therapeutic)","Clarifying (therapeutic)","Asking relevant questions (therapeutic)","Focusing (therapeutic)"],e:"\"Why\" questions ask for explanation and can make the patient defensive."},
{l:4,s:"p35",q:"Which of the following is listed as NON-therapeutic in Lecture 4?",o:["Sympathy","Empathy","Self-disclosure","Confrontation"],e:"Sympathy is non-therapeutic; empathy is therapeutic."},
{l:4,s:"p35",q:"Patient: \"The nurses here never answer my bell!\" Nurse: \"We are very busy, we have 30 patients!\" This is:",o:["A defensive response (non-therapeutic)","Validation (therapeutic)","Providing information (therapeutic)","Confrontation (therapeutic)"],e:"A defensive response."},
{l:4,s:"p35",q:"Nurse: \"I think you should get the surgery. If I were you, I would.\" This is:",o:["Giving personal opinions (non-therapeutic)","Counselling (therapeutic)","Self-disclosure (therapeutic)","Sharing hope (therapeutic)"],e:"Giving personal opinions. It also goes against the counsellor role of NOT making decisions for the patient."},
{l:4,s:"p35",q:"A patient starts talking about fear of dying and the nurse says, \"Have you seen the weather today?\" This is:",o:["Changing the subject (non-therapeutic)","Focusing (therapeutic)","Using humour (therapeutic)","Using silence (therapeutic)"],e:"Changing the subject."},
{l:4,s:"p35",q:"Nurse: \"Good! That is the right decision.\" Praising or condemning the patient's choice is:",o:["Approval / disapproval (non-therapeutic)","Sharing hope (therapeutic)","Validation (therapeutic)","Providing information (therapeutic)"],e:"Approval or disapproval is non-therapeutic because it implies the nurse judges the patient's choice."},
{l:4,s:"p35",q:"Replying with clichés like \"Old people are always a bit confused\" is:",o:["Automatic responses (non-therapeutic)","Sharing observations (therapeutic)","Validation (therapeutic)","Summarizing (therapeutic)"],e:"Automatic responses: stereotyped, thoughtless replies."},
{l:4,s:"p36",q:"Which of the following groups is NOT listed in Lecture 4 as patients with special communication needs?",o:["Patients who are very talkative","Patients who cannot speak clearly","Patients with hearing impairment","Patients who do not speak your language"],e:"Listed: cannot speak clearly, cognitive impairment, hearing impairment, visual impairment, do not speak your language."},
{l:4,s:"p37",q:"When communicating with a deaf patient who has a sign-language interpreter, the nurse should:",o:["Address the patient, not the interpreter","Address the interpreter","Speak only to the family","Write everything instead of speaking"],e:"Address the individual, not their companion or interpreter."},
{l:4,s:"p37",q:"A patient brings a guide dog to the clinic. The nurse should:",o:["Not distract it by petting or talking to it","Pet it to make the patient feel welcome","Ask the patient to leave it outside","Feed it"],e:"The service animal is on the job and needs to focus on the patient."},
{l:4,s:"p37",q:"Which is correct when communicating with patients with disabilities?",o:["Offer help, and if it is accepted, follow the patient's lead","Assume what they cannot do and do it for them","Talk to them like a child","Assume they experience their disability the same way you would"],e:"Treat adults as adults; don't assume; offer help and follow their lead."},
{l:4,s:"p37",tf:1,q:"A patient may see their disability as part of their self-identity.",a:1,e:"True. The nurse should recognize this."},
{l:4,s:"p39",q:"According to the L4 summary, therapeutic communication leads to more accurate diagnoses and better adherence, and therefore:",o:["Better patient outcomes","Shorter consultations","Fewer nurses needed","Less documentation"],e:"Adherence → better patient outcome."},
{l:4,s:"p39",q:"According to the L4 summary, nurses should AVOID:",o:["Assumptions, interruptions, and giving suggestions at the wrong time","Using touch and silence","Sharing hope and humour","Listening actively"],e:"Listen actively; avoid assumptions, interruptions and badly timed suggestions; be comfortable with touch and silence."}
);

// Added 2026-09-29 from the counselling-process slide photo (appended at the end so numbering stays stable)
Q.push(
{l:4,s:"p18-19",q:"On the counselling process diagram, \"identify sources of difficulties or concerns\" belongs to which step?",o:["Step 2: problem assessment","Step 1: relationship building","Step 3: goal setting","Step 5: evaluation, termination"],e:"Problem assessment = identify the sources of difficulties or concerns."},
{l:4,s:"p18-19",q:"On the counselling process diagram, \"develop a way to deal with and overcome problems → new skills\" belongs to which step?",o:["Step 3: goal setting","Step 2: problem assessment","Step 1: relationship building","Step 5: evaluation, termination"],e:"Goal setting = develop a way to deal with and overcome problems, leading to new skills."},
{l:4,s:"p18",q:"The 5 steps of the counselling process are shown as nested boxes. Step 1, which surrounds all the others, is:",o:["Relationship building","Problem assessment","Goal setting","Counselling intervention"],e:"The relationship is the base of every later step: 1 relationship building → 2 problem assessment → 3 goal setting → 4 counselling intervention → 5 evaluation, termination."}
);


// L5 — Basic Skills in Nurse-Client Communication & Communication with Health Care Team (M Lam)
Q.push(
{l:5,s:"p4",q:"Interpersonal communication is reciprocal. This means:",o:["The sender and listener each send and receive messages at the same time","Only the sender sends messages","Only the listener gives feedback, after the message ends","Communication happens only in writing"],e:"Sender: sends while also receiving. Listener: receives while also sending. \"Brain\" (information) + \"heart\" (feeling)."},
{l:5,s:"p4",q:"In the reciprocal model of interpersonal communication, the two things exchanged are:",o:["\"Brain\" (information) and \"heart\" (feeling)","Words and numbers","Orders and reports","Questions and answers"],e:"Brain = information, heart = feeling."},
{l:5,s:"p6",q:"Which of the following is a component of the communication process?",o:["Medium (channel)","Diagnosis","Prescription","Delegation"],e:"Components: sender, message, medium / channel, receiver, feedback (and context). The slide diagram labels the medium."},
{l:5,s:"p7",q:"Which of the following is NOT one of the 4 types of communication listed in Lecture 5?",o:["Telepathic","Verbal","Visual","Written"],e:"Verbal, Nonverbal, Visual, Written."},
{l:5,s:"p8",q:"In Mehrabian's 7-38-55% rule, what % of \"total liking\" comes from facial expression?",o:["55%","38%","7%","93%"],e:"7% verbal (words), 38% vocal (tone), 55% facial."},
{l:5,s:"p8",q:"In Mehrabian's 7-38-55% rule, what % of \"total liking\" comes from the WORDS used?",o:["7%","38%","55%","93%"],e:"Verbal = 7%."},
{l:5,s:"p8",q:"In Mehrabian's 7-38-55% rule, what % of \"total liking\" comes from vocal cues (tone of voice)?",o:["38%","7%","55%","20%"],e:"Vocal = 38%."},
{l:5,s:"p8",q:"What is the important limitation of Mehrabian's 7-38-55% rule?",o:["It applies only to communicating feelings and attitudes (like / dislike)","It applies only to written communication","It applies only to children","It has no limitation"],e:"The rule came from experiments on feelings and attitudes. Unless someone is talking about feelings or attitudes, it does not apply."},
{l:5,s:"p8",tf:1,q:"According to Lecture 5, nonverbal cues can be more valuable and telling than verbal ones.",a:1,e:"True (repeated in the summary)."},
{l:5,s:"p10",q:"A genuine (heart-felt) smile signals:",o:["True enjoyment, and makes the person seem trustworthy and generous","Politeness only","Nervousness","Disagreement"],e:"A genuine smile = heart-felt happiness, TRUE enjoyment, seems trustworthy and generous."},
{l:5,s:"p11",q:"Tone, volume, inflection and accent are which type of nonverbal communication?",o:["Paralinguistics","Proxemics","Haptics","Chronemics"],e:"Paralinguistics."},
{l:5,s:"p12",q:"Touching, such as holding or hugging, is which type of nonverbal communication?",o:["Haptics","Proxemics","Chronemics","Artifacts"],e:"Haptics = touch."},
{l:5,s:"p12",q:"Interpersonal space is which type of nonverbal communication?",o:["Proxemics","Haptics","Chronemics","Paralinguistics"],e:"Proxemics = space."},
{l:5,s:"p12",q:"Time and cultural context is which type of nonverbal communication?",o:["Chronemics","Proxemics","Haptics","Artifacts"],e:"Chronemics = time."},
{l:5,s:"p12",q:"Adornments such as tattoos and accessories are which type of nonverbal communication?",o:["Artifacts","Appearance","Environment","Haptics"],e:"Artifacts = adornment. (Appearance = dress and hairstyle.)"},
{l:5,s:"p11",q:"Dress and hairstyle are which type of nonverbal communication?",o:["Appearance","Artifacts","Posture","Environment"],e:"Appearance = physical outlook: dress, hairstyle."},
{l:5,s:"p12",q:"Location, such as an office or meeting room, is which type of nonverbal communication?",o:["Environment","Proxemics","Chronemics","Artifacts"],e:"Environment."},
{l:5,s:"p11",q:"Leaning towards or away from someone is which type of nonverbal communication?",o:["Body movement","Posture","Gestures","Proxemics"],e:"Body movement: leaning towards / away. (Posture on the slide = height, tallness; gestures = hands, arms, fingers.)"},
{l:5,s:"p11-12",q:"How many types of nonverbal communication are shown in Lecture 5 (Kobiruzzaman, 2023)?",o:["12","6","7","10"],e:"12: appearance, paralinguistics, body movement, gestures, posture, facial expression, eye contact, haptics, proxemics, chronemics, artifacts, environment."},
{l:5,s:"p14",q:"In the zones of touch, the genitalia and rectum are in the:",o:["Intimate zone: permission and great sensitivity needed","Consent zone: permission needed","Vulnerable zone: special care needed","Social zone: no permission needed"],e:"Intimate zone."},
{l:5,s:"p14",q:"In the zones of touch, the mouth, wrists and feet are in the:",o:["Consent zone: permission needed","Social zone: no permission needed","Vulnerable zone: special care needed","Intimate zone"],e:"Consent zone = mouth, wrists, feet."},
{l:5,s:"p14",q:"In the zones of touch, the face, neck and front of the body are in the:",o:["Vulnerable zone: special care needed","Consent zone","Social zone","Intimate zone"],e:"Vulnerable zone = face, neck, front of body."},
{l:5,s:"p14",q:"In the zones of touch, the hands, arms, shoulders and back are in the:",o:["Social zone: no permission needed","Consent zone","Vulnerable zone","Intimate zone"],e:"Social zone."},
{l:5,s:"p14",q:"A nurse needs to check a patient's radial pulse at the wrist. Which zone of touch is this?",o:["Consent zone (permission needed)","Social zone (no permission needed)","Vulnerable zone","Intimate zone"],e:"Wrists = consent zone."},
{l:5,s:"p14",q:"A nurse pats a patient on the shoulder to comfort them. Which zone of touch is this?",o:["Social zone","Consent zone","Vulnerable zone","Intimate zone"],e:"Shoulders = social zone."},
{l:5,s:"p14",tf:1,q:"Touching a patient's feet is in the social zone, so no permission is needed.",a:0,e:"False. Feet = CONSENT zone (permission needed)."},
{l:5,s:"p18",q:"Which of the following is NOT listed as a reason communication matters in nursing?",o:["To speed up discharge to free beds","To correct misinformation","To overcome perceptual bias or stereotypes","To document the patient's condition"],e:"Listed: gather information, interpret messages, obtain new information, correct misinformation, promote understanding, plan patient-centred care, overcome bias or stereotypes, document the condition."},
{l:5,s:"p18",q:"Effective communication in nursing leads to care that is:",o:["Individualized, problem-based, focused, safe and high quality","Standardized for all patients","Cheaper but slower","Doctor-directed"],e:"Individualized, problem-based, focused, safe and high-quality care."},
{l:5,s:"p20-41",q:"The phases of nurse–client communication follow which framework?",o:["The nursing process: assessment, diagnosis, planning, implementation, evaluation","SOLER","ISBAR","The 6 Cs"],e:"5 phases = nursing process (ADPIE)."},
{l:5,s:"p21",q:"In the assessment phase, communication is used to:",o:["Ask and gather information","Discuss and prioritize","Determine plans","Give feedback"],e:"Assessment = ask and gather; Diagnosis = discuss and prioritize; Planning = determine; Implementation = explain procedure and educate; Evaluation = feedback."},
{l:5,s:"p35",q:"In the nursing diagnosis phase, communication is used to:",o:["Discuss and prioritize","Ask and gather information","Explain procedures and educate","Give feedback"],e:"Diagnosis = discuss and prioritize (validate needs and priorities with the patient)."},
{l:5,s:"p40",q:"In the implementation phase, communication is used to:",o:["Explain procedures and educate","Ask and gather information","Discuss and prioritize","Compare actual and expected outcomes"],e:"Implementation = explain procedure and educate."},
{l:5,s:"p41",q:"Comparing actual and expected outcomes and updating the care plan belong to which phase?",o:["Evaluation","Planning","Implementation","Diagnosis"],e:"Evaluation = feedback: compare outcomes, find factors affecting them, change the plan, explain changes."},
{l:5,s:"p36",q:"Writing down expected outcomes and making written or verbal referrals to team members belong to which phase?",o:["Planning","Assessment","Evaluation","Diagnosis"],e:"Planning = determine."},
{l:5,s:"p21",q:"Which of the following is an assessment-phase communication activity?",o:["Visual and intuitive observation of nonverbal behaviour","Modifying the care plan","Delegating to the health care team","Documenting the nursing diagnosis"],e:"Assessment: interviewing and history taking; observing nonverbal behaviour; collecting data by sight, touch and hearing during physical exam; written records, tests, literature."},
{l:5,s:"p22",q:"A client interview is defined as:",o:["A planned communication or conversation with a purpose","Any casual chat","A written questionnaire","A handover between nurses"],e:"Planned + with a purpose (get / give information, identify problems, evaluate change, teach, support / counsel, provide therapy)."},
{l:5,s:"p23",q:"Which feature describes a DIRECTIVE interview?",o:["Highly structured and controlled by the nurse, used when time is limited","Controlled by the client","Used mainly to build rapport","The client has plenty of chance to ask questions"],e:"Directive: highly structured, nurse controls, specific information, limited time, client has limited chance to ask questions."},
{l:5,s:"p23",q:"Which feature describes a NONDIRECTIVE interview?",o:["The client controls the interview; used for building rapport","The nurse controls the interview","Highly structured","Used when time is limited"],e:"Nondirective = rapport building, client controls."},
{l:5,s:"p23",q:"A patient arrives at A&E with chest pain and the nurse must quickly get specific information. Which interview type fits best?",o:["Directive interview","Nondirective interview","Counselling interview","Group interview"],e:"Limited time + specific information = directive."},
{l:5,s:"p24",q:"\"How have you been feeling lately?\" is an example of:",o:["An open-ended question","A closed question","A leading question","A directive statement"],e:"Open-ended: invites the client to explore and elaborate; longer answers."},
{l:5,s:"p24",q:"\"Are you having pain now?\" is an example of:",o:["A closed question","An open-ended question","A neutral question","A leading question"],e:"Closed: yes / no or short factual answers; mostly used in directive interviews / history taking."},
{l:5,s:"p24",q:"Open-ended questions are mainly used to ___, while closed questions are mainly used for ___.",o:["describe problems; history","history; describe problems","build rapport; counselling","close the interview; open the interview"],e:"Open → describe problems. Closed → history."},
{l:5,s:"p24",q:"Closed questions are mostly used in which type of interview?",o:["Directive interview","Nondirective interview","Counselling interview","Rapport-building interview"],e:"Directive."},
{l:5,s:"p25",q:"\"How do you feel about the surgery tomorrow?\" is an example of:",o:["A neutral question","A leading question","A closed question","A multiple-choice mix-up"],e:"Neutral: the client can answer without direction or pressure."},
{l:5,s:"p25",q:"\"You are nervous about the surgery tomorrow, aren't you?\" is an example of:",o:["A leading question","A neutral question","An open-ended question","Clarifying"],e:"Leading: directs the client's answer."},
{l:5,s:"p25",q:"\"Are you feeling stressed about the surgery tomorrow?\" is classified in Lecture 5 as:",o:["A leading question","A neutral question","An open-ended question","Focusing"],e:"The slide lists it under LEADING questions because it suggests the feeling (stress)."},
{l:5,s:"p26",q:"When is the best time to hold a client interview?",o:["When the client is physically comfortable, with no interruptions, outside visiting hours and routines","During visiting hours so family can help","Right after a painful procedure","During meal time"],e:"Client comfortable; no interruptions; outside visiting hours / routine."},
{l:5,s:"p26",q:"What is the recommended seating arrangement for an interview?",o:["At the same level","Nurse standing, client sitting","Nurse sitting higher","Across a large desk"],e:"Same level."},
{l:5,s:"p27",q:"What is the most comfortable distance to keep between client and nurse in an interview?",o:["2–3 feet","6–8 feet","Less than 1 foot","10 feet"],e:"2–3 feet (also consider cultural and personal needs)."},
{l:5,s:"p26",q:"The place for an interview should be:",o:["Well-lit, well-ventilated, free of noise or distraction, and private","Dim and quiet","In the corridor for convenience","In the nurses' station"],e:"Well-lit, well-ventilated, quiet, private."},
{l:5,s:"p27",q:"About language in interviews, the nurse should:",o:["Use a language the client understands and turn medical terms into everyday language","Use medical terminology to sound professional","Always use English","Let the family translate everything"],e:"Use a language the client understands; convert medical terminology."},
{l:5,s:"p29",q:"What are the 3 phases of an interview?",o:["Introductory (opening) → working (body) → summary and closure (closing)","Assessment → planning → evaluation","Orientation → intervention → referral","Greeting → questioning → documentation"],e:"Opening → body → closing."},
{l:5,s:"p30",q:"Which phase of the interview is described as the MOST important part?",o:["Opening (introductory phase)","Body (working phase)","Closing","All equally"],e:"The opening is the most important part: it builds rapport and orients the client → goodwill and trust."},
{l:5,s:"p30",q:"The purpose of the interview's opening phase is to:",o:["Establish rapport and orient the client","Give health teaching","Plan the next meeting","Summarize findings"],e:"Purpose: rapport + orientation. Result: goodwill + trust."},
{l:5,s:"p30",q:"Which of the following belongs to the OPENING phase of an interview?",o:["Explaining confidentiality and the right to stop","Planning the next meeting","Asking one question at a time","Expressing thanks"],e:"Opening: greeting, self-introduction, gestures (smile, ± handshake), explain purpose and nature (how long, what information), confidentiality and right to stop."},
{l:5,s:"p31",q:"Which of the following belongs to the BODY (working phase) of an interview?",o:["Ask one question at a time","Greet the patient","Express thanks","Plan the next meeting"],e:"Body: respect and acceptance, logical sequence, speak slowly, understandable language, clarify, one question at a time, watch your tone, calm eye contact, don't impose your values, avoid personal examples."},
{l:5,s:"p31",tf:1,q:"In the working phase of an interview, the nurse should use personal examples to help the client relate.",a:0,e:"False. \"Avoid using personal examples\" and \"do not impose your own values\"."},
{l:5,s:"p34",q:"What is the purpose of the CLOSING phase of an interview?",o:["To keep rapport and trust and make future interaction easier","To collect as much data as possible","To make a diagnosis","To explain confidentiality"],e:"Closing: maintain rapport and trust; facilitate future interaction."},
{l:5,s:"p34",q:"Which of the following belongs to the CLOSING phase of an interview?",o:["Showing concern for the client's welfare and future","Explaining how long the interview will take","Asking questions in a logical sequence","Self-introduction"],e:"Closing: offer to answer questions, concluding statement, thanks, concern for the client's welfare and future, plan the next meeting."},
{l:5,s:"p32",q:"Which of the following is listed as a skill of good interviewing?",o:["Facilitation","Arguing","False reassurance","Changing the subject"],e:"Skills: nonverbal communication, facilitation, reflection, clarification, summarization, validation, empathic response, reassurance, transition."},
{l:5,s:"p37",q:"When should a nurse communicate with the health care team to get help?",o:["When facing a problem or a change in the patient's condition that needs more knowledge, skills or resources","Only during scheduled ward rounds","Only when the patient asks","Only in emergencies"],e:"Seek procedural help or clinical expertise; identify problems needing extra knowledge, skills or resources."},
{l:5,s:"p37",q:"Which structured approach does Lecture 5 recommend for framing conversations with the health care team?",o:["ISBAR","SOLER","SURETY","KISS"],e:"ISBAR: gives a chance to ask and answer questions; supports handover and patient safety."},
{l:5,s:"p37",q:"What does ISBAR stand for?",o:["Identify, Situation, Background, Assessment, Recommendation","Introduce, Summarize, Background, Action, Review","Identify, Symptoms, Background, Action, Response","Inform, Situation, Brief, Assess, Report"],e:"ISBAR = Identify, Situation, Background, Assessment, Recommendation."},
{l:5,s:"p54",q:"According to the L5 summary, ISBAR is a structured framework that makes which activities more effective?",o:["Handovers and interdisciplinary collaboration","Patient interviews only","Health education","Counselling"],e:"Handovers and interdisciplinary collaboration → patient safety and better outcomes."},
{l:5,s:"p38",q:"BEFORE making a phone consultation, which is NOT a recommended step?",o:["Leave the assessment for the consultant to do","Gather the information (notes, medication sheets)","Assess the patient yourself","Rehearse the report in your head using ISBAR"],e:"Before: gather information, assess the patient YOURSELF, cover clinical history and patient's view, interpret the problem, rehearse with ISBAR; know why you're calling; think of possible solutions."},
{l:5,s:"p38",tf:1,q:"Before calling a consultant, the nurse should understand why they are calling and think through some possible solutions.",a:1,e:"True."},
{l:5,s:"p39",q:"DURING a phone consultation, the nurse should:",o:["Avoid bias by not overloading the consultant with subjective and emotional conclusions","Hand the whole problem over to the consultant","Hang up once the consultant gives an answer","Share strong personal opinions about the patient"],e:"During: don't prejudice the consultant; be available to discuss; do NOT hand over the whole problem."},
{l:5,s:"p39",q:"AFTER a phone consultation, the nurse should:",o:["Add the recommendations to the care plan and always give the consultant feedback on the outcome","Do nothing further","Only record the call time","Ask the patient to call the consultant"],e:"After: incorporate recommendations; always give feedback on the outcome."},
{l:5,s:"p42",q:"The fundamental components of patient-centred communication are:",o:["Empathy, clarity and honesty","Speed, accuracy and brevity","Authority, control and structure","Silence, touch and humour"],e:"Empathy, Clarity, Honesty (be human, active listening)."},
{l:5,s:"p45",q:"Hierarchy and gender issues in interdisciplinary communication are which type of barrier?",o:["Personal barriers","Physical barriers","Environmental barriers","Technological barriers"],e:"Personal barriers: patient-related, nurse-related, interdisciplinary (hierarchy, gender)."},
{l:5,s:"p45",q:"Hospital procedures and physical space are which type of communication barrier?",o:["Physical barriers","Personal barriers","Interdisciplinary barriers","Patient-related barriers"],e:"Physical barriers: physical environment, hospital procedures, physical space."},
{l:5,s:"p47",q:"A rambling, detailed introduction before asking a question is the error called:",o:["Long-winded build-up","Thunder stealer","Multiple-choice mix-up","Cryptic codes"],e:"Long-winded build-up. Fix: KISS."},
{l:5,s:"p47",q:"What does the KISS principle stand for?",o:["Keep It Short and Simple","Keep It Safe and Secure","Know Information, Speak Slowly","Keep Interviews Structured and Standard"],e:"Keep It Short and Simple."},
{l:5,s:"p47",q:"Jumping in with your own views before the client has a chance to speak is the error called:",o:["Thunder stealer","Long-winded build-up","Misuse of \"why\"","Multiple-choice mix-up"],e:"Thunder stealer."},
{l:5,s:"p47",q:"Asking many questions at once so the client doesn't know where to begin is the error called:",o:["Multiple-choice mix-up","Thunder stealer","Cryptic codes","Misuse of closed questions"],e:"Multiple-choice mix-up."},
{l:5,s:"p47",q:"Using medical terminology and your own jargon that confuses clients is the error called:",o:["Incomprehensible and cryptic codes","Long-winded build-up","Thunder stealer","Leading question"],e:"Incomprehensible and cryptic codes."},
{l:5,s:"p48",q:"A client is slamming his pillow against the bed frame. The nurse asks, \"Why are you doing that, Mr Kent?\" This is the error called:",o:["Misuse of \"why\"","Thunder stealer","Multiple-choice mix-up","Cryptic codes"],e:"Misuse of \"WHY?\"."},
{l:5,s:"p48",q:"When first taking a health history, the nurse asks, \"Do you eat a well-balanced diet?\" What is the error?",o:["Misuse of open and closed questions: a yes / no answer tells little about nutritional intake","Leading question","Thunder stealer","Long-winded build-up"],e:"A closed question where an open one is needed."},
{l:5,s:"p50",q:"Texting, computer messaging and videoconferencing are which mode of health care communication?",o:["Computer-mediated (technology)","Person-to-person","Face-to-face","Telephone"],e:"Computer-mediated / technology."},
{l:5,s:"p51",q:"When using technology to communicate, which of the following is NOT listed as something to consider?",o:["Font size","Ethics","Confidentiality","Uncontrolled secondary use"],e:"Consider: ethics, confidentiality, unauthorized access, uncontrolled secondary use."},
{l:5,s:"p51",tf:1,q:"According to Lecture 5, technology decreases social interaction, which is the foundation for building a trusting relationship.",a:1,e:"True."},
{l:5,s:"p52",q:"Ineffective communication is a root cause of about what % of all reported sentinel events?",o:["~66%","~7%","~38%","~90%"],e:"Nearly 66%."},
{l:5,s:"p52",q:"Communication errors cause what % of preventable hospital deaths?",o:["60–70%","10–20%","30–40%","80–90%"],e:"60%–70%."},
{l:5,s:"p52",q:"Poor communication in the health care team is the leading root cause of which of the following?",o:["Medication errors, delays in treatment and wrong-site surgery","Hospital-acquired infections only","Staff turnover only","Longer visiting hours"],e:"Medication errors, treatment delays, wrong-site surgeries."},
{l:5,s:"p53",q:"Effective communication in the health care team should be:",o:["Clear, complete, brief and timely","Long, detailed and formal","Written only","Emotional and persuasive"],e:"Clear, Complete, Brief, Timely."},
{l:5,s:"p53",q:"\"Offer and request information in an appropriate timeframe; verify authenticity; validate or acknowledge information\" describes which quality of team communication?",o:["Timely","Clear","Complete","Brief"],e:"Timely."},
{l:5,s:"p53",q:"\"Communicate all relevant information\" describes which quality of team communication?",o:["Complete","Brief","Clear","Timely"],e:"Complete."}
);

// L6 — History of Nursing Thoughts (C Sun)
Q.push(
{l:6,s:"p3",q:"According to Parker (2001), a theory is:",o:["An organized, coherent set of concepts and their relationships that offers descriptions, explanations and predictions about phenomena","A personal opinion based on experience","A rule that cannot be tested","A list of nursing procedures"],e:"Parker (2001). A theory is also a set of established statements or rules that CAN be tested."},
{l:6,s:"p3",tf:1,q:"A theory is a set of established statements or rules that can be tested.",a:1,e:"True."},
{l:6,s:"p4",q:"Nursing theories are organized, knowledge-based concepts that essentially define:",o:["The scope of nursing practice","Hospital budgets","Medical diagnoses","Nurses' salaries"],e:"Scope of practice = what nursing is, what nurses are tasked with, and why."},
{l:6,s:"p5",q:"Which of the following is NOT a reason nursing needs theory?",o:["To replace clinical judgement","To give foundational knowledge that explains what we do for patients","To give evidence that justifies our methods","To provide ground for new nursing knowledge"],e:"Theories give: foundational knowledge, principles underpinning practice, evidence justifying methods, ground to generate more knowledge."},
{l:6,s:"p6",q:"Which is the MOST general (most abstract) level of nursing theory?",o:["Metaparadigm","Grand theory","Middle-range theory","Practice-level theory"],e:"Metaparadigm → grand → middle-range → practice-level (most general → most specific)."},
{l:6,s:"p6",q:"Order the levels of nursing theory from most abstract to most specific:",o:["Metaparadigm → grand → middle-range → practice-level","Grand → metaparadigm → practice-level → middle-range","Practice-level → middle-range → grand → metaparadigm","Metaparadigm → middle-range → grand → practice-level"],e:"Metaparadigm → Grand → Middle-range → Practice-level."},
{l:6,s:"p7",q:"What are the 4 concepts of the nursing metaparadigm?",o:["Person, environment, health, nursing","Person, family, community, society","Assessment, diagnosis, planning, evaluation","Care, compassion, competence, communication"],e:"Person, Environment, Health, Nursing."},
{l:6,s:"p7",q:"A paradigm is:",o:["A pattern of shared understanding and assumptions about reality and the world","A research method","A nursing procedure","A type of practice-level theory"],e:"Paradigm = a pattern of shared understanding and assumptions about reality."},
{l:6,s:"p6",q:"Madeleine Leininger's Cultural Care Theory is given as an example of a:",o:["Grand theory","Middle-range theory","Practice-level theory","Metaparadigm"],e:"Grand theories give a broad, abstract framework (e.g. Leininger)."},
{l:6,s:"p6",q:"In Lecture 6, Roy's Adaptation Model is given as an example of a:",o:["Middle-range theory","Grand theory","Practice-level theory","Metaparadigm"],e:"The L6 slides (p6 and p8) classify Roy as MIDDLE-RANGE."},
{l:6,s:"p6",q:"Theories of wound healing and end-of-life care are examples of:",o:["Practice-level theories","Grand theories","Middle-range theories","Metaparadigms"],e:"Practice-level: a defined patient population at a specified time."},
{l:6,s:"p6",q:"Which level of theory drills down into specific areas of nursing and comes from practice, research or theories of similar disciplines?",o:["Middle-range theory","Grand theory","Metaparadigm","Practice-level theory"],e:"Middle-range."},
{l:6,s:"p6",q:"Which level of theory focuses on a defined patient population at a specified time?",o:["Practice-level theory","Middle-range theory","Grand theory","Metaparadigm"],e:"Practice-level."},
{l:6,s:"p8",q:"Which theorist is correctly matched with their theory?",o:["Hildegard Peplau: Interpersonal Relations Theory","Virginia Henderson: Self-Care Theory","Dorothea Orem: Need Theory","Jean Watson: Adaptation Model"],e:"Nightingale = Environmental; Henderson = Need; Peplau = Interpersonal Relations; Orem = Self-Care; Roy = Adaptation; Watson = Transpersonal Caring."},
{l:6,s:"p8",q:"Which of the 6 theories in Lecture 6 is classified as a MIDDLE-RANGE theory (the rest are grand)?",o:["Roy's Adaptation Model","Orem's Self-Care Theory","Watson's Theory of Transpersonal Caring","Henderson's Need Theory"],e:"Only Roy is middle-range in the L6 table."},
{l:6,s:"p8",q:"Virginia Henderson lived from:",o:["1897 to 1996","1820 to 1910","1909 to 1999","1914 to 2007"],e:"Henderson 1897–1996; Peplau 1909–1999; Orem 1914–2007; Roy 1939–present; Watson 1940–present."},
{l:6,s:"p8",q:"Which TWO theorists in Lecture 6 are still alive (\"– present\")?",o:["Sister Callista Roy and Jean Watson","Peplau and Orem","Henderson and Watson","Roy and Orem"],e:"Roy (1939–present) and Watson (1940–present)."},
{l:6,s:"p8",q:"Hildegard Peplau lived from:",o:["1909 to 1999","1897 to 1996","1914 to 2007","1939 to present"],e:"Peplau 1909–1999."},
{l:6,s:"p8",q:"Dorothea Orem lived from:",o:["1914 to 2007","1909 to 1999","1897 to 1996","1940 to present"],e:"Orem 1914–2007."},
{l:6,s:"p9",q:"Florence Nightingale is described in Lecture 6 as:",o:["The first nursing theorist and the pioneer of modern nursing","The founder of the Interpersonal Relations Theory","A middle-range theorist","The founder of the ICN"],e:"First nursing theorist; pioneer of modern nursing; \"the lady with the lamp\"."},
{l:6,s:"p9",q:"The focus of Nightingale's Environmental Theory is:",o:["The nurse manipulates the environment to enhance patient recovery","The nurse–patient relationship","Patient self-care","Adaptation to change"],e:"Manipulate the environment → recovery."},
{l:6,s:"p9",q:"Which of the following is NOT one of Nightingale's 5 main environmental factors?",o:["Nutrition","Fresh / pure air","Pure water","Efficient drainage"],e:"The 5: pure air, pure water, efficient drainage, cleanliness, light."},
{l:6,s:"p9",q:"Which of the following IS one of Nightingale's 5 main environmental factors?",o:["Light","Noise","Variety","Food"],e:"Pure air, pure water, efficient drainage, cleanliness, LIGHT. (Noise, variety and food are among the 13 concepts, not the 5 factors.)"},
{l:6,s:"p10",q:"How many concepts are in Nightingale's Environmental Theory?",o:["13","5","14","10"],e:"13 concepts (and 5 main environmental factors). Don't mix it up with Henderson's 14 components."},
{l:6,s:"p10",q:"In Nightingale's theory, \"documenting the plan of care and all evaluations so others give the same care in your absence\" is the concept of:",o:["Petty management","Observation of the sick","Health of houses","Variety"],e:"Petty management = continuity of care."},
{l:6,s:"p10",q:"In Nightingale's theory, which concept tells nurses to keep noise to a minimum and avoid whispering outside the door?",o:["Noise","Chattering hopes and advices","Variety","Petty management"],e:"Noise."},
{l:6,s:"p10",q:"In Nightingale's theory, bringing cards, flowers, pictures, books or puzzles, and encouraging friends to engage the client in conversation, is the concept of:",o:["Variety","Chattering hopes and advices","Food","Health of houses"],e:"Variety."},
{l:6,s:"p10",q:"In Nightingale's theory, assessing the surroundings for pure air, pure water, drainage, cleanliness and light is the concept of:",o:["Health of houses","Ventilation and warmth","Cleanliness of rooms and walls","Light"],e:"Health of houses."},
{l:6,s:"p10",q:"In Nightingale's theory, checking the client's body temperature and room temperature, fresh air and foul odours is the concept of:",o:["Ventilation and warmth","Health of houses","Noise","Personal cleanliness"],e:"Ventilation and warmth."},
{l:6,s:"p10-11",q:"In Nightingale's theory, \"food intake\" is about ___, whereas \"food\" is about ___.",o:["the amount eaten at every meal; the types of food the client likes or dislikes","likes and dislikes; the amount eaten","hospital menus; family food","vitamins; calories"],e:"Food intake = amount. Food = preferences; make sure enjoyable food is available."},
{l:6,s:"p11",q:"According to Nightingale's \"bed and bedding\" concept, the bed should be kept:",o:["Dry, wrinkle-free and at the lowest height","Warm and at the highest height","Soft and at waist height","Changed once a week"],e:"Dry, wrinkle-free, LOWEST height."},
{l:6,s:"p11",q:"According to Nightingale's \"light\" concept:",o:["Sunlight works best, but don't put the client in direct light","Artificial light is best","The room should be kept dark for rest","Direct sunlight on the client is ideal"],e:"Sunlight best; avoid direct light on the client."},
{l:6,s:"p11",q:"Keeping the room free of dampness, darkness, dust and mildew is Nightingale's concept of:",o:["Cleanliness of rooms and walls","Personal cleanliness","Health of houses","Light"],e:"Cleanliness of rooms and walls."},
{l:6,s:"p12",q:"Keeping the client dry and clean at all times and checking the skin often is Nightingale's concept of:",o:["Personal cleanliness","Cleanliness of rooms and walls","Bed and bedding","Observation of the sick"],e:"Personal cleanliness."},
{l:6,s:"p12",q:"\"Avoid talking without reason or giving advice that is not based on fact; avoid personal talk\" is Nightingale's concept of:",o:["Chattering hopes and advices","Noise","Variety","Petty management"],e:"Chattering hopes and advices."},
{l:6,s:"p12",q:"According to Nightingale's \"observation of the sick\", observations should be:",o:["Factual, not just opinions","Based on the nurse's feelings","Recorded only when abnormal","Done by doctors only"],e:"Observe and record everything; factual, not opinion."},
{l:6,s:"p13",q:"According to Nightingale (1860), the goal of nursing is to:",o:["Place the patient in the best possible condition for nature to act","Cure disease with medicine","Help the patient adapt to change","Build a therapeutic relationship"],e:"Put the patient in the best environment for nature to influence health."},
{l:6,s:"p13",q:"Nightingale believed many symptoms and sufferings of patients were caused by:",o:["Poor environmental conditions, not the disease itself","Lack of medication","Poor nurse–patient relationships","Patients' lack of self-care"],e:"Poor environmental conditions."},
{l:6,s:"p17",q:"Henderson's Need Theory stresses the importance of:",o:["Patient independence, so the patient keeps progressing after leaving hospital","The environment","The nurse–patient relationship","Adapting to stimuli"],e:"Patient independence."},
{l:6,s:"p17",q:"In Henderson's theory, the SUBSTITUTIVE role of the nurse means:",o:["Doing something FOR the patient","Helping the patient do something","Working WITH the patient to do something","Teaching the patient"],e:"Substitutive = for; supplementary = help; complementary = with."},
{l:6,s:"p17",q:"In Henderson's theory, the SUPPLEMENTARY role of the nurse means:",o:["Helping the patient do something","Doing something for the patient","Working with the patient to do something","Referring the patient"],e:"Supplementary = helping."},
{l:6,s:"p17",q:"In Henderson's theory, the COMPLEMENTARY role of the nurse means:",o:["Working WITH the patient to do something","Doing something for the patient","Helping the patient do something","Supervising other staff"],e:"Complementary = working with."},
{l:6,s:"p17",q:"A nurse feeds an unconscious patient through a nasogastric tube. According to Henderson, which nurse role is this?",o:["Substitutive","Supplementary","Complementary","Supportive-educative"],e:"Doing it FOR the patient = substitutive. (Supportive-educative is Orem's term.)"},
{l:6,s:"p18",q:"How many components are in Henderson's Need Theory?",o:["14","13","10","5"],e:"14 components (9 physical + 5 psychosocial / spiritual). Nightingale has 13 concepts."},
{l:6,s:"p18",q:"Which of Henderson's components is a PSYCHOSOCIAL / SPIRITUAL need?",o:["Worship according to one's faith","Breathe normally","Eliminate body wastes","Sleep and rest"],e:"Psychosocial / spiritual: communicate, worship, work (accomplishment), play / recreation, learn."},
{l:6,s:"p18",q:"Which of Henderson's components is a PHYSICAL need?",o:["Avoid dangers in the environment and avoid injuring others","Communicate with others","Play or take part in recreation","Work with a sense of accomplishment"],e:"Physical (1–9): breathe, eat and drink, eliminate, move and posture, sleep and rest, clothing, temperature, clean / groomed / protect integument, avoid dangers."},
{l:6,s:"p18",q:"Henderson's component \"maintain body temperature within normal range\" is achieved by:",o:["Adjusting clothing and modifying the environment","Taking antipyretics","Drinking warm water","Exercising"],e:"By adjusting clothing and modifying the environment."},
{l:6,s:"p18",q:"How many of Henderson's 14 components are PHYSICAL needs?",o:["9","5","7","10"],e:"9 physical + 5 psychosocial / spiritual."},
{l:6,s:"p19",q:"Henderson's needs are often linked in Lecture 6 to which other framework?",o:["Maslow's Hierarchy of Needs (1943)","Carper's patterns of knowing","Flexner's criteria","The SOLER model"],e:"Maslow's Hierarchy of Needs (1943)."},
{l:6,s:"p21",q:"Henderson's theory works well in which settings?",o:["Rehabilitation units and patients with chronic diseases","Emergency departments only","Operating theatres","Psychiatric crisis units"],e:"Rehabilitation and chronic disease, where the transition to self-care matters."},
{l:6,s:"p22",q:"Peplau's Interpersonal Relations Theory was published in:",o:["1952","1860","1999","1943"],e:"1952."},
{l:6,s:"p22",q:"According to Peplau, the foundation of nursing practice is:",o:["The nurse–client relationship","The environment","Self-care","Adaptation"],e:"The nurse–client relationship: a give-and-take partnership."},
{l:6,s:"p22",q:"Which statement goes AGAINST Peplau's Interpersonal Relations Theory?",o:["The nurse passively carries out the doctor's orders","Nurse and client form a partnership","The relationship is give-and-take","The nurse–client relationship is the foundation of nursing"],e:"Peplau rejects the client passively receiving treatment and the nurse passively acting on doctor's orders."},
{l:6,s:"p23-26",q:"What are Peplau's 4 phases of the therapeutic nurse–patient relationship, in order?",o:["Orientation → identification → exploitation → resolution","Orientation → working → termination → evaluation","Assessment → diagnosis → planning → evaluation","Identification → orientation → resolution → exploitation"],e:"Orientation → Identification → Exploitation → Resolution."},
{l:6,s:"p23",q:"In which of Peplau's phases does the client meet the nurse as a stranger and the problem is defined?",o:["Orientation","Identification","Exploitation","Resolution"],e:"Orientation = problem-defining phase."},
{l:6,s:"p24",q:"In which of Peplau's phases does the client work interdependently with the nurse and express feelings?",o:["Identification","Orientation","Exploitation","Resolution"],e:"Identification: may feel belonging and able to cope, OR helpless and hopeless."},
{l:6,s:"p25",q:"In which of Peplau's phases does the client make full use of the services offered and may make minor requests or use attention-getting techniques?",o:["Exploitation","Identification","Orientation","Resolution"],e:"Exploitation."},
{l:6,s:"p26",q:"In which of Peplau's phases does the client give up dependent behaviour and the professional relationship ends?",o:["Resolution","Exploitation","Identification","Orientation"],e:"Resolution. It can be hard for both sides because psychological dependence may persist."},
{l:6,s:"p27",q:"Jenny, 58, has pancreatic cancer and panics before surgery. She tells her case nurse about her fears and feelings. Which Peplau phase is this?",o:["Identification","Orientation","Exploitation","Resolution"],e:"Expressing feelings to the nurse = identification."},
{l:6,s:"p27",q:"After surgery, Jenny regains a sense of control and gets used to the ward. The nurse teaches self-care (blood glucose monitoring, diet). Which Peplau phase is this?",o:["Exploitation","Resolution","Identification","Orientation"],e:"Exploitation: full use of services; self-care education."},
{l:6,s:"p27",q:"Jenny makes friends on the ward and even helps the nurses talk to other patients; she does a return demonstration of self-care. Which Peplau phase is this?",o:["Resolution","Exploitation","Identification","Orientation"],e:"Resolution: no longer dependent."},
{l:6,s:"p27",q:"On admission, the nurse explains Jenny's treatment and disease, and orients her to the environment. Which Peplau phase is this?",o:["Orientation","Identification","Exploitation","Resolution"],e:"Orientation."},
{l:6,s:"p28",q:"According to Orem, nursing is:",o:["The act of helping others provide and manage self-care to maintain or improve human functioning","Manipulating the environment","A give-and-take relationship","Promoting adaptation"],e:"Orem: assisting with self-care. All patients want to care for themselves and recover faster by doing so."},
{l:6,s:"p29",q:"In Orem's theory, when is nursing required?",o:["When there is a self-care deficit","When self-care agency is high","Always, for every patient","Only after surgery"],e:"Self-care deficit = the person cannot meet their own self-care needs → nursing is required."},
{l:6,s:"p29",q:"In Orem's theory, a person's ABILITY to perform self-care (affected by age, development, health and resources) is called:",o:["Self-care agency","Nursing agency","Therapeutic self-care demand","Self-care deficit"],e:"Self-care agency. Nursing agency = the NURSE's ability to help."},
{l:6,s:"p29",q:"In Orem's theory, \"the total self-care actions needed to meet known self-care needs\" is called:",o:["Therapeutic self-care demand","Self-care agency","Nursing agency","Nursing systems"],e:"Therapeutic self-care demand."},
{l:6,s:"p29",q:"In Orem's theory, the nurse's ability to help meet the patient's self-care needs is called:",o:["Nursing agency","Self-care agency","Nursing system","Self-care"],e:"Nursing agency."},
{l:6,s:"p29",q:"What are the 3 nursing systems in Orem's theory?",o:["Wholly compensatory, partly compensatory, supportive-educative","Substitutive, supplementary, complementary","Orientation, identification, exploitation","Physiological, self-concept, role function"],e:"Wholly compensatory, partly compensatory, supportive-educative. (Substitutive / supplementary / complementary = Henderson.)"},
{l:6,s:"p29",q:"A newly diagnosed diabetic who can physically do everything but needs teaching on insulin injection fits which of Orem's nursing systems?",o:["Supportive-educative","Wholly compensatory","Partly compensatory","Substitutive"],e:"Can do it, but needs teaching and support = supportive-educative."},
{l:6,s:"p29",q:"An unconscious ICU patient who needs the nurse to do everything fits which of Orem's nursing systems?",o:["Wholly compensatory","Partly compensatory","Supportive-educative","Complementary"],e:"Wholly compensatory."},
{l:6,s:"p30",q:"Princess Margaret Hospital's \"I Can Do It\" programme uses a traffic-light chart to show hip-fracture patients' self-care ability. Which theory does this best illustrate?",o:["Orem's Self-Care Theory","Peplau's Interpersonal Relations Theory","Nightingale's Environmental Theory","Watson's Transpersonal Caring"],e:"Self-care theory in contemporary practice."},
{l:6,s:"p30",q:"In the hip-fracture example, keeping patients in bed too long because of worry can cause:",o:["Disuse dysfunction (shortening and deformity of the limb, functional decline)","Venous air embolism","Hypoglycaemia","Infection"],e:"Disuse dysfunction (無為殘障)."},
{l:6,s:"p31",q:"According to Roy, adaptation happens when:",o:["People respond positively to changes in the environment","The nurse changes the environment","The patient becomes dependent","The disease is cured"],e:"Positive response to environmental change, using conscious awareness, self-reflection and choice."},
