<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="1600 Drill"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GIN Test I Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#F3F5F8; --surface:#FFFFFF; --ink:#18202E; --muted:#5A6477; --line:#DDE2EA;
  --lamp:#F5B800; --lamp-soft:#FFF3C4; --lamp-ink:#3A2C00;
  --ok:#1C8456; --ok-soft:#E1F4EA; --bad:#C23B35; --bad-soft:#FBE6E4;
  --focus:#2F6BD8;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10141B; --surface:#181E28; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3240;
    --lamp:#FFCF33; --lamp-soft:#3A3113; --lamp-ink:#FFE89A;
    --ok:#4CC38A; --ok-soft:#153325; --bad:#F07068; --bad-soft:#3A1A19; --focus:#7FA8F0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10141B; --surface:#181E28; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3240;
  --lamp:#FFCF33; --lamp-soft:#3A3113; --lamp-ink:#FFE89A;
  --ok:#4CC38A; --ok-soft:#153325; --bad:#F07068; --bad-soft:#3A1A19; --focus:#7FA8F0;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);padding:0 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-within{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.eyebrow{font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1}
.brand h1 .flame{display:inline-block;width:.5em;height:.62em;margin-left:.12em;background:var(--lamp);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:translateY(-.05em)}
.exam{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.exam .days{font:700 22px/1 var(--mono);color:var(--ink)}
.exam .sub{font-size:13px;color:var(--muted)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{font:700 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* modes */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mode:hover{border-color:var(--muted)}
.mode.primary{background:var(--lamp);border-color:var(--lamp);color:#241B00}
.mode.primary .d{color:#4A3A06}
.mode .t{font:700 17px/1.2 var(--display)}
.mode .d{font-size:13px;color:var(--muted);line-height:1.4}
.mode[disabled]{opacity:.45;cursor:not-allowed}

/* lecture picker */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-head h2{font-size:18px;font-weight:600}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lects{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.chip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.chip:first-child{border-top:0}
.chip input{width:18px;height:18px;accent-color:var(--lamp);margin:0}
.chip .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.chip .nm b{font-weight:700;font-size:15px}
.chip .nm b .ln{font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:6px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)}
.bar .w{background:var(--bad)}
.chip .ct{font:500 13px/1.2 var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.chip.off .nm,.chip.off .ct{opacity:.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.note{font-size:13px;color:var(--muted);line-height:1.5}
.note strong{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--ground);padding-block:10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.qbar .home{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.qbar .prog{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.qbar .prog .row{display:flex;justify-content:space-between;font:500 13px/1 var(--mono);color:var(--muted);gap:8px}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--lamp)}
.timer{font:700 16px/1 var(--mono);padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font:700 12px/1 var(--mono);padding:5px 8px;border-radius:6px;background:var(--lamp-soft);color:var(--lamp-ink)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.tf{background:var(--ground);color:var(--muted)}
.qtext{font:600 clamp(19px,3.6vw,23px)/1.35 var(--body);margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{font:700 13px/1 var(--mono);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--ground);color:var(--muted)}
.opt .tx{padding-top:5px}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb .h{font:700 15px/1.2 var(--display)}
.fb.ok .h{color:var(--ok)}
.fb.no .h{color:var(--bad)}
.acts{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border-radius:10px;padding:11px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn.go{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.kbd{font:500 12px/1 var(--mono);color:var(--muted)}
.sessline{display:flex;gap:16px;font:500 13px/1 var(--mono);color:var(--muted);flex-wrap:wrap}
.sessline b{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:480px){.grid{grid-template-columns:repeat(5,1fr)}}
.gc{font:700 13px/1 var(--mono);padding:9px 0;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.gc.done{background:var(--lamp-soft);color:var(--lamp-ink);border-color:transparent}
.gc.cur{border-color:var(--ink);color:var(--ink)}

/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font:800 clamp(48px,12vw,72px)/1 var(--display);letter-spacing:-.03em}
.score .of{font:500 20px/1 var(--mono);color:var(--muted)}
.verdict{font-weight:700}
.breakdown{display:flex;flex-direction:column;gap:8px}
.bd{display:grid;grid-template-columns:44px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bd .l{font:700 13px/1 var(--mono);color:var(--muted)}
.bd .r{font:500 13px/1 var(--mono);text-align:right}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rv.ok{border-left-color:var(--ok)}
.rv .q{font-weight:700}
.rv .a{font-size:14px}
.rv .a .y{color:var(--bad)}
.rv .a .c{color:var(--ok)}
.rv .e{font-size:14px;color:var(--muted)}
.histbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:13px 16px;border-radius:12px;border:1px dashed var(--line);background:transparent}
.histbtn:hover:not([disabled]){border-color:var(--muted)}
.histbtn>span{display:flex;flex-direction:column;gap:3px}
.histbtn b{font:700 16px/1.2 var(--display)}
.histbtn .d{font-size:13px;color:var(--muted)}
.histbtn .arrow{font:700 18px/1 var(--mono);color:var(--muted)}
.histbtn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.sw{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px}
.sw summary{cursor:pointer;font-weight:700}
.sw .review{margin-top:12px}
.exrow{display:flex;gap:10px;flex-wrap:wrap}
.exarea{width:100%;min-height:160px;font:12px/1.4 var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px}
.sel{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-left:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{font-size:13px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.segb.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.hrow{border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow summary{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.hrow summary::-webkit-details-marker{display:none}
.hno{font:700 12px/1 var(--mono);color:var(--muted)}
.hrow.inbook .hno{color:var(--bad)}
.hq{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;min-width:0}
.hn{font:700 13px/1 var(--mono);color:var(--bad)}
.hn small{color:var(--muted);font-weight:500}
.hbody{display:flex;flex-direction:column;gap:6px;padding:0 14px 14px}
.hbody .q{font-weight:700}
.hbody .a{font-size:14px}.hbody .a .y{color:var(--bad)}.hbody .a .c{color:var(--ok)}
.hbody .e{font-size:14px;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const Q=[];
// L1 — Nursing History, Education & Organizations (C Sun). o[0] is always the correct option; shuffled at runtime.
Q.push(
{l:1,s:"p4",q:"The word \"nurse\" comes from the Latin word nutrix / nutria, which means:",o:["To nourish","To heal","To protect","To serve"],e:"Nutrix / nutria = to nourish."},
{l:1,s:"p4",q:"Which of the following is NOT one of the 4 common goals of nursing?",o:["To cure disease","To promote wellness","To prevent illness","To facilitate coping"],e:"The 4 common goals: promote wellness, prevent illness, restore health, facilitate coping. Curing disease is not on the list."},
{l:1,s:"p4",q:"Which of the following IS one of the 4 common goals of nursing?",o:["To restore health","To diagnose disease","To prescribe treatment","To perform surgery"],e:"Promote wellness, prevent illness, restore health, facilitate coping."},
{l:1,s:"p4",tf:1,q:"Nursing developed into a career and profession from an unorganized way of caring for babies and the sick.",a:1,e:"True, word for word from slide 4."},
{l:1,s:"p7",q:"In early civilizations (about 4000 BC), health care was mainly about:",o:["The medicinal value of plants and herbs","Temples that served as health spas","Formal medical education in universities","Hospital nursing schools"],e:"4000 BC = plants and herbs. Temple spas = Ancient Greece. University medical education = Middle Ages."},
{l:1,s:"p7",q:"In Ancient Greece (700 BC), temples built to honour the goddess of health served as:",o:["Health spas rather than hospitals","The first hospitals","Nursing schools","Medical universities"],e:"They were health spas, not hospitals. Nursing was done by women at home."},
{l:1,s:"p7",q:"In Ancient Greece (700 BC), who did the nursing?",o:["Women at home","Male priests in temples","Trained nurses in hospitals","Monks in monasteries"],e:"Slide 7: nursing was done by women at home."},
{l:1,s:"p7",q:"Which statement describes the Middle Ages (11th–12th centuries)?",o:["Medical education in universities became formal, and nursing was seen as a natural nurturing job for women","The first formal nursing schools were founded","Nursing was done only in temples","Hospitals had strict standards for nurses"],e:"Middle Ages: formal medical education in universities; nursing was seen as a natural nurturing job for women."},
{l:1,s:"p8",q:"The oldest hospital in the world still giving medical care on the site where it was first built is:",o:["St Bartholomew's Hospital (1123)","St Thomas' Hospital (1860)","Brunelleschi's Founding Hospital in Florence","Queen Mary Hospital"],e:"St Bartholomew's, 1123. St Thomas' is where the Nightingale school opened in 1860."},
{l:1,s:"p8",q:"In which year was St Bartholomew's Hospital founded?",o:["1123","1860","1400","1899"],e:"1123."},
{l:1,s:"p9",q:"Which statement about the Renaissance (1400–1550) is correct?",o:["There was renewed interest in science, but no formal nursing schools were founded","The first Nightingale school was founded","Nursing was done only by women at home","Temples served as health spas"],e:"Renaissance: renewed interest in science, but still no formal nursing schools."},
{l:1,s:"p9",q:"During the Industrial Revolution (early to mid-1800s), women working in hospitals mainly:",o:["Made beds, scrubbed floors and bathed the poor","Gave medicines under strict standards","Trained in university nursing programmes","Ran community health centres"],e:"Their work was unskilled and there were NO standards for hospital nurses."},
{l:1,s:"p9",tf:1,q:"During the Industrial Revolution there were clear standards for nurses who worked in hospitals.",a:0,e:"False. The slide says there were NO standards for hospital nurses."},
{l:1,s:"p9",q:"The first Nightingale School of Nursing was set up in 1860 at:",o:["St Thomas' Hospital, London","St Bartholomew's Hospital, London","The Founding Hospital, Florence","Geneva, Switzerland"],e:"1860, St Thomas' Hospital, London."},
{l:1,s:"p9",q:"Brunelleschi's Founding Hospital in Florence is described on the slides as:",o:["The first Renaissance masterpiece","The oldest hospital still on its original site","The first nursing school","The headquarters of the ICN"],e:"Slide 9 labels it the first Renaissance masterpiece."},
{l:1,s:"p11",q:"Florence Nightingale lived from:",o:["1820 to 1910","1821 to 1912","1841 to 1930","1867 to 1940"],e:"1820–1910. (1821–1912 = Clara Barton, 1841–1930 = Linda Richards, 1867–1940 = Lillian Wald.)"},
{l:1,s:"p11",q:"Which description of Florence Nightingale is correct?",o:["She came from a wealthy upper-class family in England and was well educated","She came from a poor family and had no formal education","She founded the American Red Cross","She was the first community health nurse"],e:"Wealthy upper-class English family, well educated, felt called by God to help others."},
{l:1,s:"p11",q:"Florence Nightingale is described as the first:",o:["Scientist-theorist and nurse researcher","African American professional nurse","Community health nurse","Nurse to hold an American training-school diploma"],e:"She was the founder of modern nursing and the first scientist-theorist and nurse researcher."},
{l:1,s:"p11",q:"Florence Nightingale's nickname is:",o:["The Lady with the Lamp","The Angel of the Battlefield","The Mother of Public Health","The Lady of the Red Cross"],e:"\"The Lady with the Lamp\"."},
{l:1,s:"p11",q:"Florence Nightingale is known as:",o:["The founder of modern nursing","The founder of public health nursing","The founder of the ICN","The founder of the American Red Cross"],e:"Founder of MODERN nursing. The founder of PUBLIC HEALTH nursing is Lillian Wald."},
{l:1,s:"p12",q:"What was new about the Nightingale Training School of Nurses (1860)?",o:["It taught both theory-based knowledge and clinical skills","It taught only bedside skills","It trained doctors and nurses together","It was a university degree programme"],e:"It was the first nursing school, and it taught both theory and clinical skill building."},
{l:1,s:"p12",q:"Which of the following was NOT one of Nightingale's new beliefs about nursing education?",o:["Nursing knowledge should come from and depend on medical knowledge","A holistic framework that includes both illness and health","A liberal education as the foundation for nursing practice","An environment that promotes healing"],e:"She believed nursing needed its own body of knowledge, DISTINCT from medical knowledge."},
{l:1,s:"p12",tf:1,q:"Nightingale believed nursing needs a body of knowledge that is distinct from medical knowledge.",a:1,e:"True. This is one of her 5 new beliefs about nursing education."},
{l:1,s:"p12",q:"Which of these is one of Nightingale's beliefs about nursing education?",o:["A theoretical basis for nursing practice","Nursing should be learned only through apprenticeship","Nurses should focus only on illness","Nursing education belongs inside medical schools"],e:"Her 5 beliefs: holistic framework (illness AND health), theoretical basis, liberal education, a healing environment, and a distinct body of nursing knowledge."},
{l:1,s:"p13",q:"Who organized the American Red Cross?",o:["Clara Barton","Linda Richards","Mary Mahoney","Lillian Wald"],e:"Clara Barton (1821–1912)."},
{l:1,s:"p13",q:"Who received the first diploma from an American nursing training school?",o:["Linda Richards","Clara Barton","Mary Mahoney","Florence Nightingale"],e:"Linda Richards (1841–1930). She also started keeping nurses' notes and wearing uniforms."},
{l:1,s:"p13",q:"Which nursing leader started the practice of keeping nurses' notes and wearing uniforms?",o:["Linda Richards","Clara Barton","Lillian Wald","Mary Mahoney"],e:"Linda Richards."},
{l:1,s:"p13",q:"Who was the first African American professional nurse?",o:["Mary Mahoney","Linda Richards","Clara Barton","Lillian Wald"],e:"Mary Mahoney (1845–1926). She promoted respect for cultural diversity and equal opportunities."},
{l:1,s:"p13",q:"Which nursing leader is linked with respecting cultural diversity and promoting equal opportunities?",o:["Mary Mahoney","Clara Barton","Linda Richards","Florence Nightingale"],e:"Mary Mahoney, the first African American professional nurse."},
{l:1,s:"p13",q:"Who was the first community health nurse and the founder of public health nursing?",o:["Lillian Wald","Clara Barton","Linda Richards","Mary Mahoney"],e:"Lillian Wald (1867–1940)."},
{l:1,s:"p13",q:"Which pair is correctly matched?",o:["Lillian Wald: founder of public health nursing","Clara Barton: first American training-school diploma","Mary Mahoney: organized the American Red Cross","Linda Richards: first African American professional nurse"],e:"Barton = Red Cross; Richards = first diploma, notes and uniforms; Mahoney = first African American professional nurse; Wald = community / public health nursing."},
{l:1,s:"p14",q:"Professor Sophia Chan is a local nursing leader who was:",o:["Former Secretary for Food and Health (Food & Health Bureau)","Chairperson of the Nursing Council of Hong Kong","President of the Hong Kong Academy of Nursing","Ex-Chief Manager (Nursing) of the Hospital Authority"],e:"Sophia Chan = former Secretary for Food & Health, with a nursing background."},
{l:1,s:"p14",q:"Professor Agnes Tiwari is:",o:["Chairperson of the Nursing Council of Hong Kong","Former Secretary for Food and Health","President of the Hong Kong Academy of Nursing","The first HK nurse to receive the Florence Nightingale Award"],e:"Agnes Tiwari = Chairperson of NCHK."},
{l:1,s:"p14",q:"Who was the first Hong Kong nurse to receive the Florence Nightingale Award?",o:["Prof. Sylvia Fung","Prof. Sophia Chan","Prof. Agnes Tiwari","Ms Cherry Sun"],e:"Sylvia Fung: President of HKAN, first HK recipient of the Florence Nightingale Award, ex-Chief Manager (Nursing) of the HA."},
{l:1,s:"p14",q:"Prof. Sylvia Fung is the President of:",o:["The Hong Kong Academy of Nursing (HKAN)","The Nursing Council of Hong Kong","The College of Nursing, Hong Kong","The International Council of Nurses"],e:"HKAN."},
{l:1,s:"p16",q:"The International Council of Nurses (ICN) is:",o:["A federation of national nurses associations","A union of hospital nurses","Hong Kong's licensing body for nurses","A WHO department"],e:"The ICN is a federation of national nurses associations."},
{l:1,s:"p16",q:"When was the ICN founded, and where is its headquarters?",o:["1899, Geneva, Switzerland","1860, London, UK","1899, New York, USA","1931, Hong Kong"],e:"Founded 1899, headquarters in Geneva."},
{l:1,s:"p16",q:"The ICN was the first international organization for:",o:["Health care professionals","Doctors","Hospital managers","Nursing students"],e:"The first international organization for health care professionals."},
{l:1,s:"p16",q:"Which of the following is NOT a goal of the ICN?",o:["To register and license nurses in each country","To bring nurses' organizations together in a worldwide body","To advance the socio-economic status of nurses","To influence global and domestic health policy"],e:"Registration and licensing are done by national bodies (e.g. NCHK), not the ICN."},
{l:1,s:"p17",q:"The Nursing Council of Hong Kong (NCHK) was formerly called:",o:["The Nursing Board","The Hong Kong Nurses Association","The Government Nurses Association","The Hong Kong Academy of Nursing"],e:"Nursing Board → renamed Nursing Council in 1999."},
{l:1,s:"p17",q:"The Nursing Board was named in 1931 when which law was first enacted?",o:["Nurses Registration Ordinance","Hospital Authority Ordinance","Medical Registration Ordinance","Public Health Ordinance"],e:"Nurses Registration Ordinance, 1931."},
{l:1,s:"p17",q:"In which year was the Nursing Board renamed the Nursing Council of Hong Kong?",o:["1999","1931","1964","2011"],e:"1999. (1931 = named, 1964 = HK Nurses Association, 2011 = HKAN.)"},
{l:1,s:"p17",q:"Which of the following is NOT a main function of the Nursing Council of Hong Kong?",o:["Accrediting nursing specialist training programmes","Registration or enrolment of nurses","Deciding the standards of licensing examinations","Using regulatory and disciplinary powers under the Ordinance"],e:"Specialist training is accredited by HKAN. NCHK accredits programmes for REGISTRATION or ENROLMENT."},
{l:1,s:"p17",q:"Which organization accredits the nursing programmes that lead to registration or enrolment in Hong Kong?",o:["The Nursing Council of Hong Kong","The Hong Kong Academy of Nursing","The Association of Hong Kong Nursing Staff","The International Council of Nurses"],e:"NCHK."},
{l:1,s:"p18",q:"A nurse registered in Australia wants to practise nursing in Hong Kong. According to the case in Lecture 1, they must:",o:["Pass the local licensing examination","Register only with the ICN","Get a letter from the Food & Health Bureau","Complete 45 CNE points"],e:"Nurses with overseas qualifications must pass the NCHK licensing exam before they can practise in HK."},
{l:1,s:"p19",tf:1,q:"Non-locally trained nurses registered in Hong Kong (394 of them) make up less than 1% of local nursing manpower.",a:1,e:"True (on.cc news, 1 Apr 2026)."},
{l:1,s:"p20",q:"The Hong Kong Academy of Nursing (HKAN) is:",o:["An independent institution that organizes, monitors, assesses and accredits all nursing specialist training programmes","The statutory body that registers nurses","A nurses' union","A federation of national nurses associations"],e:"HKAN = specialist training, since 2011, 14 colleges."},
{l:1,s:"p20",q:"HKAN was set up in ___ and has ___ colleges.",o:["2011; 14","1999; 14","2011; 12","1964; 10"],e:"Since 2011; 14 colleges (14 nursing specialties)."},
{l:1,s:"p20",q:"Which of the following is a mission of HKAN?",o:["To legitimize advanced nursing practice","To register enrolled nurses","To act as a trade union for government nurses","To license overseas-trained nurses"],e:"HKAN missions: protect public safety, legitimize advanced nursing practice, raise its visibility, shape health policy, foster cross-disciplinary collaboration, network with global partners."},
{l:1,s:"p20",tf:1,q:"One of HKAN's missions is to protect the safety of the public.",a:1,e:"True. It is HKAN's first listed mission."},
{l:1,s:"p22",q:"The College of Nursing, Hong Kong (CNHK) started in 1964 as:",o:["The Hong Kong Nurses Association","The Nursing Board","The Government Nurses Association","The Hong Kong Academy of Nursing"],e:"CNHK began as the Hong Kong Nurses Association in 1964."},
{l:1,s:"p23",q:"The Association of Hong Kong Nursing Staff was founded in 1977 and was formerly known as:",o:["The Government Nurses Association","The Hong Kong Nurses Association","The Nursing Board","The Nurses Registration Board"],e:"Formerly the Government Nurses Association; it is a nurses' union."},
{l:1,s:"p23",q:"Which local organization is a nurses' union?",o:["Association of Hong Kong Nursing Staff","Nursing Council of Hong Kong","Hong Kong Academy of Nursing","International Council of Nurses"],e:"The Association of HK Nursing Staff (1977) is a union made up of nurses."},
{l:1,s:"p22-23",q:"Put these in order of founding year, from earliest: CNHK (as HK Nurses Association), Association of HK Nursing Staff, HKAN.",o:["1964 → 1977 → 2011","1977 → 1964 → 2011","1964 → 2011 → 1977","2011 → 1977 → 1964"],e:"CNHK 1964, AHKNS 1977, HKAN 2011."},
{l:1,s:"p24",q:"Under the Mandatory CNE system, how many CNE points must a registered nurse (RN) earn in each 3-year cycle?",o:["45","30","60","15"],e:"RN = 45, EN = 30, per 3-year cycle."},
{l:1,s:"p24",q:"Under the Mandatory CNE system, how many CNE points must an enrolled nurse (EN) earn in each 3-year cycle?",o:["30","45","20","60"],e:"EN = 30 points in 3 years."},
{l:1,s:"p24",q:"The Mandatory CNE requirement applies to practising certificates that take effect from:",o:["1 January 2030","1 January 2026","1 September 2027","1 January 2031"],e:"1 Jan 2030."},
{l:1,s:"p24",q:"The CNE cycle under the Mandatory CNE system lasts:",o:["3 years","1 year","2 years","5 years"],e:"3-year cycle."},
{l:1,s:"p24",q:"Which of the following is NOT listed as an administrator of CNE under the Mandatory CNE system?",o:["International Council of Nurses","Hospital Authority","Department of Health","Hong Kong Association of Gerontology"],e:"Listed: HA, DH, AHKNS, CNHK, Health Care Section of Correctional Services Dept, HKAN&M, Nu Pro Nurse Centre, HK Association of Gerontology."},
{l:1,s:"p26",q:"Put these nursing qualifications in order from lowest to highest:",o:["Diploma → Associate Degree → Baccalaureate → Master → Doctoral","Associate Degree → Diploma → Baccalaureate → Doctoral → Master","Diploma → Baccalaureate → Associate Degree → Master → Doctoral","Baccalaureate → Diploma → Associate Degree → Master → Doctoral"],e:"Diploma / Higher Diploma → Associate Degree → Baccalaureate → Master / MPhil → Doctoral / PhD."},
{l:1,s:"p27",q:"Diploma / Higher Diploma nursing programmes started in ___ and were run by ___.",o:["1873; hospitals","1952; community colleges","1909; universities","1979; universities"],e:"Diploma: since 1873, run by hospitals, 2–3 years, leads to EN or RN."},
{l:1,s:"p27",q:"Associate Degree nursing programmes started in ___ and were run by ___.",o:["1952; community colleges","1873; hospitals","1909; universities","1960s; universities"],e:"Associate Degree: since 1952, community colleges, 2 years, \"technically competent\"."},
{l:1,s:"p27",q:"Baccalaureate nursing programmes started in:",o:["1909","1873","1952","1979"],e:"Baccalaureate: since 1909, universities, 5 years, RN."},
{l:1,s:"p27",q:"According to the table in Lecture 1, a Baccalaureate nursing programme lasts:",o:["5 years","2 years","3 years","2–3 years"],e:"5 years (like our BNurs)."},
{l:1,s:"p27",q:"What do you need to enter a Master (Graduate Entry) nursing programme?",o:["A degree in a subject other than nursing","A BN / BSN","An MN","A DSE only"],e:"Graduate Entry Master: non-nurse degree, since 1979, 3 years, leads to RN."},
{l:1,s:"p27",q:"The Master (Graduate Entry) programme started in ___ and lasts ___.",o:["1979; 3 years","1950s; 2–3 years","1960s; 3–5 years","1909; 5 years"],e:"1979; 3 years."},
{l:1,s:"p27",q:"What do you need to enter a Master programme (not graduate entry)?",o:["A BN / BSN","A non-nurse degree","A DSE","An MN"],e:"Master: entry with BN / BSN, since the 1950s, 2–3 years → advanced practice nurse in a special area."},
{l:1,s:"p27",q:"The expected outcome of a (non-graduate-entry) Master programme is:",o:["An advanced practice nurse prepared in a special area","A nurse technically competent to plan, direct and implement care","A leader for advanced clinical practice, education, administration and research","A nurse clinically competent to plan, direct and implement care"],e:"Master = advanced practice nurse in a special area. Doctoral = leaders."},
{l:1,s:"p27",q:"Doctoral nursing programmes started in the ___ and last ___.",o:["1960s; 3–5 years","1950s; 2–3 years","1979; 3 years","1909; 5 years"],e:"Doctoral: 1960s, universities, 3–5 years, entry with an MN."},
{l:1,s:"p27",q:"The expected outcome of a Doctoral nursing programme is:",o:["Leaders for advanced clinical practice, education, administration and research","An advanced practice nurse in a special area","A nurse professionally prepared for health promotion and disease prevention","A technically competent nurse"],e:"Doctoral = leaders."},
{l:1,s:"p27",q:"Which programme's outcome is described as \"technically competent to plan, direct and implement care\"?",o:["Associate Degree","Diploma / Higher Diploma","Baccalaureate","Master"],e:"Associate Degree = TECHNICALLY competent. Diploma = CLINICALLY competent."},
{l:1,s:"p27",q:"Which programme's outcome is described as \"clinically competent to plan, direct and implement care\"?",o:["Diploma / Higher Diploma","Associate Degree","Baccalaureate","Doctoral"],e:"Diploma = CLINICALLY competent."},
{l:1,s:"p27",q:"Which TWO programmes both aim to produce a nurse \"professionally prepared to plan, implement and coordinate care, health promotion and disease prevention\"?",o:["Baccalaureate and Master (Graduate Entry)","Diploma and Associate Degree","Master and Doctoral","Associate Degree and Baccalaureate"],e:"Both Baccalaureate and Graduate Entry Master lead to RN with the same outcome wording."},
{l:1,s:"p27",q:"What do you need to enter a Doctoral nursing programme, according to the table?",o:["An MN","A BN / BSN","A non-nurse degree","A DSE"],e:"Doctoral entry = MN."},
{l:1,s:"p27",tf:1,q:"A Diploma / Higher Diploma programme can lead to becoming either an EN or an RN.",a:1,e:"True. Licentiate for Diploma = EN or RN."},
{l:1,s:"p28",q:"Online learning, simulation and virtual reality are examples of which trend in nursing education?",o:["Technology-assisted learning","Problem-based learning","Evidence-based practice","Interdisciplinary learning"],e:"Technology-assisted learning."},
{l:1,s:"p28",q:"Tutorial discussions and clinical PBL are examples of:",o:["Problem-based learning","Practice-based competency learning","Performance-based learning","Technology-assisted learning"],e:"PBL: accountability for patient care / safety, critical thinking, self-responsibility, communication and negotiation."},
{l:1,s:"p28",q:"Which of the following is NOT a listed benefit of problem-based learning?",o:["Memorizing drug doses faster","Better critical thinking and problem solving","More awareness of self-responsibility","Better communication and negotiation skills"],e:"PBL benefits: accountability for patient care / safety, critical thinking and problem solving, self-responsibility, communication and negotiation."},
{l:1,s:"p29",q:"OSCA is an example of which trend in contemporary nursing education?",o:["Practice-based competency learning","Problem-based learning","Evidence-based practice","Technology-assisted learning"],e:"Practice-based competency learning: nursing is a practising profession; applications include OSCA and presentations."},
{l:1,s:"p29",q:"According to the slides, practice gives about what % learning retention?",o:["~75%","~50%","~25%","~90%"],e:"About 75%."},
{l:1,s:"p29",q:"Performance examinations, clinical practicum assessment and portfolio documentation are examples of:",o:["Performance-based / outcome-based learning","Practice-based competency learning","Problem-based learning","Team-based learning"],e:"Performance / outcome-based learning uses expected learning outcomes and assessment guides / rubrics."},
{l:1,s:"p29",q:"Which trend in nursing education relies on expected learning outcomes and an assessment guide or rubric?",o:["Performance-based / outcome-based learning","Evidence-based practice","Problem-based learning","Technology-assisted learning"],e:"Performance / outcome-based learning."},
{l:1,s:"p30",q:"Changing from oral / rectal to tympanic temperature, and from hand washing to alcohol hand rub, are examples of:",o:["Evidence-based practice","Technology-assisted learning","Problem-based learning","Interdisciplinary learning"],e:"EBP: using research findings in practice changes how skills are done."},
{l:1,s:"p31",q:"Inter-professional Education (IPE) and PCP are examples of which trend?",o:["Interdisciplinary / team-based learning","Evidence-based practice","Performance-based learning","Problem-based learning"],e:"Interdisciplinary / team-based learning = learning together with other disciplines."},
{l:1,s:"p35",q:"Health care in the community to promote wellness, prevent illness and/or do early screening is:",o:["Primary health care","Secondary health care","Tertiary health care","Quaternary health care"],e:"Primary = community, promotion, prevention, screening."},
{l:1,s:"p35",q:"Short-term treatment of a brief but serious illness, in outpatient or inpatient settings, is:",o:["Secondary health care","Primary health care","Tertiary health care","Community health care"],e:"Secondary = short-term treatment, outpatient or inpatient."},
{l:1,s:"p35",q:"Specialized consultative care for advanced investigation and treatment, high cost, intensive, inpatient only, is:",o:["Tertiary health care","Secondary health care","Primary health care","Community health care"],e:"Tertiary = specialized, high cost, intensive, INPATIENT only."},
{l:1,s:"p35",q:"A woman has a free cervical screening test at a District Health Centre. Which level of health care is this?",o:["Primary","Secondary","Tertiary","None of these"],e:"Screening in the community = primary."},
{l:1,s:"p35",q:"A patient with severe burns is admitted to a specialized burns ICU for intensive treatment. Which level of health care is this?",o:["Tertiary","Secondary","Primary","Community"],e:"Specialized, high cost, intensive, inpatient = tertiary."},
{l:1,s:"p35",q:"A man with appendicitis has an appendicectomy and goes home 3 days later. Which level of health care is this?",o:["Secondary","Primary","Tertiary","Community"],e:"Short-term treatment of a brief but serious illness = secondary."},
{l:1,s:"p35",tf:1,q:"Tertiary health care can be given in either outpatient or inpatient settings.",a:0,e:"False. Tertiary = INPATIENT setting. It is SECONDARY care that can be outpatient or inpatient."},
{l:1,s:"p39",q:"Which of the following is NOT one of the sociocultural factors that shaped the development of nursing?",o:["Climate","Religion","Gender","Technological advancement"],e:"The 6 factors: religion, gender, historical events (wars, revolutions), education and literacy, social movements and public perception, technological advancement."},
{l:1,s:"p39",q:"Wars and revolutions belong to which sociocultural factor that shaped nursing?",o:["Historical events","Social movements and public perception","Religion","Technological advancement"],e:"Historical events: wars, revolutions."},
{l:1,s:"p39",q:"Which of the following IS one of the sociocultural factors that shaped the development of nursing?",o:["Education and literacy","Stock market changes","Climate","Population density"],e:"Religion, gender, historical events, education and literacy, social movements and public perception, technological advancement."}
);

// L2 — Fundamental Patterns of Knowing in Nursing (C Sun)
Q.push(
{l:2,s:"p4",q:"Who proposed the 4 fundamental patterns of knowing in nursing, and in which year?",o:["Carper, 1978","Nightingale, 1860","Watson, 1985","Flexner, 1915"],e:"Barbara Carper, 1978. (Flexner 1915 = criteria of a profession, in L3.)"},
{l:2,s:"p9",q:"Which of the following is NOT one of Carper's 4 fundamental patterns of knowing?",o:["Intuitive knowing","Empirics","Aesthetics","Ethics"],e:"The 4 patterns: Empirics, Aesthetics, Personal knowledge, Ethics."},
{l:2,s:"p9",q:"In Carper's patterns of knowing, \"Empirics\" is also called:",o:["The science of nursing","The art of nursing","The moral component","Tacit knowledge"],e:"Empirics = science; Aesthetics = art; Ethics = moral."},
{l:2,s:"p9",q:"In Carper's patterns of knowing, \"Aesthetics\" is also called:",o:["The art of nursing","The science of nursing","The moral component","Personal growth"],e:"Aesthetics = art of nursing."},
{l:2,s:"p9",q:"In Carper's patterns of knowing, which pattern is the moral component?",o:["Ethics","Empirics","Aesthetics","Personal knowledge"],e:"Ethics = moral."},
{l:2,s:"p3",q:"Which statement about the fundamental patterns of knowing is correct?",o:["They give the discipline its own perspective and bring all forms of nursing knowledge together in an integrated way","They show that nursing knowledge is the same as medical knowledge","They only matter to nursing researchers","They replace clinical guidelines"],e:"The patterns give nursing its own perspective, integrate all forms of knowledge, and are essential for teaching and learning nursing."},
{l:2,s:"p3",tf:1,q:"According to Lecture 2, what nurses should know has historically been communicated well.",a:0,e:"False. Historically, what nurses should know has NOT been communicated well."},
{l:2,s:"p4",q:"Which of the following is NOT part of Carper's view of nursing (1978)?",o:["Diagnosing and treating medical diseases","Advocacy in the care of individuals, families, groups and communities","Facilitation of healing","Prevention of illness and injury"],e:"Carper's view: care of individuals, families and communities; interaction; advocacy; facilitation of healing; prevention of illness and injury; promotion and optimization of health."},
{l:2,s:"p5",q:"In the \"NURSE\" acronym on the ways of knowing slide, what does the \"U\" stand for?",o:["Universal","Understanding","Unique","Unity"],e:"N-U-R-S-E = Nurture, Universal, Responsible, Smart, Educated."},
{l:2,s:"p5",q:"In the \"NURSE\" acronym on the ways of knowing slide, what does the \"S\" stand for?",o:["Smart","Safe","Skilled","Science"],e:"Nurture, Universal, Responsible, Smart, Educated."},
{l:2,s:"p10",q:"Empirics is best described as:",o:["Behaviours based on experience and observation; applying theory to practice","The use of self to comfort and support patients","Deciding what is morally right or wrong","Tacit knowledge gained from reflection"],e:"Empirics = based on experience and observation; applying theory to practice; systematically organized knowledge."},
{l:2,s:"p10",q:"Empirics says nursing needs systematically organized knowledge in order to:",o:["Describe, explain and predict phenomena","Comfort, support and strengthen patients","Decide what ought to be done","Build a nurse–patient relationship"],e:"Describe, explain and predict phenomena."},
{l:2,s:"p10",q:"According to Lecture 2, the science of nursing is a combination of:",o:["Performance, skills and knowledge","Caring, compassion and conscience","Obligations, codes and values","Intuition, reflection and experience"],e:"Science of nursing = performance, skills, knowledge."},
{l:2,s:"p11",q:"Which of the following is NOT listed as a way the science of nursing shapes our practice?",o:["Personal intuition","Nursing research","Evidence-based practice","Organization's guidelines and protocols"],e:"4 ways: nursing research, EBP, nursing education, organization's guidelines and protocols."},
{l:2,s:"p12",q:"In the St Teresa's Hospital case, a patient took a neighbouring patient's drugs. What was the main nursing error?",o:["The nurse did not check the patient's name and wristband before giving the drugs","The doctor wrote the wrong prescription","The pharmacy gave out the wrong drugs","The patient took drugs from home"],e:"The nurse did not match the name and wristband (右手帶). This is failure to check the right patient."},
{l:2,s:"p12",q:"Under the Code of Practice for private hospitals, a sentinel or serious untoward event must be reported to the Department of Health within ___, with a detailed report within ___.",o:["24 hours; 4 weeks","48 hours; 2 weeks","24 hours; 2 weeks","12 hours; 1 month"],e:"24 hours to notify, 4 weeks for the full report."},
{l:2,s:"p13",q:"The \"Guide to Good Nursing Practice\" (2017) that turns science into practice was published by:",o:["The Nursing Council of Hong Kong","The Hospital Authority","The International Council of Nurses","The Hong Kong Academy of Nursing"],e:"NCHK, 2017."},
{l:2,s:"p14",q:"Leung, Chong and Arthur (2007) proposed a new model of drug administration based on:",o:["Two checks and five rights","Three checks and five rights","Three checks and seven rights","One check and five rights"],e:"They kept the 5 rights but cut the 3 checks down to 2."},
{l:2,s:"p14",q:"In Leung et al. (2007), why did many nurses see \"three checks and five rights\" as impractical?",o:["Time constraints, manpower shortage and heavy workloads","Poor computer systems","Patients refused to be checked","Doctors did not allow it"],e:"Time constraints, manpower shortage, heavy workloads."},
{l:2,s:"p14",q:"Which research design did Leung et al. (2007) use?",o:["Mixed method (quantitative and qualitative)","Randomized controlled trial only","Qualitative only","Systematic review"],e:"Mixed method: incident review, focus groups, questionnaires, observation, interviews."},
{l:2,s:"p14",q:"Which of the following was NOT a common cause of medication errors found by Leung et al. (2007)?",o:["Patients refusing medication","Not following policies or procedures","Doctors' writing that is hard to read","Distractions"],e:"Causes found: not following policies, illegible writing, wrong transcription of times, not checking the right patient, wrong drug identification, distractions."},
{l:2,s:"p14",tf:1,q:"Leung et al. (2007) found that the \"five rights\" are appropriate for preventing medication errors.",a:1,e:"True. The data supported the 5 rights; only the 3 checks were reduced to 2."},
{l:2,s:"p15",q:"\"The use of self and the relationship with patients to inform, comfort, support and strengthen\" (Barnard, 1985) describes:",o:["Aesthetics","Empirics","Ethics","Personal knowledge"],e:"Aesthetics (art of nursing)."},
{l:2,s:"p15",q:"Which highly valued qualities make up the art of nursing?",o:["Caring, compassion, conscience and communication","Competence, critical thinking and evidence","Obligations, duties and codes","Research, education and protocols"],e:"The art of nursing = caring, compassion, conscience, communication."},
{l:2,s:"p15",tf:1,q:"According to Lecture 2, caring is a mutually beneficial experience for both the patient and the nurse.",a:1,e:"True (Aesthetics slide)."},
{l:2,s:"p15",q:"Individualizing care to protect, nurture and promote health, and being creative in designing effective nursing, belong to:",o:["Aesthetics","Empirics","Ethics","Personal knowledge"],e:"Aesthetics = individualized care and creativity."},
{l:2,s:"p16",q:"\"Maybe this one moment, with this one patient, is the very reason we're here on earth at this time\" was said by:",o:["Dr Jean Watson","Florence Nightingale","Barbara Carper","Lillian Wald"],e:"Jean Watson (caring theory), quoted under the Art of Nursing."},
{l:2,s:"p18",q:"A care home sets up a hospice room where family can stay with a dying resident and nurses give massage and bathing. This best shows:",o:["Aesthetics (art of nursing)","Empirics (science of nursing)","Justice","Veracity"],e:"Individualized, compassionate care that protects dignity = art of nursing."},
{l:2,s:"p21",q:"At Queen Mary Hospital, staff helped hold a wedding on the ward so that a critically ill mother could see her daughter get married. This is an example of:",o:["The art of nursing (aesthetics)","The science of nursing (empirics)","Non-maleficence","Evidence-based practice"],e:"Caring and compassion = art of nursing."},
{l:2,s:"p22",q:"In the Science vs Art table, \"critical thinking\" belongs to:",o:["Science","Art"],e:"Science: nursing process, knowledge of disease process, critical thinking, EBP, competence."},
{l:2,s:"p22",q:"In the Science vs Art table, \"holistic care\" belongs to:",o:["Art","Science"],e:"Art: caring, compassion, conscience, engaging, effective communication, positive interaction, holistic care."},
{l:2,s:"p22",q:"In the Science vs Art table, \"the nursing process\" belongs to:",o:["Science","Art"],e:"Nursing process = science."},
{l:2,s:"p22",q:"In the Science vs Art table, \"effective communication\" belongs to:",o:["Art","Science"],e:"Effective communication = art."},
{l:2,s:"p22",q:"In the Science vs Art table, \"competence\" belongs to:",o:["Science","Art"],e:"Competence = science."},
{l:2,s:"p22",q:"In the Science vs Art table, \"conscience\" belongs to:",o:["Art","Science"],e:"Conscience = art. Watch out: this is not \"competence\"."},
{l:2,s:"p22",q:"Which of the following belongs to the SCIENCE of nursing in the Science vs Art table?",o:["Knowledge of disease process","Compassion","Positive interaction","Engaging"],e:"Science: nursing process, knowledge of disease process, critical thinking, EBP, competence."},
{l:2,s:"p22",q:"Which of the following belongs to the ART of nursing in the Science vs Art table?",o:["Positive interaction","Evidence-based practice","Critical thinking","Competence"],e:"Art: caring, compassion, conscience, engaging, effective communication, positive interaction, holistic care."},
{l:2,s:"p22",tf:1,q:"Lecture 2 concludes that the science of nursing is more important than the art of nursing.",a:0,e:"False. \"Art and science are both important to nursing!!!\""},
{l:2,s:"p23-24",q:"Peter, 2 years old, has a bowel obstruction and cannot say when he is in pain. Using a pain scale to score his pain and giving pain medication belongs to:",o:["Science","Art"],e:"Science: pain management, hydration, nutrition, monitoring."},
{l:2,s:"p24",q:"In Peter's case, using visual aids, gestures and play-based tools to understand his needs is an example of:",o:["Art (communication)","Science (monitoring)","Science (pain management)","Ethics (autonomy)"],e:"Art: communication, family engagement, emotional support, empathy and trust building."},
{l:2,s:"p24",q:"In Peter's case, regularly checking bowel sounds, abdominal distension and vital signs is an example of:",o:["Science (monitoring)","Art (empathy)","Art (emotional support)","Art (family engagement)"],e:"Monitoring = science."},
{l:2,s:"p24",q:"In Peter's case, letting him choose which toy to hold during procedures is meant to:",o:["Build trust and autonomy and reduce fear (art)","Monitor complications (science)","Manage pain (science)","Get family involved (art)"],e:"Offering choices = empathy and trust building (art)."},
{l:2,s:"p24",q:"In Peter's case, working with dietitians to slowly bring back oral intake once his bowels work again is:",o:["Nutrition (science)","Emotional support (art)","Family engagement (art)","Communication (art)"],e:"Nutrition = science."},
{l:2,s:"p24",q:"In Peter's case, involving the family in care planning and daily routines to reduce their anxiety is:",o:["Family engagement (art)","Monitoring (science)","Hydration (science)","Pain management (science)"],e:"Family engagement = art."},
{l:2,s:"p24",q:"In Peter's case, monitoring intake / output and signs of dehydration is:",o:["Hydration (science)","Emotional support (art)","Communication (art)","Empathy (art)"],e:"Hydration = science."},
{l:2,s:"p24",q:"In Peter's case, letting him have familiar items such as toys and blankets to comfort him is:",o:["Emotional support (art)","Nutrition (science)","Monitoring (science)","Pain management (science)"],e:"Emotional support = art."},
{l:2,s:"p25",q:"In nursing, effective personal knowledge is a mix of:",o:["Basic knowledge, tacit and experiential knowledge from clinical activities, and scientific / intellectual knowledge","Only textbook knowledge","Only ethical codes","Only intuition"],e:"Personal knowledge = basic + tacit / experiential (from clinical activities) + scientific / intellectual knowledge."},
{l:2,s:"p25",q:"To help nurses gain tacit knowledge, the education and health systems need:",o:["A culture of collaborative knowledge acquisition","More written examinations","Stricter disciplinary rules","Separate training for each profession"],e:"A collaborative knowledge acquisition culture."},
{l:2,s:"p25",q:"According to Lecture 2, what are the reasons for gaining personal knowledge?",o:["Personal growth and professional excellence","Higher salary and promotion","Passing licensing exams","Avoiding legal liability"],e:"Personal growth and professional excellence."},
{l:2,s:"p25",tf:1,q:"Personal knowledge shows in correct decision-making and clinical practice.",a:1,e:"True."},
{l:2,s:"p26",q:"Which of the following is NOT listed as a way of turning knowing into knowledge?",o:["Rote memorization","Problem-based learning","Clinical supervision","Structured reflection on practice"],e:"3 ways: PBL, clinical supervision, structured reflection (Johns, 1994)."},
{l:2,s:"p26",q:"\"An exchange between practising professionals to develop professional knowledge and skills\" defines:",o:["Clinical supervision","Problem-based learning","Structured reflection","Evidence-based practice"],e:"Clinical supervision."},
{l:2,s:"p26",q:"The model of structured reflection, where learning comes from experience, was developed by:",o:["Johns (1994)","Carper (1978)","Barnard (1985)","Flexner (1915)"],e:"Johns, 1994."},
{l:2,s:"p26",q:"Problem-based learning is described as a teaching method in which students:",o:["Work in small groups to gain knowledge and problem-solving skills","Learn alone from lectures","Only practise clinical skills","Are supervised one-to-one by a nurse"],e:"PBL = small groups."},
{l:2,s:"p27",q:"In Hassanian et al. (2018), how did students gain THEORETICAL nursing knowledge?",o:["By using books and validated articles","By spending time in clinical areas","By combining knowledge with clinical performance","By online arguments"],e:"Theoretical = books and validated articles; clinical = time in the sectors; experience = combining knowledge with performance."},
{l:2,s:"p27",q:"In Hassanian et al. (2018), \"nursing experiences\" were built up by:",o:["Combining knowledge with performance in clinical practice","Reading validated articles","Attending lectures","Watching videos"],e:"Experience = knowledge + performance in clinical practice."},
{l:2,s:"p27",q:"Which research method did Hassanian et al. (2018) use?",o:["Grounded theory","Randomized controlled trial","Systematic review","Case study"],e:"Grounded theory (29 participants: 17 students, 12 teachers)."},
{l:2,s:"p29",q:"At Kowloon Hospital, a permanent tracheostomy was mistaken for a temporary stoma and covered with gauze. The inquiry said the main problem was:",o:["Staff lacked enough professional knowledge","Staff tried to cover up the event","The patient refused care","The equipment was faulty"],e:"Staff lacked the professional knowledge to see the stoma was permanent and the patient's only airway. No evidence of a cover-up."},
{l:2,s:"p30",q:"At Princess Margaret Hospital, a patient's nasogastric tube was found in the lung two days after a nurse re-inserted it. This case is mainly about a gap in:",o:["Professional knowledge and competence","Aesthetics","Veracity","Justice"],e:"It is used in L2 to show why knowledge / competence matters for safe practice."},
{l:2,s:"p31",q:"A nurse removed a catheter while the patient was sitting on a chair, and the patient died. What risk does this position increase?",o:["Venous air embolism","Pulmonary oedema","Hypoglycaemia","Pressure injury"],e:"Venous air embolism."},
{l:2,s:"p31",q:"In the catheter-removal case, the Nursing Council cut the nurse's suspension from ___ to ___ months.",o:["6; 5","12; 6","5; 3","6; 3"],e:"From 6 to 5 months, because of his clear record and mitigation."},
{l:2,s:"p31",q:"In the catheter-removal case, the nurse was accused of failing to:",o:["Ensure individual safety and be responsible and accountable for nursing judgments","Get consent for the procedure","Report the incident within 24 hours","Delegate the task to a HCA"],e:"He did not follow standard practice (a safety failure) and did not know the risk (an accountability failure)."},
{l:2,s:"p32",q:"Ethics is defined as:",o:["A branch of philosophy that develops reasonable procedures for deciding what is morally right or wrong","Behaviours based on experience and observation","The use of self to comfort patients","Knowledge gained through reflection"],e:"Ethics = branch of philosophy about moral right and wrong; a set of standards for what one ought to do."},
{l:2,s:"p32",q:"When do moral dilemmas arise?",o:["In situations of ambiguity and uncertainty","Only when laws are broken","Only in end-of-life care","When there is enough information"],e:"Ambiguity and uncertainty."},
{l:2,s:"p33",q:"Which of the following is NOT listed as a focus of ethics in nursing?",o:["Making a medical diagnosis","Nurses' obligation: what ought to be done","Ethical codes of nursing","Facing and resolving conflicting values, norms, interests or principles"],e:"Focus: obligations, ethical codes, resolving conflicting values."},
{l:2,s:"p34",q:"Why do nurses need to understand ethics?",o:["Nurses face many ethical dilemmas, and ethics helps them see difficult cases clearly and make wise decisions","So they can give legal advice to patients","To replace hospital policies","Because doctors make all ethical decisions"],e:"Nurses meet many dilemmas and families turn to nurses; ethics helps them make wise decisions."},
{l:2,s:"p35",q:"\"To do good; to benefit the patient\" is the ethical principle of:",o:["Beneficence","Non-maleficence","Fidelity","Justice"],e:"Beneficence."},
{l:2,s:"p35",q:"\"Do no harm; prevent harm\" is the ethical principle of:",o:["Non-maleficence","Beneficence","Veracity","Autonomy"],e:"Non-maleficence."},
{l:2,s:"p35",q:"\"Freedom of choice; the right to self-determination\" is the ethical principle of:",o:["Autonomy","Justice","Fidelity","Confidentiality"],e:"Autonomy. This includes informed consent, and in children, consent through guardians."},
{l:2,s:"p35",q:"\"Fair and equal treatment; fairness in resource allocation\" is the ethical principle of:",o:["Justice","Beneficence","Fidelity","Autonomy"],e:"Justice."},
{l:2,s:"p35",q:"\"Telling the truth; giving full and accurate information\" is the ethical principle of:",o:["Veracity","Fidelity","Confidentiality","Autonomy"],e:"Veracity."},
{l:2,s:"p35",q:"\"Keeping promises and commitments\" is the ethical principle of:",o:["Fidelity","Veracity","Justice","Beneficence"],e:"Fidelity. Veracity = truth; fidelity = promises."},
{l:2,s:"p35",q:"A nurse promised to come back in 15 minutes to help a patient walk, and does so on time. Which principle is this?",o:["Fidelity","Veracity","Autonomy","Justice"],e:"Keeping a promise = fidelity."},
{l:2,s:"p35",q:"A nurse cares for a homeless patient to the same standard as a VIP patient. Which principle is this?",o:["Justice","Beneficence","Fidelity","Veracity"],e:"Equitable care regardless of background = justice."},
{l:2,s:"p35",q:"A nurse respects a competent patient's informed decision to refuse a blood transfusion. Which principle is this?",o:["Autonomy","Beneficence","Non-maleficence","Fidelity"],e:"Respecting the patient's decision and informed consent = autonomy."},
{l:2,s:"p35",q:"A nurse does not discuss a patient's HIV status in the hospital lift. Which principle is this?",o:["Confidentiality","Veracity","Justice","Fidelity"],e:"Protecting private information = confidentiality."},
{l:2,s:"p35",q:"A nurse puts up cot rails and checks the fall risk of a confused older patient. Which principle is this mainly about?",o:["Non-maleficence","Autonomy","Veracity","Justice"],e:"Preventing harm and safe practice = non-maleficence."},
{l:2,s:"p35",q:"Communicating honestly about diagnosis, treatment and prognosis is how which principle is put into practice?",o:["Veracity","Fidelity","Beneficence","Autonomy"],e:"Veracity."},
{l:2,s:"p35",q:"Following through on care plans and agreements to keep the patient's trust is how which principle is put into practice?",o:["Fidelity","Justice","Veracity","Confidentiality"],e:"Fidelity."},
{l:2,s:"p35",q:"How many ethical principles for nurses are listed in the Lecture 2 table?",o:["7","4","5","6"],e:"7: Beneficence, Non-maleficence, Autonomy, Justice, Veracity, Confidentiality, Fidelity."},
{l:2,s:"p36",q:"Mr Chan, 68, has end-stage oesophageal cancer and wants to know his prognosis. His family asks you not to tell him. Which TWO principles are in conflict?",o:["Veracity vs Beneficence","Justice vs Autonomy","Fidelity vs Confidentiality","Non-maleficence vs Justice"],e:"The slide labels Case 1: Veracity vs Beneficence."},
{l:2,s:"p37",q:"Case 2: one donor organ, three possible recipients (a lonely 68-year-old widower, a man jailed 3 years ago, a fresh graduate with first-class honours). Which TWO principles are in conflict?",o:["Justice vs Beneficence","Veracity vs Beneficence","Autonomy vs Fidelity","Confidentiality vs Justice"],e:"The slide labels Case 2: Justice vs Beneficence."}
);

// L3 — Nursing as a Profession / Discipline, Roles, Appearance (M Lam)
Q.push(
{l:3,s:"p3",q:"The goal of the nursing DISCIPLINE is to:",o:["Expand knowledge about human experiences through creative conceptualization and research","Provide service to humankind by living the art of the science","Regulate standards of practice and education","Register and license nurses"],e:"Discipline = expand KNOWLEDGE (research, academic settings). Profession = provide SERVICE."},
{l:3,s:"p4",q:"The goal of the nursing PROFESSION is to:",o:["Provide service to humankind by living the art of the science","Expand knowledge through creative conceptualization and research","Create theories in academic settings","Replace medical care"],e:"Profession = service to humankind."},
{l:3,s:"p3",q:"According to Lecture 3, where is discipline-specific nursing knowledge born and fostered?",o:["In academic settings, where research and education move knowledge into new realms","In hospital wards only","In government departments","In professional unions"],e:"Academic settings."},
{l:3,s:"p4",q:"Members of the nursing profession are responsible for regulating standards of practice and education based on disciplinary knowledge that reflects safe health service to society in:",o:["All settings","Hospital settings only","Community settings only","Private settings only"],e:"In ALL settings."},
{l:3,s:"p5",q:"Which statement describes a DISCIPLINE (not a profession)?",o:["A field or body of knowledge, skills and practices, found in existing frameworks and theories","A group of people who apply knowledge and are recognized by society","Practice according to nationally regulated standards","Members who hold practising certificates"],e:"Discipline = the body of knowledge. Profession = the group of people applying it, recognized by society and nationally regulated."},
{l:3,s:"p5",q:"Which statement describes a PROFESSION (not a discipline)?",o:["A group of individuals who apply the knowledge and skills, recognized by society, under nationally regulated standards","A body of knowledge in extant frameworks and theories","Knowledge about bio-psycho-social and spiritual well-being","The ethical principles of nursing"],e:"Profession = group of individuals, applying, recognized, regulated."},
{l:3,s:"p7",q:"Who described the criteria of a profession in 1915?",o:["Flexner (sociologist)","Carper","Nightingale","Watson"],e:"Sociologist Flexner, 1915."},
{l:3,s:"p7",q:"Which of the following is NOT one of Flexner's (1915) features of a profession?",o:["A short on-the-job apprenticeship","A body of knowledge developed and refined through research","Highly specialized professional education","A strong internal organization of members"],e:"Flexner: specialized intellectual study and training, a research-based body of knowledge, specialized education, high individual responsibility, strong internal organization."},
{l:3,s:"p7",q:"According to Lecture 3, a profession is a combination of:",o:["Expertise, autonomy, commitment and responsibility","Caring, compassion, competence and communication","Empirics, aesthetics, ethics and personal knowledge","Assessment, diagnosis, planning and evaluation"],e:"Expertise, Autonomy, Commitment, Responsibility (repeated in the Summary)."},
{l:3,s:"p8",q:"Professionalism is described as:",o:["A process of becoming a professional","A fixed title given at graduation","The same thing as an occupation","A legal licence"],e:"Professionalism = professional character, attributes, expected conduct; a PROCESS of becoming a professional."},
{l:3,s:"p8",q:"Which of the following does NOT separate a profession from an occupation?",o:["Being paid a salary","A code of ethics","Autonomy","Ongoing research"],e:"Features that separate a profession from an occupation: specialized training, service orientation, ongoing research, code of ethics, autonomy, professional organization."},
{l:3,s:"p9",q:"According to Lecture 3, a profession is autonomous if:",o:["It regulates itself and sets standards for its members","It is managed by the government","Its members work alone","It follows doctors' orders"],e:"Autonomy = self-regulation + setting standards."},
{l:3,s:"p9",q:"For nursing to have professional status, it must be given legal authority to:",o:["Define its scope of practice, describe its functions and roles, and set its goals and responsibilities","Prescribe all medications","Run hospitals","Train doctors"],e:"Legal authority to define scope, describe functions and roles, determine goals and responsibilities."},
{l:3,s:"p10",q:"In Lecture 3, the art of nursing is grounded on:",o:["Perception and the caring experience connecting nurse and patient","Evidence-based practice","Objective assessment","Research data"],e:"Art = perception and caring experience. Science = EBP and objective assessment."},
{l:3,s:"p10",q:"In Lecture 3, the science of nursing refers to:",o:["Evidence-based practice and objective assessments","Perception and caring experience","Compassion and courage","Personal values"],e:"Science = EBP + objective assessment."},
{l:3,s:"p12",q:"In the framework that applies art and science to nursing, what sits at the centre as the identity of nursing?",o:["Caring","Curing","Research","Leadership"],e:"Caring: a conscious commitment to the art of caring as the identity of nursing."},
{l:3,s:"p13",q:"The \"6 Cs\" in nursing are:",o:["Care, Compassion, Competence, Communication, Courage, Commitment","Care, Cure, Competence, Communication, Confidence, Commitment","Caring, Compassion, Conscience, Communication, Courage, Collaboration","Care, Compassion, Critical thinking, Communication, Courage, Consent"],e:"Care, Compassion, Competence, Communication, Courage, Commitment."},
{l:3,s:"p13",q:"The 6 Cs are described as a:",o:["Set of values","Set of legal rules","Set of clinical skills","Nursing process"],e:"A set of values for health care professions, essential to compassionate care."},
{l:3,s:"p14",q:"Which C is described as \"intelligent kindness\", given through relationships based on empathy, respect and dignity?",o:["Compassion","Care","Courage","Commitment"],e:"Compassion."},
{l:3,s:"p14",q:"Which C is described as \"our core business\" that defines us and our work?",o:["Care","Compassion","Competence","Commitment"],e:"Care."},
{l:3,s:"p15",q:"Which C means having the ability to understand an individual's health and social needs, and the expertise and knowledge to give effective, evidence-based care?",o:["Competence","Communication","Care","Courage"],e:"Competence."},
{l:3,s:"p15",q:"Which C is central to caring relationships and effective teamwork, and includes listening?",o:["Communication","Compassion","Commitment","Competence"],e:"Communication."},
{l:3,s:"p16",q:"Which C lets us do the right thing, speak up for patients' rights, and innovate?",o:["Courage","Commitment","Compassion","Competence"],e:"Courage."},
{l:3,s:"p16",q:"Which C is \"a strong promise to our patients and populations\" and a cornerstone of what we do?",o:["Commitment","Courage","Care","Communication"],e:"Commitment."},
{l:3,s:"p16",q:"A nurse speaks up when a senior colleague is about to skip a safety check. Which of the 6 Cs is this?",o:["Courage","Care","Competence","Commitment"],e:"Doing the right thing and speaking up = courage."},
{l:3,s:"p18",q:"According to WHO (2024), health is:",o:["A state of complete physical, mental and social well-being and not merely the absence of disease or infirmity","The absence of disease","A state of complete physical fitness","The ability to work"],e:"WHO definition. Absence of disease ≠ healthy."},
{l:3,s:"p18",tf:1,q:"Being free of disease is the same as being healthy.",a:0,e:"False. Absence of disease ≠ healthy; health is a continuum."},
{l:3,s:"p18",tf:1,q:"Lecture 3 describes health as a continuum.",a:1,e:"True."},
{l:3,s:"p20",q:"Holism sees health as a systemic model in which which factors are interlinked?",o:["Biological, psychological and social","Only biological","Only psychological","Economic and political"],e:"Multiple biological, psychological and social factors are interlinked."},
{l:3,s:"p20",q:"The goal of holistic care is to:",o:["Put the patient in the best condition for nature to act upon him","Cure the disease as fast as possible","Reduce hospital costs","Follow the doctor's orders exactly"],e:"A Nightingale-style goal: put the patient in the BEST condition for nature to act upon him."},
{l:3,s:"p20",q:"To implement holistic care, the nurse should consider:",o:["Physical, psychological, social, spiritual and ethical aspects","Physical aspects only","Only what the doctor ordered","Only what the family wants"],e:"See the patient as a WHOLE."},
{l:3,s:"p21",q:"\"The body as a machine; disease as the result of a breakdown; the physician's task is to repair the machine\" describes:",o:["The disease-centred approach","The client-centred approach","Holistic care","The nursing process"],e:"Disease-centred approach."},
{l:3,s:"p21",q:"\"Care given with dignity, respecting the patient's preferences, needs and values, which guide all clinical decisions\" describes:",o:["The client-centred approach","The disease-centred approach","The biomedical model","Delegation"],e:"Client-centred approach: care tailored to the individual."},
{l:3,s:"p21",q:"In the disease-centred approach, what decides the treatment strategy?",o:["Knowing the disease","The patient's values","The family's wishes","The nurse's intuition"],e:"Knowing the disease determines the treatment strategy."},
{l:3,s:"p22",q:"Which of the following is NOT one of the 4 dimensions of nursing practice?",o:["Advocacy","Practice","Professional development","Scientific inquiry"],e:"The 4 dimensions: Practice, Professional development, Collaboration, Scientific inquiry."},
{l:3,s:"p22",q:"\"Evaluates and improves the quality and effectiveness of nursing practice; uses research in practice\" belongs to which dimension of nursing practice?",o:["Scientific inquiry","Practice","Collaboration","Professional development"],e:"Scientific inquiry."},
{l:3,s:"p22",q:"\"Effectively uses the nursing process in various settings, uses resources, and makes decisions ethically\" belongs to which dimension?",o:["Practice","Scientific inquiry","Professional development","Collaboration"],e:"Practice."},
{l:3,s:"p22",q:"\"Evaluates own nursing practice, gets and uses current knowledge, and contributes to the profession's development\" belongs to which dimension?",o:["Professional development","Practice","Collaboration","Scientific inquiry"],e:"Professional development."},
{l:3,s:"p22",q:"\"Collaborates with clients and health care providers\" belongs to which dimension?",o:["Collaboration","Practice","Professional development","Scientific inquiry"],e:"Collaboration."},
{l:3,s:"p23",q:"The Standards of Professional Nursing PRACTICE describe competent nursing care shown through which critical thinking model?",o:["The nursing process","The 6 Cs","Carper's patterns of knowing","The 5 rights of delegation"],e:"The nursing process: assessment, diagnosis, outcomes identification and planning, implementation, evaluation (Potter, 2025)."},
{l:3,s:"p23",q:"Which is the correct order of the nursing process in the Standards of Practice?",o:["Assessment → diagnosis → outcomes identification and planning → implementation → evaluation","Diagnosis → assessment → planning → evaluation → implementation","Planning → assessment → diagnosis → implementation → evaluation","Assessment → planning → diagnosis → implementation → evaluation"],e:"A-D-P-I-E."},
{l:3,s:"p23",q:"The Standards of Professional PERFORMANCE describe:",o:["A competent level of behaviour in the professional nursing role","A competent level of care shown through the nursing process","The legal scope of practice","The licensing exam content"],e:"Performance = BEHAVIOUR in the role. Practice = CARE through the nursing process."},
{l:3,s:"p24",q:"Which organization's standards (2021) list the Standards of Professional Performance used in Lecture 3?",o:["American Nurses Association","Nursing Council of Hong Kong","International Council of Nurses","World Health Organization"],e:"ANA, 2021."},
{l:3,s:"p24",q:"Which of the following is NOT one of the Standards of Professional Performance (ANA, 2021)?",o:["Diagnosis","Ethics","Resource stewardship","Environmental health"],e:"Diagnosis is part of the nursing process (Standards of PRACTICE). Performance: ethics, advocacy, respect and equitable practice, communication, collaboration, leadership, education, scholarly inquiry, quality of practice, professional practice evaluation, resource stewardship, environmental health."},
{l:3,s:"p24",q:"Which of the following IS one of the Standards of Professional Performance (ANA, 2021)?",o:["Scholarly inquiry","Implementation","Assessment","Evaluation"],e:"Assessment, implementation and evaluation belong to the Standards of Practice (nursing process)."},
{l:3,s:"p24",q:"How many Standards of Professional Performance are listed (ANA, 2021)?",o:["12","6","5","10"],e:"12."},
{l:3,s:"p26",q:"Professional nurses are accountable for their actions and must follow established standards of practice, ethical guidelines and legal requirements, such as:",o:["The Scope of Professional Practice and the Code of Professional Conduct","Hospital visiting hours","Doctors' personal preferences","The ICN constitution only"],e:"Scope of Professional Practice and Code of Professional Conduct (NCHK)."},
{l:3,s:"p27",q:"Nurses are accountable to which three parties?",o:["Patients / clients, employers and the Nursing Council","Doctors, patients and family","Government, hospital and union","Patients, colleagues and ICN"],e:"1) Patients / clients 2) Employers 3) Nursing Council."},
{l:3,s:"p27",tf:1,q:"Nurses are personally accountable for both their actions and their omissions in professional practice.",a:1,e:"True. Nurses are accountable for action AND omission, and must justify their decisions."},
{l:3,s:"p27",q:"Which statement about accountability is correct?",o:["Nurses must give reasons for their practice and justify decisions within legislation, standards, EBP and ethics","Accountability transfers to the doctor who wrote the order","Nurses are accountable only for actions, not omissions","Accountability applies only to senior nurses"],e:"Nurses give reasons, are personally accountable (action and omission), and decide within legislation, professional standards, EBP and ethical conduct."},
{l:3,s:"p29",q:"The statutory bodies for Hong Kong nurses were set up under which law?",o:["Nurses Registration Ordinance","Hospital Authority Ordinance","Medical Registration Ordinance","Midwives Ordinance only"],e:"Nurses Registration Ordinance → NCHK and the Midwives Council of Hong Kong."},
{l:3,s:"p29",q:"Which TWO statutory bodies regulate nurses and midwives in Hong Kong?",o:["Nursing Council of HK and Midwives Council of HK","HKAN and CNHK","ICN and NCHK","Hospital Authority and Department of Health"],e:"NCHK + Midwives Council of HK."},
{l:3,s:"p29",tf:1,q:"An RN, a registered midwife or an EN may practise in Hong Kong only if they hold a valid practising certificate issued by the relevant council.",a:1,e:"True."},
{l:3,s:"p30",q:"Which TWO documents make up NCHK's \"Guides to Good Nursing Practice\"?",o:["Code of Ethics and Professional Conduct, and Scope of Professional Practice","The 6 Cs and the nursing process","ANA standards and ICN code","Nurses Registration Ordinance and the HA Ordinance"],e:"Code of Ethics and Professional Conduct + Scope of Professional Practice."},
{l:3,s:"p31",q:"What are the 4 domains of the NCHK Code of Ethics and Professional Conduct?",o:["Nurse and People, Nurse and Practice, Nurse and the Profession, Nurse and Society","Nurse and Patient, Nurse and Doctor, Nurse and Hospital, Nurse and Government","Beneficence, Non-maleficence, Autonomy, Justice","Practice, Professional development, Collaboration, Scientific inquiry"],e:"People, Practice, Profession, Society."},
{l:3,s:"p31",q:"In which year was the NCHK Code of Ethics and Professional Conduct quoted in Lecture 3 published?",o:["2015","2017","1999","2021"],e:"NCHK, 2015. (Guide to Good Nursing Practice = 2017; ANA standards = 2021.)"},
{l:3,s:"p32",q:"\"Safeguard the individual's right to self-determination\" falls under which domain of the NCHK Code?",o:["Nurses and People","Nurses and Practice","Nurses and the Profession","Nurses and Society"],e:"Nurses and People: items 1–3 (dignity, self-determination, confidentiality)."},
{l:3,s:"p32",q:"\"Hold in confidence personal information obtained in a professional capacity\" falls under:",o:["Nurses and People","Nurses and Society","Nurses and the Profession","Nurses and Practice"],e:"Nurses and People (item 3)."},
{l:3,s:"p32",q:"\"Provide safe and competent practice\" falls under:",o:["Nurses and Practice","Nurses and People","Nurses and the Profession","Nurses and Society"],e:"Nurses and Practice: items 4–6 (safe and competent practice, maintain standards, collaborate)."},
{l:3,s:"p32",q:"\"Collaborate with colleagues, co-workers and stakeholders to meet the goal of quality care\" falls under:",o:["Nurses and Practice","Nurses and Society","Nurses and People","Nurses and the Profession"],e:"Nurses and Practice (item 6)."},
{l:3,s:"p33",q:"\"Uphold the image of nurses and the profession\" falls under:",o:["Nurses and the Profession","Nurses and Practice","Nurses and Society","Nurses and People"],e:"Nurses and the Profession: items 7–9 (image, trust, professional growth)."},
{l:3,s:"p33",q:"\"Foster the trust inherent in the privileged relationship between nurses and their clients\" falls under:",o:["Nurses and the Profession","Nurses and People","Nurses and Practice","Nurses and Society"],e:"Nurses and the Profession (item 8). This is easy to confuse with People."},
{l:3,s:"p33",q:"\"Commit to promote professional growth and advancement\" falls under:",o:["Nurses and the Profession","Nurses and Practice","Nurses and People","Nurses and Society"],e:"Nurses and the Profession (item 9)."},
{l:3,s:"p33",q:"\"Ensure that health care resources are allocated in a fair and equitable manner\" falls under:",o:["Nurses and Society","Nurses and Practice","Nurses and the Profession","Nurses and People"],e:"Nurses and Society: items 10–11 (community health through partnership, fair allocation of resources)."},
{l:3,s:"p33",q:"\"Promote community health and well-being through partnership\" falls under:",o:["Nurses and Society","Nurses and People","Nurses and Practice","Nurses and the Profession"],e:"Nurses and Society (item 10)."},
{l:3,s:"p32-33",q:"How many items are in the NCHK Code of Ethics and Professional Conduct?",o:["11","4","7","12"],e:"11 items in 4 domains (3 + 3 + 3 + 2)."},
