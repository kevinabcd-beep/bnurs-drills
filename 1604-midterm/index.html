  document.getElementById("sel-none").onclick=()=>{S.sel=[];save();home();};
  document.getElementById("m-practice").onclick=()=>start("practice");
  document.getElementById("m-mock").onclick=()=>start("mock");
  document.getElementById("m-book").onclick=()=>start("book");
  document.getElementById("reset").onclick=()=>{
    document.getElementById("reset-zone").innerHTML=`<span class="confirm">Clear all progress and the wrong-answers list? <button class="btn warn" id="reset-yes">Clear</button><button class="btn" id="reset-no">Cancel</button></span>`;
    document.getElementById("reset-yes").onclick=()=>{S.q={};S.resetAt=Date.now();save();schedulePush(0);home();};
    document.getElementById("reset-no").onclick=home;
  };
  window.scrollTo(0,0);
}

/* ---------- PICKING ---------- */
function weight(q){
  const x=S.q[q.id];
  if(!x||!x.n)return 4;
  if(x.b)return 6;
  return 1/(1+x.s);
}
function pickPractice(){
  const p=pool(), recent=new Set(quiz.recent);
  let cands=p.filter(q=>!recent.has(q.id));if(!cands.length)cands=p;
  let tot=0;const w=cands.map(q=>{const v=weight(q);tot+=v;return v;});
  let r=Math.random()*tot;for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0)return cands[i];}
  return cands[cands.length-1];
}
function proportional(p,N){
  const by={};p.forEach(q=>(by[q.l]=by[q.l]||[]).push(q));
  const ls=Object.keys(by), out=[], alloc={};let used=0;N=Math.min(N,p.length);
  ls.forEach(l=>{alloc[l]=Math.max(1,Math.floor(N*by[l].length/p.length));used+=alloc[l];});
  while(used>N){const l=ls.reduce((a,b)=>alloc[a]>=alloc[b]?a:b);alloc[l]--;used--;}
  const order=shuffle(ls);let i=0;while(used<N){const l=order[i++%order.length];if(alloc[l]<by[l].length){alloc[l]++;used++;}}
  ls.forEach(l=>out.push(...shuffle(by[l]).slice(0,alloc[l])));
  return shuffle(out);
}
function mockSet(){
  const p=pool();
  const A=proportional(p.filter(isObj),MOCK_A);
  const saq=shuffle(p.filter(q=>kind(q)==="saq")), other=shuffle(p.filter(q=>kind(q)==="fill"||kind(q)==="num"));
  const nS=Math.min(2,saq.length);let B=saq.slice(0,nS).concat(other.slice(0,MOCK_B-nS));
  if(B.length<MOCK_B)B=B.concat(saq.slice(nS,nS+MOCK_B-B.length));
  return A.concat(shuffle(B));
}

/* ---------- QUIZ ---------- */
function start(mode){
  quiz={mode,items:[],idx:0,right:0,done:0,recent:[]};
  if(mode==="mock"){
    quiz.items=mockSet().map(mkItem);
    quiz.nA=quiz.items.filter(x=>isObj(x.q)).length;
    quiz.startAt=Date.now();quiz.deadline=quiz.startAt+MOCK_MIN*60*1000;
    timerId=setInterval(tick,1000);
  }else if(mode==="book"){
    quiz.items=shuffle(bookList()).map(mkItem);
  }else{
    quiz.items=[mkItem(pickPractice())];
  }
  render();
}
function tick(){
  const left=quiz.deadline-Date.now();
  const el=document.getElementById("timer");
  if(left<=0){finishMock();return;}
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=m+":"+String(s).padStart(2,"0");el.classList.toggle("low",left<5*60000);}
}
function finish(it,ok){
  it.fin=true;it.ok=ok;record(it.q,ok);quiz.done++;if(ok)quiz.right++;
  quiz.recent.push(it.q.id);if(quiz.recent.length>25)quiz.recent.shift();
}
function render(){
  view="quiz";
  const it=quiz.items[quiz.idx], q=it.q, mock=quiz.mode==="mock", k=kind(q);
  const total=quiz.items.length;
  let progTxt, pct;
  if(quiz.mode==="practice"){progTxt=`#${quiz.done+(it.fin?0:1)} · ${quiz.right}/${quiz.done} right`;pct=0;}
  else if(mock){const a=quiz.items.filter(answered).length;progTxt=`${quiz.idx<quiz.nA?"A":"B"} · Q${quiz.idx+1} of ${total} · ${a} answered`;pct=a/total*100;}
  else{progTxt=`${quiz.idx+1} of ${total} · ${quiz.right} right`;pct=(quiz.idx+(it.fin?1:0))/total*100;}
  const modeName={practice:"Endless practice",mock:"Mock test",book:"Redo wrong answers"}[quiz.mode];
  let h=`<div class="qbar"><button class="home" id="exit">← Home</button>
    <div class="prog"><div class="row"><span>${modeName}</span><span>${progTxt}</span></div>${quiz.mode==="practice"?"":`<div class="track"><i style="width:${pct}%"></i></div>`}</div>
    ${mock?`<span class="timer" id="timer">${MOCK_MIN}:00</span>`:""}</div>`;
  h+=`<article class="card"><div class="qmeta"><span class="tag">${lab(q.l)}</span><span class="tag plain">slide ${esc(q.s)}</span>${TYPE_TAG[k]?`<span class="tag tf">${TYPE_TAG[k]}</span>`:""}</div>
    <h2 class="qtext">${esc(q.q)}</h2>`;
  const reveal=it.fin&&!mock;
  if(isObj(q)){
    h+=`<div class="opts" role="group" aria-label="Answer options">`;
    it.opts.forEach((o,i)=>{
      let cls="opt";
      if(reveal){if(o.c)cls+=" right";else if(i===it.ch)cls+=" wrong";}
      else if(i===it.ch)cls+=" sel";
      h+=`<button class="${cls}" data-i="${i}" ${reveal?"disabled":""}><span class="k">${"ABCD"[i]||i+1}</span><span class="tx">${esc(o.t)}</span></button>`;
    });
    h+=`</div>`;
    if(reveal){const ans=it.opts.find(o=>o.c).t;h+=`<div class="fb ${it.ok?"ok":"no"}"><span class="h">${it.ok?"Correct":"Wrong. Answer: "+esc(ans)}</span><span>${esc(q.e)}</span></div>`;}
  }else if(k==="fill"||k==="num"){
    h+=`<div class="ansrow"><input class="ans ${reveal?(it.ok?"right":"wrong"):""}" id="ans" type="text" ${k==="num"?`inputmode="decimal"`:""} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${k==="num"?"Your answer"+(q.unit?" ("+esc(q.unit)+")":""):"Type the word(s)"}" value="${esc(it.txt)}" ${reveal?"disabled":""}>${!mock&&!reveal?`<button class="btn go" id="check">Check</button>`:""}</div>`;
    if(reveal)h+=`<div class="fb ${it.ok?"ok":"no"}"><span class="h">${it.ok?"Correct":"Not quite. Answer: "+esc(rightAnswer(q))}</span>${!it.ok&&k==="fill"&&q.ans.length>1?`<span class="kbd">Also accepted: ${q.ans.slice(1).map(esc).join(" · ")}</span>`:""}<span>${esc(q.e)}</span></div>`;
  }else{ // saq
    h+=`<textarea class="ans long" id="ans" rows="6" placeholder="Write your answer here (or on paper / in your head), then reveal the model answer." ${it.rev&&!mock?"disabled":""}>${esc(it.txt)}</textarea>`;
    if(!mock&&it.rev)h+=saqMarking(it,"m-");
  }
  h+=`<div class="acts">`;
  if(mock){
    h+=`<button class="btn" id="prev" ${quiz.idx?"":"disabled"}>← Previous</button>`;
    h+=quiz.idx<total-1?`<button class="btn go" id="next">Next →</button>`:`<button class="btn go" id="submit">Submit test</button>`;
  }else{
    if(k==="saq"&&!it.rev)h+=`<span class="kbd">Answer first, then reveal</span><button class="btn go" id="reveal">Show model answer</button>`;
    else if(k==="saq"&&!it.fin)h+=`<span class="kbd">Tick what you covered</span><button class="btn go" id="mark">Save my mark</button>`;
    else{
      h+=`<span class="kbd">${reveal?"Enter = next":isObj(q)?"Keys A–D or 1–4":"Enter = check"}</span>`;
      if(reveal)h+=`<button class="btn go" id="next">${quiz.mode==="book"&&quiz.idx>=total-1?"Finish":"Next →"}</button>`;
    }
  }
  h+=`</div></article>`;
  if(mock){
    h+=`<section class="sec"><div class="sec-head"><span class="eyebrow">Jump to question · A = MCQ/TF · B = short answer</span><span id="sub-zone"><button class="link" id="submit2">Submit early</button></span></div><div class="grid">`;
    quiz.items.forEach((x,i)=>{h+=`<button class="gc ${answered(x)?"done":""} ${i===quiz.idx?"cur":""}" data-j="${i}">${i<quiz.nA?i+1:"B"+(i-quiz.nA+1)}</button>`;});
    h+=`</div></section>`;
  }
  app.innerHTML=h;
  if(mock)tick();
  document.getElementById("exit").onclick=()=>{if(mock){confirmExit();}else home();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const inp=document.getElementById("ans");
  if(inp){inp.oninput=()=>{it.txt=inp.value;if(mock){const g=app.querySelector(`.gc[data-j="${quiz.idx}"]`);if(g)g.classList.toggle("done",answered(it));}};
    if(!mock&&!it.fin&&!it.rev&&window.matchMedia("(pointer:fine)").matches)inp.focus();}
  const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  bind("check",check);bind("next",next);bind("reveal",()=>{it.rev=true;render();});
  bind("mark",()=>{finish(it,q.points.every((_,i)=>it.ticks[i]));render();});
  bind("prev",()=>{quiz.idx--;render();});bind("submit",confirmSubmit);bind("submit2",confirmSubmit);
  app.querySelectorAll(".pt input").forEach(c=>c.onchange=()=>{it.ticks[+c.dataset.p]=c.checked;});
  app.querySelectorAll(".gc").forEach(b=>b.onclick=()=>{quiz.idx=+b.dataset.j;render();});
}
function saqMarking(it,pre){
  const q=it.q;
  let h=`<div class="model"><span class="eyebrow">Model answer</span><p>${esc(q.model)}</p></div><div class="pts"><span class="eyebrow">Marking points — tick each one your answer covered</span>`;
  q.points.forEach((p,i)=>{h+=`<label class="pt"><input type="checkbox" data-p="${i}" data-it="${pre}" ${it.ticks[i]?"checked":""} ${it.fin?"disabled":""}><span>${esc(p)}</span></label>`;});
  h+=`</div>`;
  if(it.fin&&quiz&&quiz.mode!=="mock")h+=`<div class="fb ${it.ok?"ok":"no"}"><span class="h">${it.ok?"All points covered":"Some points missing, so it goes on the wrong-answers list"}</span><span>${esc(q.e)}</span></div>`;
  return h;
}
function check(){
  const it=quiz.items[quiz.idx];if(it.fin)return;
  const inp=document.getElementById("ans");if(inp)it.txt=inp.value;
  if(!it.txt.trim())return;
  finish(it,autoMark(it.q,it.txt));render();
  const fb=app.querySelector(".fb");if(fb)fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function confirmSubmit(){
  const un=quiz.items.filter(x=>!answered(x)).length;
  const z=document.getElementById("sub-zone");
  z.innerHTML=`<span class="confirm">${un?un+" unanswered. ":""}Submit now? <button class="btn go" id="sub-yes">Submit</button><button class="btn" id="sub-no">Keep going</button></span>`;
  document.getElementById("sub-yes").onclick=finishMock;
  document.getElementById("sub-no").onclick=render;
  z.scrollIntoView({block:"nearest"});
}
function confirmExit(){
  const z=document.getElementById("sub-zone");
  z.innerHTML=`<span class="confirm">Leave the mock test? Your answers will not be saved. <button class="btn warn" id="ex-yes">Leave</button><button class="btn" id="ex-no">Stay</button></span>`;
  document.getElementById("ex-yes").onclick=home;
  document.getElementById("ex-no").onclick=render;
  z.scrollIntoView({block:"nearest"});
}
function choose(i){
  const it=quiz.items[quiz.idx];
  if(quiz.mode==="mock"){it.ch=i;render();return;}
  if(it.fin)return;
  it.ch=i;finish(it,it.opts[i].c);
  render();
  const fb=app.querySelector(".fb");if(fb)fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){
  if(quiz.mode==="mock"){quiz.idx++;render();return;}
  const it=quiz.items[quiz.idx];if(!it.fin)return;
  if(quiz.mode==="practice"){quiz.items.push(mkItem(pickPractice()));if(quiz.items.length>60)quiz.items.shift();quiz.idx=quiz.items.length-1;render();window.scrollTo(0,0);return;}
  if(quiz.idx<quiz.items.length-1){quiz.idx++;render();window.scrollTo(0,0);}
  else bookDone();
}
function bookDone(){
  view="result";
  const left=bookList().length;
  app.innerHTML=`<article class="card"><span class="eyebrow">Round complete</span><div class="score"><span class="big num">${quiz.right}</span><span class="of">/ ${quiz.items.length} right</span></div>
  <p>${left?`<b>${left}</b> question${left>1?"s are":" is"} still on the wrong-answers list. You need to get each one right twice in a row to clear it.`:"The wrong-answers list is empty."}</p>
  <div class="acts">${left?`<button class="btn go" id="again">Go again</button>`:""}<button class="btn" id="back">Home</button></div></article>`;
  const a=document.getElementById("again");if(a)a.onclick=()=>start("book");
  document.getElementById("back").onclick=home;
}
function finishMock(){
  clearInterval(timerId);view="result";
  const its=quiz.items, nA=quiz.nA, used=Math.max(1,Math.round((Date.now()-quiz.startAt)/60000));
  let rA=0;const per={};
  its.forEach(x=>{
    const k=kind(x.q);
    if(isObj(x.q)){x.ok=x.ch!==null&&x.opts[x.ch].c;if(x.ok)rA++;record(x.q,x.ok);}
    else if(k!=="saq"){x.ok=autoMark(x.q,x.txt);record(x.q,x.ok);}
    else x.ok=null;
    if(x.ok!==null){const l=x.q.l;(per[l]=per[l]||[0,0]);per[l][1]++;if(x.ok)per[l][0]++;}
  });
  const pct=Math.round(rA/nA*100);
  const verdict=pct>=85?"Ready for the MCQ part.":pct>=70?"Solid. Go over the wrong ones below.":pct>=50?"Borderline. Do more practice on your weakest lectures.":"Not yet. Start with endless practice on one lecture at a time.";
  const saqs=its.filter(x=>kind(x.q)==="saq");
  let marked=!saqs.length;
  function bScore(){let s=0;its.slice(nA).forEach(x=>{if(kind(x.q)==="saq")s+=x.ticks.filter(Boolean).length/x.q.points.length;else if(x.ok)s++;});return Math.round(s*10)/10;}
  let h=`<div class="qbar"><button class="home" id="exit">← Home</button><div class="prog"><div class="row"><span>Mock test result</span><span>${used} min used</span></div></div></div>
  <article class="card"><div class="score"><span class="big num">${rA}</span><span class="of">/ ${nA} MCQ/TF · ${pct}%</span></div><p class="verdict">${verdict}</p>
  <p class="num" id="bline"></p>
  <div class="breakdown">`;
  Object.keys(per).sort((a,b)=>a-b).forEach(l=>{const [a,b]=per[l];h+=`<div class="bd"><span class="l">${lab(+l)}</span><span class="bar" style="height:8px"><i class="m" style="width:${a/b*100}%"></i><i class="w" style="width:${(b-a)/b*100}%"></i></span><span class="r">${a}/${b}</span></div>`;});
  h+=`</div><div class="acts"><button class="btn go" id="again">New mock test</button><button class="btn" id="back">Home</button></div></article>`;
  if(saqs.length){
    h+=`<section class="sec"><div class="sec-head"><h2>Mark your short answers</h2></div>`;
    saqs.forEach((x,i)=>{h+=`<article class="card"><span class="eyebrow">${lab(x.q.l)} · slide ${esc(x.q.s)}</span><h3 class="qtext" style="font-size:18px">${esc(x.q.q)}</h3>
      <div class="yours"><span class="eyebrow">Your answer</span><p>${x.txt.trim()?esc(x.txt):"<i>(no answer)</i>"}</p></div>${saqMarking(x,"s"+i+"-")}</article>`;});
    h+=`<div class="acts"><span class="kbd" id="mark-note">Short answers aren't counted until you save your marks.</span><button class="btn go" id="save-marks">Save marks</button></div></section>`;
  }
  h+=`<section class="sec"><div class="sec-head"><h2>Review</h2><button class="link" id="toggle">Show all</button></div><div class="review" id="rv"></div></section>`;
  app.innerHTML=h;
  function bLine(){document.getElementById("bline").textContent=`Short answer (B): ${marked?bScore():"?"} / ${its.length-nA}${marked?"":" — mark your short answers below"}`;}
  bLine();
  saqs.forEach((x,i)=>{app.querySelectorAll(`.pt input[data-it="s${i}-"]`).forEach(c=>c.onchange=()=>{x.ticks[+c.dataset.p]=c.checked;});});
  const sm=document.getElementById("save-marks");
  if(sm)sm.onclick=()=>{
    if(marked)return;marked=true;
    saqs.forEach(x=>{x.ok=x.q.points.every((_,i)=>x.ticks[i]);record(x.q,x.ok);});
    app.querySelectorAll(".pt input").forEach(c=>c.disabled=true);
    sm.disabled=true;document.getElementById("mark-note").textContent="Saved. Any short answer with a missing point is now on the wrong-answers list.";bLine();list();
  };
  let showAll=false;
  function list(){
    const rv=document.getElementById("rv");let s="";
    its.forEach((x,i)=>{const k=kind(x.q);if(k==="saq")return;const ok=x.ok;if(ok&&!showAll)return;
      const ans=rightAnswer(x.q), yours=isObj(x.q)?(x.ch===null?"(no answer)":x.opts[x.ch].t):(x.txt.trim()||"(no answer)");
      s+=`<div class="rv ${ok?"ok":""}"><span class="eyebrow">${i<nA?"Q"+(i+1):"B"+(i-nA+1)} · ${lab(x.q.l)} · slide ${esc(x.q.s)}</span><span class="q">${esc(x.q.q)}</span>
      <span class="a">${ok?`<span class="c">✓ ${esc(ans)}</span>`:`<span class="y">✗ Your answer: ${esc(yours)}</span><br><span class="c">✓ ${esc(ans)}</span>`}</span><span class="e">${esc(x.q.e)}</span></div>`;});
    rv.innerHTML=s||`<div class="empty">All correct.</div>`;
    document.getElementById("toggle").textContent=showAll?"Wrong ones only":"Show all";
  }
  list();
  document.getElementById("toggle").onclick=()=>{showAll=!showAll;list();};
  document.getElementById("again").onclick=()=>start("mock");
  document.getElementById("back").onclick=home;
  document.getElementById("exit").onclick=home;
  quiz={mode:"done",items:[]};window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!quiz||!quiz.items.length||e.metaKey||e.ctrlKey||e.altKey)return;
  const it=quiz.items[quiz.idx];if(!it)return;
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="TEXTAREA")return;
  if(tag==="INPUT"&&e.target.type==="text"){
    if(e.key==="Enter"){e.preventDefault();if(quiz.mode==="mock"){if(quiz.idx<quiz.items.length-1){quiz.idx++;render();}}else if(!it.fin)check();else next();}
    return;
  }
  const k=e.key.toLowerCase();const map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(isObj(it.q)&&k in map&&map[k]<it.opts.length&&(quiz.mode==="mock"||!it.fin)){e.preventDefault();choose(map[k]);}
  else if(k==="enter"&&it.fin&&quiz.mode!=="mock"){e.preventDefault();next();}
  else if(quiz.mode==="mock"&&(k==="arrowright"||k==="enter")&&quiz.idx<quiz.items.length-1){e.preventDefault();quiz.idx++;render();}
  else if(quiz.mode==="mock"&&k==="arrowleft"&&quiz.idx>0){e.preventDefault();quiz.idx--;render();}
});
home();
})();
</script>

</body></html>
