{l:9,s:"p12",q:"An aqueous solution (aq) is:",o:["A solution in which water is the solvent","A solution with no water","A solid mixture","A gas dissolved in fat"],e:"Water = solvent. All major body fluids: blood, lymph, urine, saliva."},
{l:9,s:"p12",q:"Solution, solute or solvent? Glucose in blood.",o:["Solute","Solvent","Solution"],e:"Solute."},
{l:9,s:"p12",q:"Solution, solute or solvent? Water in body fluids.",o:["Solvent","Solute","Solution"],e:"Solvent — \"the universal biological solvent\"."},
{l:9,s:"p12",q:"Solution, solute or solvent? Blood plasma.",o:["Solution","Solute","Solvent"],e:"Solution (plasma, cytosol)."},
{l:9,s:"p14",q:"Mass/volume percent (m/v) is calculated as:",o:["(mass of solute in g ÷ volume of solution in mL) × 100%","(volume of solute ÷ volume of solution) × 100%","moles of solute ÷ litres of solution","(mass of solute ÷ mass of solvent) × 100%"],e:"m/v = g solute / mL solution × 100%."},
{l:9,s:"p14",q:"Molarity (M) is:",o:["Moles of solute per litre of solution","Grams of solute per 100 mL","mL of solute per 100 mL","Moles of solute per kg of solvent"],e:"M = mol / L of solution."},
{l:9,s:"p14",q:"0.9% saline means:",o:["0.9 g NaCl in 100 mL of solution","0.9 g NaCl in 1 L","9 g NaCl in 100 mL","0.9 mL NaCl in 100 mL"],e:"m/v: 0.9 g / 100 mL."},
{l:9,s:"p14",q:"70% rubbing alcohol (v/v) means:",o:["70 mL isopropanol in 100 mL of solution","70 g isopropanol in 100 mL","70 mL isopropanol in 1 L","70 mL isopropanol added to 100 mL water"],e:"v/v: 70 mL solute / 100 mL solution."},
{l:9,s:"p14",q:"1.0 M glucose means:",o:["1 mole (180 g) of glucose per litre of solution","180 g glucose per 100 mL","1 g glucose per litre","1 mole of glucose per 100 mL"],e:"1 mol glucose = 180 g, per L."},
{l:9,s:"p14",q:"Which concentration unit is used for clinical solutions and IV drips?",o:["Mass/volume % (m/v)","Volume/volume % (v/v)","Molarity (M)","Parts per million"],e:"m/v for IV fluids; v/v for dilute liquid solutes (alcohol, acids); molarity for chemical calculations."},
{l:9,s:"p14",q:"Which concentration unit is used for dilute LIQUID solutes such as alcohol?",o:["Volume/volume % (v/v)","Mass/volume % (m/v)","Molarity","mmol/L"],e:"v/v."},
{l:9,s:"p15",q:"D5W is a 5% (m/v) dextrose solution. This means:",o:["5 g of dextrose in 100 mL of solution","5 g of dextrose in 1 L","5 mg of dextrose in 100 mL","5 parts dextrose to 100 parts water by mass"],e:"In-class exercise answer A."},
{l:9,s:"p15",type:"num",q:"A disinfectant is 10% (v/v) isopropyl alcohol. How many mL of pure isopropyl alcohol are in a 500 mL bottle?",ans:50,tol:0.5,unit:"mL",e:"10 mL per 100 mL × 500 mL = 50 mL (in-class exercise, answer B)."},
{l:9,s:"p14",type:"num",q:"How many grams of NaCl are in 1 L (1000 mL) of 0.9% (m/v) saline?",ans:9,tol:0.05,unit:"g",e:"0.9 g per 100 mL × 1000 mL = 9 g."},
{l:9,s:"p15",type:"num",q:"How many grams of dextrose are in a 250 mL bag of D5W (5% m/v)?",ans:12.5,tol:0.05,unit:"g",e:"5 g / 100 mL × 250 mL = 12.5 g."},
{l:9,s:"p14",type:"num",q:"How many mL of isopropanol are in 200 mL of 70% (v/v) rubbing alcohol?",ans:140,tol:0.5,unit:"mL",e:"70/100 × 200 = 140 mL."},
{l:9,s:"p14",type:"num",q:"4.5 g of NaCl is dissolved to make 500 mL of solution. What is the concentration in % (m/v)?",ans:0.9,tol:0.01,unit:"%",e:"4.5 / 500 × 100% = 0.9% — normal saline."},
{l:9,s:"p16",q:"Blood plasma, lymph, cytosol and interstitial fluid are all:",o:["Aqueous solutions containing electrolytes, gases, nutrients and wastes","Pure water","Non-aqueous solutions","Suspensions of fat"],e:"Body fluids are aqueous solutions."},
{l:9,s:"p16",q:"Interstitial fluid is the fluid:",o:["Between cells","Inside cells","In blood vessels only","In lymph vessels only"],e:"Interstitial = between cells; cytosol = inside cells."},
{l:9,s:"p16",q:"An electrolyte is a solute that:",o:["Dissociates into ions in water and conducts electricity","Does not dissociate and does not conduct electricity","Is always a gas","Only dissolves in fat"],e:"e.g. NaCl → Na⁺ + Cl⁻."},
{l:9,s:"p16",q:"Electrolyte or nonelectrolyte? NaCl.",o:["Electrolyte","Nonelectrolyte"],e:"Electrolyte."},
{l:9,s:"p16",q:"Electrolyte or nonelectrolyte? Glucose.",o:["Nonelectrolyte","Electrolyte"],e:"Nonelectrolyte (does not dissociate)."},
{l:9,s:"p16",q:"Electrolyte or nonelectrolyte? Urea.",o:["Nonelectrolyte","Electrolyte"],e:"Nonelectrolyte."},
{l:9,s:"p16",q:"Electrolytes are crucial for:",o:["Nerve impulses, muscle contraction and fluid balance","Storing energy as fat","Making DNA","Carrying oxygen"],e:"Nerve impulses, muscle contraction, fluid balance."},
{l:9,s:"p18",q:"L9 defines osmosis as the diffusion of water across a semipermeable membrane from:",o:["Lower solute concentration to higher solute concentration","Higher solute concentration to lower solute concentration","Higher water concentration to higher solute concentration by active transport","Inside the cell to outside only"],e:"Low solute → high solute. Same idea as L6 (low → high osmolarity)."},
{l:9,s:"p19",q:"What happens to a red blood cell in an ISOTONIC solution?",o:["Its volume stays stable","It swells and may lyse","It crenates (shrinks)","It divides"],e:"Isotonic, e.g. 0.9% saline for IV drips."},
{l:9,s:"p19",q:"What happens to a red blood cell in a HYPOTONIC solution?",o:["Water enters; it swells and may lyse (burst)","Water leaves; it crenates","No change","It becomes a sickle shape"],e:"Hypotonic → swells → may lyse."},
{l:9,s:"p19",q:"What happens to a red blood cell in a HYPERTONIC solution?",o:["Water leaves; it crenates (shrinks)","Water enters; it bursts","No change","It gains solute"],e:"Hypertonic → crenate."},
{l:9,s:"p19",q:"Crenation means the cell:",o:["Shrinks","Bursts","Divides","Stays the same"],e:"Crenate = shrink. Lyse = burst."},
{l:9,s:"p19",q:"Which IV fluid is given as an example of an isotonic solution?",o:["0.9% saline","Distilled water","10% saline","Mannitol"],e:"0.9% saline."},
{l:9,s:"p19",q:"Cell result: 0.9% saline.",o:["No change","Swell / lyse","Crenate"],e:"Isotonic."},
{l:9,s:"p19",q:"Cell result: distilled water.",o:["Swell / lyse","No change","Crenate"],e:"Hypotonic."},
{l:9,s:"p19",q:"Cell result: a solution with higher solute concentration than the cell.",o:["Crenate","Swell / lyse","No change"],e:"Hypertonic."},
{l:9,s:"p21",q:"A healthcare worker accidentally connects a bag of distilled water instead of saline. What happens to the patient's red blood cells?",o:["They swell and may lyse as water enters","They crenate as water leaves","They stay the same because the membrane is impermeable to water","They change shape but not volume"],e:"In-class exercise answer B. Distilled water is hypotonic."},
{l:9,s:"p22",q:"Mannitol, a sugar that does not cross cell membranes, is given for dangerously high intracranial pressure. What type of solution is it and what does it do?",o:["Hypertonic; draws water out of brain cells into the bloodstream","Hypotonic; hydrates brain cells","Isotonic; replaces fluid without a shift","A non-electrolyte that provides energy for neurons"],e:"In-class exercise answer C."},
{l:9,s:"p22",tf:1,q:"Mannitol lowers intracranial pressure because it is hypertonic and pulls water out of brain cells.",a:1,e:"True."},
{l:9,s:"p22",tf:1,q:"Giving distilled water IV is safe because water is the universal solvent.",a:0,e:"False. It is hypotonic → RBCs swell and may lyse."},
{l:9,s:"p9",type:"fill",q:"Surfactant is secreted by type ________ alveolar cells.",ans:["ii","2","two","type ii","type 2","type two"],e:"Type II alveolar cells."},
{l:9,s:"p9",type:"fill",q:"The collapse of alveoli during expiration is called ________.",ans:["atelectasis"],e:"Atelectasis."},
{l:9,s:"p8",type:"fill",q:"The property of water sticking to other substances, such as vessel walls, is ________.",ans:["adhesion"],e:"Adhesion (cohesion = water to water)."},
{l:9,s:"p16",type:"fill",q:"A solute that dissociates into ions in water and conducts electricity is an ________.",ans:["electrolyte"],e:"Electrolyte."},
{l:9,s:"p19",type:"fill",q:"A red blood cell that shrinks in a hypertonic solution is said to ________.",ans:["crenate"],e:"Crenate."},
{l:9,s:"p8-9",type:"saq",q:"Explain surface tension in the alveoli, how surfactant solves the problem, and what happens when surfactant is deficient.",model:"Alveoli are lined with fluid; water molecules cling together by hydrogen bonds (cohesion), creating surface tension. High surface tension pulls the alveolar walls inwards, making the lungs hard to inflate (↓ compliance) and causing small alveoli to collapse. Surfactant, secreted by type II alveolar cells, acts like a detergent: it breaks water bonds, reduces surface tension, increases lung compliance and keeps alveoli open. In surfactant deficiency — neonatal respiratory distress syndrome in premature babies — alveoli collapse during expiration (atelectasis), causing extreme difficulty breathing. Treatment: artificial surfactant and/or mechanical ventilation.",points:["Hydrogen bonds/cohesion in alveolar fluid → surface tension","High surface tension → inward pull, ↓ compliance, small alveoli collapse","Surfactant from type II alveolar cells ↓ surface tension, ↑ compliance","Deficiency = NRDS in premature babies → atelectasis","Treatment: artificial surfactant / mechanical ventilation"],e:"Slide 9."},
{l:9,s:"p19-22",type:"saq",q:"Predict and explain the effect of isotonic, hypotonic and hypertonic solutions on red blood cells, and apply this to (a) distilled water given by mistake and (b) mannitol for raised intracranial pressure.",model:"Isotonic (same solute concentration as the cell, e.g. 0.9% saline): no net water movement, cell volume stable. Hypotonic (lower solute concentration): water enters the cell by osmosis, the cell swells and may lyse. Hypertonic (higher solute concentration): water leaves the cell, which crenates. (a) Distilled water is hypotonic, so RBCs swell and may lyse. (b) Mannitol does not cross cell membranes, so it makes plasma hypertonic; water is drawn out of brain cells into the bloodstream, lowering intracranial pressure.",points:["Isotonic → no change (0.9% saline)","Hypotonic → water in → swell/lyse","Hypertonic → water out → crenate","Distilled water = hypotonic → lysis","Mannitol = hypertonic → water out of brain cells → ↓ ICP"],e:"Slides 19–22."}
);

// L10 — Biomolecules (carbohydrates, lipids, proteins) and nutrition for health (Dr Anfernee Tse)
// Held back until Tutorial 1 is submitted: p15–16 (liver vs muscle glycogen in fasting; liver-disease exercise).
Q.push(
{l:10,s:"p5",q:"Life is based on which element, and is built from how many major classes of organic macromolecules?",o:["Carbon; four","Oxygen; four","Carbon; three","Nitrogen; five"],e:"Carbon-based; four classes: carbohydrates, lipids, proteins, nucleic acids."},
{l:10,s:"p5",q:"The monomer of carbohydrates is:",o:["Monosaccharides","Amino acids","Nucleotides","Fatty acids"],e:"Carbohydrates ← monosaccharides."},
{l:10,s:"p5",q:"The monomer of proteins is:",o:["Amino acids","Nucleotides","Monosaccharides","Glycerol"],e:"Proteins ← amino acids."},
{l:10,s:"p5",q:"The monomer of nucleic acids is:",o:["Nucleotides","Amino acids","Monosaccharides","Fatty acids"],e:"Nucleic acids ← nucleotides."},
{l:10,s:"p5",q:"Which macromolecule class is NOT a true polymer?",o:["Lipids","Proteins","Carbohydrates","Nucleic acids"],e:"Lipids are not true polymers; they are built from fatty acids & glycerol."},
{l:10,s:"p5",q:"Macromolecule: hemoglobin, collagen, insulin, antibodies.",o:["Proteins","Carbohydrates","Lipids","Nucleic acids"],e:"Proteins."},
{l:10,s:"p5",q:"Macromolecule: glucose, starch, glycogen, cellulose.",o:["Carbohydrates","Lipids","Proteins","Nucleic acids"],e:"Carbohydrates."},
{l:10,s:"p5",q:"Macromolecule: triglycerides, phospholipids, cholesterol.",o:["Lipids","Carbohydrates","Proteins","Nucleic acids"],e:"Lipids."},
{l:10,s:"p5",q:"Macromolecule: DNA, RNA.",o:["Nucleic acids","Proteins","Lipids","Carbohydrates"],e:"Nucleic acids."},
{l:10,s:"p5",q:"Which macromolecule's primary functions include long-term energy storage, insulation, cell membranes and signaling?",o:["Lipids","Carbohydrates","Proteins","Nucleic acids"],e:"Lipids."},
{l:10,s:"p5",q:"Which macromolecule's functions include enzymes (catalysts), structure, transport, movement and defense?",o:["Proteins","Lipids","Carbohydrates","Nucleic acids"],e:"Proteins."},
{l:10,s:"p5",q:"Which macromolecule stores and transmits genetic information and directs protein synthesis?",o:["Nucleic acids","Proteins","Carbohydrates","Lipids"],e:"Nucleic acids."},
{l:10,s:"p5",q:"Which macromolecule's functions are energy source, energy storage and structural support?",o:["Carbohydrates","Nucleic acids","Proteins","Lipids"],e:"Carbohydrates."},
{l:10,s:"p6",q:"A polymer is:",o:["A large molecule made of repeating monomer units, often linked by covalent bonds","A single small building block","An ion","A mixture of unrelated molecules"],e:"Polymers = repeating monomers, often joined by covalent bonds."},
{l:10,s:"p7",q:"Dehydration synthesis (condensation):",o:["Links monomers into polymers by removing –H and –OH to form water","Breaks polymers into monomers by adding water","Adds a phosphate to a protein","Dissolves lipids"],e:"Dehydration synthesis removes H₂O to join monomers."},
{l:10,s:"p7",q:"Hydrolysis:",o:["Breaks polymers into monomers by adding a water molecule","Joins monomers by removing water","Is how we build proteins on ribosomes","Removes –H and –OH"],e:"Hydrolysis adds water to break a bond — this is how we digest food."},
{l:10,s:"p7",q:"Digestion of food into small building blocks is an example of:",o:["Hydrolysis","Dehydration synthesis","Condensation","Phosphorylation"],e:"Hydrolysis."},
{l:10,s:"p7",q:"Dehydration synthesis or hydrolysis? Joining glucose and fructose into sucrose.",o:["Dehydration synthesis","Hydrolysis"],e:"Building → dehydration synthesis."},
{l:10,s:"p7",q:"Dehydration synthesis or hydrolysis? Digesting starch into sugars.",o:["Hydrolysis","Dehydration synthesis"],e:"Breaking down → hydrolysis."},
{l:10,s:"p7",tf:1,q:"In dehydration synthesis, a water molecule is added to break a bond.",a:0,e:"False. That is hydrolysis. Dehydration synthesis REMOVES water (–H and –OH) to form a bond."},
{l:10,s:"p8",q:"Which of these is a MONOSACCHARIDE?",o:["Fructose","Sucrose","Starch","Glycogen"],e:"Monosaccharides: ribose, glucose, fructose (single ring)."},
{l:10,s:"p8",q:"Sucrose is formed from which two monosaccharides?",o:["Glucose + fructose","Glucose + glucose","Glucose + galactose","Fructose + ribose"],e:"Sucrose = glucose + fructose, by dehydration synthesis."},
{l:10,s:"p8-10",q:"Lactose is formed from:",o:["Glucose + galactose","Glucose + fructose","Glucose + glucose","Galactose + fructose"],e:"Standard model (the disaccharide slides are pictures — check them). Maltose = glucose + glucose."},
{l:10,s:"p8-10",q:"Maltose is formed from:",o:["Glucose + glucose","Glucose + fructose","Glucose + galactose","Fructose + fructose"],e:"Standard model (picture slides)."},
{l:10,s:"p8",q:"Which of these is a POLYSACCHARIDE?",o:["Cellulose","Sucrose","Ribose","Fructose"],e:"Polysaccharides: cellulose, starch, glycogen — long chains of monosaccharides."},
{l:10,s:"p8",q:"Carbohydrate class: sucrose.",o:["Disaccharide","Monosaccharide","Polysaccharide"],e:"Disaccharide."},
{l:10,s:"p8",q:"Carbohydrate class: ribose.",o:["Monosaccharide","Disaccharide","Polysaccharide"],e:"Monosaccharide."},
{l:10,s:"p8",q:"Carbohydrate class: glycogen.",o:["Polysaccharide","Disaccharide","Monosaccharide"],e:"Polysaccharide."},
{l:10,s:"p8",q:"Carbohydrate class: glucose.",o:["Monosaccharide","Disaccharide","Polysaccharide"],e:"Monosaccharide."},
{l:10,s:"p8",q:"Carbohydrate class: starch.",o:["Polysaccharide","Monosaccharide","Disaccharide"],e:"Polysaccharide."},
{l:10,s:"p12",q:"In a Fischer projection, what decides whether a sugar is the D or L form?",o:["The side of the –OH on the chiral carbon farthest from the carbonyl group","The number of carbons","Whether it is a ring or a chain","The –OH on the first carbon"],e:"–OH on the RIGHT = D; on the LEFT = L."},
{l:10,s:"p12",q:"If the –OH on the chiral carbon farthest from the carbonyl is on the RIGHT, the sugar is:",o:["D form","L form","Neither","Both"],e:"Right = D; left = L."},
{l:10,s:"p12",q:"The naturally occurring form of glucose is:",o:["D-glucose","L-glucose","Both equally","Neither"],e:"D-glucose (= dextrose). L-glucose is made synthetically in small amounts and is less biologically active."},
{l:10,s:"p12",q:"Why is L-glucose less biologically active?",o:["It does not fit into the enzymes that evolved to process D-glucose","It has fewer carbon atoms","It is a polysaccharide","It is radioactive"],e:"Enzyme specificity — L-glucose doesn't fit."},
{l:10,s:"p11-12",q:"Why does glucose have two names, glucose and dextrose?",o:["Dextrose is the name for D-glucose, the naturally occurring form","Dextrose is a disaccharide of glucose","Dextrose is L-glucose","Dextrose is the polysaccharide form"],e:"D-glucose = dextrose (e.g. D5W in L9)."},
{l:10,s:"p13",q:"Complex carbohydrates (polysaccharides) include:",o:["Starch, glycogen and fiber","Glucose, fructose and ribose","Sucrose and lactose","Triglycerides"],e:"Starch, glycogen, fiber."},
{l:10,s:"p14",q:"Glycogen is also called:",o:["Animal starch","Plant starch","Fiber","Amylose"],e:"Glycogen = animal starch."},
{l:10,s:"p14",q:"Glycogen stores α-D-glucose in the:",o:["Liver and muscle","Brain and heart","Adipose tissue","Kidney"],e:"Liver or muscle."},
{l:10,s:"p14",q:"Glycogen is similar to amylopectin (plant starch) but:",o:["More highly branched","Less branched","Unbranched","Made of fructose"],e:"More highly branched."},
{l:10,s:"p14",q:"Glucose units in the straight chains of glycogen are joined by:",o:["α-1,4-glycosidic bonds","α-1,6-glycosidic bonds","Peptide bonds","Hydrogen bonds"],e:"α-1,4 in chains; α-1,6 at branch points."},
{l:10,s:"p14",q:"The branch points in glycogen are joined by:",o:["α-1,6-glycosidic bonds","α-1,4-glycosidic bonds","β-1,4-glycosidic bonds","Disulfide bonds"],e:"α-1,6."},
{l:10,s:"p14",q:"In glycogen, branches occur about every:",o:["10–15 glucose units","2–3 glucose units","100 glucose units","1000 glucose units"],e:"Every 10–15 units."},
{l:10,s:"p17",q:"Nucleic acids include:",o:["DNA and RNA","ATP and ADP","Amino acids","Glycogen"],e:"DNA and RNA contain genetic information."},
{l:10,s:"p18",q:"What are the 3 components of a nucleotide?",o:["5-carbon sugar, nitrogenous base, phosphate group","6-carbon sugar, amino group, phosphate","Glycerol, fatty acid, phosphate","Ribose, amino acid, sulfur"],e:"5-carbon sugar + nitrogenous base + phosphate."},
{l:10,s:"p18",q:"How many types of nucleotides (bases) are described on the slide?",o:["Five","Four","Twenty","Three"],e:"Five: A, C, G (both), T (DNA only), U (RNA only)."},
{l:10,s:"p18",q:"Which base is found ONLY in DNA?",o:["Thymine","Uracil","Adenine","Guanine"],e:"Only DNA uses thymine."},
{l:10,s:"p18",q:"Which base is found ONLY in RNA?",o:["Uracil","Thymine","Cytosine","Adenine"],e:"Only RNA uses uracil."},
{l:10,s:"p18",q:"Which bases are found in BOTH DNA and RNA?",o:["Adenine, cytosine, guanine","Adenine, thymine, uracil","Thymine and uracil","Cytosine and uracil"],e:"A, C, G."},
{l:10,s:"p18",q:"Base: thymine.",o:["DNA only","RNA only","Both DNA and RNA"],e:"DNA only."},
{l:10,s:"p18",q:"Base: uracil.",o:["RNA only","DNA only","Both DNA and RNA"],e:"RNA only."},
{l:10,s:"p18",q:"Base: guanine.",o:["Both DNA and RNA","DNA only","RNA only"],e:"Both."},
{l:10,s:"p19",q:"Two nucleotides are linked by ___ and separated by ___.",o:["Dehydration synthesis; hydrolysis","Hydrolysis; dehydration synthesis","Phosphorylation; dephosphorylation","Oxidation; reduction"],e:"Same as other polymers."},
{l:10,s:"p19",q:"In the DNA pairing rule, adenine pairs with:",o:["Thymine","Guanine","Cytosine","Uracil"],e:"A–T, G–C (standard model; the pairing rule on the slide is a picture)."},
{l:10,s:"p19",q:"In the DNA pairing rule, guanine pairs with:",o:["Cytosine","Adenine","Thymine","Uracil"],e:"G–C (standard model; picture slide)."},
{l:10,s:"p20",q:"Which RNA carries genetic instructions from DNA to the ribosome?",o:["mRNA","tRNA","rRNA","DNA polymerase"],e:"Messenger RNA."},
{l:10,s:"p20",q:"Which RNA brings the correct amino acid to the ribosome?",o:["tRNA","mRNA","rRNA","snRNA"],e:"Transfer RNA."},
{l:10,s:"p20",q:"Which RNA makes up the ribosome?",o:["rRNA","mRNA","tRNA","DNA"],e:"Ribosomal RNA."},
{l:10,s:"p20",q:"RNA type: the messenger.",o:["mRNA","tRNA","rRNA"],e:"mRNA."},
{l:10,s:"p20",q:"RNA type: the adaptor that brings amino acids.",o:["tRNA","mRNA","rRNA"],e:"tRNA."},
{l:10,s:"p20",q:"RNA type: part of the protein-building machine.",o:["rRNA","tRNA","mRNA"],e:"rRNA."},
{l:10,s:"p20",q:"Making mRNA from DNA is called:",o:["Transcription","Translation","Replication","Hydrolysis"],e:"DNA → mRNA = transcription; mRNA → protein = translation."},
{l:10,s:"p20",q:"Building a protein from mRNA at the ribosome is called:",o:["Translation","Transcription","Replication","Condensation only"],e:"Translation."},
{l:10,s:"p21",q:"Actinomycin D binds DNA and inhibits the synthesis of mRNA. Which process is directly disrupted?",o:["Transcription","Translation","DNA replication","Hydrolysis"],e:"In-class exercise answer C."},
{l:10,s:"p22",q:"Which of these is NOT one of the 5 parts of an amino acid?",o:["A phosphate group","A central carbon atom","An amine group","A side chain (R group)"],e:"5 parts: central carbon, amine group (N), acid group, hydrogen atom, R group."},
{l:10,s:"p22",q:"The part of an amino acid that contains nitrogen is the:",o:["Amine group","Acid group","R group always","Central carbon"],e:"Amine group contains nitrogen."},
{l:10,s:"p24",q:"The 20 common amino acids are grouped into classes according to the properties of their:",o:["Side chains (R groups)","Amine groups","Acid groups","Central carbons"],e:"Side chains."},
{l:10,s:"p25",q:"How many essential amino acids are there?",o:["9","11","20","12"],e:"9 essential, 11 nonessential = 20."},
{l:10,s:"p25",q:"How many nonessential amino acids are there?",o:["11","9","20","5"],e:"11."},
{l:10,s:"p25",q:"An essential amino acid is one that:",o:["The body cannot make at all or in sufficient amounts, so it must come from the diet","Is more important than a nonessential amino acid","The body makes in large amounts","Is only found in plants"],e:"Must be consumed in the diet."},
{l:10,s:"p25",tf:1,q:"Nonessential amino acids are less important to the body than essential amino acids.",a:0,e:"False. They are JUST AS IMPORTANT — the body can simply make enough of them."},
{l:10,s:"p26",q:"Joining two amino acids forms a ___ and one molecule of ___.",o:["Dipeptide; water","Polysaccharide; water","Dipeptide; CO₂","Nucleotide; ATP"],e:"AA1 + AA2 → dipeptide + H₂O."},
{l:10,s:"p26",q:"According to the table, dehydration synthesis of a dipeptide:",o:["Requires energy (endergonic)","Releases energy (exergonic)","Has no energy change","Produces ATP"],e:"Dehydration synthesis = endergonic; hydrolysis = exergonic."},
{l:10,s:"p26",q:"According to the table, hydrolysis of a dipeptide:",o:["Releases energy (exergonic)","Requires energy (endergonic)","Needs ribosomes","Produces water"],e:"Hydrolysis = exergonic; decomposition."},
{l:10,s:"p26",q:"Which enzymes carry out protein HYDROLYSIS?",o:["Proteases (e.g. pepsin, trypsin) and peptidases","Ribosome (peptidyl transferase)","Kinases","Amylase"],e:"Proteases, peptidases."},
{l:10,s:"p26",q:"Which enzyme builds peptide bonds during protein synthesis?",o:["Ribosome (peptidyl transferase)","Pepsin","Trypsin","Lipase"],e:"Ribosome (peptidyl transferase) and other synthetases."},
{l:10,s:"p26",q:"Hydrolysis of proteins has which biological role?",o:["Digests dietary proteins and recycles cellular proteins","Builds proteins and peptides","Stores energy as fat","Makes DNA"],e:"Digestion + recycling."},
{l:10,s:"p26",q:"Dehydration synthesis is which reaction type (L2 classification)?",o:["Synthesis (building up)","Decomposition (breaking down)","Single replacement","Redox"],e:"Synthesis. Hydrolysis = decomposition."},
{l:10,s:"p27",q:"A gene is:",o:["A section of DNA that codes for a single protein","A single nucleotide","A type of RNA","A protein"],e:"Gene = section of DNA coding for one protein."},
{l:10,s:"p27",q:"A protein's unique function is determined by:",o:["Its specific amino acid sequence","Its number of phosphate groups","Its sugar content","Its size only"],e:"Specific amino acid sequence (stored in DNA)."},
{l:10,s:"p29",q:"The PRIMARY structure of a protein is:",o:["The linear sequence of amino acids","Local folding into helices and sheets","The overall 3D shape of one chain","Multiple chains assembled together"],e:"1° = sequence, e.g. Ala-Gly-Ser-Val."},
{l:10,s:"p29",q:"The SECONDARY structure of a protein is:",o:["Local folding of the backbone into repeating patterns (α-helix, β-pleated sheet)","The amino acid sequence","The overall 3D shape","Multiple subunits"],e:"2° = α-helix, β-sheet."},
{l:10,s:"p29",q:"The TERTIARY structure of a protein is:",o:["The overall 3D shape of a single polypeptide chain","Local folding patterns","Several chains together","The amino acid sequence"],e:"3° = overall 3D shape of ONE chain, e.g. myoglobin, lysozyme."},
{l:10,s:"p29",q:"The QUATERNARY structure of a protein is:",o:["Multiple folded polypeptide chains (subunits) assembled together","The overall shape of one chain","The amino acid sequence","A single α-helix"],e:"4° = multiple subunits, e.g. hemoglobin (4), collagen (3), antibodies."},
{l:10,s:"p29",q:"Protein structure level: the α-helix in keratin (hair).",o:["Secondary","Primary","Tertiary","Quaternary"],e:"Secondary."},
{l:10,s:"p29",q:"Protein structure level: the β-pleated sheet in silk fibroin.",o:["Secondary","Tertiary","Quaternary","Primary"],e:"Secondary."},
{l:10,s:"p29",q:"Protein structure level: myoglobin (a single-chain oxygen storage protein).",o:["Tertiary","Quaternary","Secondary","Primary"],e:"Tertiary (one chain)."},
{l:10,s:"p29",q:"Protein structure level: hemoglobin with 4 subunits.",o:["Quaternary","Tertiary","Secondary","Primary"],e:"Quaternary."},
{l:10,s:"p29",q:"Protein structure level: collagen's 3 subunits twisted into a triple helix.",o:["Quaternary","Secondary","Tertiary","Primary"],e:"Quaternary (per the slide)."},
{l:10,s:"p29",q:"Protein structure level: the sequence Alanine–Glycine–Serine–Valine.",o:["Primary","Secondary","Tertiary","Quaternary"],e:"Primary."},
{l:10,s:"p29",q:"Protein structure level: the enzyme lysozyme's overall 3D shape.",o:["Tertiary","Quaternary","Primary","Secondary"],e:"Tertiary."},
{l:10,s:"p29",q:"Hemoglobin has how many subunits?",o:["4","3","2","1"],e:"4 subunits. Collagen has 3."},
{l:10,s:"p30",q:"In sickle cell anemia, which amino acid replaces glutamic acid at position 6 of the β-chain?",o:["Valine","Glycine","Serine","Alanine"],e:"Glutamic acid (polar, acidic) → valine (nonpolar)."},
{l:10,s:"p30",q:"In sickle cell anemia, the substitution is at which position of the hemoglobin β-chain?",o:["6th amino acid","1st amino acid","16th amino acid","146th amino acid"],e:"The sixth amino acid."},
{l:10,s:"p30",q:"Glutamic acid is ___, while valine is ___.",o:["Polar acidic; nonpolar","Nonpolar; polar acidic","Polar basic; polar acidic","Nonpolar; polar basic"],e:"Glu = polar acidic; Val = nonpolar."},
{l:10,s:"p30",q:"Why do red blood cells sickle in sickle cell anemia?",o:["The nonpolar valine R group is attracted to nonpolar regions in other β-chains, so hemoglobin aggregates","Valine is polar and binds water","Hemoglobin loses its iron","The cell membrane loses phospholipids"],e:"Nonpolar valine → attraction to nonpolar regions → aggregation → crescent shape → poor O₂ transport."},
{l:10,s:"p31",q:"Sickle cell anemia results from a single amino acid substitution. Which level of protein structure is most DIRECTLY and primarily altered?",o:["Primary","Secondary","Tertiary","Quaternary"],e:"In-class exercise answer A — the amino acid SEQUENCE changes (downstream the shape changes)."},
{l:10,s:"p33",q:"The one property that all lipids have in common is that they:",o:["Do not dissolve in water but dissolve in organic solvents","Are polymers of glucose","Contain four carbon rings","Are all hormones"],e:"Insoluble in water, soluble in organic solvents."},
{l:10,s:"p33",tf:1,q:"Lipids are polymers made of long chains of repeating monomers.",a:0,e:"False. Lipids are NOT polymers — they have extremely diverse chemical structures."},
{l:10,s:"p33",q:"Which lipid forms the majority of cell membranes?",o:["Phospholipids","Triglycerides","Steroids","Cholesterol"],e:"Phospholipids."},
{l:10,s:"p34",q:"A triglyceride consists of:",o:["Three fatty acids bonded to glycerol","Two fatty acids, glycerol and a phosphate","Four carbon rings","Three glucose molecules"],e:"3 fatty acids + glycerol. (Phospholipid = 2 fatty acids — L6.)"},
{l:10,s:"p34",q:"Saturated fatty acid chains contain:",o:["Only single carbon–carbon bonds","One or more double bonds that bend the chain","Triple bonds","Rings"],e:"Saturated = only single C–C bonds. Unsaturated = one or more double bonds that bend the chain."},
{l:10,s:"p34",q:"In unsaturated fatty acids, the chains are bent by:",o:["One or more double bonds","Single bonds only","Hydrogen bonds","Disulfide bonds"],e:"Double bonds bend the chain."},
{l:10,s:"p35",q:"Phospholipids spontaneously form bilayers in water because they have:",o:["A hydrophilic (polar) head and hydrophobic (nonpolar) tails","Only polar bonds","Only nonpolar bonds","Four carbon rings"],e:"Amphipathic structure → bilayer."},
{l:10,s:"p35",q:"A lipid bilayer is selectively permeable to:",o:["Lipids and small, nonpolar molecules","Ions","Large polar molecules","Proteins"],e:"Lipids and small nonpolar molecules (matches L6 simple diffusion)."},
{l:10,s:"p36",q:"Steroids are lipids that have:",o:["Four interconnected carbon rings","Three fatty acids and glycerol","A phosphate head","A glucose backbone"],e:"Four interconnected rings."},
{l:10,s:"p36",q:"Which of the following is NOT a steroid?",o:["Triglyceride","Vitamin D","Testosterone","Cholesterol"],e:"Steroids: vitamin D, testosterone, cholesterol, estrogen, cortisol."},
{l:10,s:"p36",q:"Animal cells use cholesterol as a starting material to make:",o:["Sex hormones such as testosterone and estrogen","Glycogen","Proteins","DNA"],e:"Cholesterol → other lipids including sex hormones."},
{l:10,s:"p37",q:"Lipid type: primary long-term energy reserve, insulation, cushions organs.",o:["Triglycerides","Phospholipids","Steroids"],e:"Triglycerides (adipose tissue)."},
{l:10,s:"p37",q:"Lipid type: main structural component of cell membranes; emulsification.",o:["Phospholipids","Triglycerides","Steroids"],e:"Phospholipids."},
{l:10,s:"p37",q:"Lipid type: chemical signaling (hormones), membrane fluidity, aids fat digestion.",o:["Steroids","Phospholipids","Triglycerides"],e:"Steroids (cholesterol, estrogen/testosterone, cortisol)."},
{l:10,s:"p37",q:"Lipid type: cortisol (stress hormone).",o:["Steroid","Triglyceride","Phospholipid"],e:"Steroid."},
{l:10,s:"p37",q:"Which lipid helps keep cell membranes fluid and stable?",o:["Cholesterol (a steroid)","Triglyceride","Glycerol","Fatty acid only"],e:"Steroids: membrane fluidity."},
{l:10,s:"p38",q:"Vitamin D3 (calcitriol) synthesis: in which organ is it FIRST made from cholesterol, when exposed to sunlight?",o:["Skin","Liver","Kidney","Intestine"],e:"Skin → liver → kidney (last and most important modification)."},
{l:10,s:"p38",q:"Put the organs of vitamin D3 synthesis in order:",o:["Skin → liver → kidney","Liver → skin → kidney","Kidney → liver → skin","Skin → kidney → liver"],e:"Skin (sunlight) → liver → kidney."},
{l:10,s:"p38",q:"The LAST and most important modification of vitamin D3 happens in the:",o:["Kidney","Liver","Skin","Pancreas"],e:"Kidney."},
{l:10,s:"p39",q:"To extract lipids from a plasma sample, which solvent is most appropriate?",o:["Organic solvents, such as chloroform or ether","Polar solvents such as water or saline","Isotonic buffers such as PBS","Weak hydrochloric acid"],e:"In-class exercise answer C — lipids dissolve in organic solvents."},
{l:10,s:"p7",type:"fill",q:"Breaking a polymer into monomers by adding water is called ________.",ans:["hydrolysis"],e:"Hydrolysis."},
{l:10,s:"p18",type:"fill",q:"The base found only in RNA is ________.",ans:["uracil","u"],e:"Uracil."},
{l:10,s:"p20",type:"fill",q:"The RNA that brings the correct amino acid to the ribosome is ________ RNA.",ans:["transfer","trna","t"],e:"tRNA."},
{l:10,s:"p29",type:"fill",q:"The level of protein structure formed by several polypeptide subunits assembling together is the ________ structure.",ans:["quaternary"],e:"Quaternary."},
{l:10,s:"p14",type:"fill",q:"The branch points in glycogen are joined by α-1,________-glycosidic bonds.",ans:["6"],e:"α-1,6 (chains: α-1,4)."},
{l:10,s:"p36",type:"fill",q:"Lipids with four interconnected carbon rings are called ________.",ans:["steroids","steroid"],e:"Steroids."},
{l:10,s:"p29-31",type:"saq",q:"Describe the four levels of protein structure with one example each, and use sickle cell anemia to explain why the amino acid sequence determines a protein's function.",model:"Primary: linear sequence of amino acids (e.g. Ala-Gly-Ser-Val). Secondary: local folding of the backbone into repeating patterns — α-helix (keratin) or β-pleated sheet (silk fibroin). Tertiary: overall 3D shape of a single chain (myoglobin, lysozyme). Quaternary: several folded chains together (hemoglobin, 4 subunits; collagen, 3; antibodies). In sickle cell anemia, the 6th amino acid of the β-chain, polar acidic glutamic acid, is replaced by nonpolar valine — a change in PRIMARY structure. Valine's nonpolar R group is attracted to nonpolar regions of other β-chains, so hemoglobin aggregates, the RBC becomes crescent (sickle) shaped, and it cannot carry enough oxygen.",points:["Primary = sequence (+ example)","Secondary = α-helix / β-sheet (+ example)","Tertiary = 3D shape of one chain (+ example)","Quaternary = multiple subunits (+ example)","Sickle cell: Glu→Val at β6 (primary change) → aggregation → sickle RBC, poor O₂ transport"],e:"Slides 29–31."},
{l:10,s:"p33-38",type:"saq",q:"Name the three main types of lipid. For each, describe its structure and give two functions.",model:"Triglycerides: three fatty acids bonded to glycerol (saturated = single C–C bonds; unsaturated = double bonds bend the chain); functions: long-term energy storage, insulation, protection/cushioning of organs. Phospholipids: hydrophilic polar head and two hydrophobic fatty acid tails, forming bilayers; functions: main structural component of cell membranes, emulsification. Steroids: four interconnected carbon rings (e.g. cholesterol, vitamin D, testosterone, estrogen, cortisol); functions: chemical signaling as hormones, membrane fluidity, aid fat digestion; cholesterol is the starting material for sex hormones.",points:["Triglyceride: 3 fatty acids + glycerol","Triglyceride functions: energy storage / insulation / protection","Phospholipid: polar head + nonpolar tails → bilayer; membranes, emulsification","Steroid: 4 carbon rings; hormones, membrane fluidity, digestion"],e:"Slides 33–38."}
);

// L11 — Energy & metabolism (Dr Anfernee Tse)
// Held back until Tutorial 1 is submitted: p13–14 (interconversion of macronutrients).
Q.push(
{l:11,s:"p6",q:"Physicists define energy as:",o:["The ability to do work, that is, to move matter","The mass of a substance","The heat in a substance","The number of chemical bonds"],e:"Energy = the ability to do work (to move matter)."},
{l:11,s:"p7",q:"A bicyclist at the top of a hill has ___ energy, which becomes ___ energy as he coasts down.",o:["Potential; kinetic","Kinetic; potential","Chemical; thermal","Kinetic; chemical"],e:"Top of the hill = potential → coasting = kinetic."},
{l:11,s:"p7",q:"Chemical energy is a form of:",o:["Potential energy, released when a molecule's bonds break","Kinetic energy","Light energy","Electrical energy only"],e:"Chemical energy = potential energy stored in bonds."},
{l:11,s:"p7",q:"Potential or kinetic? Glucose sitting in a cell.",o:["Potential (chemical)","Kinetic"],e:"Stored chemical energy = potential."},
{l:11,s:"p7",q:"Potential or kinetic? A contracting muscle moving a limb.",o:["Kinetic","Potential"],e:"Movement = kinetic."},
{l:11,s:"p8",q:"The two most important energy transformations in living things are:",o:["Photosynthesis and cellular respiration","Digestion and absorption","Glycolysis and osmosis","Transcription and translation"],e:"Photosynthesis and cellular respiration."},
{l:11,s:"p10",q:"Metabolism is:",o:["The sum of all chemical reactions in biological systems","Only the breakdown of food","Only the building of proteins","The rate of breathing"],e:"Metabolism = all chemical reactions."},
{l:11,s:"p10",q:"Catabolic pathways:",o:["Release energy by breaking complex molecules into simpler ones","Consume energy to build complex molecules","Neither release nor use energy","Only happen in plants"],e:"Catabolic = release energy, break down. Anabolic = consume energy, build up."},
{l:11,s:"p10",q:"Anabolic pathways:",o:["Consume energy to build complex molecules from simpler ones","Release energy by breaking down molecules","Only happen in mitochondria","Break down fat"],e:"Anabolic = consume energy to build."},
{l:11,s:"p10",q:"Photosynthesis is an example of:",o:["An anabolic pathway","A catabolic pathway","Hydrolysis","Beta-oxidation"],e:"Photosynthesis builds glucose from CO₂ and H₂O → anabolic."},
{l:11,s:"p10",q:"Cellular respiration is an example of:",o:["A catabolic pathway","An anabolic pathway","An endergonic reaction","Protein synthesis"],e:"Breaks glucose down to CO₂ + H₂O → catabolic."},
{l:11,s:"p11",q:"The major CATABOLIC pathway for carbohydrates is:",o:["Cellular respiration","Glycogenesis","Lipogenesis","Deamination"],e:"Carbs: catabolic = cellular respiration; anabolic = glycogenesis."},
{l:11,s:"p11",q:"The major ANABOLIC pathway for carbohydrates is:",o:["Glycogenesis","Cellular respiration","Beta-oxidation","Protein synthesis"],e:"Glycogenesis = linking glucose into glycogen for storage (liver & muscles)."},
{l:11,s:"p11",q:"The major CATABOLIC pathway for lipids is:",o:["Beta-oxidation","Lipogenesis","Glycogenesis","Deamination"],e:"Beta-oxidation: fatty acids → acetyl-CoA → cellular respiration → ATP."},
{l:11,s:"p11",q:"The major ANABOLIC pathway for lipids is:",o:["Lipogenesis","Beta-oxidation","Glycogenesis","Protein synthesis"],e:"Lipogenesis: acetyl-CoA → triglycerides (long-term storage)."},
{l:11,s:"p11",q:"The major CATABOLIC pathway for proteins is:",o:["Deamination & Krebs cycle","Protein synthesis","Lipogenesis","Glycogenesis"],e:"Deamination: amino group removed; the carbon skeleton is used for energy."},
{l:11,s:"p11",q:"Beta-oxidation breaks fatty acids down into:",o:["Acetyl-CoA","Glucose","Amino acids","Glycogen"],e:"Acetyl-CoA, which enters cellular respiration to make ATP."},
{l:11,s:"p11",q:"Lipogenesis assembles ___ into triglycerides.",o:["Acetyl-CoA molecules","Amino acids","Glucose molecules directly into glycogen","Nucleotides"],e:"Acetyl-CoA → triglycerides."},
{l:11,s:"p11",q:"In deamination, what is removed from an amino acid?",o:["The amino group","The carbon skeleton","The R group","A phosphate"],e:"Amino group removed; the remaining carbon skeleton is used for energy."},
{l:11,s:"p11",q:"Glycogenesis stores glycogen in the:",o:["Liver and muscles","Brain","Adipose tissue","Kidneys"],e:"Liver & muscles."},
{l:11,s:"p11",q:"Pathway: linking glucose molecules together into glycogen.",o:["Glycogenesis","Lipogenesis","Beta-oxidation","Deamination"],e:"Glycogenesis."},
{l:11,s:"p11",q:"Pathway: breaking fatty acids into acetyl-CoA.",o:["Beta-oxidation","Lipogenesis","Glycogenesis","Deamination"],e:"Beta-oxidation."},
{l:11,s:"p11",q:"Pathway: building triglycerides from acetyl-CoA.",o:["Lipogenesis","Beta-oxidation","Glycogenesis","Deamination"],e:"Lipogenesis."},
{l:11,s:"p11",q:"Pathway: removing the amino group from an amino acid.",o:["Deamination","Lipogenesis","Glycogenesis","Beta-oxidation"],e:"Deamination."},
{l:11,s:"p11",q:"Catabolic or anabolic? Lipogenesis.",o:["Anabolic","Catabolic"],e:"Builds up for storage → anabolic."},
{l:11,s:"p11",q:"Catabolic or anabolic? Beta-oxidation.",o:["Catabolic","Anabolic"],e:"Breaks down → catabolic."},
{l:11,s:"p11",q:"Catabolic or anabolic? Deamination.",o:["Catabolic","Anabolic"],e:"Catabolic."},
{l:11,s:"p11",q:"Catabolic or anabolic? Glycogenesis.",o:["Anabolic","Catabolic"],e:"Anabolic."},
{l:11,s:"p11",tf:1,q:"Glycogenesis is the breakdown of glycogen into glucose.",a:0,e:"False. Glycogen-GENESIS = making (genesis) glycogen from glucose."},
{l:11,s:"p16",q:"An ENDERGONIC reaction:",o:["Requires energy input; products contain more energy than reactants","Releases energy; products contain less energy","Has no energy change","Always breaks molecules down"],e:"Endergonic = energy in; e.g. glycogenesis, lipogenesis."},
{l:11,s:"p16",q:"An EXERGONIC reaction:",o:["Releases energy; products contain less energy than reactants","Requires energy input","Products contain more energy","Always builds molecules"],e:"Exergonic = energy out; e.g. cellular respiration, beta-oxidation."},
{l:11,s:"p16",q:"Endergonic or exergonic? Glycogenesis.",o:["Endergonic","Exergonic"],e:"Endergonic."},
{l:11,s:"p16",q:"Endergonic or exergonic? Cellular respiration.",o:["Exergonic","Endergonic"],e:"Exergonic."},
{l:11,s:"p16",q:"Endergonic or exergonic? Lipogenesis.",o:["Endergonic","Exergonic"],e:"Endergonic."},
{l:11,s:"p16",q:"Endergonic or exergonic? Beta-oxidation of fatty acids.",o:["Exergonic","Endergonic"],e:"Exergonic."},
{l:11,s:"p16",tf:1,q:"In an exergonic reaction, the products contain more energy than the reactants.",a:0,e:"False. Exergonic → products have LESS energy (energy was released)."},
{l:11,s:"p17",q:"Building complex carbohydrate ___ energy; breaking down complex carbohydrate ___ energy.",o:["Requires; releases","Releases; releases","Requires; requires","Releases; requires"],e:"In-class exercise answer D."},
{l:11,s:"p19",q:"ATP is often called the cell's:",o:["Energy currency","Genetic code","Structural protein","Waste product"],e:"Energy currency — like money in a bank."},
{l:11,s:"p19",q:"Animals store the energy from the breakdown of food as:",o:["ATP","Glucose only","DNA","Water"],e:"ATP (slide 19)."},
{l:11,s:"p21",q:"Which of these is NOT a subunit of ATP?",o:["Deoxyribose","Adenine","Ribose","Three phosphate groups"],e:"ATP = adenine + ribose + 3 phosphates."},
{l:11,s:"p21",q:"ATP consists of:",o:["Adenine, ribose and 3 phosphate groups","Adenine, deoxyribose and 3 phosphates","Adenine, glucose and 2 phosphates","Adenosine and 1 phosphate"],e:"Adenine + ribose (= adenosine) + 3 phosphates."},
{l:11,s:"p21",q:"The high-energy bonds in ATP join:",o:["The 2 end phosphate groups","Adenine and ribose","Ribose and the first phosphate","The adenine rings"],e:"The 2 end phosphate groups are bonded by high-energy bonds, which break easily."},
{l:11,s:"p22",q:"In the battery analogy, a drained battery that can be recharged is:",o:["ADP","ATP","Glucose","NAD⁺"],e:"ADP = discharged battery, recharged back to ATP."},
{l:11,s:"p23",q:"ATP SYNTHESIS uses energy from ___ reactions to add P to ADP.",o:["Exergonic","Endergonic","Anabolic","Hydrolysis of water"],e:"Energy from exergonic reactions → ADP + P → ATP."},
{l:11,s:"p23",q:"ATP HYDROLYSIS releases energy that powers ___ reactions.",o:["Endergonic","Exergonic","Catabolic","Oxidation only"],e:"ATP → ADP + P releases energy for endergonic reactions."},
{l:11,s:"p23",q:"ATP connects:",o:["Exergonic reactions to endergonic reactions","Only exergonic reactions","Only endergonic reactions","DNA to RNA"],e:"ATP couples the two."},
{l:11,s:"p24",q:"Removing the endmost phosphate group of ATP gives:",o:["ADP and a free phosphate","AMP and two phosphates","Adenosine only","ATP and water"],e:"ATP → ADP + Pᵢ, releasing energy."},
{l:11,s:"p25",q:"In glycogen synthesis, ATP helps by:",o:["Energizing the target molecule so it is more likely to bond with other molecules","Changing the shape of a transport protein","Breaking down glycogen","Removing an amino group"],e:"Example 1 (anabolism): ATP energizes the target molecule."},
{l:11,s:"p26",q:"In active transport, ATP helps by:",o:["Donating a phosphate group that changes the shape of the transport protein","Energizing glucose to bond","Making water move","Breaking hydrogen bonds"],e:"Example 2: ATP donates a phosphate → shape change (links to the P-type ATPase in L6)."},
{l:11,s:"p27",q:"Catabolic or anabolic? Breaking a protein into individual amino acids.",o:["Catabolic","Anabolic"],e:"Catabolic (given as the worked example)."},
{l:11,s:"p27",q:"Catabolic or anabolic? Using glucose to build glycogen for storage in the liver.",o:["Anabolic","Catabolic"],e:"Anabolic."},
{l:11,s:"p27",q:"Catabolic or anabolic? Digesting starch into maltose and glucose.",o:["Catabolic","Anabolic"],e:"Catabolic."},
{l:11,s:"p27",q:"Catabolic or anabolic? Synthesizing a new DNA strand from nucleotides.",o:["Anabolic","Catabolic"],e:"Anabolic."},
{l:11,s:"p27",q:"Catabolic or anabolic? Building a triglyceride from fatty acids and glycerol.",o:["Anabolic","Catabolic"],e:"Anabolic."},
{l:11,s:"p27",q:"Catabolic or anabolic? Linking amino acids in a specific sequence to form hemoglobin.",o:["Anabolic","Catabolic"],e:"Anabolic."},
{l:11,s:"p21",type:"fill",q:"ATP stands for adenosine ________.",ans:["triphosphate","tri-phosphate"],e:"Adenosine triphosphate."},
{l:11,s:"p16",type:"fill",q:"A reaction that requires energy input, with products containing more energy than reactants, is ________.",ans:["endergonic"],e:"Endergonic."},
{l:11,s:"p11",type:"fill",q:"The catabolic pathway that breaks fatty acids into acetyl-CoA is ________.",ans:["beta-oxidation","beta oxidation","β-oxidation","b-oxidation"],e:"Beta-oxidation."},
{l:11,s:"p11",type:"fill",q:"The anabolic pathway that assembles acetyl-CoA into triglycerides is ________.",ans:["lipogenesis"],e:"Lipogenesis."},
{l:11,s:"p11",type:"saq",q:"For carbohydrates, lipids and proteins, name the major catabolic pathway and the major anabolic pathway, and say what each does.",model:"Carbohydrates — catabolic: cellular respiration, which breaks glucose into CO₂ and H₂O to produce ATP; anabolic: glycogenesis, which links glucose into glycogen for storage in liver and muscle. Lipids — catabolic: beta-oxidation, which breaks fatty acids into acetyl-CoA that enters cellular respiration; anabolic: lipogenesis, which assembles acetyl-CoA into triglycerides for long-term storage. Proteins — catabolic: deamination & Krebs cycle, removing the amino group and using the carbon skeleton for energy; anabolic: protein synthesis, linking amino acids in a specific order.",points:["Carbs: cellular respiration / glycogenesis","Lipids: beta-oxidation (→ acetyl-CoA) / lipogenesis (→ triglycerides)","Proteins: deamination & Krebs / protein synthesis","States what each pathway does"],e:"Slide 11."},
{l:11,s:"p16-24",type:"saq",q:"Explain how ATP couples exergonic and endergonic reactions. Include ATP's structure and one example of ATP use.",model:"ATP is made of adenine, ribose and three phosphate groups; the two end phosphates are joined by high-energy bonds that break easily. Exergonic reactions (e.g. cellular respiration) release energy, which is used to add a phosphate to ADP → ATP (ATP synthesis). ATP hydrolysis removes the end phosphate (ATP → ADP + Pᵢ), releasing energy that powers endergonic reactions (e.g. glycogenesis). Like a rechargeable battery, ADP is recharged to ATP. Examples: in glycogen synthesis ATP energizes the target molecule so it bonds more easily; in active transport ATP donates a phosphate that changes the shape of the transport protein.",points:["ATP = adenine + ribose + 3 phosphates; high-energy bonds between end phosphates","Exergonic energy → ADP + P → ATP","ATP → ADP + Pᵢ releases energy for endergonic reactions","Example: glycogen synthesis or active transport"],e:"Slides 16–26."}
);

// L12 — Enzymes as biocatalysts (Dr Anfernee Tse)
Q.push(
{l:12,s:"p6",q:"About what % of enzymes are proteins?",o:["~99%","~50%","100%, without exception","~75%"],e:"Enzymes are proteins (~99%)."},
{l:12,s:"p6",q:"A catalyst is a substance that:",o:["Speeds up a reaction or lets it occur under milder conditions, without being consumed","Is used up during the reaction","Slows down a reaction","Always raises the temperature"],e:"Catalyst = speeds up, not consumed."},
{l:12,s:"p6",tf:1,q:"A catalyst is consumed during the reaction it speeds up.",a:0,e:"False. It is NOT consumed — the enzyme is used over and over."},
{l:12,s:"p8",q:"The initial input of energy needed to start a chemical reaction is called the:",o:["Activation energy (Eₐ)","Free energy","Kinetic energy","Bond energy"],e:"Activation energy."},
{l:12,s:"p8",q:"Enzymes increase the rate of a reaction by:",o:["Lowering the activation energy","Raising the activation energy","Raising the temperature","Adding energy to the products"],e:"Lowering Eₐ."},
{l:12,s:"p9-13",q:"In the stone-and-hill analogy, the activation energy is:",o:["The energy needed to roll the stone up the hill","The energy released when the stone breaks","The height of the valley","The size of the stone"],e:"Rolling the stone UP the hill = activation energy; once over the top, the rest of the reaction occurs."},
{l:12,s:"p15",q:"Carbonic anhydrase lowers the activation energy of the reaction that converts:",o:["CO₂ and H₂O to bicarbonate and H⁺","Glucose to glycogen","Urea to CO₂ and ammonia","Protein to amino acids"],e:"CO₂ + H₂O ⇌ HCO₃⁻ + H⁺ (the L2 bicarbonate buffer)."},
{l:12,s:"p15",tf:1,q:"The reaction catalysed by carbonic anhydrase is reversible.",a:1,e:"True — \"the reversible reaction that converts CO₂ and H₂O to bicarbonate and H⁺\"."},
{l:12,s:"p17",q:"The active site is:",o:["A region within an enzyme that fits the shape of the substrate","The entire enzyme molecule","The same as the substrate","A non-protein cofactor"],e:"Active site = a region within the enzyme; contains amino acid R groups that bind the substrate."},
{l:12,s:"p17",q:"The reacting molecule that binds the enzyme's active site is called the:",o:["Substrate","Product","Cofactor","Inhibitor"],e:"Substrate."},
{l:12,s:"p17",q:"The active site contains amino acid ___ that bind the substrate.",o:["R groups","Amine groups only","Phosphate groups","Carbohydrate chains"],e:"R groups."},
{l:12,s:"p21",q:"The active site of an enzyme is best described as:",o:["A specific region where the substrate binds","The entire enzyme molecule","The same as the substrate","A non-protein cofactor"],e:"In-class exercise 1: B."},
{l:12,s:"p18",q:"Put the steps of an enzyme-catalysed reaction in order:",o:["Substrate attaches to active site → ES complex forms → reaction occurs, products released → enzyme reused","ES complex forms → substrate attaches → enzyme is consumed","Products form → substrate attaches → ES complex","Enzyme is destroyed → products released"],e:"E + S → ES → E + P."},
{l:12,s:"p18",q:"What does ES stand for?",o:["Enzyme–substrate complex","Enzyme specificity","Energy of the system","Essential substrate"],e:"Enzyme–substrate complex."},
{l:12,s:"p18",q:"Which equation represents an enzyme-catalysed reaction?",o:["E + S ⇌ ES → E + P","E + S → P (enzyme consumed)","S → E + P","E + P → ES → S"],e:"The enzyme comes out unchanged."},
{l:12,s:"p19",q:"Enzymes may recognize and catalyse:",o:["A single substrate, a group of similar substrates, or a particular type of bond","Any molecule at all","Only one type of reaction in the whole body","Only carbohydrates"],e:"Enzyme specificity — three levels."},
{l:12,s:"p19",q:"Glucose, mannose and galactose are given as examples of:",o:["Hexoses (a group of similar substrates)","Disaccharides","Pentoses","Polysaccharides"],e:"Hexoses — an enzyme may act on a group of similar substrates."},
{l:12,s:"p20",q:"The lock-and-key model describes the active site as:",o:["Rigid and nonflexible","Flexible, adapting to the substrate","Absent","Changing the substrate's shape"],e:"Lock-and-key = early theory, rigid active site."},
{l:12,s:"p20",q:"The induced-fit model describes the active site as:",o:["Flexible, adapting to the shape of the substrate","Rigid and nonflexible","Identical to the substrate","A separate molecule"],e:"Induced fit = dynamic, flexible."},
{l:12,s:"p21",q:"According to the induced-fit model:",o:["The enzyme slightly changes shape to better fit the substrate upon binding","The active site is rigid and unchanging","The substrate changes shape to match the enzyme perfectly","The enzyme unfolds completely around the substrate"],e:"In-class exercise 2: D."},
{l:12,s:"p20",q:"Model: \"the active site has a rigid, nonflexible shape\".",o:["Lock-and-key","Induced-fit"],e:"Lock-and-key."},
{l:12,s:"p20",q:"Model: \"the dynamic model in which the active site adapts to the substrate\".",o:["Induced-fit","Lock-and-key"],e:"Induced-fit."},
{l:12,s:"p20",tf:1,q:"The lock-and-key model is the newer, dynamic model of enzyme action.",a:0,e:"False. Lock-and-key is the EARLY theory (rigid). Induced fit is the dynamic model."},
{l:12,s:"p23",q:"What happens to most enzymes at a very high temperature?",o:["They are denatured and activity falls sharply","Activity keeps increasing forever","They become more specific","They turn into substrates"],e:"Standard model (slide 23 is a picture): activity rises to an optimum, then falls when the enzyme denatures."},
{l:12,s:"p23",q:"The optimum temperature for most human enzymes is about:",o:["37℃","25℃","50℃","100℃"],e:"Body temperature. (Standard model — the slide shows it as a graph.)"},
{l:12,s:"p24",q:"Most enzymes in the body have an optimum pH of about:",o:["7.4","2","5","9"],e:"About 7.4, but some organs have enzymes with lower or higher optimum pH."},
{l:12,s:"p24",q:"Which enzyme works best at a very LOW pH (about 1.5–2)?",o:["Pepsin (stomach)","Trypsin","Pancreatic amylase","Salivary amylase"],e:"Standard values (the table on the slide is a picture — check it): pepsin ~1.5–2; trypsin ~8."},
{l:12,s:"p24",q:"Trypsin, working in the small intestine, has an optimum pH of about:",o:["~8","~2","~5","~11"],e:"Standard value (picture table)."},
{l:12,s:"p24",tf:1,q:"All enzymes in the body have an optimum pH of 7.4.",a:0,e:"False. Most are ~7.4, but enzymes in certain organs (e.g. pepsin in the stomach) work at lower or higher pH."},
{l:12,s:"p26",q:"What are the 3 types of enzyme inhibitors?",o:["Competitive, non-competitive, irreversible","Allosteric, zymogen, kinase","Reversible, permanent, temporary","Primary, secondary, tertiary"],e:"Competitive, non-competitive, irreversible."},
{l:12,s:"p27",q:"A competitive inhibitor:",o:["Has a structure similar to the substrate and competes for the active site","Binds away from the active site and distorts the enzyme","Bonds permanently to R groups","Is always a vitamin"],e:"Competitive: similar structure, competes for active site, reversed by ↑ substrate."},
{l:12,s:"p27",q:"The effect of a competitive inhibitor can be reversed by:",o:["Increasing substrate concentration","Increasing inhibitor concentration","Lowering the temperature","Nothing"],e:"More substrate outcompetes it."},
{l:12,s:"p27",q:"Malonate is a competitive inhibitor of:",o:["Succinate dehydrogenase","Carbonic anhydrase","Threonine deaminase","Trypsin"],e:"Malonate resembles succinate → competes at succinate dehydrogenase; reversed by adding succinate."},
{l:12,s:"p27",q:"Why can malonate inhibit succinate dehydrogenase?",o:["Its structure is similar to succinate","It destroys the enzyme's R groups","It binds to an allosteric site","It removes a phosphate"],e:"Similar structure → competes for the active site."},
{l:12,s:"p28",q:"A non-competitive inhibitor:",o:["Has a structure very different from the substrate and distorts the enzyme's shape, changing the active site","Looks like the substrate and competes for the active site","Is reversed by adding more substrate","Is a zymogen"],e:"Non-competitive: different structure, distorts enzyme, NOT reversed by more substrate."},
{l:12,s:"p28",tf:1,q:"Adding more substrate reverses non-competitive inhibition.",a:0,e:"False. Non-competitive inhibition CANNOT be reversed by more substrate (the active site shape is changed)."},
{l:12,s:"p29",q:"In irreversible inhibition, the inhibitor:",o:["Bonds with R groups at the active site and destroys enzyme activity","Competes with the substrate","Binds temporarily at an allosteric site","Is removed by adding substrate"],e:"Irreversible: bonds with active-site R groups → destroys activity."},
{l:12,s:"p30",q:"Competitive or non-competitive? Increasing substrate reverses the inhibition.",o:["Competitive","Non-competitive"],e:"A: competitive."},
{l:12,s:"p30",q:"Competitive or non-competitive? Binds to the enzyme surface but not to the active site.",o:["Non-competitive","Competitive"],e:"B: non-competitive."},
{l:12,s:"p30",q:"Competitive or non-competitive? Structure is similar to the substrate.",o:["Competitive","Non-competitive"],e:"C: competitive."},
{l:12,s:"p30",q:"Competitive or non-competitive? Inhibition is NOT reversed by adding more substrate.",o:["Non-competitive","Competitive"],e:"D: non-competitive. (Key: A 1, B 2, C 1, D 2 — options repeat.)"},
{l:12,s:"p27-29",q:"Inhibitor type: bonds with R groups at the active site and destroys enzyme activity.",o:["Irreversible","Competitive","Non-competitive"],e:"Irreversible."},
{l:12,s:"p32",q:"Which of these is NOT listed as a way to regulate enzyme activity?",o:["Hydrolysis of the substrate","Allosteric enzymes","Feedback control","Covalent modification (zymogens, phosphorylation)"],e:"Regulation: allosteric enzymes, feedback control, covalent modifications (zymogens, phosphorylation)."},
{l:12,s:"p32",q:"Zymogens and phosphorylation are both types of:",o:["Covalent modification","Allosteric regulation","Feedback control","Competitive inhibition"],e:"Covalent modifications."},
{l:12,s:"p33",q:"Allosteric enzymes bind a regulator molecule at:",o:["An allosteric site (not the active site)","The active site","The substrate","The ribosome"],e:"Regulator ≠ substrate; binds at the allosteric site."},
{l:12,s:"p34",q:"In feedback control:",o:["An end product binds the first enzyme (E1) of the pathway and shuts it down when enough product is present","The substrate activates the last enzyme","A zymogen is activated","A kinase adds a phosphate"],e:"End product acts as regulator on E1."},
{l:12,s:"p34",q:"In feedback control, the regulator is:",o:["The end product of the pathway","The first substrate","A vitamin","A metal ion"],e:"A product acts as the regulator."},
{l:12,s:"p35",q:"When isoleucine accumulates in a cell, it binds to:",o:["Threonine deaminase, the first enzyme in the pathway from threonine to isoleucine","Succinate dehydrogenase","The last enzyme of the pathway","Pepsinogen"],e:"Isoleucine → binds threonine deaminase (E1) → shape change blocks threonine binding → less isoleucine made."},
{l:12,s:"p35",q:"The effect of isoleucine binding to threonine deaminase is:",o:["It blocks threonine from binding, so isoleucine synthesis decreases","It increases isoleucine synthesis","It destroys the enzyme permanently","It activates pepsin"],e:"Feedback control ↓ synthesis."},
{l:12,s:"p35",tf:1,q:"Threonine deaminase is the LAST enzyme in the pathway from threonine to isoleucine.",a:0,e:"False. It is the FIRST enzyme (E1)."},
{l:12,s:"p36",q:"Zymogens (proenzymes) are:",o:["Inactive forms of enzymes, activated when one or more peptides are removed","Active enzymes that are phosphorylated","Coenzymes made from vitamins","Allosteric regulators"],e:"Zymogen = inactive; activated by removing peptide(s)."},
{l:12,s:"p37",q:"Pepsinogen is produced in the ___ and activated by ___.",o:["Stomach; HCl","Pancreas; enterokinase","Pancreas; trypsin","Duodenum; bile"],e:"Pepsinogen → pepsin in the stomach lumen by HCl."},
{l:12,s:"p37",q:"Trypsinogen is activated in the duodenum by:",o:["Enterokinase","HCl","Trypsin","Pepsin"],e:"Trypsinogen → trypsin by enterokinase."},
{l:12,s:"p37",q:"Chymotrypsinogen is activated by:",o:["Trypsin","Enterokinase","HCl","Pepsin"],e:"Chymotrypsinogen → chymotrypsin by trypsin (in the duodenum)."},
{l:12,s:"p37",q:"Procarboxypeptidase is activated by:",o:["Trypsin","Enterokinase","HCl","Chymotrypsin"],e:"Procarboxypeptidase → carboxypeptidase by trypsin."},
{l:12,s:"p37",q:"Which zymogen is produced in the STOMACH (not the pancreas)?",o:["Pepsinogen","Trypsinogen","Chymotrypsinogen","Procarboxypeptidase"],e:"Pepsinogen = stomach. The other three = pancreas."},
{l:12,s:"p37",q:"Activator: pepsinogen → pepsin.",o:["HCl","Enterokinase","Trypsin"],e:"HCl."},
{l:12,s:"p37",q:"Activator: trypsinogen → trypsin.",o:["Enterokinase","HCl","Trypsin"],e:"Enterokinase."},
{l:12,s:"p37",q:"Activator: chymotrypsinogen → chymotrypsin.",o:["Trypsin","Enterokinase","HCl"],e:"Trypsin."},
{l:12,s:"p37",q:"Activator: procarboxypeptidase → carboxypeptidase.",o:["Trypsin","HCl","Enterokinase"],e:"Trypsin."},
{l:12,s:"p37",q:"Which active enzyme digests proteins into peptides in the stomach?",o:["Pepsin","Trypsin","Carboxypeptidase","Chymotrypsin"],e:"Pepsin."},
{l:12,s:"p37",q:"Which active enzyme removes amino acids from the ends of peptides?",o:["Carboxypeptidase","Pepsin","Trypsin","Chymotrypsin"],e:"Carboxypeptidase."},
{l:12,s:"p37",q:"Why are digestive enzymes made as inactive zymogens? (Reasoning from the slide.)",o:["So they don't digest the organ that makes them before reaching where they are needed","Because they need a vitamin to be made","Because they are lipids","So they can be stored as glycogen"],e:"Produced in one organ, transported, then activated where needed by removing small peptide sections."},
{l:12,s:"p38",q:"Protein phosphorylation adds a phosphate group using which enzyme?",o:["Protein kinase","Phosphatase","Protease","Enterokinase"],e:"Kinase adds phosphate (reversible post-translational modification)."},
{l:12,s:"p38",q:"Protein phosphorylation is described as:",o:["A reversible post-translational modification","An irreversible inhibition","A type of hydrolysis","A zymogen activation"],e:"Reversible post-translational modification."},
{l:12,s:"p39",q:"The enzyme that REMOVES a phosphate group from a protein is a:",o:["Phosphatase","Kinase","Deaminase","Synthase"],e:"Phosphatase removes; kinase adds."},
{l:12,s:"p40",q:"Glycogen synthase is the key enzyme in:",o:["Glycogenesis (glucose → glycogen)","Releasing glucose from glycogen","Beta-oxidation","Protein digestion"],e:"Glycogen synthase = glycogenesis. Glycogen phosphorylase releases glucose from glycogen."},
{l:12,s:"p40",q:"Which enzyme releases glucose from glycogen?",o:["Glycogen phosphorylase","Glycogen synthase","Carbonic anhydrase","Pepsin"],e:"Glycogen phosphorylase."},
{l:12,s:"p41",q:"Glycogen PHOSPHORYLASE is activated by:",o:["Phosphorylation","Dephosphorylation","Removal of a peptide","Zinc"],e:"Phosphorylase ← phosphorylation. Synthase ← dephosphorylation."},
{l:12,s:"p41",q:"Glycogen SYNTHASE is activated by:",o:["Dephosphorylation","Phosphorylation","HCl","Enterokinase"],e:"Synthase ← dephosphorylation."},
{l:12,s:"p41",q:"Activated by phosphorylation or dephosphorylation? Glycogen phosphorylase.",o:["Phosphorylation","Dephosphorylation"],e:"Phosphorylation."},
{l:12,s:"p41",q:"Activated by phosphorylation or dephosphorylation? Glycogen synthase.",o:["Dephosphorylation","Phosphorylation"],e:"Dephosphorylation."},
{l:12,s:"p44",q:"A simple enzyme is:",o:["An active enzyme that consists only of protein","An enzyme that needs a metal ion","An inactive zymogen","A coenzyme"],e:"Simple enzyme = protein only."},
{l:12,s:"p44",q:"A coenzyme is:",o:["A cofactor that is a small organic molecule, such as a vitamin","A metal ion cofactor","An inactive enzyme","A competitive inhibitor"],e:"Coenzyme = organic cofactor (vitamin). Metal ions are inorganic cofactors."},
{l:12,s:"p44",q:"Cofactor or coenzyme? A vitamin-derived small organic molecule.",o:["Coenzyme (a type of cofactor)","Inorganic cofactor (metal ion)"],e:"Coenzyme."},
{l:12,s:"p44",q:"Cofactor or coenzyme? Zn²⁺ in carbonic anhydrase.",o:["Inorganic cofactor (metal ion)","Coenzyme (a type of cofactor)"],e:"Metal ion = inorganic cofactor."},
{l:12,s:"p45",q:"About what fraction of known enzymes need metallic cations for full activity?",o:["Over a quarter","About 1%","About half","All of them"],e:"Over a quarter."},
{l:12,s:"p46",q:"Carbonic anhydrase requires which metal?",o:["Zinc (Zn²⁺)","Iron (Fe²⁺)","Copper (Cu²⁺)","Magnesium (Mg²⁺)"],e:"Zinc (links to L1: Zn = enzyme cofactor)."},
{l:12,s:"p46",q:"In carbonic anhydrase, the zinc atom is bound to the side chains of three ___ residues.",o:["Histidine","Cysteine","Serine","Glycine"],e:"Three histidines + one water molecule."},
{l:12,s:"p46",q:"The zinc in carbonic anhydrase produces a nucleophilic ___ that attacks the substrate.",o:["Hydroxide ion","Hydrogen ion","Chloride ion","Phosphate"],e:"Zinc-bound water → hydroxide ion (OH⁻)."},
{l:12,s:"p46",q:"A dietary zinc deficiency could disrupt:",o:["The body's pH and CO₂ balance (via carbonic anhydrase)","Collagen triple helix","Mitochondrial DNA","Stomach acid activation of pepsin"],e:"Impaired carbonic anhydrase → disrupted pH & CO₂ balance."},
{l:12,s:"p47",q:"Many coenzymes are derived from:",o:["Vitamins","Metal ions","Amino acids only","Steroids"],e:"Vitamins — essential for metabolism, growth and development."},
{l:12,s:"p47",q:"NAD⁺ is a coenzyme derived from which vitamin?",o:["Niacin (B3)","Riboflavin (B2)","Thiamine (B1)","Vitamin C"],e:"Standard (the coenzyme–vitamin table on the slide is a picture — check it): NAD⁺ ← niacin; FAD ← riboflavin; coenzyme A ← pantothenic acid."},
{l:12,s:"p48",q:"The role of a coenzyme is to:",o:["Prepare the active site for catalytic activity","Permanently inhibit the enzyme","Replace the substrate","Break down the enzyme"],e:"A coenzyme prepares the active site."},
{l:12,s:"p8",type:"fill",q:"Enzymes speed up reactions by lowering the ________ energy.",ans:["activation"],e:"Activation energy."},
{l:12,s:"p20",type:"fill",q:"The model in which the active site is flexible and adapts to the substrate is the ________ model.",ans:["induced-fit","induced fit","inducedfit"],e:"Induced-fit."},
{l:12,s:"p36",type:"fill",q:"An inactive precursor form of an enzyme, activated by removing peptides, is called a ________ (or proenzyme).",ans:["zymogen"],e:"Zymogen."},
{l:12,s:"p37",type:"fill",q:"Trypsinogen is activated in the duodenum by ________.",ans:["enterokinase"],e:"Enterokinase."},
{l:12,s:"p38",type:"fill",q:"An enzyme that adds a phosphate group to a protein is a protein ________.",ans:["kinase"],e:"Kinase."},
{l:12,s:"p46",type:"fill",q:"Carbonic anhydrase requires the metal ion ________ as a cofactor.",ans:["zinc","zn","zn2+"],e:"Zinc."},
{l:12,s:"p27-30",type:"saq",q:"Compare competitive, non-competitive and irreversible enzyme inhibition, and give the lecture example of a competitive inhibitor.",model:"Competitive inhibitor: structure similar to the substrate; competes with the substrate for the active site; its effect is reversed by increasing substrate concentration. Example: malonate inhibits succinate dehydrogenase because it resembles succinate; adding succinate reverses it. Non-competitive inhibitor: structure very different from the substrate; binds the enzyme elsewhere (not the active site), distorting the enzyme's shape and the active site, so the substrate cannot bind; not reversed by adding more substrate. Irreversible inhibitor: bonds with R groups at the active site and destroys enzyme activity.",points:["Competitive: similar structure, competes for active site","Competitive: reversed by ↑ substrate; malonate / succinate dehydrogenase","Non-competitive: different structure, binds elsewhere, distorts active site","Non-competitive: not reversed by ↑ substrate","Irreversible: bonds to active-site R groups, destroys activity"],e:"Slides 26–30."},
{l:12,s:"p32-41",type:"saq",q:"Describe three ways enzyme activity is regulated, with an example from the lecture for each.",model:"(1) Allosteric regulation / feedback control: a regulator (often the end product) binds the allosteric site of the first enzyme of a pathway and changes its shape — e.g. isoleucine binds threonine deaminase, blocking threonine binding and decreasing isoleucine synthesis. (2) Zymogens: enzymes made as inactive proenzymes and activated by removing peptides — e.g. pepsinogen → pepsin by HCl in the stomach; trypsinogen → trypsin by enterokinase in the duodenum. (3) Phosphorylation (covalent modification): a kinase adds a phosphate and a phosphatase removes it, switching enzymes on or off — e.g. glycogen phosphorylase is activated by phosphorylation, glycogen synthase by dephosphorylation.",points:["Allosteric/feedback: end product binds E1 at allosteric site","Example: isoleucine → threonine deaminase","Zymogen activation by peptide removal (pepsinogen/HCl or trypsinogen/enterokinase)","Phosphorylation: kinase adds, phosphatase removes","Example: phosphorylase ← phosphorylation; synthase ← dephosphorylation"],e:"Slides 32–41."}
);

</script>
<script>
(function(){
const LECT={1:"Basic chemistry: atoms, elements & bonds",2:"Chemical reactions, pH & buffers",3:"Homeostasis & feedback",4:"Thermoregulation",5:"Cell structure & tissues",6:"Cellular transport & fluid shifts",8:"Body organization & integumentary system",9:"Water & fluid balance",10:"Biomolecules",11:"Energy & metabolism",12:"Enzymes as biocatalysts"};
const LS=[1,2,3,4,5,6,8,9,10,11,12];
const lab=l=>l===6?"L6–7":"L"+l;
const EXAM=new Date(2026,9,6,0,0,0);
const KEY="nurs1604-midterm-v1";
const MOCK_A=40, MOCK_B=5, MOCK_MIN=60;
const kind=q=>q.type||(q.tf?"tf":"mcq");
const isObj=q=>{const k=kind(q);return k==="mcq"||k==="tf";};
const TYPE_TAG={tf:"True / False",fill:"Fill in the blank",num:"Calculation",saq:"Short answer"};

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
Q.forEach(q=>{q.id=q.l+"-"+hash(q.q);});

let S={q:{},sel:LS.slice(),resetAt:0};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.q)S={q:p.q,sel:Array.isArray(p.sel)&&p.sel.length?p.sel.filter(l=>LS.includes(l)):S.sel,resetAt:p.resetAt||0};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}schedulePush();}
function st(id){return S.q[id]||(S.q[id]={n:0,r:0,s:0,b:0,t:0});}
function record(q,ok){const x=st(q.id);x.n++;x.t=Date.now();if(ok){x.r++;x.s++;if(x.s>=2)x.b=0;}else{x.s=0;x.b=1;}save();}

/* ---------- SYNC (local-first; the private per-account db doc is the meeting point) ---------- */
const SYNC={state:"local",ref:null,writing:false,again:false,timer:null};
let view="home";
function syncLabel(){
  return {local:`<span class="dot" style="background:var(--muted)"></span>Saved on this device only`,
    syncing:`<span class="dot" style="background:var(--lamp)"></span>Syncing…`,
    synced:`<span class="dot" style="background:var(--ok)"></span>Synced to your account (Mac, iPad…)`,
    offline:`<span class="dot" style="background:var(--bad)"></span>Offline, saved on this device. Will sync when you're back online`}[SYNC.state];
}
function setSync(s){SYNC.state=s;const el=document.getElementById("sync");if(el)el.innerHTML=syncLabel();}
function merge(remote){
  let changed=false;const rr=remote.resetAt||0;
  if(rr>(S.resetAt||0)){S.resetAt=rr;for(const id in S.q){if((S.q[id].t||0)<rr){delete S.q[id];changed=true;}}}
  const rq=remote.q||{};
  for(const id in rq){const r=rq[id],l=S.q[id];if((r.t||0)<(S.resetAt||0))continue;
    if(!l||(r.t||0)>(l.t||0)){S.q[id]={n:r.n|0,r:r.r|0,s:r.s|0,b:r.b|0,t:r.t||0};changed=true;}}
  return changed;
}
function localAhead(remote){
  if((S.resetAt||0)>(remote.resetAt||0))return true;
  const rq=remote.q||{};
  for(const id in S.q){const r=rq[id];if(!r||(S.q[id].t||0)>(r.t||0))return true;}
  return false;
}
function schedulePush(delay){if(!SYNC.ref)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,delay==null?1500:delay);}
async function push(){
  if(!SYNC.ref)return;
  if(SYNC.writing){SYNC.again=true;return;}
  SYNC.writing=true;SYNC.again=false;if(SYNC.state!=="synced")setSync("syncing");
  try{await SYNC.ref.set({v:1,q:S.q,resetAt:S.resetAt||0,at:Date.now()});setSync("synced");}
  catch(e){setSync(e&&e.code==="revoked"?"local":"offline");if(e&&e.code!=="revoked")schedulePush(30000);}
  finally{SYNC.writing=false;if(SYNC.again)schedulePush(300);}
}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(!snap.exists){if(Object.keys(S.q).length||S.resetAt)schedulePush(0);else setSync("synced");return;}
  const d=snap.data()||{};
  if(merge(d)){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(view==="home")home();}
  if(localAhead(d))schedulePush(0);else if(!SYNC.writing)setSync("synced");
}
function subscribe(){
  SYNC.ref.onSnapshot(onRemote,e=>{setSync(e&&e.code==="revoked"?"local":"offline");if(!e||e.code!=="revoked")setTimeout(subscribe,30000);});
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    SYNC.ref=db.doc("data/users/"+uid+"/progress");setSync("syncing");subscribe();
  }catch(e){setSync("local");}
})();
window.addEventListener("online",()=>schedulePush(0));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")schedulePush(0);});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const app=document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){return Q.filter(q=>S.sel.includes(q.l));}
function options(q){
  if(q.tf)return [{t:"True",c:q.a===1},{t:"False",c:q.a===0}];
  return shuffle(q.o.map((t,i)=>({t,c:i===0})));
}
function mkItem(q){return {q,opts:isObj(q)?options(q):null,ch:null,txt:"",fin:false,ok:null,rev:false,ticks:[]};}
function bookList(){return pool().filter(q=>S.q[q.id]&&S.q[q.id].b);}
const norm=s=>String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
function autoMark(q,txt){
  const k=kind(q);
  if(k==="fill"){const t=norm(txt);return !!t&&q.ans.some(a=>norm(a)===t);}
  if(k==="num"){const v=parseFloat(String(txt).replace(/[^0-9.\-]/g,""));return isFinite(v)&&Math.abs(v-q.ans)<=q.tol+1e-9;}
  return false;
}
const rightAnswer=q=>{const k=kind(q);if(k==="fill")return q.ans[0];if(k==="num")return q.ans+(q.unit?" "+q.unit:"");if(k==="tf")return q.a?"True":"False";if(k==="saq")return "(see model answer)";return q.o[0];};
const answered=it=>isObj(it.q)?it.ch!==null:it.txt.trim()!=="";

let quiz=null, timerId=null;

/* ---------- HOME ---------- */
function home(){
  clearInterval(timerId);quiz=null;view="home";
  const all=Q.length, seen=Q.filter(q=>S.q[q.id]&&S.q[q.id].n).length;
  let n=0,r=0;Object.values(S.q).forEach(x=>{n+=x.n;r+=x.r;});
  const book=Q.filter(q=>S.q[q.id]&&S.q[q.id].b).length, selBook=bookList().length;
  const days=Math.ceil((EXAM-new Date())/864e5);
  const dayTxt=days>1?days+" days":days===1?"1 day":days===0?"Today":"Done";
  const p=pool().length, pObj=pool().filter(isObj).length;
  let h=`<header class="top"><div class="brand"><span class="eyebrow">NURS1604 · Foundation of Life Sciences</span><h1>Mid-term Drill<span class="flame" aria-hidden="true"></span></h1></div>
  <div class="exam"><span class="days num">${dayTxt}</span><span class="sub">Tue 6 Oct · 10:45 · L1–12 · 60 min</span></div></header>
  <div class="stats">
   <div class="stat"><b>${seen}<small style="font-size:13px;color:var(--muted)">/${all}</small></b><span>Questions seen</span></div>
   <div class="stat"><b>${n?Math.round(r/n*100)+"%":"—"}</b><span>Accuracy (${n} answers)</span></div>
   <div class="stat"><b style="color:${book?"var(--bad)":"inherit"}">${book}</b><span>Wrong answers to redo</span></div>
   <div class="stat"><b>${p}</b><span>In selected lectures</span></div>
  </div>
  <div class="modes">
   <button class="mode primary" id="m-practice" ${p?"":"disabled"}><span class="t">Endless practice</span><span class="d">Random order, never ends. New and wrong questions come up more often. Answer and explanation straight away.</span></button>
   <button class="mode" id="m-mock" ${pObj>=20?"":"disabled"}><span class="t">Mock test</span><span class="d">${MOCK_A} MCQ/TF + ${MOCK_B} short answer · ${MOCK_MIN} min · results at the end.</span></button>
   <button class="mode" id="m-book" ${selBook?"":"disabled"}><span class="t">Redo wrong answers <span class="num">(${selBook})</span></span><span class="d">Get a question right twice in a row and it leaves this list.</span></button>
  </div>
  <section class="sec"><div class="sec-head"><h2>Lectures</h2><span><button class="link" id="sel-all">Select all</button> · <button class="link" id="sel-none">Clear</button></span></div>
  <div class="lects">`;
  for(const l of LS){
    const qs=Q.filter(q=>q.l===l), tot=qs.length;
    const m=qs.filter(q=>S.q[q.id]&&S.q[q.id].s>=1).length, w=qs.filter(q=>S.q[q.id]&&S.q[q.id].b).length;
    const on=S.sel.includes(l);
    h+=`<label class="chip ${on?"":"off"}"><input type="checkbox" data-l="${l}" ${on?"checked":""}>
      <span class="nm"><b><span class="ln">${lab(l)}</span>${esc(LECT[l])}</b><span class="bar"><i class="m" style="width:${m/tot*100}%"></i><i class="w" style="width:${w/tot*100}%"></i></span></span>
      <span class="ct">${m}/${tot}</span></label>`;
  }
  h+=`</div><div class="legend"><span><i style="background:var(--ok)"></i>Last answer right</span><span><i style="background:var(--bad)"></i>In wrong-answers list</span></div></section>
  <p class="note"><strong>Unofficial practice questions.</strong> Written with AI help from the lecture slides by a classmate, not by the lecturers, so some may be wrong. Every question shows its slide number: check the slide when in doubt. Spotted a mistake? Screenshot it and send it to whoever shared this link. Your progress is saved in this browser only.</p>
  <p class="note"><strong>Real test format</strong> (course manual p.8): multiple-choice + short-answer questions, 60 minutes. The manual doesn't give the number of questions, so the mock uses ${MOCK_A} + ${MOCK_B} as a guess. Short answers are practised three ways: <strong>fill in the blank</strong> and <strong>calculations</strong> are marked automatically; for <strong>short answer</strong> questions, write your answer, then tick the marking points you covered. Matching exercises become one MCQ per item, and options repeat like in real matching questions.</p>
  <p class="note"><strong>Not in this bank yet:</strong> Tutorial 1 (added after you hand it in), R1–R2 review lectures (slides not in the folder), and a few slides that give away Tutorial 1 answers (L3 p5 & p9 glucose/insulin, L10 p15–16, L11 p13–14).</p>
  <p class="note syncline"><span id="sync">${syncLabel()}</span> · <span id="reset-zone"><button class="link" id="reset">Reset progress</button></span></p>`;
  app.innerHTML=h;
  app.querySelectorAll(".chip input").forEach(c=>c.addEventListener("change",()=>{
    const l=+c.dataset.l;S.sel=c.checked?[...new Set([...S.sel,l])].sort((a,b)=>a-b):S.sel.filter(x=>x!==l);save();home();
  }));
  document.getElementById("sel-all").onclick=()=>{S.sel=LS.slice();save();home();};
