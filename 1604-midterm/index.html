{l:4,s:"p27",q:"Skin colour/moisture: heat stroke.",o:["Red/warm, dry","Red, moist","Pale, moist"],e:"Dry: not enough fluid for the sweat glands."},
{l:4,s:"p27",q:"Why is the skin PALE in heat exhaustion?",o:["Low blood volume decreases blood flow, which cannot meet the needs of muscle and skin","Skin arterioles are dilated","The sweat glands have stopped working","Adrenaline makes the skin pale in all heat illness"],e:"More severe dehydration → low blood volume → decreased blood flow to muscle & skin."},
{l:4,s:"p27",q:"Heat stroke is caused by:",o:["Untreated, prolonged heat exhaustion that breaks down the thermoregulation mechanism","Mild Na⁺ loss only","Sunburn","Too much shivering"],e:"Untreated prolonged heat exhaustion → thermoregulation breaks down; may lead to coma or death."},
{l:4,s:"p27",q:"Why is the heart rate rapid in heat stroke (from the lecture)?",o:["The heart pumps faster to maintain blood flow when blood volume is low","Adrenaline from shivering","The hypothalamus is cooling the blood","Because the skin is moist"],e:"From your notes: compensating for the lower blood volume."},
{l:4,s:"p27",tf:1,q:"Heat cramps are triggered by Na⁺ loss and dehydration.",a:1,e:"True."},
{l:4,s:"p27",tf:1,q:"In heat stroke, the skin is typically pale and moist.",a:0,e:"False. Heat stroke = red/warm DRY skin. Pale moist = heat exhaustion."},
{l:4,s:"p17",type:"fill",q:"The control center for thermoregulation is the ________.",ans:["hypothalamus"],e:"Hypothalamus."},
{l:4,s:"p14",type:"fill",q:"Heat transfer through direct contact with the body surface is called ________.",ans:["conduction"],e:"Conduction."},
{l:4,s:"p13",type:"fill",q:"The environmental temperature range (25–30℃) where body temperature is controlled only by skin blood flow is the ________ zone.",ans:["thermoneutral"],e:"Thermoneutral zone."},
{l:4,s:"p23",type:"fill",q:"Regulation that responds before the feedback system, to minimize changes in a regulated variable, is called ________ regulation.",ans:["feedforward","feed-forward","feed forward"],e:"Feedforward."},
{l:4,s:"p17-19",type:"saq",q:"Describe how the body responds to a COLD environment. Name the receptors, the control center, and at least three effector responses.",model:"Peripheral thermoreceptors in the skin and central thermoreceptors in the abdominal organs and hypothalamus detect the fall in temperature. The hypothalamus (control center) sends signals to the effectors. Heat production goes up: skeletal muscle shivers (involuntary contraction that generates heat), and the adrenal medulla secretes adrenaline, which increases basal metabolism. Heat loss goes down: skin arterioles constrict and shunt vessels dilate, so less blood flows to the skin; sweating stops. Skin receptors can also trigger these responses by feedforward before the core temperature falls.",points:["Peripheral (skin) + central (abdominal organs, hypothalamus) thermoreceptors","Hypothalamus = control center","Shivering (involuntary skeletal muscle contraction → heat)","Adrenal medulla → adrenaline → ↑ basal metabolism","Skin arterioles constrict / shunt vessels dilate; no sweat"],e:"Slides 17–19."},
{l:4,s:"p27",type:"saq",q:"Compare heat cramps, heat exhaustion and heat stroke: the skin signs, the cause, and their order of severity.",model:"Heat cramps (mildest): painful involuntary muscle cramps, red moist skin; triggered by Na⁺ loss and dehydration. Heat exhaustion: muscle cramp, fatigue, pale moist skin, fainting, dizziness, nausea, vomiting; triggered by more severe dehydration, so low blood volume decreases blood flow, which cannot meet the needs of muscle and skin. Heat stroke (most severe): muscle cramp, red/warm DRY skin, rapid heart rate, seizure; due to untreated prolonged heat exhaustion that breaks down thermoregulation; may lead to coma or death.",points:["Severity: cramps < exhaustion < stroke","Cramps: red moist skin; Na⁺ loss + dehydration","Exhaustion: pale moist skin; severe dehydration → low blood volume","Stroke: red/warm dry skin, rapid HR, seizure; thermoregulation breaks down"],e:"Slide 27."}
);

// L5 — Introduction of cell structure & functions (Dr Philip Hung)
Q.push(
{l:5,s:"p3",q:"The basic unit of life is the:",o:["Cell","Tissue","Organ","Atom"],e:"Cell = basic unit of life."},
{l:5,s:"p3",q:"An adult human is made up of about how many cells?",o:["30 trillion","30 billion","30 million","300 trillion"],e:"About 30 trillion cells, mostly organized into tissues."},
{l:5,s:"p3",q:"Put these in order of size, from smallest: bacteria, yeast, human cell, frog egg.",o:["Bacteria (1–2 µm) → yeast (5 µm) → human cell (20 µm) → frog egg (1 mm)","Yeast → bacteria → human cell → frog egg","Bacteria → human cell → yeast → frog egg","Human cell → bacteria → yeast → frog egg"],e:"Bacteria 1–2 µm < yeast 5 µm < human cell 20 µm < frog egg 1 mm."},
{l:5,s:"p3",q:"A typical human cell is about:",o:["20 µm","2 µm","1 mm","5 µm"],e:"Human cell ~20 µm (yeast 5 µm, bacteria 1–2 µm, frog egg 1 mm)."},
{l:5,s:"p4",q:"In the \"cell as a factory\" analogy, the nucleus is the:",o:["Information center","Wall boundary and guard center","Production worker","Security"],e:"Nucleus contains inherited material (DNA) = information center. Plasma membrane = wall boundary and guard center."},
{l:5,s:"p4",q:"In the \"cell as a factory\" analogy, the plasma membrane is the:",o:["Wall boundary and guard center","Information center","Power plant","Boss"],e:"It encloses the cell (wall) and controls what passes (guard)."},
{l:5,s:"p4",q:"The content of the cell (inside the plasma membrane) is called the:",o:["Cytoplasm","Nucleoplasm","Extracellular matrix","Interstitial fluid"],e:"Cell content = CYTOPLASM, with organelles (departments)."},
{l:5,s:"p5",q:"What are the 3 major components of a human cell?",o:["Plasma membrane, cytoplasm, nucleus","Cell wall, cytoplasm, nucleus","Plasma membrane, mitochondria, ribosome","Nucleus, Golgi, ER"],e:"Plasma membrane, cytoplasm, nucleus."},
{l:5,s:"p5",q:"The plasma membrane is described as:",o:["Selectively permeable","Fully permeable","Impermeable","Only permeable to ions"],e:"Encloses the cell; selectively permeable."},
{l:5,s:"p5",q:"The nucleus is the site of:",o:["RNA production (the region with DNA)","ATP production","Protein modification","Protein synthesis using ribosomes"],e:"Nucleus: one of the organelles; region with DNA; site of RNA production."},
{l:5,s:"p5",tf:1,q:"The nucleus is one of the organelles.",a:1,e:"True — slide 5 lists it as \"one of organelles\"."},
{l:5,s:"p6",q:"Which organelle produces ATP?",o:["Mitochondria","Golgi apparatus","Endoplasmic reticulum","Nucleus"],e:"Mitochondria = ATP production."},
{l:5,s:"p6",q:"Which organelle carries out protein MODIFICATIONS?",o:["Golgi apparatus","Mitochondria","Endoplasmic reticulum","Nucleus"],e:"Golgi = protein modifications."},
{l:5,s:"p6",q:"Which organelle carries out protein SYNTHESIS using ribosomes?",o:["Endoplasmic reticulum","Golgi apparatus","Mitochondria","Nucleus"],e:"ER = protein synthesis using ribosomes."},
{l:5,s:"p5-6",q:"Organelle function: site of RNA production.",o:["Nucleus","Mitochondria","Golgi apparatus","Endoplasmic reticulum"],e:"Nucleus. (Options repeat across these items.)"},
{l:5,s:"p5-6",q:"Organelle function: ATP production.",o:["Mitochondria","Nucleus","Golgi apparatus","Endoplasmic reticulum"],e:"Mitochondria."},
{l:5,s:"p7",q:"Mitochondrial DNA is inherited from:",o:["The mother only","The father only","Both parents equally","Neither parent — it is made new"],e:"Only the egg contributes mitochondria and mitochondrial DNA to the zygote."},
{l:5,s:"p7",q:"Which statement about the zygote is correct?",o:["Both sperm and egg give nuclear DNA, but only the egg gives mitochondria","Only the sperm gives mitochondria","Only the egg gives nuclear DNA","Both give mitochondrial DNA equally"],e:"Nuclear DNA from both; mitochondrial DNA from the egg only."},
{l:5,s:"p8",q:"A woman has a mitochondrial disease. Which children can inherit it?",o:["Both her sons and daughters","Only her sons","Only her daughters","None of her children"],e:"Mitochondria come from the mother's egg, so ALL her children can inherit it."},
{l:5,s:"p8",q:"A man has a mitochondrial disease; his wife is healthy. Can their children inherit it from him?",o:["No — mitochondrial defects only come from the mother","Yes — all his children","Only his sons","Only his daughters"],e:"The father doesn't pass on mitochondria."},
{l:5,s:"p8",tf:1,q:"A diseased father can pass a mitochondrial defect to his daughters but not his sons.",a:0,e:"False. Fathers do not pass on mitochondrial DNA to any child."},
{l:5,s:"p9",q:"In a complex organism, cells are specialized and grouped into:",o:["Tissues that perform a common function","Organelles","Atoms","Molecules"],e:"Cells are specialized and grouped into tissues that perform a common function."},
{l:5,s:"p10",q:"What are the 4 types of tissue in the human body?",o:["Epithelial, connective, muscle, neural","Epithelial, adipose, bone, blood","Skin, muscle, bone, nerve","Connective, cartilage, muscle, glandular"],e:"Epithelial, connective, muscle, neural."},
{l:5,s:"p10",q:"Which tissue type covers organ surfaces for protection or absorption and forms glands?",o:["Epithelial","Connective","Muscle","Neural"],e:"Epithelial."},
{l:5,s:"p10",q:"Which tissue type supports, binds and cushions organs?",o:["Connective","Epithelial","Muscle","Neural"],e:"Connective."},
{l:5,s:"p10",q:"Which tissue type sends signals rapidly to other cells?",o:["Neural","Muscle","Epithelial","Connective"],e:"Neural."},
{l:5,s:"p10",q:"Tissue type: tendons and ligaments.",o:["Connective","Epithelial","Muscle","Neural"],e:"Connective: tendons, ligaments, cartilage, bones, blood, lymph."},
{l:5,s:"p10",q:"Tissue type: blood and lymph.",o:["Connective","Epithelial","Muscle","Neural"],e:"Blood and lymph are connective tissue."},
{l:5,s:"p10",q:"Tissue type: outer layer of the skin (epidermis).",o:["Epithelial","Connective","Muscle","Neural"],e:"Epithelial."},
{l:5,s:"p10",q:"Tissue type: spinal cord.",o:["Neural","Connective","Muscle","Epithelial"],e:"Neural: brain, spinal cord, nerves."},
{l:5,s:"p10",q:"Tissue type: lining of internal organs.",o:["Epithelial","Connective","Muscle","Neural"],e:"Epithelial."},
{l:5,s:"p10",q:"Tissue type: cartilage and bones.",o:["Connective","Epithelial","Muscle","Neural"],e:"Connective."},
{l:5,s:"p10",q:"Tissue type: heart.",o:["Muscle","Connective","Neural","Epithelial"],e:"Muscle: skeletal (limbs), heart, internal organs."},
{l:5,s:"p11",q:"Which is a characteristic of epithelial tissue?",o:["It is avascular","It is highly vascular","Its cells are loosely scattered in matrix","It cannot regenerate"],e:"Epithelium: tightly packed, avascular, polarity, regenerates."},
{l:5,s:"p11",q:"\"Avascular\" means:",o:["Not associated with blood and lymphatic vessels","Having many blood vessels","Having no nuclei","Unable to regenerate"],e:"Avascular = no blood & lymphatic vessels."},
{l:5,s:"p11",q:"In epithelium, the APICAL side is:",o:["The surface exposed to the lumen","The side attached to the basement membrane","The side next to muscle","The inside of the nucleus"],e:"Apical = exposed to lumen. Basal = attached to basement membrane. (Your ? on polarity.)"},
{l:5,s:"p11",q:"In epithelium, the BASAL side is:",o:["Attached to the basement membrane","Exposed to the lumen","Covered in cilia","Facing the air"],e:"Basal side → basement membrane."},
{l:5,s:"p11",q:"Having an apical side and a basal side is called:",o:["Polarity","Avascularity","Stratification","Specificity"],e:"Epithelium exhibits polarity."},
{l:5,s:"p11",tf:1,q:"Epithelial tissue can regenerate.",a:1,e:"True."},
{l:5,s:"p11",tf:1,q:"Epithelial tissue is highly vascular.",a:0,e:"False. Epithelium is AVASCULAR. Connective tissue is highly vascular."},
{l:5,s:"p13",q:"Cilia on the apical surface are found in the:",o:["Trachea","Small intestine","Skin","Bone"],e:"Cilia: trachea. Microvilli: small intestine & urinary tract."},
{l:5,s:"p13",q:"Microvilli on the apical surface are found in the:",o:["Small intestine and urinary tract","Trachea","Epidermis","Tendons"],e:"Microvilli: small intestine & urinary tract."},
{l:5,s:"p14",q:"Squamous epithelial cells are:",o:["Thin and flat with an irregular shape","Hexagonal, appear square in cross-section","Hexagonal, appear rectangular in cross-section","Multi-nucleated"],e:"Squamous (\"squam\" = scale): thin, flat, irregular."},
{l:5,s:"p14",q:"Epithelial cells that are hexagonal but look SQUARE in cross-section are:",o:["Cuboidal","Columnar","Squamous","Pseudo-columnar"],e:"Cuboidal = square in section; columnar = rectangle in section."},
{l:5,s:"p14",q:"Epithelial cells that are hexagonal but look RECTANGULAR in cross-section are:",o:["Columnar","Cuboidal","Squamous","Stratified"],e:"Columnar."},
{l:5,s:"p14",q:"The trachea epithelium looks stratified because its nuclei are at different levels, but it has only one layer. It is called:",o:["Pseudo-columnar (pseudostratified columnar)","Stratified squamous","Simple cuboidal","Stratified columnar"],e:"Slide wording: \"pseudo-columnar\" — textbooks call it pseudostratified columnar."},
{l:5,s:"p14",q:"An epithelium with a single layer of cells is called:",o:["Simple","Stratified","Pseudostratified","Compound"],e:"Single layer = simple; multiple layers = stratified."},
{l:5,s:"p14",q:"An epithelium with multiple layers of cells is called:",o:["Stratified","Simple","Squamous","Avascular"],e:"Stratified = multilayer."},
{l:5,s:"p14",tf:1,q:"Pseudo-columnar epithelium in the trachea truly has several layers of cells.",a:0,e:"False. It SEEMS stratified (nuclei at different levels) but has only ONE layer."},
{l:5,s:"p14",q:"Epithelium is classified by which two features?",o:["Cell shape and number of cell layers","Colour and size","Blood supply and nerve supply","Location and function only"],e:"Shape (squamous/cuboidal/columnar) + layers (simple/stratified)."},
{l:5,s:"p16",q:"The oesophagus is lined by:",o:["Stratified squamous epithelium","Simple columnar epithelium","Stratified columnar epithelium","Simple squamous epithelium"],e:"Slide 16 examples: oesophagus = stratified squamous; jejunum = simple columnar; salivary glands = stratified columnar."},
{l:5,s:"p16",q:"The jejunum is lined by:",o:["Simple columnar epithelium","Stratified squamous epithelium","Stratified columnar epithelium","Pseudo-columnar epithelium"],e:"Jejunum = simple columnar."},
{l:5,s:"p16",q:"Salivary glands are given as an example of:",o:["Stratified columnar epithelium","Simple columnar epithelium","Stratified squamous epithelium","Simple cuboidal epithelium"],e:"Salivary glands = stratified columnar."},
{l:5,s:"p17",q:"A gland whose secretions go into a DUCT is:",o:["Exocrine","Endocrine","Paracrine","Apocrine"],e:"Exocrine = into a duct (e.g. sweat gland, lining of digestive tract). Endocrine = into the blood."},
{l:5,s:"p17",q:"A gland whose secretions go into the BLOOD is:",o:["Endocrine","Exocrine","Sebaceous","Ductal"],e:"Endocrine, e.g. adrenal gland."},
{l:5,s:"p17",q:"Exocrine or endocrine? Sweat gland.",o:["Exocrine","Endocrine"],e:"Exocrine (into a duct)."},
{l:5,s:"p17",q:"Exocrine or endocrine? Adrenal gland.",o:["Endocrine","Exocrine"],e:"Endocrine (into blood)."},
{l:5,s:"p17",q:"Exocrine or endocrine? Glands in the lining of the digestive tract.",o:["Exocrine","Endocrine"],e:"Exocrine (slide 17 example)."},
{l:5,s:"p18",q:"Which is a characteristic of connective tissue?",o:["Highly vascular and lies in extracellular matrix","Avascular and tightly packed","Has an apical and basal side","Cannot regenerate"],e:"Connective: highly vascular, lies in ECM, regenerates, under epithelium, separated from it by a basement membrane."},
{l:5,s:"p18",q:"Connective tissue is separated from epithelium by a:",o:["Basement membrane","Plasma membrane","Serous membrane","Synovial membrane"],e:"Basement membrane."},
{l:5,s:"p19",q:"What are the 3 major components of connective tissue?",o:["Extracellular protein fibers, ground substance, specialized cells","Collagen, elastin, keratin","Epithelium, basement membrane, lumen","Plasma, platelets, red cells"],e:"Fibers + ground substance + specialized cells (together fibers + ground substance = ECM)."},
{l:5,s:"p19",q:"What are the 3 types of extracellular protein fibers in connective tissue?",o:["Collagen, elastic, reticular","Collagen, keratin, actin","Elastic, muscle, nerve","Reticular, keratin, myosin"],e:"Collagen, elastic, reticular."},
{l:5,s:"p19",q:"The gel-like substance of connective tissue is the:",o:["Ground substance","Basement membrane","Cytoplasm","Plasma"],e:"Ground substance = gel-like."},
{l:5,s:"p20",q:"Which fibers exist as unbranched bundles and are found in ALL connective tissues?",o:["Collagen fibers","Elastic fibers","Reticular fibers","Keratin fibers"],e:"Collagen: bundles, unbranched, in all connective tissues."},
{l:5,s:"p20",q:"Which fibers are made of a spring-like protein, form a branched network, and are thin but easy to stretch?",o:["Elastic fibers","Collagen fibers","Reticular fibers","Muscle fibers"],e:"Elastic fibers (elastin), e.g. blood vessels, vocal cord, skin."},
{l:5,s:"p20",q:"Elastic fibers are made of the protein:",o:["Elastin","Collagen","Keratin","Reticulin"],e:"Elastin."},
{l:5,s:"p21",q:"Reticular fibers are:",o:["Collagen fibers arranged in a network that support delicate soft tissue","Spring-like elastin in a branched network","Thick unbranched bundles in tendons","Made of keratin"],e:"Reticular = collagen in a network; flexible; supports delicate soft tissue (e.g. spleen)."},
{l:5,s:"p20-21",q:"Fiber type: found in blood vessels and vocal cords because they stretch easily.",o:["Elastic","Collagen","Reticular"],e:"Elastic."},
{l:5,s:"p20-21",q:"Fiber type: network supporting the spleen.",o:["Reticular","Elastic","Collagen"],e:"Reticular."},
{l:5,s:"p22",q:"Which connective tissue cell produces ground substance and protein fibers?",o:["Fibroblast","Macrophage","Mast cell","Adipocyte"],e:"Fibroblast."},
{l:5,s:"p22",q:"Which connective tissue cell is a scavenger that engulfs foreign particles like bacteria?",o:["Macrophage","Fibroblast","Mast cell","Chondrocyte"],e:"Macrophage."},
{l:5,s:"p22",q:"Which connective tissue cell secretes histamine to induce inflammation?",o:["Mast cell","Macrophage","Fibroblast","Osteocyte"],e:"Mast cell — histamine, important in body defense."},
{l:5,s:"p23",q:"Loose connective tissue:",o:["Has loosely organized elastic and collagen fibers and mainly supports nerves and blood vessels","Has tightly packed parallel collagen and no elastic fibers","Is found in tendons","Has reticular fibers only"],e:"Loose CT: e.g. under the skin."},
{l:5,s:"p24",q:"Dense connective tissue:",o:["Has tight parallel packing of collagen fibers, with no elastic or reticular fibers","Has loosely arranged elastic fibers","Is found in the spleen","Has a large vacuole in each cell"],e:"Dense CT: e.g. tendons, ligaments."},
{l:5,s:"p24",q:"Tendons and ligaments are examples of:",o:["Dense connective tissue","Loose connective tissue","Reticular tissue","Adipose tissue"],e:"Dense connective tissue."},
{l:5,s:"p25",q:"The spleen is supported by:",o:["Reticular tissue","Dense connective tissue","Adipose tissue","Cartilage"],e:"Reticular tissue: reticular fibers in a loose network (soft tissue, e.g. spleen)."},
{l:5,s:"p23-25",q:"Connective tissue type: tissue under the skin with loosely organized elastic and collagen fibers.",o:["Loose","Dense","Reticular"],e:"Loose."},
{l:5,s:"p23-25",q:"Connective tissue type: tendon.",o:["Dense","Loose","Reticular"],e:"Dense."},
{l:5,s:"p26",q:"The suffix \"-cyte\" means:",o:["Cell","Fat","Bone","Tissue"],e:"-cyte = cell."},
{l:5,s:"p26",q:"Adipocytes are found in:",o:["Adipose tissue","Cartilage","Bone","Blood"],e:"Adipo- = fat."},
{l:5,s:"p26",q:"Chondrocytes are found in:",o:["Cartilage","Bone","Adipose tissue","Tendon"],e:"Chondro- = cartilage."},
{l:5,s:"p26",q:"Osteocytes are found in:",o:["Bone","Cartilage","Adipose tissue","Blood"],e:"Osteo- = bone."},
{l:5,s:"p26",q:"Which connective tissue has NO fibers?",o:["Blood (and lymph)","Bone","Cartilage","Tendon"],e:"Blood & lymphatic system: (no fiber)."},
{l:5,s:"p27",q:"Two features of adipocytes seen under the microscope are:",o:["A large vacuole and a nucleus near the edge","Many nuclei and striations","Cilia and microvilli","A central nucleus and no vacuole"],e:"Large vacuole (stored fat), nucleus pushed to the edge."},
{l:5,s:"p27",q:"Adipose tissue belongs to which group of connective tissue?",o:["Loose connective tissue","Dense connective tissue","Reticular tissue","Epithelial tissue"],e:"\"Adipose tissue is also belonged to loose connective tissue!\""},
{l:5,s:"p27",q:"The main function of adipocytes is to:",o:["Store fat as an energy reserve","Produce blood cells","Secrete histamine","Engulf bacteria"],e:"Store fat for energy reserve."},
{l:5,s:"p28",q:"Which region of bone contains bone marrow for producing blood cells?",o:["Spongy bone","Compact bone","Cartilage","Periosteum"],e:"Spongy bone has bone marrow; compact bone is for support & protection."},
{l:5,s:"p28",q:"The KEY difference between bone and cartilage is that bone matrix contains:",o:["Collagen fibers AND calcium salts","Only elastic fibers","No cells","Only ground substance"],e:"Osteocytes lie within a bone matrix full of collagen fibers & calcium salts — the key difference from cartilage."},
{l:5,s:"p28",q:"Compact bone is mainly for:",o:["Support and protection","Producing blood cells","Storing fat","Secreting hormones"],e:"Compact = support & protection; spongy = marrow (blood cells)."},
{l:5,s:"p28",tf:1,q:"Bone only has a support function.",a:0,e:"False. Bone tissue = blood cell production (spongy bone marrow) AND body support."},
{l:5,s:"p29",q:"Muscle tissue is specialized for:",o:["Contraction","Secretion","Signal transmission","Absorption"],e:"Specialized for contraction."},
{l:5,s:"p29",q:"Which muscle types are STRIATED?",o:["Skeletal and cardiac","Skeletal and smooth","Cardiac and smooth","Smooth only"],e:"Striated (multi-band): skeletal and cardiac. Smooth = non-striated, spindle-shaped."},
{l:5,s:"p29",q:"Which muscle type is VOLUNTARY?",o:["Skeletal","Cardiac","Smooth","Cardiac and smooth"],e:"Skeletal = voluntary. Cardiac and smooth = involuntary."},
{l:5,s:"p29",q:"Which muscle type is MULTI-NUCLEATED?",o:["Skeletal","Cardiac","Smooth","All three"],e:"Skeletal = multi-nucleated. Cardiac and smooth = mono-nucleated."},
{l:5,s:"p29",q:"Which muscle type is non-striated and spindle-shaped?",o:["Smooth","Skeletal","Cardiac","None"],e:"Smooth."},
{l:5,s:"p29",q:"Muscle type: striated, involuntary, mono-nucleated.",o:["Cardiac","Skeletal","Smooth"],e:"Cardiac."},
{l:5,s:"p29",q:"Muscle type: striated, voluntary, multi-nucleated.",o:["Skeletal","Cardiac","Smooth"],e:"Skeletal."},
{l:5,s:"p29",q:"Muscle type: non-striated, involuntary, mono-nucleated.",o:["Smooth","Cardiac","Skeletal"],e:"Smooth."},
{l:5,s:"p30",q:"Which muscle cells are arranged in a branching, lattice-like pattern?",o:["Cardiac","Skeletal","Smooth","None"],e:"Cardiac muscle cells (lattice-like)."},
{l:5,s:"p31",q:"Smooth muscle is found in:",o:["The digestive tract and blood vessels","The four limbs","The heart","Tendons"],e:"Smooth muscle: digestive tract & blood vessels."},
{l:5,s:"p29",tf:1,q:"Cardiac muscle is striated and involuntary.",a:1,e:"True."},
{l:5,s:"p32",q:"Neural tissue has two types of cells:",o:["Neurons and glial cells","Neurons and fibroblasts","Glial cells and mast cells","Axons and dendrites"],e:"Neurons (nerve impulses) + glial cells (support)."},
{l:5,s:"p32",q:"Which cells generate nerve impulses for rapid communication?",o:["Neurons","Glial cells","Macrophages","Fibroblasts"],e:"Neurons."},
{l:5,s:"p32",q:"Which cells support neurons, e.g. by giving nutrients and cushioning?",o:["Glial cells","Neurons","Mast cells","Osteocytes"],e:"Glial cells."},
{l:5,s:"p32",q:"The cell body of a neuron is also called the:",o:["Soma","Axon","Dendrite","Synapse"],e:"Cell body = soma (has the nucleus)."},
{l:5,s:"p33",q:"Which part of a neuron conducts ACTION POTENTIALS?",o:["Axon","Dendrite","Cell body","Glial cell"],e:"Axon conducts action potentials. (Your note: the lecturer said this is all you need for the mid-term; details in L21/L30.)"},
{l:5,s:"p33",q:"Which part of a neuron conducts GRADED potentials created by stimuli (e.g. neurotransmitters)?",o:["Dendrite","Axon","Axon terminal","Myelin"],e:"Dendrite = graded potentials."},
{l:5,s:"p33",q:"Which part of a neuron releases neurotransmitter when stimulated by action potentials?",o:["Axon terminal","Dendrite","Cell body","Nucleus"],e:"Axon terminal."},
{l:5,s:"p33",q:"Put the parts of a neuron in the order a signal travels:",o:["Dendrite → cell body → axon → axon terminal","Axon → cell body → dendrite → axon terminal","Axon terminal → axon → cell body → dendrite","Cell body → dendrite → axon terminal → axon"],e:"Dendrite (graded) → cell body → axon (action potential) → axon terminal (neurotransmitter)."},
{l:5,s:"p6",type:"fill",q:"The organelle that produces ATP is the ________.",ans:["mitochondria","mitochondrion","mitochondrion (mitochondria)"],e:"Mitochondria."},
{l:5,s:"p11",type:"fill",q:"Epithelial tissue has no blood or lymphatic vessels; it is ________.",ans:["avascular"],e:"Avascular."},
{l:5,s:"p22",type:"fill",q:"The connective tissue cell that secretes histamine to induce inflammation is the ________ cell.",ans:["mast"],e:"Mast cell."},
{l:5,s:"p22",type:"fill",q:"The connective tissue cell that produces ground substance and protein fibers is the ________.",ans:["fibroblast","fibroblasts"],e:"Fibroblast."},
{l:5,s:"p17",type:"fill",q:"A gland that secretes its products into the blood is an ________ gland.",ans:["endocrine"],e:"Endocrine (into blood); exocrine (into a duct)."},
{l:5,s:"p26",type:"fill",q:"Cartilage cells are called ________.",ans:["chondrocytes","chondrocyte"],e:"Chondrocytes."},
{l:5,s:"p10-17",type:"saq",q:"List four characteristics of epithelial tissue, and explain how epithelium is classified (give the terms used).",model:"Characteristics: continuous layer of tightly packed cells; avascular (no blood or lymphatic vessels); exhibits polarity — apical side exposed to the lumen and basal side attached to the basement membrane; regenerates. Classification: by cell shape — squamous (thin, flat, irregular), cuboidal (square in cross-section), columnar (rectangle in cross-section), plus pseudo-columnar (looks stratified but one layer, e.g. trachea); and by number of layers — simple (one layer) or stratified (many layers).",points:["Tightly packed continuous layer","Avascular","Polarity: apical (lumen) vs basal (basement membrane)","Regenerates","Shape: squamous / cuboidal / columnar (± pseudo-columnar)","Layers: simple vs stratified"],e:"Slides 11–14."},
{l:5,s:"p29-31",type:"saq",q:"Compare skeletal, cardiac and smooth muscle for: striations, voluntary control, number of nuclei, and location.",model:"Skeletal: striated, voluntary, multi-nucleated; four limbs. Cardiac: striated, involuntary, mono-nucleated, branching lattice-like cells; heart. Smooth: non-striated and spindle-shaped, involuntary, mono-nucleated; digestive tract and blood vessels (internal organs).",points:["Skeletal: striated, voluntary, multi-nucleated, limbs","Cardiac: striated, involuntary, mono-nucleated, heart","Smooth: non-striated/spindle, involuntary, mono-nucleated, gut & vessels"],e:"Slides 29–31."}
);

// L6–7 — Cellular transport and fluid shifts (1), (2) (Dr Philip Hung) — one slide deck, stored as l:6
Q.push(
{l:6,s:"p4",q:"The cell membrane is mainly composed of:",o:["A phospholipid bilayer with transmembrane proteins","A single layer of cholesterol","A cellulose wall","A double layer of collagen"],e:"Phospholipid bilayers + transmembrane proteins."},
{l:6,s:"p4",q:"Which part of a phospholipid is HYDROPHILIC?",o:["The head (phosphate, R group, glycerol)","The two fatty acid tails","The whole molecule","Neither part"],e:"Hydrophilic head: one phosphate (−ve), one hydrocarbon group R (e.g. choline), one glycerol. Hydrophobic tails: two fatty acid chains."},
{l:6,s:"p4",q:"The hydrophobic tails of a phospholipid are:",o:["Two fatty acid chains","One phosphate group","One glycerol","Three fatty acid chains"],e:"Two fatty acid chains. (A triglyceride has three — L10.)"},
{l:6,s:"p4",q:"Which of these is NOT part of the phospholipid head?",o:["A fatty acid chain","A phosphate group","A glycerol","A hydrocarbon (R) group such as choline"],e:"Fatty acids are the tails."},
{l:6,s:"p4",q:"The phosphate in the phospholipid head carries a:",o:["Negative charge","Positive charge","No charge","Partial positive charge"],e:"One phosphate (–ve)."},
{l:6,s:"p4",q:"An example of the hydrocarbon (R) group in the phospholipid head is:",o:["Choline","Glucose","Cholesterol","Alanine"],e:"e.g. choline."},
{l:6,s:"p5",q:"Proteins that are mainly EMBEDDED within the phospholipid bilayer are called:",o:["Intrinsic (integral) proteins","Extrinsic (peripheral) proteins","Glycolipids","Ground substance"],e:"Intrinsic/integral = embedded. Extrinsic/peripheral = on the surface."},
{l:6,s:"p5",q:"Proteins that are mainly located on the SURFACE of the phospholipid layers are called:",o:["Extrinsic (peripheral) proteins","Intrinsic (integral) proteins","Ion channels","Aquaporins"],e:"Extrinsic/peripheral; can be extracellular or intracellular."},
{l:6,s:"p5",q:"Which are examples of INTRINSIC proteins?",o:["Ion channels, protein carriers and enzymes","Receptors and antigens","Glycolipids","Phospholipid heads"],e:"Intrinsic: transport proteins (ion channel, carrier), enzymes (usually near the cytoplasmic domain)."},
{l:6,s:"p5",q:"Which are examples of EXTRINSIC proteins (per the slide)?",o:["Receptors and antigens","Ion channels and carriers","Aquaporins","Na⁺/K⁺ ATPase"],e:"Extrinsic: receptors, antigens."},
{l:6,s:"p5",q:"Intrinsic or extrinsic protein? An ion channel.",o:["Intrinsic","Extrinsic"],e:"Intrinsic (transport protein)."},
{l:6,s:"p5",q:"Intrinsic or extrinsic protein? A receptor on the membrane surface.",o:["Extrinsic","Intrinsic"],e:"Extrinsic (per the slide)."},
{l:6,s:"p5",q:"Intrinsic or extrinsic protein? A protein carrier (e.g. glucose transporter).",o:["Intrinsic","Extrinsic"],e:"Intrinsic."},
{l:6,s:"p5",q:"Intrinsic or extrinsic protein? An antigen.",o:["Extrinsic","Intrinsic"],e:"Extrinsic."},
{l:6,s:"p5",tf:1,q:"Extrinsic proteins can be located on either the extracellular or the intracellular surface.",a:1,e:"True."},
{l:6,s:"p6",q:"Carbohydrate attached to a protein on the membrane forms a:",o:["Glycoprotein","Glycolipid","Phospholipid","Lipoprotein"],e:"Carbohydrate + protein = glycoprotein; carbohydrate + lipid = glycolipid (slide 6 diagram)."},
{l:6,s:"p7",q:"The cell membrane is selectively permeable. Which molecules can pass DIRECTLY through the bilayer?",o:["Small and non-ion, or lipid-soluble molecules","Large and charged molecules","All ions","Only glucose"],e:"Criteria: small and non-ion, OR lipid-soluble."},
{l:6,s:"p8",q:"Why can't ions travel directly across the phospholipid bilayer (per the lecture)?",o:["The charged heads and hydrophobic core block them: positive ions are trapped by the negative phosphate heads and negative ions are repelled","Ions are too large","Ions are lipid-soluble","The membrane has no charge"],e:"From slide 8 + your notes: the phosphate heads are −ve, so cations get held, anions get repelled."},
{l:6,s:"p9",q:"Which transport processes are PASSIVE (no energy)?",o:["Simple diffusion, facilitated diffusion and osmosis","Primary and secondary active transport","Endocytosis and exocytosis","Na⁺/K⁺ ATPase"],e:"Passive: diffusion (simple, facilitated) and osmosis — down the gradient."},
{l:6,s:"p9",q:"Passive transport moves substances:",o:["Down the concentration gradient without energy","Against the concentration gradient using ATP","Only in vesicles","Only out of the cell"],e:"Passive = no energy, down the gradient. Active = ATP, against the gradient."},
{l:6,s:"p9",q:"Active transport moves substances:",o:["Against the concentration gradient, using ATP","Down the concentration gradient, without energy","Only through aquaporins","Only by diffusion"],e:"Active = ATP required, against the gradient."},
{l:6,s:"p9",q:"Passive or active? Simple diffusion.",o:["Passive","Active"],e:"Passive."},
{l:6,s:"p9",q:"Passive or active? Facilitated diffusion.",o:["Passive","Active"],e:"Passive — it uses a protein, but no energy."},
{l:6,s:"p9",q:"Passive or active? Osmosis.",o:["Passive","Active"],e:"Passive."},
{l:6,s:"p9",q:"Passive or active? Secondary active transport.",o:["Active","Passive"],e:"Active."},
{l:6,s:"p9",q:"Passive or active? Exocytosis.",o:["Active","Passive"],e:"Active — like endocytosis, exocytosis requires energy."},
{l:6,s:"p9",tf:1,q:"Facilitated diffusion requires ATP because it uses a protein carrier.",a:0,e:"False. Facilitated diffusion is PASSIVE — no energy, down the gradient."},
{l:6,s:"p10",q:"Which molecules cross the membrane by SIMPLE diffusion?",o:["O₂, CO₂ and fat-soluble vitamins","Glucose and amino acids","Na⁺ and K⁺","Proteins and DNA"],e:"Small non-ions (O₂, CO₂) or lipid-soluble molecules (vitamins A, D, E, K)."},
{l:6,s:"p10",q:"The fat-soluble vitamins that cross the membrane by simple diffusion are:",o:["A, D, E, K","B, C","B₁, B₂, B₆, B₁₂","C, D"],e:"Vitamins A, D, E, K."},
{l:6,s:"p11",tf:1,q:"Simple diffusion only happens across the cell membrane, never inside the cell.",a:0,e:"False. Diffusion also occurs INSIDE the cell; ions diffusing within the cell form an intracellular electric current."},
{l:6,s:"p11",q:"When ions diffuse within the cell, they form:",o:["An intracellular electric current","An osmotic pressure gradient only","A vesicle","A new organelle"],e:"Intracellular electric current."},
{l:6,s:"p12",q:"Which substances use FACILITATED diffusion?",o:["Glucose, amino acids and ions","O₂ and CO₂","Vitamins A, D, E, K","Bacteria"],e:"Lipid-insoluble substances: glucose, amino acids, ions — via protein channels or carriers."},
{l:6,s:"p12",q:"Facilitated diffusion uses:",o:["Specific protein channels or carriers","Vesicles","ATP-driven pumps","The phospholipid bilayer directly"],e:"Protein channels (e.g. ion channel) or carriers (e.g. glucose transporter)."},
{l:6,s:"p12",q:"Glucose crosses the membrane by facilitated diffusion using a:",o:["Glucose transporter (protein carrier)","Ion channel","Aquaporin","Vesicle"],e:"Protein carrier = glucose transporter."},
{l:6,s:"p13",q:"Stronger ion movement across the membrane (ion influx) leads to:",o:["Faster intracellular current and faster electrical conduction in the heart and neurons","Slower conduction","No change in conduction","Cell shrinkage"],e:"Stronger influx → faster intracellular current → faster electrical conduction."},
{l:6,s:"p14",q:"Diltiazem and verapamil are:",o:["Calcium channel blockers (anti-anginal)","Sodium channel blockers (anti-arrhythmic)","PCSK9 inhibitors","SGLT1 inhibitors"],e:"Ca²⁺ channel blockers → anti-anginal drugs."},
{l:6,s:"p14",q:"Flecainide and propafenone are:",o:["Sodium channel blockers (class Ic anti-arrhythmic)","Calcium channel blockers (anti-anginal)","Potassium channel openers","Proton pump inhibitors"],e:"Na⁺ channel blockers → class Ic anti-arrhythmics."},
{l:6,s:"p14",q:"How do calcium channel blockers help angina?",o:["↓ Ca²⁺ influx → ↓ intracellular Ca²⁺ → weaker cardiac contraction → heart muscle needs less blood","↑ Ca²⁺ influx → stronger contraction","↓ Na⁺ influx → ↓ heart rate","They dissolve blood clots"],e:"Intracellular Ca²⁺ is important for muscle contraction."},
{l:6,s:"p14",q:"How do sodium channel blockers (class Ic) act on the heart?",o:["↓ Na⁺ influx → ↓ intracellular Na⁺ current → ↓ electrical conduction → ↓ heart rate","↑ Na⁺ influx → ↑ heart rate","↓ Ca²⁺ → weaker contraction","They block the Na⁺/K⁺ pump"],e:"All four blanks on slide 14 are ↓ (your notes)."},
{l:6,s:"p14",q:"Drug class: verapamil.",o:["Ca²⁺ channel blocker","Na⁺ channel blocker","PCSK9 inhibitor","SGLT1 inhibitor"],e:"Diltiazem, verapamil = Ca²⁺ channel blockers."},
{l:6,s:"p14",q:"Drug class: flecainide.",o:["Na⁺ channel blocker","Ca²⁺ channel blocker","PCSK9 inhibitor","SGLT1 inhibitor"],e:"Flecainide, propafenone = Na⁺ channel blockers."},
{l:6,s:"p14",q:"Drug class: diltiazem.",o:["Ca²⁺ channel blocker","Na⁺ channel blocker","SGLT1 inhibitor","PCSK9 inhibitor"],e:"Ca²⁺ channel blocker."},
{l:6,s:"p14",tf:1,q:"Calcium channel blockers are anti-arrhythmic drugs of class Ic.",a:0,e:"False. Ca²⁺ channel blockers = anti-ANGINAL. Na⁺ channel blockers = anti-arrhythmic (class Ic)."},
{l:6,s:"p15",q:"Osmosis is the movement of:",o:["Water molecules","Solutes","Ions only","Glucose"],e:"Osmosis = \"diffusion of water\"."},
{l:6,s:"p15",q:"In osmosis, water moves from:",o:["High to low water potential (low to high osmolarity)","Low to high water potential","High to low osmolarity","Only into the cell"],e:"High → low water potential = low → high osmolarity."},
{l:6,s:"p15",q:"Water crosses the membrane MUCH faster through:",o:["Aquaporins (protein channels)","The lipid bilayer directly","Vesicles","Na⁺/K⁺ ATPase"],e:"Much faster through aquaporin; very slowly directly through the bilayer."},
{l:6,s:"p15",tf:1,q:"Water can pass directly through the lipid bilayer, but only very slowly.",a:1,e:"True."},
{l:6,s:"p16",q:"A solution with 10 water molecules and 15 solute molecules has an osmolarity of:",o:["60%","40%","15%","100%"],e:"Osmolarity = solutes / total = 15/25 = 60%. Water potential = 10/25 = 40%."},
{l:6,s:"p16",q:"Pure water (no solute) has a water potential of ___ and an osmolarity of ___.",o:["100%; 0%","0%; 100%","50%; 50%","100%; 100%"],e:"10/10 water = 100%; 0 solute = 0%."},
{l:6,s:"p16",tf:1,q:"Higher water potential means lower osmolarity.",a:1,e:"True — they are opposites."},
{l:6,s:"p17",q:"Why is there an osmotic flow across the cell membrane?",o:["Solutes cannot cross directly, and water is attracted to solutes, so water moves to the region with more concentrated solutes","Water is pumped by ATP","Solutes move to where water is","The membrane pushes water out"],e:"Selectively permeable membrane + water attracted to solutes → water moves to higher osmolarity."},
{l:6,s:"p18",q:"More concentrated solute → ___ osmolarity → ___ osmotic pressure.",o:["Higher; higher","Higher; lower","Lower; higher","Lower; lower"],e:"↑ solute → ↑ osmolarity → ↑ osmotic pressure."},
{l:6,s:"p19",q:"A solution with the SAME osmolarity as a cell is:",o:["Isotonic","Hypertonic","Hypotonic","Hyperosmotic"],e:"Isotonic."},
{l:6,s:"p19",q:"A solution with osmolarity HIGHER than a cell is:",o:["Hypertonic","Hypotonic","Isotonic"],e:"Hypertonic."},
{l:6,s:"p19",q:"A solution with osmolarity LOWER than a cell is:",o:["Hypotonic","Hypertonic","Isotonic"],e:"Hypotonic."},
{l:6,s:"p20",q:"ICF and ECF normally have:",o:["The same osmolarity","Different osmolarity","No solutes","Only water"],e:"Both have the same osmolarity."},
{l:6,s:"p20",q:"An ISOTONIC solution is infused into the ECF. What happens to the ICF volume?",o:["No change","Increases","Decreases"],e:"Same osmolarity → no net water shift."},
{l:6,s:"p20",q:"A HYPERTONIC solution is infused into the ECF. What happens to the ICF volume?",o:["Decreases","Increases","No change"],e:"ECF osmolarity rises → water leaves cells → ICF shrinks."},
{l:6,s:"p20",q:"A HYPOTONIC solution is infused into the ECF. What happens to the ICF volume?",o:["Increases","Decreases","No change"],e:"ECF osmolarity falls → water enters cells → ICF swells."},
{l:6,s:"p21",q:"Primary active transport uses:",o:["Ion pumps (ATPases) that break ATP to release a phosphate","The gradient of another ion","Vesicles","Aquaporins"],e:"Ion pump = ATPase; ATP is enzymatically broken to release an energetic phosphate."},
{l:6,s:"p21",q:"The most common P-type ATPase is the:",o:["Na⁺/K⁺ ATPase","H⁺ ATPase in lysosomes","CFTR","P-glycoprotein"],e:"P-type: activated by phosphorylation; most common = Na⁺/K⁺ ATPase; others Ca²⁺, Mg²⁺."},
{l:6,s:"p21",q:"P-type ATPases are activated by:",o:["Phosphorylation (binding of a phosphate)","Binding of glucose","Light","Dephosphorylation"],e:"P = phosphorylation."},
{l:6,s:"p21",q:"Which ATPase is the H⁺ pump in vesicles/vacuoles such as lysosomes?",o:["V-type","F-type","P-type","ABC transporter"],e:"V-type = vesicles/vacuoles. F-type = mitochondrial inner membrane."},
{l:6,s:"p21",q:"Which ATPase is the H⁺ ATPase in the mitochondrial inner membrane?",o:["F-type","V-type","P-type","ABC transporter"],e:"F-type."},
{l:6,s:"p21",q:"P-glycoprotein and CFTR are examples of:",o:["ABC (ATP binding cassette) transporters","P-type ATPases","V-type ATPases","Symporters"],e:"ABC transporters."},
{l:6,s:"p21",q:"CFTR stands for:",o:["Cystic fibrosis transmembrane conductance regulator","Calcium flux transport regulator","Chloride-free transmembrane receptor","Cellular fluid transport regulator"],e:"Cystic fibrosis transmembrane conductance regulator."},
{l:6,s:"p21",q:"ATPase type: Na⁺/K⁺ pump.",o:["P-type","V-type","F-type","ABC transporter"],e:"P-type."},
{l:6,s:"p21",q:"ATPase type: CFTR.",o:["ABC transporter","P-type","V-type","F-type"],e:"ABC."},
{l:6,s:"p21",q:"ATPase type: H⁺ pump in a lysosome.",o:["V-type","F-type","P-type","ABC transporter"],e:"V-type."},
{l:6,s:"p22-23",q:"For each cycle, the Na⁺/K⁺ ATPase moves:",o:["3 Na⁺ out and 2 K⁺ in","2 Na⁺ out and 3 K⁺ in","3 Na⁺ in and 2 K⁺ out","1 Na⁺ out and 1 K⁺ in"],e:"3 Na⁺ out, 2 K⁺ in."},
{l:6,s:"p23",q:"Because of the Na⁺/K⁺ ATPase, where is Na⁺ more concentrated?",o:["Extracellular","Intracellular","Equal on both sides"],e:"Na⁺ pumped out → more Na⁺ outside."},
{l:6,s:"p23",q:"Because of the Na⁺/K⁺ ATPase, where is K⁺ more concentrated?",o:["Intracellular","Extracellular","Equal on both sides"],e:"K⁺ pumped in → more K⁺ inside."},
{l:6,s:"p23",q:"With each cycle of the Na⁺/K⁺ ATPase, the inside of the cell:",o:["Loses one net positive charge","Gains one net positive charge","Has no change in charge","Gains 5 positive charges"],e:"3 out, 2 in → net loss of 1 positive charge inside (your note: 2 K in, 3 Na out)."},
{l:6,s:"p23",q:"When a Na⁺ channel opens, Na⁺ ions:",o:["Move into the cell","Move out of the cell","Stay put","Move into the mitochondria"],e:"Na⁺ is more concentrated outside, so it flows IN down its gradient."},
{l:6,s:"p22",q:"The purpose of the Na⁺/K⁺ ATPase is to:",o:["Build up an electrochemical gradient","Move water into the cell","Break down glucose","Make vesicles"],e:"To build up the electrochemical gradient."},
{l:6,s:"p24",q:"Secondary active transport is:",o:["Movement of one substance driven by the electrochemical gradient of another substance (often Na⁺)","Direct use of ATP by an ion pump","Diffusion through the lipid bilayer","Uptake of bacteria by vesicles"],e:"Secondary = driven by another substance's gradient (often the Na⁺ gradient made by the Na⁺/K⁺ ATPase)."},
{l:6,s:"p24",q:"In a SYMPORT (cotransport) system, the two substances move:",o:["In the same direction","In opposite directions","Only into vesicles","Without any gradient"],e:"Symport = same direction. Antiport = opposite directions."},
{l:6,s:"p24",q:"In an ANTIPORT (countertransport) system, the two substances move:",o:["In opposite directions","In the same direction","Only out of the cell","Through aquaporins"],e:"Antiport = opposite directions."},
{l:6,s:"p24",q:"Where does the energy for secondary active transport ultimately come from?",o:["The Na⁺ gradient built by the Na⁺/K⁺ ATPase (which uses ATP)","Glucose diffusing in","Osmosis","Nothing — it is passive"],e:"The Na⁺/K⁺ ATPase keeps Na⁺ high outside; Na⁺ flowing back in drives the other substance."},
{l:6,s:"p25-26",q:"In both cotransporters and antiporters, is Na⁺ more concentrated inside or outside the cell?",o:["Outside","Inside","Equal"],e:"Outside — it flows in, down its gradient, and that drives the other substance."},
{l:6,s:"p27",q:"SGLT1 stands for:",o:["Sodium glucose co-transporter-1","Sodium glucose ligand transporter-1","Selective glucose transporter-1","Simple glucose lipid transporter-1"],e:"Sodium glucose co-transporter-1."},
{l:6,s:"p27",q:"SGLT1 is an example of which type of transport?",o:["Secondary active transport (symport of Na⁺ and glucose)","Primary active transport","Simple diffusion","Endocytosis"],e:"Na⁺ and glucose move into the intestinal cell together (same direction) — cotransport. (The SGLT1 slide is a picture; this is the standard model.)"},
{l:6,s:"p27",q:"Sotagliflozin works by:",o:["Inhibiting SGLT1, so less glucose is absorbed from the intestine","Blocking Ca²⁺ channels","Increasing LDL receptors","Blocking Na⁺ channels in the heart"],e:"Anti-diabetic drug targeting SGLT1 on intestinal epithelial cells. (Picture slide — check it.)"},
{l:6,s:"p28",q:"\"Cell eating\" — the uptake of solid particles such as bacteria — is:",o:["Phagocytosis","Pinocytosis","Receptor-mediated endocytosis","Exocytosis"],e:"Phagocytosis (吞噬作用)."},
{l:6,s:"p28",q:"\"Cell drinking\" — the uptake of dissolved molecules such as DNA, protein and fat droplets — is:",o:["Pinocytosis","Phagocytosis","Exocytosis","Osmosis"],e:"Pinocytosis (胞飲作用)."},
{l:6,s:"p28",q:"Uptake of cholesterol after it is recognized by specific receptors is:",o:["Receptor-mediated endocytosis","Pinocytosis","Phagocytosis","Facilitated diffusion"],e:"Receptor-mediated endocytosis, e.g. cholesterol."},
{l:6,s:"p28",q:"Endocytosis type: a macrophage taking up bacteria.",o:["Phagocytosis","Pinocytosis","Receptor-mediated endocytosis"],e:"Phagocytosis."},
{l:6,s:"p28",q:"Endocytosis type: uptake of DNA or protein in solution.",o:["Pinocytosis","Phagocytosis","Receptor-mediated endocytosis"],e:"Pinocytosis."},
{l:6,s:"p28",q:"Endocytosis type: LDL-cholesterol taken up via the LDL receptor.",o:["Receptor-mediated endocytosis","Pinocytosis","Phagocytosis"],e:"Receptor-mediated."},
{l:6,s:"p29",q:"In phagocytosis, the cell extends:",o:["Pseudopodia around the particle","Cilia","Microvilli","Aquaporins"],e:"Pseudopodium (diagram, slide 29)."},
{l:6,s:"p30",q:"LDL stands for:",o:["Low density lipoprotein","Lipid delivery ligand","Low density lipid","Liver-derived lipoprotein"],e:"LDL carries cholesterol in blood."},
{l:6,s:"p30",q:"PCSK9 inhibitors lower blood cholesterol by:",o:["Increasing LDL receptors in the liver, so the liver takes up more cholesterol","Blocking cholesterol absorption in the gut","Blocking Ca²⁺ channels","Inhibiting SGLT1"],e:"↑ LDL receptors → ↑ liver uptake → ↓ LDL/cholesterol in blood."},
{l:6,s:"p30",tf:1,q:"PCSK9 inhibitors decrease LDL receptors in the liver.",a:0,e:"False. They INCREASE LDL receptors → more uptake → lower blood LDL."},
{l:6,s:"p31",q:"Exocytosis is:",o:["Secretion of large molecules in vesicles, which needs energy","Uptake of bacteria","Passive diffusion of water","Movement through ion channels"],e:"Exocytosis requires energy, e.g. release of hormone or neurotransmitter."},
{l:6,s:"p31",q:"Which is an example of exocytosis?",o:["Release of a neurotransmitter","Uptake of cholesterol","Uptake of O₂","Na⁺ entry through channels"],e:"Release of hormone or neurotransmitter."},
{l:6,s:"p9-31",q:"Transport type: O₂ entering a cell.",o:["Simple diffusion","Facilitated diffusion","Primary active transport","Secondary active transport"],e:"Small, non-ion → simple diffusion."},
{l:6,s:"p9-31",q:"Transport type: glucose entering via a glucose transporter down its gradient.",o:["Facilitated diffusion","Simple diffusion","Primary active transport","Endocytosis"],e:"Facilitated diffusion."},
{l:6,s:"p9-31",q:"Transport type: Na⁺/K⁺ ATPase.",o:["Primary active transport","Secondary active transport","Facilitated diffusion","Osmosis"],e:"Primary active (uses ATP directly)."},
{l:6,s:"p9-31",q:"Transport type: glucose absorbed with Na⁺ via SGLT1.",o:["Secondary active transport","Primary active transport","Simple diffusion","Pinocytosis"],e:"Secondary active (symport)."},
{l:6,s:"p9-31",q:"Transport type: water entering through aquaporins.",o:["Osmosis","Simple diffusion of solute","Primary active transport","Exocytosis"],e:"Osmosis."},
{l:6,s:"p9-31",q:"Transport type: Ca²⁺ flowing into cardiac cells through channels.",o:["Facilitated diffusion","Simple diffusion","Primary active transport","Exocytosis"],e:"Ions through channels = facilitated diffusion."},
{l:6,s:"p9-31",q:"Transport type: vitamin D crossing the membrane.",o:["Simple diffusion","Facilitated diffusion","Receptor-mediated endocytosis","Primary active transport"],e:"Lipid-soluble → simple diffusion."},
{l:6,s:"p15",type:"fill",q:"The protein channels that let water cross the membrane quickly are called ________.",ans:["aquaporins","aquaporin"],e:"Aquaporins."},
{l:6,s:"p24",type:"fill",q:"A secondary active transport system in which two substances move in the SAME direction is called a ________ (or cotransport).",ans:["symport","symporter"],e:"Symport."},
{l:6,s:"p24",type:"fill",q:"A secondary active transport system in which two substances move in OPPOSITE directions is called an ________.",ans:["antiport","antiporter"],e:"Antiport (countertransport)."},
{l:6,s:"p28",type:"fill",q:"\"Cell eating\" of solid particles such as bacteria is called ________.",ans:["phagocytosis"],e:"Phagocytosis."},
{l:6,s:"p19",type:"fill",q:"A solution with a higher osmolarity than a cell is ________.",ans:["hypertonic"],e:"Hypertonic."},
{l:6,s:"p21-23",type:"saq",q:"Describe how the Na⁺/K⁺ ATPase works and explain how it creates an electrochemical gradient. How does this gradient drive secondary active transport?",model:"The Na⁺/K⁺ ATPase is a P-type ion pump (primary active transport). It breaks down ATP to release a phosphate, which phosphorylates and activates it. Each cycle it moves 3 Na⁺ out and 2 K⁺ into the cell, against their gradients. Na⁺ becomes more concentrated outside and K⁺ inside; because 3 positive charges leave and only 2 enter, the inside loses one net positive charge each cycle. This builds up the electrochemical gradient. In secondary active transport, Na⁺ flowing back into the cell down its gradient drives another substance across the membrane — in the same direction (symport, e.g. SGLT1 with glucose) or in the opposite direction (antiport).",points:["P-type ATPase; uses ATP (phosphorylation) = primary active transport","3 Na⁺ out, 2 K⁺ in","Na⁺ high outside, K⁺ high inside; net loss of 1 positive charge inside","Secondary: Na⁺ moving down its gradient drives another substance","Symport (same direction, e.g. SGLT1) vs antiport (opposite)"],e:"Slides 21–27."},
{l:6,s:"p15-20",type:"saq",q:"Define osmosis and tonicity. Predict what happens to the ICF volume when isotonic, hypertonic and hypotonic solutions are infused into the ECF, and explain why.",model:"Osmosis is the movement of water across a selectively permeable membrane from high to low water potential, i.e. from low to high osmolarity; water is attracted to solutes that cannot cross the membrane. It goes much faster through aquaporins. Tonicity compares a solution's osmolarity with a cell's: isotonic = same, hypertonic = higher, hypotonic = lower. ICF and ECF normally have the same osmolarity. Isotonic infusion → no change in ICF volume. Hypertonic infusion → ECF osmolarity rises, water leaves the cells → ICF volume decreases. Hypotonic infusion → ECF osmolarity falls, water enters the cells → ICF volume increases.",points:["Osmosis: water moves from low to high osmolarity (high to low water potential)","Isotonic/hypertonic/hypotonic defined vs the cell","Isotonic → no change","Hypertonic → water leaves cells, ICF ↓","Hypotonic → water enters cells, ICF ↑"],e:"Slides 15–20."}
);

// L8 — Structural organization of human body, integumentary system (Dr Philip Hung)
Q.push(
{l:8,s:"p3",q:"Put the levels of organization of the human body in order, from simplest:",o:["Chemical → cell → tissue → organ → system → organism","Cell → chemical → tissue → organ → system → organism","Chemical → tissue → cell → organ → system → organism","Chemical → cell → organ → tissue → system → organism"],e:"1 chemical, 2 cell, 3 tissue, 4 organ, 5 system, 6 organism."},
{l:8,s:"p3",q:"Which level of organization is labeled the \"basic functional unit\"?",o:["Cell","Tissue","Organ","Atom"],e:"Cell level = basic functional unit!!!"},
{l:8,s:"p3",q:"In the example on the slide, the stomach is at which level of organization?",o:["Organ","Tissue","System","Cell"],e:"Stomach = organ (level 4); digestive system = system (level 5); smooth muscle tissue = tissue (level 3)."},
{l:8,s:"p3",q:"In the example on the slide, smooth muscle tissue is at which level?",o:["Tissue (level 3)","Cell (level 2)","Organ (level 4)","System (level 5)"],e:"Tissue."},
{l:8,s:"p3",q:"In the example on the slide, DNA (a molecule) belongs to which level?",o:["Chemical (level 1)","Cell (level 2)","Tissue (level 3)","Organ (level 4)"],e:"Atoms and molecules = chemical level."},
{l:8,s:"p4-5",q:"Which plane cuts the body into SUPERIOR and INFERIOR parts?",o:["Transverse plane","Sagittal plane","Frontal (coronal) plane","Longitudinal plane"],e:"Transverse → upper/lower."},
{l:8,s:"p4-5",q:"Which plane cuts the body into LEFT and RIGHT parts?",o:["Sagittal (longitudinal) plane","Frontal (coronal) plane","Transverse plane","Horizontal plane"],e:"Sagittal → left lateral / right lateral."},
{l:8,s:"p4-5",q:"Which plane cuts the body into ANTERIOR and POSTERIOR parts?",o:["Frontal (coronal) plane","Sagittal plane","Transverse plane","Midline plane"],e:"Frontal/coronal → front/back."},
{l:8,s:"p4",q:"The frontal plane is also called the:",o:["Coronal plane","Sagittal plane","Transverse plane","Longitudinal plane"],e:"Frontal = coronal."},
{l:8,s:"p4",q:"The sagittal plane is also called the:",o:["Longitudinal plane","Coronal plane","Transverse plane","Horizontal plane"],e:"Sagittal (longitudinal) — as labeled on the slide."},
{l:8,s:"p4-5",q:"Plane: a CT slice that shows the body as if cut across at the waist (top vs bottom).",o:["Transverse","Sagittal","Frontal (coronal)"],e:"Transverse."},
{l:8,s:"p4-5",q:"Plane: a cut down the midline separating the left and right halves of the head.",o:["Sagittal","Frontal (coronal)","Transverse"],e:"Sagittal."},
{l:8,s:"p4-5",q:"Plane: a cut separating the face (front) from the back of the head.",o:["Frontal (coronal)","Sagittal","Transverse"],e:"Frontal/coronal."},
{l:8,s:"p6",q:"\"The head is ___ to the neck.\"",o:["Superior","Inferior","Distal","Lateral"],e:"Superior = above."},
{l:8,s:"p6",q:"\"The abdomen is ___ to the thorax.\"",o:["Inferior","Superior","Proximal","Anterior"],e:"Inferior (your notes fill-in)."},
{l:8,s:"p6",q:"\"The elbow is ___ to the wrist.\"",o:["Proximal","Distal","Medial","Inferior"],e:"Proximal = closer to the point where the limb attaches to the body."},
{l:8,s:"p6",q:"\"The leg is ___ to the thigh.\"",o:["Distal","Proximal","Superior","Medial"],e:"Distal = further from the attachment point."},
{l:8,s:"p6",q:"\"The spine is ___ to the lungs.\"",o:["Posterior","Anterior","Lateral","Superior"],e:"Posterior = behind."},
{l:8,s:"p6",q:"\"The eye is ___ to the nose.\"",o:["Lateral","Medial","Proximal","Posterior"],e:"Lateral = away from the midline."},
{l:8,s:"p6",q:"\"The nose is ___ to the ears.\"",o:["Medial","Lateral","Distal","Inferior"],e:"Medial = nearer the midline."},
{l:8,s:"p6",q:"\"Proximal\" means:",o:["Closer to the point where a limb attaches to the body","Further from the midline","Towards the front","Above"],e:"Proximal (更接近身體中央連接點) vs distal (更遠離)."},
{l:8,s:"p6",q:"\"Medial\" means:",o:["Nearer to the body's midline","Further from the midline","Nearer to the limb's attachment","Towards the back"],e:"Medial = near midline; lateral = away from midline."},
{l:8,s:"p6",tf:1,q:"The knee is distal to the hip.",a:1,e:"True — further from where the leg attaches to the trunk."},
{l:8,s:"p6",tf:1,q:"The ears are medial to the nose.",a:0,e:"False. The ears are LATERAL to the nose; the nose is medial to the ears."},
{l:8,s:"p7",q:"Which of the following belongs to the AXIAL region?",o:["Thorax","Upper limbs","Lower limbs","Hand"],e:"Axial: head, neck, thorax, abdomen, pelvis. Appendicular: upper and lower limbs."},
{l:8,s:"p7",q:"The appendicular region consists of the:",o:["Upper and lower limbs","Head and neck","Thorax and abdomen","Abdomen and pelvis"],e:"Appendicular = limbs."},
{l:8,s:"p7",q:"Axial or appendicular? Pelvis.",o:["Axial","Appendicular"],e:"Axial (head, neck, thorax, abdomen, pelvis)."},
{l:8,s:"p7",q:"Axial or appendicular? Upper limb.",o:["Appendicular","Axial"],e:"Appendicular."},
{l:8,s:"p7",q:"Axial or appendicular? Neck.",o:["Axial","Appendicular"],e:"Axial."},
{l:8,s:"p9",q:"The prefix \"epi-\" means:",o:["Near to, or above","Below (inferior)","Superior to","Within"],e:"epi- = near to / above, e.g. epidermis."},
{l:8,s:"p9",q:"The prefix \"hypo-\" means:",o:["Inferior (below)","Above","Superior","Near to"],e:"hypo- = inferior, e.g. hypodermis = layer below the dermis."},
{l:8,s:"p9",q:"The prefix \"supra-\" means:",o:["Superior","Inferior","Near to","Lateral"],e:"supra- = superior, e.g. supra-renal gland."},
{l:8,s:"p9",q:"The supra-renal gland is also named the:",o:["Adrenal gland","Pituitary gland","Thyroid gland","Pancreas"],e:"Supra-renal = adrenal gland — an endocrine gland superior to a kidney."},
{l:8,s:"p9",q:"The hypodermis is:",o:["A layer of cells below the dermis","A layer of cells near to the dermis on the surface","The outermost layer of the skin","The layer inside the dermis"],e:"Hypo- = below."},
{l:8,s:"p10",q:"\"Hypochondriac\" (as in the abdominal regions) literally means:",o:["Below the cartilage of the rib cage","Above the navel","Near the hip bone","Below the stomach"],e:"Hypochondriac = below cartilage of rib cage."},
{l:8,s:"p10",q:"The appendix and cecum lie in which abdominal region?",o:["Right iliac (inguinal) region","Left iliac region","Epigastric region","Left hypochondriac region"],e:"Standard model (region names are in the slide picture — check your slide)."},
{l:8,s:"p10",q:"The liver and gallbladder mainly lie in which abdominal region?",o:["Right hypochondriac","Left hypochondriac","Hypogastric","Left lumbar"],e:"Right hypochondriac: liver, gallbladder, right kidney, small intestine. (Standard model; the slide labels the regions in a picture.)"},
{l:8,s:"p10",q:"The spleen lies in which abdominal region?",o:["Left hypochondriac","Right hypochondriac","Epigastric","Right iliac"],e:"Left hypochondriac. (Standard model; region names are in the slide picture.)"},
{l:8,s:"p11",q:"The integumentary system consists of the skin and its associated organs. Which of these is NOT one of them?",o:["Lymph node","Hair","Sebaceous gland","Arrector pili muscle"],e:"Associated organs: hair, sweat gland, sebaceous gland, arrector pili muscle."},
{l:8,s:"p12",q:"The skin is the largest organ and is composed of:",o:["Epithelium and connective tissues","Muscle and nerve tissue only","Epithelium only","Cartilage and bone"],e:"Epithelium + connective tissues."},
{l:8,s:"p12",q:"The skin covers an area of about ___ and weighs about ___.",o:["1.5–2 m²; 4–5 kg","0.5 m²; 1 kg","3–4 m²; 10 kg","1 m²; 2 kg"],e:"1.5–2 m², 4–5 kg."},
{l:8,s:"p12",q:"Thick skin (~4 mm) is found in the:",o:["Palms and soles","Eyelids","Back","Abdomen"],e:"Thick skin ~4 mm in palms & soles; thin skin ~1.5 mm."},
{l:8,s:"p12",q:"Thin skin is about:",o:["1.5 mm","4 mm","0.1 mm","10 mm"],e:"~1.5 mm."},
{l:8,s:"p13",q:"What are the 3 major layers of the skin, from outer to inner?",o:["Epidermis → dermis → hypodermis","Dermis → epidermis → hypodermis","Epidermis → hypodermis → dermis","Hypodermis → dermis → epidermis"],e:"Epidermis, dermis, hypodermis (subcutaneous)."},
{l:8,s:"p13",q:"The epidermis is made of:",o:["Keratinized stratified epithelium","Loose and dense connective tissue","Adipose tissue","Simple columnar epithelium"],e:"Keratinized stratified epithelium."},
{l:8,s:"p13",q:"The dermis is made of:",o:["Loose and dense connective tissue","Keratinized stratified epithelium","Adipose tissue only","Smooth muscle"],e:"Dermis = loose & dense connective tissue."},
{l:8,s:"p13",q:"The hypodermis (subcutaneous layer) consists mainly of:",o:["Adipose tissue","Keratinocytes","Dense connective tissue","Cartilage"],e:"Hypodermis: \"beneath the dermis\", adipose tissue, next to muscle & bone."},
{l:8,s:"p13",q:"Skin layer and tissue: dermis.",o:["Loose & dense connective tissue","Keratinized stratified epithelium","Adipose tissue"],e:"Dermis = connective tissue."},
{l:8,s:"p13",q:"Skin layer and tissue: hypodermis.",o:["Adipose tissue","Keratinized stratified epithelium","Loose & dense connective tissue"],e:"Hypodermis = adipose."},
{l:8,s:"p14",q:"According to the slide, the epidermis has how many layers (strata)?",o:["Four","Three","Five","Two"],e:"Slide: four layers (SB, SS, SG, SC). Textbooks add a 5th (stratum lucidum) in thick skin — follow the slide."},
{l:8,s:"p14",q:"The DEEPEST layer of the epidermis is the:",o:["Stratum basale","Stratum corneum","Stratum granulosum","Stratum spinosum"],e:"Deepest = stratum basale; outermost = stratum corneum."},
{l:8,s:"p14",q:"The OUTERMOST layer of the epidermis is the:",o:["Stratum corneum","Stratum basale","Stratum spinosum","Stratum granulosum"],e:"Stratum corneum."},
{l:8,s:"p14",q:"Put the epidermal layers in order from DEEPEST to outermost:",o:["Basale → spinosum → granulosum → corneum","Corneum → granulosum → spinosum → basale","Basale → granulosum → spinosum → corneum","Spinosum → basale → granulosum → corneum"],e:"SB → SS → SG → SC."},
{l:8,s:"p14",q:"Which of the following is NOT one of the 4 epidermal cell types on the slide?",o:["Fibroblasts","Keratinocytes","Melanocytes","Langerhans cells"],e:"4 cell types: keratinocytes, melanocytes, Merkel disks, Langerhans cells."},
{l:8,s:"p15",q:"The predominant cell type of the epidermis is the:",o:["Keratinocyte","Melanocyte","Langerhans cell","Merkel cell"],e:"Keratinocytes, filled with keratin as a waterproof barrier."},
{l:8,s:"p15",q:"Keratin in keratinocytes acts as a:",o:["Waterproof barrier","Pigment","Phagocyte","Touch receptor"],e:"Waterproof barrier."},
{l:8,s:"p15",q:"Which cells produce melanin and pass it to keratinocytes?",o:["Melanocytes","Langerhans cells","Merkel cells","Fibroblasts"],e:"Melanocytes (in stratum basale) → melanin granules → keratinocytes."},
{l:8,s:"p16",q:"Which epidermal cells are phagocytes that engulf cancer cells or pathogens?",o:["Langerhans cells","Merkel cells","Melanocytes","Keratinocytes"],e:"Langerhans cells."},
{l:8,s:"p16",q:"Merkel disks are associated with sensory nerve endings and detect:",o:["Continuous fine touch","Pain","Heat","Deep pressure"],e:"Merkel disk: continuous fine touch."},
{l:8,s:"p15-16",q:"Epidermal cell: produces pigment.",o:["Melanocyte","Keratinocyte","Langerhans cell","Merkel cell"],e:"Melanocyte."},
{l:8,s:"p15-16",q:"Epidermal cell: engulfs pathogens.",o:["Langerhans cell","Melanocyte","Keratinocyte","Merkel cell"],e:"Langerhans cell."},
{l:8,s:"p15-16",q:"Epidermal cell: fine touch with a sensory nerve ending.",o:["Merkel cell (disk)","Langerhans cell","Melanocyte","Keratinocyte"],e:"Merkel."},
{l:8,s:"p15-16",q:"Epidermal cell: waterproof barrier filled with keratin.",o:["Keratinocyte","Melanocyte","Langerhans cell","Merkel cell"],e:"Keratinocyte."},
{l:8,s:"p17",q:"The two layers of the dermis are:",o:["Papillary layer and reticular layer","Stratum basale and stratum corneum","Epidermis and hypodermis","Compact and spongy layers"],e:"Papillary (loose CT) + reticular (dense CT)."},
{l:8,s:"p17",q:"The papillary layer of the dermis is made of:",o:["Loose connective tissue","Dense connective tissue","Adipose tissue","Stratified epithelium"],e:"Papillary = loose; reticular = dense."},
{l:8,s:"p17",q:"The reticular layer of the dermis is made of:",o:["Dense connective tissue","Loose connective tissue","Adipose tissue","Keratinized epithelium"],e:"Reticular = dense."},
{l:8,s:"p17",q:"A dermal papilla is:",o:["A dermal projection into the epidermis","A hair follicle","A sweat duct","A layer of the hypodermis"],e:"Dermal projection into the epidermis."},
{l:8,s:"p18",q:"The papillary plexus (capillary network) is found in the:",o:["Papillary layer","Reticular layer","Hypodermis","Stratum corneum"],e:"Papillary layer: papillary plexus + sensory receptors."},
{l:8,s:"p18",q:"Hair follicles, sweat glands, sebaceous glands and the arrector pili muscle are found in the:",o:["Reticular layer of the dermis","Papillary layer","Epidermis","Stratum basale"],e:"Reticular layer holds the accessory organs and the cutaneous plexus."},
{l:8,s:"p18",q:"Dermis layer: papillary plexus.",o:["Papillary layer","Reticular layer"],e:"Papillary."},
{l:8,s:"p18",q:"Dermis layer: cutaneous plexus.",o:["Reticular layer","Papillary layer"],e:"Reticular."},
{l:8,s:"p18",q:"Dermis layer: sebaceous gland.",o:["Reticular layer","Papillary layer"],e:"Reticular."},
{l:8,s:"p19",q:"Meissner's corpuscle is a tactile receptor located in the ___ and detects ___.",o:["Dermal papilla; onset of fine touch and low-frequency vibration","Stratum basale; continuous fine touch","Hypodermis; deep pressure","Reticular layer; pain"],e:"Meissner's corpuscle: dermal papilla; onset of fine touch & low-frequency vibration. Merkel disk: continuous fine touch."},
{l:8,s:"p16-19",q:"Receptor: continuous fine touch.",o:["Merkel disk","Meissner's corpuscle"],e:"Merkel = continuous. Meissner = onset + low-frequency vibration."},
{l:8,s:"p16-19",q:"Receptor: onset of fine touch and low-frequency vibration.",o:["Meissner's corpuscle","Merkel disk"],e:"Meissner."},
{l:8,s:"p20",q:"A sensory unit contains:",o:["A single sensory (afferent) neuron and its receptor endings or receptor cells","Many neurons sharing one receptor","The whole spinal cord","One dermatome"],e:"Sensory unit = one afferent neuron + its receptor endings."},
{l:8,s:"p20",q:"A receptive field is:",o:["An area where all sensory receptors respond to a single neuron","The area of skin supplied by one spinal nerve","The part of the brain that feels touch","The total skin area"],e:"Receptive field. (Area supplied by one spinal nerve level = dermatome.)"},
{l:8,s:"p21",q:"Acuity (precision in locating a stimulus) is greatest when receptive fields are:",o:["Small and numerous","Large and few","Large and numerous","Small and few"],e:"Smaller + more receptive fields → greater acuity (e.g. fingertip, toe tip)."},
{l:8,s:"p21",q:"Acuity can be assessed by:",o:["Two-point discrimination","A reflex hammer","A thermometer","Blood pressure"],e:"2PD = shortest distance to distinguish two nearby stimuli."},
{l:8,s:"p22",q:"The two-point discrimination threshold at the fingertip is about:",o:["0.25 cm","2.5 cm","5 cm","0.025 cm"],e:"Fingertip ~0.25 cm; lower back ~2.5 cm."},
{l:8,s:"p22",q:"The two-point discrimination threshold at the lower back is about:",o:["2.5 cm","0.25 cm","25 cm","1 mm"],e:"~2.5 cm → large receptive fields, low acuity."},
{l:8,s:"p21-22",tf:1,q:"The lower back has higher tactile acuity than the fingertip.",a:0,e:"False. The fingertip has small, numerous receptive fields (2PD 0.25 cm) → higher acuity than the lower back (2.5 cm)."},
{l:8,s:"p23",q:"Dermatomes are:",o:["Areas of skin whose sensory supply comes from sensory neurons at different levels of spinal nerves","Layers of the dermis","Receptive fields of single neurons","Types of skin burn"],e:"Dermatome = skin area innervated by one spinal nerve level."},
{l:8,s:"p25",q:"Sunburn after a sunbath without sunscreen is usually a:",o:["Superficial (first-degree) burn","Partial thickness (second-degree) burn","Full thickness (third-degree) burn","Fourth-degree burn"],e:"First degree: mild edema then skin-peeling, heals in weeks without scarring."},
{l:8,s:"p25",q:"Blisters caused by fluid escaping from damaged capillaries are typical of:",o:["Partial thickness (second-degree) burn","Superficial (first-degree) burn","Full thickness (third-degree) burn","Fourth-degree burn"],e:"Second degree: hot objects or flame → blisters."},
{l:8,s:"p25",q:"Healing of a partial thickness (second-degree) burn depends on:",o:["Whether the accessory structures survive","The colour of the skin","Whether the patient has a fever","Nothing — it always heals without scarring"],e:"Healing depends on whether accessory structures survive."},
{l:8,s:"p25",q:"A superficial (first-degree) burn:",o:["Recovers within weeks without scarring","Always leaves a scar","Is numb","Destroys underlying fat and muscle"],e:"Heals within weeks, no scarring."},
{l:8,s:"p26",q:"Which burn involves limited damage of the EPIDERMIS only?",o:["First degree (superficial)","Second degree","Third degree","Fourth degree"],e:"1st: limited epidermis; 2nd: partial destruction of dermis; 3rd: extensive destruction of dermis."},
{l:8,s:"p26",q:"Which burn involves PARTIAL destruction of the dermis?",o:["Second degree (partial thickness)","First degree","Third degree","Fourth degree"],e:"Partial thickness = 2nd degree."},
{l:8,s:"p27",q:"A burn that turns the skin white or charred and is NUMB, caused by prolonged exposure to hot objects, flames or corrosive chemicals, is:",o:["Full thickness (third-degree)","Partial thickness (second-degree)","Superficial (first-degree)","Sunburn"],e:"Third degree: white or charred; numb."},
{l:8,s:"p27",q:"A burn that destroys the underlying fat and muscle is:",o:["Fourth degree","Third degree","Second degree","First degree"],e:"Fourth degree: destroys underlying fat, muscle; charred; numb."},
{l:8,s:"p27",q:"Why is a third-degree burn NUMB?",o:["Extensive destruction of the dermis destroys the nerve endings and sensory receptors there","Because it only affects the epidermis","Because blisters block the nerves","Because of too much melanin"],e:"Receptors/nerve endings live in the dermis — destroyed in full-thickness burns."},
{l:8,s:"p25-27",q:"Burn degree: mild edema then skin peeling.",o:["First","Second","Third","Fourth"],e:"First."},
{l:8,s:"p25-27",q:"Burn degree: blisters.",o:["Second","First","Third","Fourth"],e:"Second."},
{l:8,s:"p25-27",q:"Burn degree: white or charred, numb, dermis extensively destroyed.",o:["Third","Second","First","Fourth"],e:"Third."},
{l:8,s:"p25-27",q:"Burn degree: charred, numb, fat and muscle destroyed.",o:["Fourth","Third","Second","First"],e:"Fourth."},
{l:8,s:"p4-5",type:"fill",q:"The plane that divides the body into anterior and posterior parts is the frontal, or ________, plane.",ans:["coronal"],e:"Coronal."},
{l:8,s:"p14",type:"fill",q:"The deepest layer of the epidermis is the stratum ________.",ans:["basale","basal"],e:"Stratum basale."},
{l:8,s:"p15",type:"fill",q:"Melanin is produced by ________ and passed to keratinocytes.",ans:["melanocytes","melanocyte"],e:"Melanocytes."},
{l:8,s:"p21",type:"fill",q:"The shortest distance at which two nearby stimuli can be felt as two is measured by two-point ________.",ans:["discrimination"],e:"Two-point discrimination (2PD)."},
{l:8,s:"p9",type:"fill",q:"The supra-renal gland is also called the ________ gland.",ans:["adrenal"],e:"Adrenal."},
{l:8,s:"p13-18",type:"saq",q:"Describe the three layers of the skin (tissue type of each), name the four epidermal layers from deep to superficial, and give the function of the four epidermal cell types.",model:"Epidermis: keratinized stratified epithelium; dermis: loose (papillary layer) and dense (reticular layer) connective tissue; hypodermis (subcutaneous): adipose tissue next to muscle and bone. Epidermal layers from deepest: stratum basale → stratum spinosum → stratum granulosum → stratum corneum. Cell types: keratinocytes (predominant, filled with keratin as a waterproof barrier); melanocytes (produce melanin passed to keratinocytes); Langerhans cells (phagocytes that engulf cancer cells or pathogens); Merkel cells/disks (with sensory nerve endings, continuous fine touch).",points:["Epidermis = keratinized stratified epithelium","Dermis = papillary (loose) + reticular (dense) CT","Hypodermis = adipose tissue","Basale → spinosum → granulosum → corneum","Keratinocyte / melanocyte / Langerhans / Merkel functions"],e:"Slides 13–18."},
{l:8,s:"p25-27",type:"saq",q:"Classify burns by degree. For each, give the cause, the depth of damage and the outcome.",model:"First degree (superficial): e.g. sunbath without sunscreen; limited damage of the epidermis; mild edema then skin-peeling; heals within weeks without scarring. Second degree (partial thickness): hot objects or flame; partial destruction of the dermis; blisters from fluid escaping damaged capillaries; healing depends on whether accessory structures survive. Third degree (full thickness): prolonged exposure to hot objects, flames or corrosive chemicals; extensive destruction of the dermis; skin white or charred; numb. Fourth degree: destroys underlying fat and muscle; charred; numb.",points:["1st: epidermis only; edema, peeling; no scar","2nd: partial dermis; blisters; healing depends on accessory structures","3rd: extensive dermis; white/charred; numb","4th: fat and muscle destroyed; charred; numb"],e:"Slides 25–27."}
);

// L9 — Water and fluid balance in the human body (Dr Anfernee Tse)
Q.push(
{l:9,s:"p4",q:"The predominant component of the body for both men and women is:",o:["Water","Protein","Fat","Minerals"],e:"Water is the predominant body component."},
{l:9,s:"p6",q:"In a water molecule, which atom carries a partial NEGATIVE charge (δ−)?",o:["Oxygen","Hydrogen","Both hydrogens","Neither — water is non-polar"],e:"O attracts electrons more strongly → δ−; H atoms → δ+."},
{l:9,s:"p6",q:"Why does the oxygen in water carry a partial negative charge?",o:["Oxygen attracts the shared electrons more strongly than hydrogen","Oxygen has gained a full electron from hydrogen","Oxygen has lost protons","Hydrogen is more electronegative"],e:"O is more electronegative (L1) → unequal sharing → polar."},
{l:9,s:"p6",q:"A hydrogen bond is:",o:["The attraction between partial charges on adjacent molecules","A covalent bond inside one water molecule","A bond formed by transferring electrons","A bond between two hydrogen atoms in H₂"],e:"Hydrogen bond = attraction between δ+ and δ− on ADJACENT molecules."},
{l:9,s:"p6",tf:1,q:"The bond between O and H inside a single water molecule is a hydrogen bond.",a:0,e:"False. Inside the molecule it is a polar COVALENT bond. Hydrogen bonds are BETWEEN neighbouring molecules."},
{l:9,s:"p7",q:"Water's unique properties come from:",o:["Its polar nature and its ability to form extensive hydrogen-bond networks","Its ionic bonds","Its non-polar nature","Its high molecular mass"],e:"Polarity (δ⁺/δ⁻) + hydrogen bonding networks."},
{l:9,s:"p7",q:"Which of these is NOT listed as a property of water on the slide?",o:["Electrical insulation","Cohesive & adhesive","Solvent","Thermal effects"],e:"Listed: cohesive & adhesive, solvent, density, thermal effects."},
{l:9,s:"p8",q:"Cohesion means:",o:["Water sticks to water (hydrogen bonds between water molecules)","Water sticks to other substances","Water dissolves salts","Water evaporates"],e:"Cohesion = water–water. Adhesion = water–other substances."},
{l:9,s:"p8",q:"Adhesion means:",o:["Water sticks to other substances, such as cell membranes and vessel walls","Water sticks to water","Water freezes","Water breaks hydrogen bonds"],e:"Adhesion is due to water's polarity."},
{l:9,s:"p8",q:"Cohesion or adhesion? Maintains continuous blood flow in blood vessels.",o:["Cohesion","Adhesion"],e:"Cohesion."},
{l:9,s:"p8",q:"Cohesion or adhesion? Forms protective tear films for eye lubrication.",o:["Cohesion","Adhesion"],e:"Cohesion (per the table)."},
{l:9,s:"p8",q:"Cohesion or adhesion? Contributes to the viscosity of synovial (joint) fluid.",o:["Cohesion","Adhesion"],e:"Cohesion."},
{l:9,s:"p8",q:"Cohesion or adhesion? Enables capillary action for kidney reabsorption and fluid movement.",o:["Adhesion","Cohesion"],e:"Adhesion."},
{l:9,s:"p8",q:"Cohesion or adhesion? Clings to intestinal mucosa to help dissolve nutrients.",o:["Adhesion","Cohesion"],e:"Adhesion."},
{l:9,s:"p8",q:"Cohesion or adhesion? Creates thin water layers in lungs/vessels for gas diffusion.",o:["Adhesion","Cohesion"],e:"Adhesion."},
{l:9,s:"p9",q:"In the alveoli, water molecules clinging together create:",o:["Surface tension","Surfactant","Adhesion to the blood","Osmotic pressure"],e:"Cohesion (hydrogen bonds) → surface tension."},
{l:9,s:"p9",q:"High surface tension in the alveoli:",o:["Pulls the alveolar walls inward, lowers compliance and makes small alveoli collapse","Makes the lungs easier to inflate","Increases compliance","Has no effect on breathing"],e:"High surface tension → inward pull → ↓ compliance, small alveoli collapse."},
{l:9,s:"p9",q:"Surfactant is secreted by:",o:["Type II alveolar cells","Type I alveolar cells","Goblet cells","Macrophages"],e:"Type II alveolar cells (small, cube-shaped)."},
{l:9,s:"p9",q:"Surfactant acts like a detergent to:",o:["Break water bonds, reduce surface tension and increase lung compliance","Increase surface tension","Make alveoli collapse","Dissolve oxygen"],e:"↓ surface tension → ↑ compliance, keeps alveoli open."},
{l:9,s:"p9",q:"Surfactant deficiency in premature babies causes:",o:["Neonatal respiratory distress syndrome (NRDS)","COPD","Asthma","Cystic fibrosis"],e:"NRDS."},
{l:9,s:"p9",q:"In NRDS, alveoli collapse during expiration. This collapse is called:",o:["Atelectasis","Emphysema","Edema","Crenation"],e:"Atelectasis."},
{l:9,s:"p9",q:"Treatment for NRDS on the slide is:",o:["Artificial surfactant and/or mechanical ventilation","Antibiotics only","Hypertonic saline","Insulin"],e:"Artificial surfactant and/or mechanical ventilation."},
{l:9,s:"p9",tf:1,q:"Surfactant increases surface tension so the alveoli stay open.",a:0,e:"False. Surfactant REDUCES surface tension."},
{l:9,s:"p9",tf:1,q:"Lower surface tension means higher lung compliance.",a:1,e:"True."},
{l:9,s:"p10",q:"Water helps regulate body temperature by:",o:["Transporting heat from the core to the skin for release","Blocking heat loss","Producing heat through shivering","Storing fat"],e:"Water transports heat from the core to the skin."},
{l:9,s:"p10",q:"To evaporate, a water molecule must:",o:["Absorb energy to break its hydrogen bonds, taking it from the skin and blood","Release energy to the skin","Form more hydrogen bonds","Gain an electron"],e:"It must absorb energy from its surroundings → cooling effect."},
{l:9,s:"p10",q:"Evaporation of sweat is described as which kind of process?",o:["Endothermic (absorbs heat), which cools the body","Exothermic (releases heat), which warms the body","Neither — no energy change","Anabolic"],e:"LO3: the endothermic nature of evaporation → cooling."},
{l:9,s:"p10",q:"The change from liquid water to water vapour is called:",o:["Evaporation","Condensation","Hydrolysis","Osmosis"],e:"Evaporation (phase change)."},
{l:9,s:"p11",q:"When salt dissolves, the slightly NEGATIVE end of water (O) attracts:",o:["Na⁺","Cl⁻","Both equally","Neither"],e:"δ− oxygen attracts positive Na⁺; δ+ hydrogens attract negative Cl⁻."},
{l:9,s:"p11",q:"When salt dissolves, the slightly POSITIVE end of water (H) attracts:",o:["Cl⁻","Na⁺","Both equally","Neither"],e:"δ+ H attracts Cl⁻."},
{l:9,s:"p12",q:"A homogeneous mixture of two or more substances with uniform composition is a:",o:["Solution","Solute","Solvent","Suspension"],e:"Solution, e.g. blood plasma, cytosol."},
{l:9,s:"p12",q:"The substance that is dissolved is the:",o:["Solute","Solvent","Solution","Aqueous phase"],e:"Solute, e.g. glucose in blood, O₂ in plasma, Na⁺."},
{l:9,s:"p12",q:"The substance that does the dissolving is the:",o:["Solvent","Solute","Solution","Electrolyte"],e:"Solvent — water in all body fluids."},
