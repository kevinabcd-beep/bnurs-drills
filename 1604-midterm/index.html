<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="1604 Drill"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>1604 Mid-term Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#F3F5F8; --surface:#FFFFFF; --ink:#18202E; --muted:#5A6477; --line:#DDE2EA;
  --lamp:#FF5A5F; --lamp-soft:#FFE4E4; --lamp-ink:#7A1418;
  --ok:#1C8456; --ok-soft:#E1F4EA; --bad:#C23B35; --bad-soft:#FBE6E4;
  --focus:#2F6BD8;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10141B; --surface:#181E28; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3240;
    --lamp:#FF7478; --lamp-soft:#3D1C1E; --lamp-ink:#FFC4C6;
    --ok:#4CC38A; --ok-soft:#153325; --bad:#F07068; --bad-soft:#3A1A19; --focus:#7FA8F0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10141B; --surface:#181E28; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3240;
  --lamp:#FF7478; --lamp-soft:#3D1C1E; --lamp-ink:#FFC4C6;
  --ok:#4CC38A; --ok-soft:#153325; --bad:#F07068; --bad-soft:#3A1A19; --focus:#7FA8F0;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);padding:0 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-within{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.eyebrow{font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1}
.brand h1 .flame{display:inline-block;width:.5em;height:.62em;margin-left:.12em;background:var(--lamp);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:translateY(-.05em)}
.exam{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.exam .days{font:700 22px/1 var(--mono);color:var(--ink)}
.exam .sub{font-size:13px;color:var(--muted)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{font:700 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* modes */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mode:hover{border-color:var(--muted)}
.mode.primary{background:var(--lamp);border-color:var(--lamp);color:#2B0709}
.mode.primary .d{color:#4A1113}
.mode .t{font:700 17px/1.2 var(--display)}
.mode .d{font-size:13px;color:var(--muted);line-height:1.4}
.mode[disabled]{opacity:.45;cursor:not-allowed}

/* lecture picker */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-head h2{font-size:18px;font-weight:600}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lects{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.chip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.chip:first-child{border-top:0}
.chip input{width:18px;height:18px;accent-color:var(--lamp);margin:0}
.chip .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.chip .nm b{font-weight:700;font-size:15px}
.chip .nm b .ln{font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:6px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)}
.bar .w{background:var(--bad)}
.chip .ct{font:500 13px/1.2 var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.chip.off .nm,.chip.off .ct{opacity:.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.note{font-size:13px;color:var(--muted);line-height:1.5}
.note strong{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--ground);padding-block:10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.qbar .home{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.qbar .prog{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.qbar .prog .row{display:flex;justify-content:space-between;font:500 13px/1 var(--mono);color:var(--muted);gap:8px}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--lamp)}
.timer{font:700 16px/1 var(--mono);padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font:700 12px/1 var(--mono);padding:5px 8px;border-radius:6px;background:var(--lamp-soft);color:var(--lamp-ink)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.tf{background:var(--ground);color:var(--muted)}
.qtext{font:600 clamp(19px,3.6vw,23px)/1.35 var(--body);margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{font:700 13px/1 var(--mono);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--ground);color:var(--muted)}
.opt .tx{padding-top:5px}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb .h{font:700 15px/1.2 var(--display)}
.fb.ok .h{color:var(--ok)}
.fb.no .h{color:var(--bad)}
.acts{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border-radius:10px;padding:11px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn.go{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.kbd{font:500 12px/1 var(--mono);color:var(--muted)}
.sessline{display:flex;gap:16px;font:500 13px/1 var(--mono);color:var(--muted);flex-wrap:wrap}
.sessline b{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:480px){.grid{grid-template-columns:repeat(5,1fr)}}
.gc{font:700 13px/1 var(--mono);padding:9px 0;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.gc.done{background:var(--lamp-soft);color:var(--lamp-ink);border-color:transparent}
.gc.cur{border-color:var(--ink);color:var(--ink)}

/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font:800 clamp(48px,12vw,72px)/1 var(--display);letter-spacing:-.03em}
.score .of{font:500 20px/1 var(--mono);color:var(--muted)}
.verdict{font-weight:700}
.breakdown{display:flex;flex-direction:column;gap:8px}
.bd{display:grid;grid-template-columns:44px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bd .l{font:700 13px/1 var(--mono);color:var(--muted)}
.bd .r{font:500 13px/1 var(--mono);text-align:right}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rv.ok{border-left-color:var(--ok)}
.rv .q{font-weight:700}
.rv .a{font-size:14px}
.rv .a .y{color:var(--bad)}
.rv .a .c{color:var(--ok)}
.rv .e{font-size:14px;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}

/* answer inputs (fill-in / calculation / short answer) */
.ansrow{display:flex;gap:10px;flex-wrap:wrap}
.ans{flex:1;min-width:0;font:500 17px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.ans:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--ink)}
.ans.right{border-color:var(--ok);background:var(--ok-soft)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans.long{resize:vertical;min-height:130px;font-size:16px}
.ans[disabled]{opacity:1;color:var(--ink)}
.model,.yours{border-radius:10px;padding:14px 16px;background:var(--ground);display:flex;flex-direction:column;gap:6px}
.model{border-left:4px solid var(--lamp)}
.model p,.yours p{margin:0;line-height:1.55;white-space:pre-wrap}
.pts{display:flex;flex-direction:column;gap:8px}
.pt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.4}
.pt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok)}
.pt:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
</style>

<script>
const Q=[];
// L1 — Basic chemistry for nursing practice: elements, compounds & solutions (Dr Anfernee Tse)
Q.push(
{l:1,s:"p6",q:"The smallest unit of an element that still keeps the chemical properties of that element is:",o:["An atom","A molecule","A compound","An ion"],e:"Atom = smallest unit of an element that retains its chemical properties."},
{l:1,s:"p6",q:"An element is defined as:",o:["A pure substance made of only one type of atom","A substance made of two or more types of atom bonded together","A mixture of atoms with different proton numbers","Any substance that conducts electricity"],e:"Element = pure substance made of only one type of atom, defined by its atomic number."},
{l:1,s:"p6",q:"Where are protons and neutrons found in an atom?",o:["In the nucleus","In shells around the nucleus","Protons in the nucleus, neutrons in the shells","Neutrons in the nucleus, protons in the shells"],e:"Nucleus = protons (+) and neutrons (neutral). Electrons (−) orbit the nucleus in shells."},
{l:1,s:"p6",q:"Which example of an element's unique property is given on the slide?",o:["Oxygen supports combustion; carbon forms organic compounds","Oxygen forms organic compounds; carbon supports combustion","Hydrogen supports combustion; iron forms organic compounds","Nitrogen supports combustion; carbon forms salts"],e:"Slide 6: oxygen (O) supports combustion; carbon (C) forms organic compounds."},
{l:1,s:"p7",q:"Which particle is negatively charged and found OUTSIDE the nucleus?",o:["Electron","Proton","Neutron","Nucleon"],e:"Electron = negative, outside the nucleus, much smaller than protons and neutrons."},
{l:1,s:"p7",q:"Which particle has no charge but has about the same mass as a proton?",o:["Neutron","Electron","Positron","Ion"],e:"Neutron = neutral, about the same mass as a proton, found in the nucleus."},
{l:1,s:"p7",tf:1,q:"Electrons are about the same size as protons and neutrons.",a:0,e:"False. Electrons are MUCH, much smaller than protons and neutrons."},
{l:1,s:"p7",q:"Match the particle to its charge: proton.",o:["Positive (+)","Negative (−)","Neutral (0)"],e:"Proton = +, neutron = 0, electron = −. (Options can repeat across items — like a matching question.)"},
{l:1,s:"p7",q:"Match the particle to its charge: neutron.",o:["Neutral (0)","Positive (+)","Negative (−)"],e:"Neutron = neutral."},
{l:1,s:"p7",q:"Match the particle to its charge: electron.",o:["Negative (−)","Positive (+)","Neutral (0)"],e:"Electron = negative."},
{l:1,s:"p8",q:"The atomic number of an element is the number of:",o:["Protons","Neutrons","Electrons in the outer shell","Protons plus neutrons"],e:"Atomic number = number of protons. Protons + neutrons would be the mass number (not on the slide)."},
{l:1,s:"p8",q:"Oxygen atoms have how many protons?",o:["8","6","1","16"],e:"Slide 8: hydrogen has 1 proton, oxygen has 8."},
{l:1,s:"p8",q:"According to the slide, the ONLY feature that defines an element (its \"ID card\") is the number of:",o:["Protons","Neutrons","Electrons","Chemical bonds"],e:"\"Protons = Element ID Card\"."},
{l:1,s:"p9",q:"If you add 1 proton to a carbon atom, it becomes:",o:["Nitrogen","A carbon isotope","A carbon ion","Oxygen"],e:"Change the proton count → change the element. Carbon (6) + 1 proton = nitrogen (7)."},
{l:1,s:"p9",q:"Atoms of the same element that differ in their number of NEUTRONS are called:",o:["Isotopes","Ions","Compounds","Molecules"],e:"Isotopes vary in neutrons. Ions vary in electrons. In both, the proton count stays the same."},
{l:1,s:"p9",q:"An atom that has lost or gained electrons is called:",o:["An ion","An isotope","A new element","A molecule"],e:"Ions: lose/gain electrons; the proton count stays the same."},
{l:1,s:"p9",tf:1,q:"When an atom becomes an ion, its number of protons changes.",a:0,e:"False. Ions lose or gain ELECTRONS. The proton count stays the same (otherwise it would be a different element)."},
{l:1,s:"p9",tf:1,q:"C-13 and C-14 are both carbon because they have the same number of protons.",a:1,e:"True. They are isotopes: same protons (6), different neutrons."},
{l:1,s:"p10",q:"The C13/C14 urea breath test is used to detect:",o:["Helicobacter pylori infection","Stomach cancer directly","Lactose intolerance","Diabetes"],e:"H. pylori urea breath test."},
{l:1,s:"p10",q:"Which enzyme made by H. pylori is the basis of the urea breath test?",o:["Urease","Amylase","Carbonic anhydrase","Pepsin"],e:"H. pylori produces urease, which breaks urea into CO₂ and ammonia."},
{l:1,s:"p10",q:"Urease breaks urea down into:",o:["CO₂ and ammonia (NH₃)","CO₂ and water","Glucose and ammonia","Amino acids and CO₂"],e:"Urea → CO₂ + NH₃."},
{l:1,s:"p10",q:"In the urea breath test, what is measured in the patient's breath?",o:["Labeled CO₂","Labeled ammonia","Labeled urea","Oxygen"],e:"The breath is analysed for labeled CO₂ (¹³CO₂ or ¹⁴CO₂). Higher levels = infection."},
{l:1,s:"p10",q:"How long after swallowing the labeled urea does the patient breathe into the collection bag?",o:["10–30 minutes","1–2 minutes","2–3 hours","24 hours"],e:"Slide 10: exhales into a collection bag after 10–30 minutes."},
{l:1,s:"p10",q:"Why is labeled carbon (C13 or C14) used in the urea breath test?",o:["So CO₂ made from the swallowed urea can be told apart from the CO₂ the body normally breathes out","Because C13/C14 kills H. pylori","Because normal carbon cannot form urea","Because the isotopes change the stomach pH"],e:"Your ? in L1 notes. We always breathe out CO₂. Labeling the carbon lets the lab see CO₂ that came specifically from urease splitting the swallowed urea."},
{l:1,s:"p10",tf:1,q:"The slide describes C13 as weakly radioactive and C14 as non-radioactive.",a:0,e:"False — it is the other way round. The slide says \"non-radioactive or weakly radioactive\": C13 is the stable (non-radioactive) isotope, C14 is weakly radioactive."},
{l:1,s:"p11",q:"The C13/C14 urea breath test relies on isotopic labeling to track:",o:["Enzymatic cleavage of urea into CO₂","pH changes in the stomach","Bacterial DNA replication","Protein synthesis in H. pylori"],e:"In-class exercise, answer B: enzymatic cleavage of urea into CO₂."},
{l:1,s:"p12",q:"Which group lists the bulk elements that make up about 99% of body mass?",o:["O, C, H, N, Ca, P","Fe, Zn, Cu, I","O, C, H, N, Fe, Zn","Na, K, Cl, Mg, S"],e:"Bulk elements (99% of mass): O, C, H, N, Ca, P."},
{l:1,s:"p12",q:"Which of the following is a TRACE element?",o:["Zinc (Zn)","Calcium (Ca)","Phosphorus (P)","Nitrogen (N)"],e:"Trace: Fe, Zn, Cu, I, etc. Ca and P are bulk elements."},
{l:1,s:"p12",tf:1,q:"Calcium and phosphorus are trace elements because they are needed in tiny amounts.",a:0,e:"False. Ca and P are BULK elements (O, C, H, N, Ca, P = 99% of mass)."},
{l:1,s:"p12",tf:1,q:"Trace elements are critical for the body even though they are present in tiny amounts.",a:1,e:"True, word for word from slide 12."},
{l:1,s:"p14",q:"Why are trace elements like iron (Fe) and zinc (Zn) crucial despite being needed in tiny amounts?",o:["They act as cofactors for enzymes and proteins","They provide energy for cells","They replace bulk elements in bone structure","They are the primary components of DNA"],e:"In-class exercise: D, cofactors for enzymes and proteins. (Your note: carbonic anhydrase needs zinc as a cofactor.)"},
{l:1,s:"p15",q:"Which element makes up the largest % of body mass?",o:["Oxygen (~65%)","Carbon (~18%)","Hydrogen (~10%)","Nitrogen (~3%)"],e:"O ~65% > C ~18% > H ~10% > N ~3%."},
{l:1,s:"p15",q:"Carbon makes up about what % of body mass?",o:["~18%","~65%","~10%","~3%"],e:"Carbon ~18%."},
{l:1,s:"p15",q:"Put these elements in order of % body mass, from highest: Carbon, Hydrogen, Nitrogen, Oxygen.",o:["O → C → H → N","C → O → H → N","O → H → C → N","H → O → C → N"],e:"O 65% → C 18% → H 10% → N 3%."},
{l:1,s:"p15",q:"Which element is described as the backbone of organic molecules (proteins, lipids, DNA)?",o:["Carbon","Oxygen","Nitrogen","Phosphorus"],e:"Carbon = backbone of organic molecules."},
{l:1,s:"p15",q:"Which element's key roles are \"proteins, nucleic acids (DNA/RNA)\" at ~3% of body mass?",o:["Nitrogen","Sulfur","Phosphorus","Carbon"],e:"Nitrogen ~3%: proteins, nucleic acids."},
{l:1,s:"p15",q:"Which element's key roles include ATP, DNA/RNA and bone mineralization?",o:["Phosphorus","Calcium","Magnesium","Sulfur"],e:"Phosphorus ~1%: ATP, DNA/RNA, bone mineralization. (Your note: phosphorus → ATP.)"},
{l:1,s:"p15",q:"Which element's key roles are bone structure, muscle contraction and signaling?",o:["Calcium","Phosphorus","Potassium","Magnesium"],e:"Calcium ~1.5%."},
{l:1,s:"p15",q:"Which element forms disulfide bonds in protein structure?",o:["Sulfur","Nitrogen","Phosphorus","Chlorine"],e:"Sulfur ~0.25%: protein structure (disulfide bonds), enzymes. (Your ?: yes — the amino acids cysteine and methionine contain sulfur; cysteine forms disulfide bonds.)"},
{l:1,s:"p15",q:"Which element is part of stomach acid?",o:["Chlorine","Sodium","Sulfur","Potassium"],e:"Chlorine ~0.15%: electrolyte balance, stomach acid (HCl)."},
{l:1,s:"p15",q:"Which element is needed for hemoglobin (oxygen transport)?",o:["Iron (Fe)","Zinc (Zn)","Magnesium (Mg)","Calcium (Ca)"],e:"Iron — trace (0.006%): hemoglobin, enzymes."},
{l:1,s:"p15",q:"Which element's key roles are \"enzyme cofactor, immune function\" and it is a trace element (0.003%)?",o:["Zinc","Iron","Magnesium","Sodium"],e:"Zinc: enzyme cofactor, immune function. Magnesium is also an enzyme cofactor but is ~0.05% and not trace on this table."},
{l:1,s:"p15",q:"Which element's key roles are \"enzyme cofactor, muscle/nerve function\" at ~0.05%?",o:["Magnesium","Zinc","Iron","Potassium"],e:"Magnesium ~0.05%."},
{l:1,s:"p15",q:"Potassium (K) at ~0.25% body mass is mainly needed for:",o:["Nerve impulses and electrolyte balance","Bone structure","Hemoglobin","Stomach acid"],e:"K: nerve impulses, electrolyte balance."},
{l:1,s:"p15",q:"Sodium (Na) at ~0.15% body mass is mainly needed for:",o:["Nerve function and fluid balance","Disulfide bonds","Oxygen transport","Backbone of organic molecules"],e:"Na: nerve function, fluid balance."},
{l:1,s:"p15",q:"Hydrogen (~10%) is involved in water, organic molecules and:",o:["pH regulation","Bone mineralization","Oxygen transport","Disulfide bonds"],e:"H: water, organic molecules, pH regulation."},
{l:1,s:"p15",q:"Oxygen's key biological roles on the table are:",o:["Cellular respiration, water, organic molecules","Backbone of organic molecules only","Nerve impulses","Protein structure (disulfide bonds)"],e:"O ~65%: cellular respiration, water, organic molecules."},
{l:1,s:"p15",tf:1,q:"Iron makes up about 0.006% of body mass, so it is a trace element.",a:1,e:"True. Fe trace (0.006%); Zn trace (0.003%)."},
{l:1,s:"p17",q:"What is the minimum number of atoms needed to make a molecule?",o:["Two","One","Three","Four"],e:"The minimum is two atoms bound together by a chemical bond."},
{l:1,s:"p18",q:"According to the octet rule, atoms gain, lose or share electrons to have how many valence electrons?",o:["8","2","4","18"],e:"8 valence electrons, like the noble gases."},
{l:1,s:"p18",q:"Which atoms are the exception to the octet rule and need only 2 electrons (duet rule)?",o:["Hydrogen and helium","Carbon and nitrogen","Oxygen and sulfur","Sodium and chlorine"],e:"H and He follow the duet rule."},
{l:1,s:"p18",q:"Why do atoms form chemical bonds?",o:["To fill their outer shells and become more stable","To gain more protons","To lose their neutrons","To become isotopes"],e:"Atoms are most stable when their outer shells are full; bonding fills the vacancies."},
{l:1,s:"p19",q:"In an ionic bond, electrons are:",o:["Transferred","Shared equally","Shared unequally","Destroyed"],e:"Ionic = transferred; covalent = shared."},
{l:1,s:"p19",q:"An ionic bond is usually formed between:",o:["A metal and a non-metal","Two non-metals","Two metals","Two noble gases"],e:"Ionic = metal + non-metal. Covalent = non-metal + non-metal."},
{l:1,s:"p19",q:"A covalent bond is usually formed between:",o:["Two non-metals","A metal and a non-metal","Two metals","A metal and a noble gas"],e:"Covalent = non-metal + non-metal."},
{l:1,s:"p19",q:"Compared with covalent compounds, ionic compounds usually have:",o:["A high melting point and are usually solid","A low melting point and can be any state","A low melting point and are usually gas","A high melting point and are usually liquid"],e:"Ionic: usually solid, high melting point. Covalent: any state, low melting point."},
{l:1,s:"p19",tf:1,q:"Covalent compounds can exist in any state (solid, liquid or gas) and usually have low melting points.",a:1,e:"True (ionic vs covalent table)."},
{l:1,s:"p21",q:"Carbon has ___ vacancies in its outer shell; hydrogen has ___.",o:["4; 1","2; 1","4; 2","8; 2"],e:"Carbon 4 vacancies, hydrogen 1 → four H share electrons with one C to form methane (CH₄)."},
{l:1,s:"p21",q:"Methane (CH₄) is held together by:",o:["Covalent bonds","Ionic bonds","Hydrogen bonds","Metallic bonds"],e:"Four H share electrons with one C → covalent bonds."},
{l:1,s:"p22",q:"A double covalent bond shares how many electrons?",o:["4 (2 pairs)","2 (1 pair)","6 (3 pairs)","8 (4 pairs)"],e:"Single = 1 pair (2 e⁻); double = 2 pairs (4 e⁻); triple = 3 pairs (6 e⁻)."},
{l:1,s:"p22",q:"Which covalent bond is the STRONGEST and SHORTEST?",o:["Triple","Double","Single","All are equal"],e:"Triple = strongest, shortest. Single = weakest, longest."},
{l:1,s:"p22",q:"Which covalent bond is the weakest and longest?",o:["Single","Double","Triple","Ionic"],e:"Single bond, e.g. H–H, C–H."},
{l:1,s:"p22",q:"N≡N is an example of a:",o:["Triple bond","Double bond","Single bond","Ionic bond"],e:"Triple: N≡N, C≡C."},
{l:1,s:"p22",q:"O=O and C=O are examples of:",o:["Double bonds","Single bonds","Triple bonds","Ionic bonds"],e:"Double: O=O, C=O."},
{l:1,s:"p22",q:"H–H and C–H are examples of:",o:["Single bonds","Double bonds","Triple bonds","Ionic bonds"],e:"Single: H–H, C–H."},
{l:1,s:"p24",q:"Electronegativity is an atom's ability to:",o:["Attract the shared electrons in a bond","Lose electrons to form a cation","Gain protons","Form ionic crystals"],e:"Electronegativity = ability to attract the shared electrons in a bond."},
{l:1,s:"p24",q:"Which element has the HIGHEST electronegativity?",o:["Fluorine","Oxygen","Chlorine","Hydrogen"],e:"High for non-metals, fluorine is the highest."},
{l:1,s:"p24",q:"On the periodic table, electronegativity increases:",o:["From left to right across a period, and from bottom to top","From right to left, and from top to bottom","From left to right, and from top to bottom","It does not change in a pattern"],e:"Increases left → right across a period, and bottom → top."},
{l:1,s:"p24",tf:1,q:"Metals have high electronegativity.",a:0,e:"False. Electronegativity is LOW for metals and HIGH for non-metals."},
{l:1,s:"p25",q:"In the H₂ molecule, electrons are shared equally. The bond is:",o:["Non-polar covalent","Polar covalent","Ionic","Hydrogen bond"],e:"Equal sharing → non-polar."},
{l:1,s:"p25",q:"In the HCl molecule, electrons are shared unequally. The bond is:",o:["Polar covalent","Non-polar covalent","Ionic","Metallic"],e:"Unequal sharing → polar."},
{l:1,s:"p25",q:"What is used to predict the polarity of a bond?",o:["The difference in electronegativity of the bonding atoms","The number of neutrons","The melting point","The atomic mass"],e:"Difference in electronegativity predicts polarity."},
{l:1,s:"p26",q:"Polar molecules are usually:",o:["Hydrophilic (water-soluble)","Hydrophobic (fat-soluble)","Insoluble in everything","Gases only"],e:"Polar = hydrophilic. Non-polar = hydrophobic."},
{l:1,s:"p26",q:"Which bonds are given as examples of UNEQUAL electron sharing?",o:["O–H and N–H","C–H and C–C","H–H and O=O","C–C and N≡N"],e:"Polar: O–H, N–H. Non-polar: C–H, C–C."},
{l:1,s:"p26",q:"Is glucose polar or non-polar (per the slide)?",o:["Polar","Non-polar"],e:"Polar examples: water, glucose, amino acids (e.g. serine)."},
{l:1,s:"p26",q:"Is cholesterol polar or non-polar (per the slide)?",o:["Non-polar","Polar"],e:"Non-polar examples: O₂, cholesterol, fatty acids."},
{l:1,s:"p26",q:"Is oxygen gas (O₂) polar or non-polar?",o:["Non-polar","Polar"],e:"O₂ = non-polar (gas exchanged in lungs)."},
{l:1,s:"p26",q:"Is water (H₂O) polar or non-polar?",o:["Polar","Non-polar"],e:"Water = polar (blood plasma, cytoplasm)."},
{l:1,s:"p26",q:"Are fatty acids polar or non-polar (per the slide)?",o:["Non-polar","Polar"],e:"Fatty acids = non-polar (energy storage in fats)."},
{l:1,s:"p26",q:"Is the amino acid serine polar or non-polar (per the slide)?",o:["Polar","Non-polar"],e:"Amino acids (e.g. serine) are listed under polar."},
{l:1,s:"p27",q:"Matching: \"Electrons are transferred from a metal to a non-metal.\"",o:["Ionic bond","Non-polar covalent bond","Polar covalent bond","Amphipathic molecule"],e:"Answer C (ionic bond). Options in this matching exercise CAN repeat."},
{l:1,s:"p27",q:"Matching: \"Electrons are shared equally between identical atoms.\"",o:["Non-polar covalent bond","Polar covalent bond","Ionic bond","Amphipathic molecule"],e:"Answer A (non-polar covalent)."},
{l:1,s:"p27",q:"Matching: \"Electrons are shared unequally, creating partial charges.\"",o:["Polar covalent bond","Non-polar covalent bond","Ionic bond","Amphipathic molecule"],e:"Answer B (polar covalent)."},
{l:1,s:"p27",q:"Matching: \"Forms crystal lattices (e.g., salts) soluble in water.\"",o:["Ionic bond","Amphipathic molecule","Polar covalent bond","Non-polar covalent bond"],e:"Answer C (ionic bond) — the SAME option as item 1. This is the one you got wrong in class (you put D): matching options can be reused."},
{l:1,s:"p27",q:"Matching: \"Major component of cell membranes (e.g., phospholipids).\"",o:["Amphipathic molecule","Ionic bond","Non-polar covalent bond","Polar covalent bond"],e:"Answer D (amphipathic = has both polar and non-polar regions)."},
{l:1,s:"p27",q:"An amphipathic molecule is one that:",o:["Has both polar and non-polar regions","Is fully polar","Is fully non-polar","Is held together by ionic bonds"],e:"Amphipathic = both polar/non-polar regions, e.g. phospholipids."},
{l:1,s:"p27",tf:1,q:"In a matching question, each option can only be used once.",a:0,e:"False — and this is exactly your known trap. In the L1 matching exercise, 'Ionic bond' is the answer to both item 1 and item 4."},
{l:1,s:"p9",type:"fill",q:"Atoms of the same element with different numbers of neutrons are called ________.",ans:["isotopes","isotope"],e:"Isotopes vary in neutrons; ions vary in electrons."},
{l:1,s:"p8",type:"fill",q:"The atomic number of an element equals its number of ________.",ans:["protons","proton"],e:"Atomic number = number of protons."},
{l:1,s:"p10",type:"fill",q:"H. pylori produces the enzyme ________, which splits urea into CO₂ and NH₃.",ans:["urease"],e:"Urease."},
{l:1,s:"p24",type:"fill",q:"The ability of an atom to attract the shared electrons in a bond is called ________.",ans:["electronegativity"],e:"Electronegativity."},
{l:1,s:"p18",type:"fill",q:"The rule that atoms gain, lose or share electrons to reach 8 valence electrons is the ________ rule.",ans:["octet"],e:"Octet rule (H and He: duet rule)."},
{l:1,s:"p27",type:"fill",q:"A molecule with both polar and non-polar regions, like a phospholipid, is described as ________.",ans:["amphipathic"],e:"Amphipathic."},
{l:1,s:"p9-10",type:"saq",q:"Explain the difference between an ion and an isotope, and explain how isotopes are used in the urea breath test for H. pylori.",model:"An ion is an atom that has lost or gained electrons, so it carries a charge; its proton number stays the same. An isotope is an atom of the same element with a different number of neutrons; the proton number (which defines the element) stays the same. In the urea breath test, the patient swallows urea labeled with ¹³C or ¹⁴C. If H. pylori is present, its urease splits the urea into labeled CO₂ and NH₃. The labeled CO₂ is breathed out after 10–30 min and detected in the breath sample; higher levels mean infection.",points:["Ion = gained/lost electrons, proton number unchanged","Isotope = different number of neutrons, same protons","Patient swallows ¹³C/¹⁴C-labeled urea","H. pylori urease splits urea → labeled CO₂ + NH₃","Labeled CO₂ detected in breath (higher = infection)"],e:"Slides 9–10."},
{l:1,s:"p19-26",type:"saq",q:"Compare ionic and covalent bonds (electrons, atoms involved, state, melting point), and explain what makes a covalent bond polar or non-polar.",model:"Ionic bonds form when electrons are transferred, usually from a metal to a non-metal; ionic compounds are usually solid with a high melting point. Covalent bonds form when electrons are shared between non-metals; covalent compounds can be in any state and have lower melting points. A covalent bond is polar when the atoms have different electronegativities, so electrons are shared unequally and partial charges form (e.g. O–H in water, HCl). It is non-polar when electrons are shared equally (e.g. H–H, C–H). Polar molecules are hydrophilic; non-polar molecules are hydrophobic.",points:["Ionic = transfer; covalent = sharing","Ionic = metal + non-metal; covalent = non-metal + non-metal","Ionic usually solid, high m.p.; covalent any state, low m.p.","Polar = unequal sharing due to electronegativity difference (partial charges)","Non-polar = equal sharing; polar → hydrophilic, non-polar → hydrophobic"],e:"Slides 19–26."}
);

// L2 — Chemical reactions in the human body (Dr Anfernee Tse)
Q.push(
{l:2,s:"p4",q:"In a chemical reaction, the starting substances are called:",o:["Reactants","Products","Catalysts","Coefficients"],e:"Starting substances = reactants; new substances formed = products."},
{l:2,s:"p4",q:"In a chemical reaction, the new substances that form are called:",o:["Products","Reactants","Substrates","Buffers"],e:"Products."},
{l:2,s:"p4",tf:1,q:"A chemical reaction is a process in which one or more substances are converted to one or more different substances.",a:1,e:"True — the slide definition."},
{l:2,s:"p5",q:"A + B → AB is the general form of which reaction type?",o:["Combination (synthesis)","Decomposition","Single replacement","Double replacement"],e:"Combination/synthesis: A + B → AB."},
{l:2,s:"p5",q:"AB → A + B is the general form of which reaction type?",o:["Decomposition","Combination","Single replacement","Double replacement"],e:"Decomposition."},
{l:2,s:"p5",q:"A-B + C → AC + B is the general form of which reaction type?",o:["Single replacement","Double replacement","Combination","Decomposition"],e:"Single replacement."},
{l:2,s:"p5",q:"AB + CD → AC + BD is the general form of which reaction type?",o:["Double replacement","Single replacement","Decomposition","Combination"],e:"Double replacement."},
{l:2,s:"p5",q:"Hemoglobin + O₂ → HbO₂ is an example of which reaction type?",o:["Combination (synthesis)","Decomposition","Single replacement","Double replacement"],e:"Combination — oxygen transport."},
{l:2,s:"p5",q:"ATP → ADP + Pᵢ + Energy is an example of which reaction type?",o:["Decomposition","Combination","Single replacement","Double replacement"],e:"Decomposition — energy release."},
{l:2,s:"p5",q:"Zn²⁺ + Hemoglobin → Zn-Hemoglobin + Fe²⁺ is an example of which reaction type?",o:["Single replacement","Double replacement","Combination","Decomposition"],e:"Single replacement (rare; heavy metal toxicity)."},
{l:2,s:"p5",q:"HCl + NaHCO₃ → NaCl + H₂CO₃ is an example of which reaction type?",o:["Double replacement","Single replacement","Combination","Decomposition"],e:"Double replacement — stomach acid neutralization (antacids)."},
{l:2,s:"p5",q:"Which clinical relevance goes with the SINGLE REPLACEMENT example on the slide?",o:["Heavy metal poisoning","Hypoxia, anemia management","Fatigue, metabolic disorders","Acid-base balance (antacids)"],e:"Single replacement (Zn replacing Fe in Hb) → heavy metal poisoning."},
{l:2,s:"p5",q:"Which clinical relevance goes with the COMBINATION example (Hb + O₂)?",o:["Hypoxia, anemia management","Heavy metal poisoning","Acid-base balance (antacids)","Fatigue, metabolic disorders"],e:"Combination → hypoxia, anemia management."},
{l:2,s:"p5",q:"Which clinical relevance goes with the DECOMPOSITION example (ATP → ADP)?",o:["Fatigue, metabolic disorders","Hypoxia, anemia management","Heavy metal poisoning","Acid-base balance (antacids)"],e:"Decomposition → fatigue, metabolic disorders."},
{l:2,s:"p5",q:"Which clinical relevance goes with the DOUBLE REPLACEMENT example (HCl + NaHCO₃)?",o:["Acid-base balance (antacids)","Heavy metal poisoning","Fatigue, metabolic disorders","Hypoxia, anemia management"],e:"Double replacement → acid-base balance (antacids)."},
{l:2,s:"p5",tf:1,q:"Single replacement reactions like Zn²⁺ replacing Fe²⁺ in hemoglobin are common, normal body reactions.",a:0,e:"False. The slide marks it as RARE, linked to heavy metal toxicity."},
{l:2,s:"p5",q:"ATP stands for:",o:["Adenosine triphosphate","Adenine triphosphate","Adenosine tetraphosphate","Amino triphosphate"],e:"ATP = adenosine triphosphate; ADP = adenosine diphosphate."},
{l:2,s:"p6",q:"Catabolism is:",o:["Breakdown of molecules, which releases energy","Synthesis of molecules, which requires energy","Transfer of electrons only","Transfer of protons only"],e:"Catabolism = breakdown, releases energy. Anabolism = synthesis, requires energy."},
{l:2,s:"p6",q:"Anabolism is:",o:["Synthesis of molecules, which requires energy","Breakdown of molecules, which releases energy","Transfer of electrons","Neutralization of acid"],e:"Anabolism = synthesis (requires energy)."},
{l:2,s:"p6",q:"Glucose → ATP + CO₂ + H₂O is an example of:",o:["Catabolism","Anabolism","Redox only","Double replacement"],e:"Catabolism (cellular respiration) — provides energy for cell functions."},
{l:2,s:"p6",q:"Amino acids → Proteins is an example of:",o:["Anabolism","Catabolism","Decomposition","Hydrolysis"],e:"Anabolism — tissue repair, enzyme production."},
{l:2,s:"p6",q:"NAD⁺ + H⁺ → NADH is given as an example of:",o:["Oxidation-reduction (redox)","Catabolism","Double replacement","Neutralization"],e:"Redox = transfer of electrons; function: ATP production in mitochondria."},
{l:2,s:"p6",q:"The function of redox reactions such as NAD⁺ → NADH, according to the slide, is:",o:["ATP production in mitochondria","Tissue repair","Stomach acid neutralization","Oxygen transport"],e:"Redox → ATP production in mitochondria."},
{l:2,s:"p6",q:"The function of anabolism, according to the table, is:",o:["Tissue repair, enzyme production","Provides energy for cellular functions","ATP production in mitochondria","Neutralizing excess acid"],e:"Anabolism → tissue repair, enzyme production."},
{l:2,s:"p8",q:"Oxidation-reduction (redox) reactions involve the transfer of:",o:["Electrons","Protons only","Neutrons","Whole atoms of carbon"],e:"Redox = transfer of electrons between substances."},
{l:2,s:"p9",q:"Anabolism or catabolism? \"A process that results in the net release of free energy (is exergonic).\"",o:["Catabolism","Anabolism"],e:"Releases energy → catabolism."},
{l:2,s:"p9",q:"Anabolism or catabolism? \"The synthesis of a complex protein from individual amino acid subunits.\"",o:["Anabolism","Catabolism"],e:"Synthesis → anabolism."},
{l:2,s:"p9",q:"Anabolism or catabolism? \"The breakdown of a large lipid polymer into its constituent fatty acids and glycerol.\"",o:["Catabolism","Anabolism"],e:"Breakdown → catabolism."},
{l:2,s:"p9",q:"Anabolism or catabolism? \"Breaking down glycogen into glucose molecules in the liver.\"",o:["Catabolism","Anabolism"],e:"Breakdown → catabolism."},
{l:2,s:"p9",q:"Anabolism or catabolism? \"Creating new DNA strands during replication.\"",o:["Anabolism","Catabolism"],e:"Building → anabolism. In-class key: 1 B, 2 A, 3 B, 4 B, 5 A — options repeat."},
{l:2,s:"p10",q:"According to the Brønsted–Lowry theory, an acid is a substance that:",o:["Donates H⁺","Accepts H⁺","Donates OH⁻","Accepts electrons"],e:"Acid = H⁺ donor; base = H⁺ acceptor."},
{l:2,s:"p10",q:"According to the Brønsted–Lowry theory, a base is a substance that:",o:["Accepts H⁺","Donates H⁺","Must contain OH⁻","Donates electrons"],e:"Base = H⁺ acceptor."},
{l:2,s:"p10",q:"Brønsted and Lowry expanded the definition of acids and bases in:",o:["1923","1899","1860","1978"],e:"1923 — J. N. Brønsted (Denmark) and T. M. Lowry (Great Britain)."},
{l:2,s:"p10",q:"What was new about the Brønsted–Lowry definition?",o:["It included bases that do not contain OH⁻ ions","It said all acids contain oxygen","It defined acids as electron donors","It only applied to strong acids"],e:"It expanded the definition to include bases WITHOUT OH⁻."},
{l:2,s:"p10",q:"J. N. Brønsted worked in ___ and T. M. Lowry in ___.",o:["Denmark; Great Britain","Great Britain; Denmark","Germany; France","Sweden; USA"],e:"Brønsted = Denmark, Lowry = Great Britain."},
{l:2,s:"p11",q:"A strong acid:",o:["Completely ionizes (100%) in aqueous solution","Dissociates only slightly in water","Accepts H⁺","Does not dissolve in water"],e:"Strong = 100% ionized. Weak = dissociates only slightly."},
{l:2,s:"p11",q:"A weak acid:",o:["Dissociates only slightly in water, forming a few ions","Completely ionizes in water","Has a pH above 7","Contains no hydrogen"],e:"Weak acid = slight dissociation."},
{l:2,s:"p11",q:"On the strong vs weak acid slide, which acid is the example of a WEAK acid?",o:["Hydrogen fluoride (HF)","Hydrogen iodide (HI)","Hydrochloric acid (HCl)","Sulfuric acid"],e:"HI = strong; HF = weak. (The labels are in a picture; this is the standard classification — check against your slide.)"},
{l:2,s:"p11",q:"On the strong vs weak acid slide, which acid is the example of a STRONG acid?",o:["Hydrogen iodide (HI)","Hydrogen fluoride (HF)","Carbonic acid (H₂CO₃)","Acetic acid"],e:"HI = strong. (Standard classification; the slide shows it as a picture.)"},
{l:2,s:"p13",q:"A solution with a pH of 7 is:",o:["Neutral","Acidic","Basic","A buffer"],e:"< 7 acidic; 7 neutral; > 7 basic."},
{l:2,s:"p13",q:"A solution with a pH of 9 is:",o:["Basic","Acidic","Neutral"],e:"> 7 = basic."},
{l:2,s:"p13",q:"A solution with a pH of 4 is:",o:["Acidic","Basic","Neutral"],e:"< 7 = acidic."},
{l:2,s:"p13",q:"The pH scale usually ranges from:",o:["0 to 14","1 to 10","−7 to +7","0 to 100"],e:"Usually 0–14."},
{l:2,s:"p14",q:"The formula for pH is:",o:["pH = −log[H₃O⁺]","pH = log[H₃O⁺]","pH = −ln[H₃O⁺]","pH = 1/[H₃O⁺]"],e:"pH = negative log (base 10) of [H₃O⁺]."},
{l:2,s:"p14",q:"The pH scale is a ___ scale.",o:["Logarithmic","Linear","Percentage","Exponential (base e)"],e:"Logarithmic (base 10)."},
{l:2,s:"p14",q:"If [H₃O⁺] = 1.0 × 10⁻² M, the pH is:",o:["2.00","−2.00","12.00","0.01"],e:"pH = −log(10⁻²) = 2.00."},
{l:2,s:"p14",type:"num",q:"Find the pH of a solution with [H₃O⁺] = 4.0 × 10⁻⁵ M. (Give 2 decimal places.)",ans:4.40,tol:0.02,e:"pH = −log(4.0 × 10⁻⁵) = −(log 4.0 + log 10⁻⁵) = −(0.60 − 5) = 4.40. Check: between 4 and 5, because 4.0 × 10⁻⁵ is between 10⁻⁴ and 10⁻⁵."},
{l:2,s:"p14",type:"num",q:"Find the pH of a solution with [H₃O⁺] = 1.0 × 10⁻⁹ M.",ans:9.00,tol:0.02,e:"pH = −log(10⁻⁹) = 9.00 → basic."},
{l:2,s:"p14",q:"Solution A has pH 3, solution B has pH 5. Compared with B, A has:",o:["100 times more H₃O⁺","2 times more H₃O⁺","20 times more H₃O⁺","100 times less H₃O⁺"],e:"Log scale: each pH unit = 10×. 2 units = 10² = 100×. Lower pH = MORE H₃O⁺."},
{l:2,s:"p14",tf:1,q:"A lower pH means a higher [H₃O⁺].",a:1,e:"True. pH = −log[H₃O⁺], so as [H₃O⁺] goes up, pH goes down."},
{l:2,s:"p14",q:"Why does the slide use H₃O⁺ while the lecturer keeps saying H⁺ (your ? in L2 notes)?",o:["They mean the same thing: free H⁺ in water attaches to H₂O to form H₃O⁺, so the two are used interchangeably","H⁺ and H₃O⁺ are completely different ions with different pH formulas","H₃O⁺ is only used for strong acids","H⁺ only exists in the stomach"],e:"In water, H⁺ never floats free — it bonds to H₂O to make H₃O⁺ (hydronium). Physiology usually writes H⁺ for short; pH = −log[H⁺] = −log[H₃O⁺]."},
{l:2,s:"p15",q:"In a neutralization reaction, an acid reacts with a base to produce:",o:["Salt and water","Salt and hydrogen gas","Water and CO₂ only","A stronger acid"],e:"Acid + base → salt + water."},
{l:2,s:"p15",q:"In neutralization, the salt formed is made of:",o:["The anion from the acid and the cation from the base","The cation from the acid and the anion from the base","Two anions","Water and hydroxide"],e:"HCl + NaOH → NaCl + H₂O: Cl⁻ (anion) from the acid, Na⁺ (cation) from the base."},
{l:2,s:"p15",q:"HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l). NaCl is the:",o:["Salt","Acid","Base","Buffer"],e:"Acid + base → salt (NaCl) + water."},
{l:2,s:"p16",q:"Antacids are made of mixtures of:",o:["Aluminum hydroxide and magnesium hydroxide","Sodium chloride and potassium chloride","Hydrochloric acid and carbonic acid","Calcium and phosphate"],e:"Al(OH)₃ + Mg(OH)₂ mixtures."},
{l:2,s:"p16-17",q:"Which is the balanced equation for magnesium hydroxide neutralizing stomach acid?",o:["Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O","Mg(OH)₂ + HCl → MgCl + H₂O","MgCl₂ + 2H₂O → Mg(OH)₂ + 2HCl","Mg + 2HCl → MgCl₂ + H₂"],e:"Standard equation (the slide shows the antacid reactions as a picture — check it). Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O."},
{l:2,s:"p18",q:"A buffer solution:",o:["Resists changes in pH when acids or bases are added","Changes pH drastically when acid is added","Always has pH 7","Only works in the stomach"],e:"In a buffer, the pH is maintained when acids or bases are added."},
{l:2,s:"p18",q:"Buffers maintain blood pH close to:",o:["7.4","7.0","6.8","8.0"],e:"Close to 7.4 in blood."},
{l:2,s:"p18",q:"According to the slide, why does a change in blood pH matter?",o:["It affects the uptake of oxygen and cellular processes","It changes the atomic number of blood ions","It only affects taste","It stops electrons moving"],e:"*A change in the pH of the blood affects the uptake of oxygen and cellular processes."},
{l:2,s:"p18",tf:1,q:"When an acid is added to plain water, the pH changes drastically.",a:1,e:"True. Water is not a buffer."},
{l:2,s:"p19",q:"Which buffer system is found in blood plasma?",o:["Bicarbonate (H₂CO₃ / HCO₃⁻)","Phosphate (H₂PO₄⁻ / HPO₄²⁻)","Ammonia (NH₃ / NH₄⁺)","None — plasma has no buffer"],e:"Bicarbonate → blood plasma."},
{l:2,s:"p19",q:"Where does the PHOSPHATE buffer system mainly work?",o:["Kidneys and ICF","Blood plasma","Stomach","Lungs"],e:"Phosphate → kidneys, ICF."},
{l:2,s:"p19",q:"Where does the AMMONIA buffer system work?",o:["Kidneys","Blood plasma","Blood & cells","Stomach"],e:"Ammonia (NH₃/NH₄⁺) → kidneys."},
{l:2,s:"p19",q:"Hemoglobin (Hb + H⁺ ⇌ HbH) is part of which buffer system?",o:["Protein","Bicarbonate","Phosphate","Ammonia"],e:"Protein buffer (Hb) → blood & cells."},
{l:2,s:"p19",q:"Which of the following is NOT one of the 4 buffer systems on the slide?",o:["Chloride","Bicarbonate","Phosphate","Ammonia"],e:"The 4: bicarbonate, phosphate, protein, ammonia."},
{l:2,s:"p19",q:"The components of the phosphate buffer are:",o:["H₂PO₄⁻ / HPO₄²⁻","H₂CO₃ / HCO₃⁻","NH₃ / NH₄⁺","Hb / HbH"],e:"Phosphate: H⁺ + HPO₄²⁻ ⇌ H₂PO₄⁻."},
{l:2,s:"p19",q:"The components of the bicarbonate buffer are:",o:["H₂CO₃ / HCO₃⁻","H₂PO₄⁻ / HPO₄²⁻","NH₃ / NH₄⁺","HCl / NaHCO₃"],e:"Bicarbonate: H₂CO₃ / HCO₃⁻."},
{l:2,s:"p20",q:"The key reaction of the bicarbonate buffer system is:",o:["CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻","CO₂ + H₂O ⇌ HCO₃⁻ ⇌ H₂CO₃ + H⁺","H⁺ + NH₃ ⇌ NH₄⁺","H⁺ + HPO₄²⁻ ⇌ H₂PO₄⁻"],e:"CO₂ + H₂O ⇌ H₂CO₃ (carbonic acid) ⇌ H⁺ + HCO₃⁻ (bicarbonate). (Your note wrote \"Co2+\" — it should be CO₂.)"},
{l:2,s:"p20",q:"Which organ system controls the CO₂ side of the bicarbonate buffer?",o:["Respiratory system, by adjusting breathing rate","Kidneys, by reabsorbing HCO₃⁻","Liver, by making urea","Stomach, by making HCl"],e:"Lungs control CO₂ release by adjusting breathing rate."},
{l:2,s:"p20",q:"Which organ regulates HCO₃⁻ levels by reabsorbing it into blood or excreting it in urine?",o:["Kidneys","Lungs","Liver","Pancreas"],e:"Kidneys regulate bicarbonate."},
{l:2,s:"p21",q:"Step 1 of the bicarbonate buffer when H⁺ is added (buffering):",o:["H⁺ + HCO₃⁻ → H₂CO₃","H₂CO₃ → CO₂ + H₂O","CO₂ is exhaled","HCO₃⁻ is excreted in urine"],e:"Step 1 buffering: free H⁺ is neutralized by bicarbonate, forming weak carbonic acid."},
{l:2,s:"p21",q:"Step 2 of the bicarbonate buffer (conversion):",o:["H₂CO₃ → CO₂ + H₂O","H⁺ + HCO₃⁻ → H₂CO₃","CO₂ is exhaled","H⁺ + NH₃ → NH₄⁺"],e:"Step 2: carbonic acid breaks down into CO₂ and water."},
{l:2,s:"p21",q:"Put the 3 steps of the bicarbonate buffer response to added H⁺ in order:",o:["Buffering → Conversion → Exhalation","Conversion → Buffering → Exhalation","Exhalation → Buffering → Conversion","Buffering → Exhalation → Conversion"],e:"1 Buffering (H⁺ + HCO₃⁻ → H₂CO₃), 2 Conversion (→ CO₂ + H₂O), 3 Exhalation (lungs remove CO₂)."},
{l:2,s:"p21",q:"The overall result of the bicarbonate buffer when H⁺ is added is:",o:["H⁺ + HCO₃⁻ → CO₂ + H₂O","CO₂ + H₂O → H⁺ + HCO₃⁻","H⁺ + OH⁻ → H₂O","HCO₃⁻ → CO₃²⁻ + H⁺"],e:"The H⁺ is converted and removed (as CO₂ breathed out), stabilizing pH."},
{l:2,s:"p21",q:"Which principle explains the shifts in the bicarbonate buffer equation?",o:["Le Châtelier's principle","Octet rule","Brønsted–Lowry theory","Lock-and-key model"],e:"Le Châtelier's principle: the equilibrium shifts to oppose the change."},
{l:2,s:"p22",q:"The normal blood pH range given on the acidosis/alkalosis slide is:",o:["7.35–7.45","7.0–7.8","7.3–7.5","6.8–7.2"],e:"L2: 7.35–7.45. Note: the L3 homeostasis table says 7.3–7.5. Use 7.35–7.45 for acid–base questions."},
{l:2,s:"p22",q:"Acidosis means the blood pH is:",o:["Below the normal range (too acidic)","Above the normal range (too alkaline)","Exactly 7.0","Normal but CO₂ is high"],e:"Acidosis = low pH; alkalosis = high pH."},
{l:2,s:"p22",q:"↑ CO₂ from hypoventilation shifts the bicarbonate equation ___ and causes ___.",o:["Right (→); respiratory acidosis","Left (←); respiratory alkalosis","Left (←); metabolic acidosis","Right (→); metabolic alkalosis"],e:"More CO₂ pushes CO₂ + H₂O → … → H⁺: right shift, more H⁺ → respiratory acidosis (e.g. COPD, asthma)."},
{l:2,s:"p22",q:"↓ CO₂ from hyperventilation shifts the bicarbonate equation ___ and causes ___.",o:["Left (←); respiratory alkalosis","Right (→); respiratory acidosis","Right (→); metabolic alkalosis","Left (←); metabolic acidosis"],e:"Less CO₂ → equation shifts left, H⁺ used up → respiratory alkalosis (e.g. anxiety, fever)."},
{l:2,s:"p22",q:"↑ H⁺ in ketoacidosis shifts the bicarbonate equation ___ and causes ___.",o:["Left (←); metabolic acidosis","Right (→); metabolic acidosis","Left (←); respiratory acidosis","Right (→); respiratory alkalosis"],e:"Extra H⁺ combines with HCO₃⁻ → shift LEFT → metabolic acidosis (e.g. diabetes, sepsis)."},
{l:2,s:"p22",q:"↓ H⁺ from vomiting HCl shifts the bicarbonate equation ___ and causes ___.",o:["Right (→); metabolic alkalosis","Left (←); metabolic alkalosis","Right (→); respiratory acidosis","Left (←); respiratory alkalosis"],e:"Losing H⁺ → shift RIGHT to replace it → metabolic alkalosis (e.g. pyloric stenosis)."},
{l:2,s:"p22",q:"Which clinical example is given for RESPIRATORY ACIDOSIS?",o:["COPD, asthma","Anxiety, fever","Diabetes, sepsis","Pyloric stenosis"],e:"Respiratory acidosis ← hypoventilation (COPD, asthma)."},
{l:2,s:"p22",q:"Which clinical example is given for RESPIRATORY ALKALOSIS?",o:["Anxiety, fever","COPD, asthma","Diabetes, sepsis","Pyloric stenosis"],e:"Respiratory alkalosis ← hyperventilation (anxiety, fever)."},
{l:2,s:"p22",q:"Which clinical example is given for METABOLIC ACIDOSIS?",o:["Diabetes, sepsis","Pyloric stenosis","Anxiety, fever","COPD, asthma"],e:"Metabolic acidosis ← ↑ H⁺, ketoacidosis (diabetes, sepsis)."},
{l:2,s:"p22",q:"Which clinical example is given for METABOLIC ALKALOSIS?",o:["Pyloric stenosis (vomiting HCl)","Diabetes, sepsis","COPD, asthma","Anxiety, fever"],e:"Metabolic alkalosis ← ↓ H⁺ from vomiting HCl (pyloric stenosis)."},
{l:2,s:"p22",tf:1,q:"Hyperventilation causes respiratory acidosis.",a:0,e:"False. Hyperventilation blows off CO₂ → ↓ CO₂ → shift left → respiratory ALKALOSIS."},
{l:2,s:"p22",tf:1,q:"In ketoacidosis, the extra H⁺ shifts the bicarbonate equation to the left.",a:1,e:"True. ↑ H⁺ pushes the equation left (H⁺ + HCO₃⁻ → H₂CO₃ → CO₂ + H₂O)."},
{l:2,s:"p22",q:"COPD stands for:",o:["Chronic obstructive pulmonary disease","Chronic oxygen perfusion disorder","Carbon dioxide overload pulmonary disease","Chronic obstructive pleural disease"],e:"Chronic obstructive pulmonary disease."},
{l:2,s:"p23",q:"A 65-year-old smoker with acute shortness of breath: pH 7.28, PaCO₂ 58 mmHg, HCO₃⁻ 26 mEq/L. What is the primary disturbance and the initial shift?",o:["Acute respiratory acidosis with a rightward shift (→)","Metabolic acidosis with a leftward shift (←)","Respiratory alkalosis with a leftward shift (←)","Metabolic alkalosis with a rightward shift (→)"],e:"In-class exercise: B. pH low (acidosis), PaCO₂ high (respiratory cause), HCO₃⁻ still normal (not yet compensated → acute). ↑ CO₂ pushes the equation right."},
{l:2,s:"p23",q:"The normal range of PaCO₂ on the ABG exercise is:",o:["35–45 mmHg","22–26 mmHg","7.35–7.45 mmHg","80–100 mmHg"],e:"PaCO₂ 35–45 mmHg; HCO₃⁻ 22–26 mEq/L; pH 7.35–7.45."},
{l:2,s:"p23",q:"The normal range of HCO₃⁻ on the ABG exercise is:",o:["22–26 mEq/L","35–45 mEq/L","7.35–7.45 mEq/L","135–145 mEq/L"],e:"HCO₃⁻ 22–26 mEq/L."},
{l:2,s:"p23",q:"In the ABG exercise, why is it RESPIRATORY rather than metabolic acidosis?",o:["PaCO₂ is high while HCO₃⁻ is normal","HCO₃⁻ is low while PaCO₂ is normal","pH is above 7.45","PaCO₂ is low"],e:"Raised CO₂ is the cause. In metabolic acidosis, HCO₃⁻ would be low."},
{l:2,s:"p10",type:"fill",q:"According to the Brønsted–Lowry theory, an acid is an H⁺ ________ and a base is an H⁺ ________. (Write the two words separated by a comma.)",ans:["donor, acceptor","donor,acceptor","donor acceptor"],e:"Acid = H⁺ donor; base = H⁺ acceptor."},
{l:2,s:"p18",type:"fill",q:"A solution that resists changes in pH when acid or base is added is called a ________.",ans:["buffer","buffer solution"],e:"Buffer."},
{l:2,s:"p21",type:"fill",q:"The shifts of CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ are explained by ________'s principle.",ans:["le chatelier","le châtelier","lechatelier"],e:"Le Châtelier's principle."},
{l:2,s:"p6",type:"fill",q:"The breakdown of molecules that releases energy is called ________.",ans:["catabolism"],e:"Catabolism (anabolism = synthesis, requires energy)."},
{l:2,s:"p8",type:"fill",q:"Reactions that involve the transfer of electrons are called ________ reactions (full name or short name).",ans:["redox","oxidation-reduction","oxidation reduction"],e:"Oxidation-reduction (redox)."},
{l:2,s:"p20-21",type:"saq",q:"Using the bicarbonate buffer equation, explain how the body resists a fall in pH when H⁺ is added, including the roles of the lungs and kidneys.",model:"CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻. When H⁺ increases, bicarbonate binds the free H⁺ to form weak carbonic acid (H⁺ + HCO₃⁻ → H₂CO₃). Carbonic acid breaks down into CO₂ and water (H₂CO₃ → CO₂ + H₂O). The lungs breathe out the extra CO₂, removing the acid load (overall H⁺ + HCO₃⁻ → CO₂ + H₂O), so pH stays near 7.4. This is a leftward shift explained by Le Châtelier's principle. The respiratory system controls CO₂ by adjusting breathing rate; the kidneys regulate HCO₃⁻ by reabsorbing it into blood or excreting it in urine.",points:["Writes CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻","HCO₃⁻ binds added H⁺ → H₂CO₃","H₂CO₃ → CO₂ + H₂O; lungs exhale CO₂","Lungs adjust breathing rate to control CO₂","Kidneys reabsorb or excrete HCO₃⁻"],e:"Slides 20–21."},
{l:2,s:"p22",type:"saq",q:"For each disturbance, state the direction the bicarbonate equation shifts and the acid–base disorder produced, with one clinical example: (a) hypoventilation, (b) hyperventilation, (c) ketoacidosis, (d) vomiting HCl.",model:"(a) Hypoventilation → ↑ CO₂ → shifts right → respiratory acidosis (COPD, asthma). (b) Hyperventilation → ↓ CO₂ → shifts left → respiratory alkalosis (anxiety, fever). (c) Ketoacidosis → ↑ H⁺ → shifts left → metabolic acidosis (diabetes, sepsis). (d) Vomiting HCl → ↓ H⁺ → shifts right → metabolic alkalosis (pyloric stenosis).",points:["(a) right → respiratory acidosis (COPD/asthma)","(b) left → respiratory alkalosis (anxiety/fever)","(c) left → metabolic acidosis (diabetes/sepsis)","(d) right → metabolic alkalosis (pyloric stenosis)"],e:"Slide 22 table."}
);

// L3 — Concepts of homeostasis (Dr Philip Hung) — slides p1–12 of the L3–L4 deck
Q.push(
{l:3,s:"p4",q:"Homeostasis is best defined as:",o:["A relatively stable condition of the internal environment","A fixed, unchanging internal environment","The external environment around the body","The process of cell division"],e:"Homeostasis = a RELATIVELY stable condition of the internal environment; it is a dynamic process."},
{l:3,s:"p4",q:"Homeostasis is regulated mainly by which two systems?",o:["Endocrine and nervous systems","Digestive and respiratory systems","Muscular and skeletal systems","Integumentary and lymphatic systems"],e:"Regulated by the endocrine and nervous systems."},
{l:3,s:"p4",tf:1,q:"Homeostasis is a static process: once a variable is set, it never changes.",a:0,e:"False. Homeostasis is a DYNAMIC process (your note: in the cold we make more heat, in the heat less)."},
{l:3,s:"p5",q:"The \"set point\" of a variable is:",o:["The ideal normal value of that variable","The restricted set of values for being healthy and stable","The highest value the body can survive","The value measured in the morning"],e:"Set point = ideal normal value. Normal range = the restricted set of values for being healthy and stable."},
{l:3,s:"p5",q:"The \"normal range\" of a variable is:",o:["The restricted set of values for being healthy and stable","The ideal normal value","The range the body can survive for a few minutes","Always ±10% of the set point"],e:"Normal range = restricted set of values for being healthy & stable."},
{l:3,s:"p5",q:"Which of the following is NOT listed as a variable the body maintains?",o:["Hair length","Blood pressure","Blood pH","Blood minerals (Na⁺, K⁺)"],e:"Listed: blood pressure, core temperature, blood pH, blood glucose, blood gases (O₂, CO₂), blood minerals (Na⁺, K⁺)."},
{l:3,s:"p5",q:"The set point of body (core) temperature is:",o:["37℃","36℃","37.5℃","38℃"],e:"37℃, normal range 36.7–37.1℃ on this table. (Your notes: the lecturer said know the trends; you don't need to memorize every number.)"},
{l:3,s:"p5",q:"The set point of blood pressure given on the slide is:",o:["120/80 mmHg","140/90 mmHg","100/60 mmHg","130/85 mmHg"],e:"120/80 mmHg; normal range 90–139 / 60–89 mmHg."},
{l:3,s:"p5",q:"The set point of blood pH on the homeostasis slide is:",o:["7.4","7.0","7.35","7.8"],e:"7.4. Note this table gives the range as 7.3–7.5, while L2 gives 7.35–7.45."},
{l:3,s:"p6",tf:1,q:"Body temperature stays exactly at 37℃ all day.",a:0,e:"False. The ideal is 37℃ but it fluctuates within the normal range over the day (noon/midnight graph)."},
{l:3,s:"p7",q:"According to the lecture, how does the normal range of blood pressure change with age, and why?",o:["It increases, because blood vessels become stiffer and less elastic","It decreases, because the heart becomes weaker","It stays the same throughout life","It increases, because children have stiffer vessels"],e:"Slide 7 is a picture (\"normal range may change with age\"); from your notes: children's vessels are elastic, older people's vessels stiffen, so pressure builds up."},
{l:3,s:"p8",q:"How does the body keep variables within their normal ranges?",o:["By feedback mechanisms","By conscious decision only","By increasing the set point","By stopping all metabolism"],e:"Homeostatic control is by feedback mechanisms."},
{l:3,s:"p8",q:"Negative feedback works to:",o:["Suppress the stimulus","Enhance the stimulus","Start a new stimulus","Speed up key processes to completion"],e:"Negative = suppress the stimulus. Positive = enhance the stimulus/action."},
{l:3,s:"p8",q:"Positive feedback works to:",o:["Enhance the stimulus / action","Suppress the stimulus","Keep a variable at its set point","Monitor the environment"],e:"Positive feedback enhances the stimulus."},
{l:3,s:"p8",q:"Which component of negative feedback MONITORS the environment?",o:["Receptor (sensor)","Control center","Effector","Stimulus"],e:"Receptor/sensor monitors; control center decides; effector responds."},
{l:3,s:"p8",q:"Which component of negative feedback determines whether the variable is within normal range?",o:["Control center","Receptor","Effector","Afferent nerve"],e:"Control center."},
{l:3,s:"p8",q:"Which component of negative feedback RESPONDS to the stimulus?",o:["Effector","Receptor","Control center","Set point"],e:"Effector responds."},
{l:3,s:"p8",q:"Put the negative feedback components in the order a signal travels:",o:["Receptor → Control center → Effector","Effector → Receptor → Control center","Control center → Receptor → Effector","Receptor → Effector → Control center"],e:"Stimulus → receptor detects → input to control center → output to effector → response."},
{l:3,s:"p9",q:"In the nervous pathway on slide 9, the sensory nerve that carries information TO the brain/spinal cord is called:",o:["Afferent nerve","Efferent nerve","Motor nerve","Effector nerve"],e:"Sensory = afferent (towards the CNS). Motor = efferent (away from the CNS)."},
{l:3,s:"p9",q:"The motor nerve that carries signals FROM the brain/spinal cord to the effector is called:",o:["Efferent nerve","Afferent nerve","Sensory nerve","Receptor nerve"],e:"Motor = efferent."},
{l:3,s:"p10",q:"Positive feedback is described on the slide as:",o:["Less common, used to accelerate some key processes","The most common type of feedback in the body","Used to keep variables at their set point","Only found in the nervous system"],e:"Positive feedback: less common; for accelerating some key processes."},
{l:3,s:"p10-12",q:"Which of the following is an example of POSITIVE feedback given in the lecture?",o:["Blood clotting","Thermoregulation","Sweating in the heat","Shivering in the cold"],e:"Positive feedback examples: blood clotting, parturition, lactation. Thermoregulation = negative feedback."},
{l:3,s:"p10-13",q:"Positive or negative feedback? Blood clotting.",o:["Positive","Negative"],e:"Positive."},
{l:3,s:"p10-13",q:"Positive or negative feedback? Parturition (childbirth).",o:["Positive","Negative"],e:"Positive."},
{l:3,s:"p10-13",q:"Positive or negative feedback? Lactation (milk let-down with suckling).",o:["Positive","Negative"],e:"Positive."},
{l:3,s:"p10-13",q:"Positive or negative feedback? Thermoregulation.",o:["Negative","Positive"],e:"Thermoregulation is an example of negative feedback (slide 13)."},
{l:3,s:"p10",q:"Put the blood-clotting positive feedback steps in order: (1) released chemicals attract more platelets, (2) break or tear in a blood vessel, (3) platelets adhere to the wound and release chemicals, (4) clotting proceeds until the wound is sealed.",o:["2 → 3 → 1 → 4","3 → 2 → 1 → 4","2 → 1 → 3 → 4","1 → 2 → 3 → 4"],e:"Tear → platelets adhere and release chemicals → chemicals attract MORE platelets (loop) → clot seals the wound, which ends the cycle."},
{l:3,s:"p10",q:"What ENDS the blood-clotting positive feedback cycle?",o:["The wound is sealed by the newly formed clot","The platelets run out","The control center switches it off","Body temperature falls"],e:"Clotting proceeds until the wound is sealed → feedback cycle ended."},
{l:3,s:"p10",tf:1,q:"In blood clotting, chemicals released by platelets attract more platelets.",a:1,e:"True — that is what makes it positive feedback."},
{l:3,s:"p11",q:"In parturition, which hormone is released in a positive feedback loop to strengthen uterine contractions?",o:["Oxytocin","Prolactin","Insulin","Adrenaline"],e:"Standard model (the slide shows parturition as a picture): the baby's head stretches the cervix → oxytocin from the posterior pituitary → stronger contractions → more stretch."},
{l:3,s:"p12",q:"In lactation, which hormone is secreted by the ANTERIOR pituitary for milk PRODUCTION?",o:["Prolactin","Oxytocin","Adrenaline","Insulin"],e:"Anterior pituitary → prolactin → milk production. (Pro = promote, lactin = milk.)"},
{l:3,s:"p12",q:"In lactation, which hormone is secreted by the POSTERIOR pituitary for milk SECRETION (let-down)?",o:["Oxytocin","Prolactin","Growth hormone","Adrenaline"],e:"Posterior pituitary → oxytocin → milk secretion / let-down."},
{l:3,s:"p12",q:"What starts the lactation positive feedback loop?",o:["Breast suckling sends a nerve impulse","A fall in blood glucose","A rise in body temperature","Stretching of the cervix"],e:"Suckling → nerve impulse → pituitary."},
{l:3,s:"p12",tf:1,q:"Prolactin is secreted by the posterior pituitary.",a:0,e:"False. Prolactin = ANTERIOR pituitary. Oxytocin = POSTERIOR pituitary."},
{l:3,s:"p8",type:"fill",q:"In negative feedback, the component that responds to the stimulus is the ________.",ans:["effector"],e:"Receptor → control center → effector."},
{l:3,s:"p5",type:"fill",q:"The ideal normal value of a physiological variable is called the ________.",ans:["set point","setpoint","set-point"],e:"Set point."},
{l:3,s:"p9",type:"fill",q:"A sensory nerve carrying signals towards the brain is also called an ________ nerve.",ans:["afferent"],e:"Afferent (sensory); efferent (motor)."},
{l:3,s:"p8-12",type:"saq",q:"Compare negative and positive feedback. Name the three components of negative feedback, and give two examples of positive feedback from the lecture.",model:"Negative feedback suppresses (opposes) the stimulus, bringing a variable back towards its set point; it is the most common way homeostasis is maintained. Its components are a receptor/sensor that monitors the environment, a control center that determines whether the variable is within its normal range, and an effector that responds. Positive feedback enhances the stimulus; it is less common and is used to accelerate key processes to completion. Examples: blood clotting (platelets release chemicals that attract more platelets), parturition, lactation.",points:["Negative = suppresses the stimulus","Positive = enhances the stimulus; less common, accelerates key processes","Receptor (sensor) → control center → effector, each with its role","Two examples from blood clotting / parturition / lactation"],e:"Slides 8–12."}
);

// L4 — Thermoregulation (Dr Philip Hung) — slides p13–27 of the L3–L4 deck
Q.push(
{l:4,s:"p13",q:"Core temperature is the temperature within the:",o:["Skull, thoracic and abdominal cavities","Skin","Hands and feet","Mouth only"],e:"Core = within skull, thoracic & abdominal cavities. Shell = essentially skin."},
{l:4,s:"p13",q:"Shell temperature is essentially the temperature of the:",o:["Skin","Brain","Abdominal organs","Blood in the heart"],e:"Shell temperature = essentially skin."},
{l:4,s:"p13",q:"The thermoneutral zone is an environmental temperature range of about:",o:["25–30℃","15–20℃","30–35℃","35–40℃"],e:"Thermoneutral zone = 25–30℃."},
{l:4,s:"p13",q:"Within the thermoneutral zone, body temperature is regulated ONLY by:",o:["Skin blood flow to control heat loss","Shivering","Sweating","Adrenaline secretion"],e:"In the thermoneutral zone, only skin blood flow is needed to control heat loss."},
{l:4,s:"p14",q:"Heat balance equals:",o:["Heat gain − heat loss","Heat gain + heat loss","Heat loss − heat gain","Core temperature − shell temperature"],e:"Heat balance = heat gain − heat loss."},
{l:4,s:"p14",q:"Which TWO methods can cause either heat GAIN or heat LOSS (depending on the temperature difference)?",o:["Conduction and radiation","Convection and evaporation","Evaporation and radiation","Conduction and convection"],e:"Gain or loss: conduction, radiation. Always loss: convection, evaporation."},
{l:4,s:"p14",q:"Which TWO methods ALWAYS cause heat loss (on the slide)?",o:["Convection and evaporation","Conduction and radiation","Radiation and evaporation","Conduction and convection"],e:"Always loss: convection (wind/air flow) and evaporation (liquid water → vapour)."},
{l:4,s:"p14",q:"Heat transfer via contact with the body surface is:",o:["Conduction","Radiation","Convection","Evaporation"],e:"Conduction = contact."},
{l:4,s:"p14",q:"Heat transfer via infra-red rays is:",o:["Radiation","Conduction","Convection","Evaporation"],e:"Radiation = infra-red."},
{l:4,s:"p14",q:"Heat loss via wind / air flow is:",o:["Convection","Conduction","Radiation","Evaporation"],e:"Convection = wind/air flow."},
{l:4,s:"p14",q:"Heat loss when liquid water turns into water vapour is:",o:["Evaporation","Convection","Radiation","Conduction"],e:"Evaporation."},
{l:4,s:"p14",q:"Sitting on a cold metal bench and losing heat to it is an example of:",o:["Conduction","Convection","Radiation","Evaporation"],e:"Direct contact = conduction."},
{l:4,s:"p14",q:"Feeling cooler in front of an electric fan (with no sweat) is mainly due to:",o:["Convection","Conduction","Radiation","Evaporation"],e:"Air flow = convection."},
{l:4,s:"p14",q:"Warming up by standing in the sun without touching anything is an example of heat gain by:",o:["Radiation","Conduction","Convection","Evaporation"],e:"Infra-red from the sun = radiation."},
{l:4,s:"p14",tf:1,q:"Evaporation can make the body gain heat.",a:0,e:"False. Evaporation and convection are listed as heat LOSS (always)."},
{l:4,s:"p16",q:"In the thermostat analogy of thermoregulation, the thermometer represents the:",o:["Receptor","Control center","Effector","Stimulus"],e:"Thermometer = receptor; thermostat = control center; heater = effector."},
{l:4,s:"p16",q:"In the thermostat analogy, the thermostat represents the:",o:["Control center","Receptor","Effector","Set point"],e:"Thermostat = control center."},
{l:4,s:"p16",q:"In the thermostat analogy, the heater represents the:",o:["Effector","Receptor","Control center","Stimulus"],e:"Heater = effector."},
{l:4,s:"p17",q:"What is the CONTROL CENTER for thermoregulation?",o:["Hypothalamus","Adrenal medulla","Skin","Spinal cord"],e:"Control center = hypothalamus."},
{l:4,s:"p17",q:"Where are the CENTRAL thermoreceptors?",o:["In abdominal organs and the hypothalamus","In the skin","In skeletal muscle","In sweat glands"],e:"Central: abdominal organs & hypothalamus. Peripheral: skin."},
{l:4,s:"p17",q:"Where are the PERIPHERAL thermoreceptors?",o:["In the skin","In the hypothalamus","In abdominal organs","In the adrenal medulla"],e:"Peripheral thermoreceptors = skin."},
{l:4,s:"p17",q:"Which of the following is NOT an effector in thermoregulation?",o:["Hypothalamus","Skeletal muscle","Skin arterioles","Sweat glands"],e:"Effectors: skeletal muscle, skin arterioles, sweat glands, adrenal medulla. Hypothalamus = control center."},
{l:4,s:"p17",q:"Which of the following IS an effector in thermoregulation?",o:["Adrenal medulla","Hypothalamus","Skin thermoreceptors","Abdominal thermoreceptors"],e:"Adrenal medulla (secretes adrenaline)."},
{l:4,s:"p17",q:"Thermoregulation role: hypothalamus.",o:["Control center","Receptor","Effector"],e:"Hypothalamus = control center (it also contains central thermoreceptors)."},
{l:4,s:"p17",q:"Thermoregulation role: sweat glands.",o:["Effector","Receptor","Control center"],e:"Sweat glands = effector."},
{l:4,s:"p17",q:"Thermoregulation role: thermoreceptors in the skin.",o:["Receptor","Effector","Control center"],e:"Peripheral receptor."},
{l:4,s:"p17",q:"Thermoregulation role: skin arterioles.",o:["Effector","Receptor","Control center"],e:"Effector."},
{l:4,s:"p18",q:"When cold, which two mechanisms increase heat PRODUCTION?",o:["Muscle shivering and adrenaline from the adrenal medulla","Sweating and vasodilation","Vasoconstriction and reduced sweating","Convection and radiation"],e:"Shivering + adrenal medulla adrenaline (↑ basal metabolism)."},
{l:4,s:"p18",q:"Shivering is:",o:["Involuntary contraction of skeletal muscle that generates heat","Voluntary contraction of smooth muscle","Constriction of skin arterioles","Secretion of sweat"],e:"Shivering = involuntary contraction → heat."},
{l:4,s:"p18",q:"The adrenal medulla increases heat production by secreting:",o:["Adrenaline, which increases basal metabolism","Insulin, which increases glucose uptake","Oxytocin, which contracts muscle","Prolactin"],e:"Adrenaline (hormone) → ↑ basal metabolism → heat."},
{l:4,s:"p19",q:"When hot, the body increases heat loss by:",o:["Dilating skin arterioles, constricting shunt vessels and sweating more","Constricting skin arterioles and dilating shunt vessels","Shivering","Stopping sweat secretion"],e:"Hot: ↑ skin blood flow (dilate arterioles, constrict shunts) + ↑ sweat."},
{l:4,s:"p19",q:"When cold, what happens to the skin arterioles and shunt vessels?",o:["Arterioles constrict; shunt vessels dilate","Arterioles dilate; shunt vessels constrict","Both dilate","Both constrict"],e:"Cold: arteriole constricted, shunt vessel dilates → less blood to the skin → less heat loss."},
{l:4,s:"p19",tf:1,q:"When the body is hot, shunt vessels constrict so more blood flows to the skin surface.",a:1,e:"True. Dilated arterioles + narrowed shunt vessels → more skin blood flow → more heat loss by radiation."},
{l:4,s:"p19",q:"Increased skin blood flow in the heat mainly increases heat loss by:",o:["Radiation","Evaporation","Shivering","Convection only"],e:"Slide 19: \"more heat loss by radiation\"."},
{l:4,s:"p20",q:"Sweat secretion is induced by:",o:["Sympathetic stimulation","Parasympathetic stimulation","Insulin","Direct heat on the gland only"],e:"Secretion is induced by sympathetic stimulation."},
{l:4,s:"p20",q:"Which part of the sweat gland is located DEEPER and secretes sweat?",o:["Secretory portion","Duct portion","Sebaceous portion","Arrector portion"],e:"Secretory portion = deep, secretes water + minerals. Duct portion = superficial."},
{l:4,s:"p20",q:"What does the DUCT portion of the sweat gland do?",o:["Passes sweat to the skin surface and reabsorbs sodium and chloride","Secretes water and minerals","Produces heat","Secretes adrenaline"],e:"Duct: superficial, carries sweat to the surface, reabsorbs Na⁺ and Cl⁻."},
{l:4,s:"p20",q:"Because the duct reabsorbs Na⁺ and Cl⁻, sweating causes:",o:["Water loss > mineral loss","Mineral loss > water loss","Equal water and mineral loss","No water loss"],e:"Water loss > mineral loss. (Your note: mineral loss doesn't help heat loss.)"},
{l:4,s:"p21",q:"As humidity increases, evaporation efficiency:",o:["Decreases","Increases","Stays the same","First increases, then decreases"],e:"↑ humidity → ↓ evaporation: the air already holds lots of water vapour."},
{l:4,s:"p21",q:"Why does high humidity reduce evaporative heat loss?",o:["Air already crowded with water vapour cannot take much more","High humidity stops sweat glands from secreting","Water vapour is a better conductor","High humidity lowers skin temperature to 0℃"],e:"If air is overcrowded with water vapour, it is less likely to accommodate more."},
{l:4,s:"p21",q:"On the humidity graph, which change increases evaporation but is NOT good for thermoregulation?",o:["A higher body (skin) temperature","Lower humidity","More wind","Lower environmental temperature"],e:"Slide 21: only ↑ body temperature ↑ evaporation (BUT no good for thermoregulation)."},
{l:4,s:"p22",q:"Vasoconstriction of skin vessels is triggered by the:",o:["Sympathetic nervous system","Parasympathetic nervous system","Adrenal cortex","Somatic motor nerves"],e:"Vasoconstriction is triggered by the sympathetic nervous system, depending on environmental temperature."},
{l:4,s:"p22",q:"A FALL in environmental temperature causes skin vessels to:",o:["Constrict (vasoconstriction)","Dilate (vasodilation)","Stay the same","Leak fluid"],e:"↓ environmental temp → vasoconstriction; ↑ environmental temp → vasodilation."},
{l:4,s:"p22",q:"Heat transfer by conduction changes about how many times between fully constricted and fully dilated skin vessels?",o:["Eight-fold","Two-fold","Hundred-fold","It does not change"],e:"Eight-fold change."},
{l:4,s:"p23",q:"Feedforward regulation is:",o:["Stimulated BEFORE the feedback system responds, to minimize changes in a regulated variable","Stimulated after core temperature has already changed","The same as positive feedback","Only found in blood clotting"],e:"Feedforward acts before the feedback response, e.g. to minimize a change in core temperature."},
{l:4,s:"p23",q:"In feedforward regulation of temperature, which receptors detect the change first?",o:["Skin thermoreceptors detecting environmental temperature","Central thermoreceptors in the hypothalamus","Abdominal thermoreceptors","Baroreceptors"],e:"Skin thermoreceptors detect environmental change → brain → effectors (vasoconstriction, shivering) before the core cools."},
{l:4,s:"p23",tf:1,q:"In feedforward regulation, the body waits for the core temperature to drop before it responds.",a:0,e:"False. Feedforward responds to environmental change (via skin receptors) BEFORE the core temperature changes."},
{l:4,s:"p24",q:"Why are older adults less tolerant of temperature extremes?",o:["Less effective sweat glands and less skin blood flow","More sweat glands and more skin blood flow","Higher metabolic rate","They have no hypothalamus"],e:"Older adults: less effective sweat glands, less skin blood flow."},
{l:4,s:"p24",q:"According to the slide, which statement about gender and thermoregulation is correct?",o:["Males have higher metabolic rates and sweat more","Females have higher metabolic rates and sweat more","Gender has no effect","Males sweat less"],e:"Males: higher metabolic rates, sweat more."},
{l:4,s:"p24",tf:1,q:"Exercise improves heat and cold tolerance.",a:1,e:"True (slide 24)."},
{l:4,s:"p25",q:"When staying naked for several hours, core temperature is maintained between 36.1 and 37.8℃ if the environmental temperature is between:",o:["12.8 and 54.4℃","25 and 30℃","0 and 40℃","20 and 37℃"],e:"12.8–54.4℃ (converted from Fahrenheit). Don't mix up with the thermoneutral zone (25–30℃)."},
{l:4,s:"p26",q:"Hypothermia is defined as a core temperature below:",o:["35.0℃","36.0℃","37.0℃","32.0℃"],e:"Hypothermia: core < 35.0℃. Hyperthermia: core > 40℃."},
{l:4,s:"p27",q:"Hyperthermia (on the slide) is a core temperature above:",o:["40℃","38℃","37.5℃","42℃"],e:"> 40℃."},
{l:4,s:"p27",q:"Put the heat illnesses in order of severity, from mildest:",o:["Heat cramps → heat exhaustion → heat stroke","Heat exhaustion → heat cramps → heat stroke","Heat stroke → heat exhaustion → heat cramps","Heat cramps → heat stroke → heat exhaustion"],e:"Cramps < exhaustion < stroke."},
{l:4,s:"p27",q:"Painful involuntary muscle cramps with RED, MOIST skin, triggered by Na⁺ loss and dehydration, is:",o:["Heat cramps","Heat exhaustion","Heat stroke","Hypothermia"],e:"Heat cramps: red moist skin, Na⁺ loss + dehydration."},
{l:4,s:"p27",q:"Muscle cramp, fatigue, PALE MOIST skin, fainting, dizziness, nausea and vomiting are features of:",o:["Heat exhaustion","Heat cramps","Heat stroke","Hypothermia"],e:"Heat exhaustion: pale moist skin, triggered by more severe dehydration."},
{l:4,s:"p27",q:"Muscle cramp, RED/WARM DRY skin, rapid heart rate and seizure are features of:",o:["Heat stroke","Heat exhaustion","Heat cramps","Sunburn"],e:"Heat stroke: red/warm DRY skin; thermoregulation has broken down."},
{l:4,s:"p27",q:"Skin colour/moisture: heat cramps.",o:["Red, moist","Pale, moist","Red/warm, dry"],e:"Cramps = red moist; exhaustion = pale moist; stroke = red/warm dry."},
{l:4,s:"p27",q:"Skin colour/moisture: heat exhaustion.",o:["Pale, moist","Red, moist","Red/warm, dry"],e:"Pale because low blood volume → less blood flow to the skin."},
